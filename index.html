 questions:[{q:'老爷爷帮"我"修好链条后为什么不要钱？',ref:'他觉得是举手之劳，热心帮助别人'},{q:'结尾写"背影不高，却让我记了很久"，表达了什么感情？',ref:'对老爷爷的感激和敬佩'}]},
{id:'b-yuye',grade:'五年级',title:'雨夜',author:'原创·写人写事',genre:'写人写事',outputPrompt:'那个雨夜，如果你是作者，你会对爸爸说什么？',
 content:'那天晚上雨下得很大，爸爸出差还没回来，家里只有我和妈妈。\n\n忽然停电了，屋里一片漆黑。我有点害怕，妈妈点亮蜡烛，说："别怕，有妈妈在。"我们坐在烛光里，妈妈给我讲她小时候的故事，窗外的雨声好像也没那么吓人了。\n\n半夜，门响了，是爸爸回来了。他的裤脚全是泥，头发上还挂着水珠。他说："雨太大，车堵在半路，我走回来的，就惦记着你们娘俩。"\n\n烛光下，我们三个人围坐在一起。那个雨夜，屋里没有电，却特别亮，特别暖。',
 questions:[{q:'停电后妈妈是怎样安慰"我"的？',ref:'点亮蜡烛，陪"我"讲小时候的故事'},{q:'结尾说"屋里没有电，却特别亮，特别暖"，为什么？',ref:'一家人的关爱和陪伴让"我"心里温暖，比灯光更亮'}]},
// ---------- 写景状物（原创）----------
{id:'b-chunyu',grade:'三年级',title:'春雨',author:'原创·写景状物',genre:'写景状物',outputPrompt:'你观察过春雨吗？写一写雨中的景物。',
 content:'春雨是轻轻地来的。\n\n像牛毛，像细丝，密密地斜织着。屋顶上笼着一层薄烟，远处的山青得发亮。\n\n雨落在池塘里，水面荡起一圈圈细小的波纹；雨落在花瓣上，花瓣更红了，亮晶晶的水珠滚来滚去；雨落在柳枝上，柳枝更绿了，随风轻轻摆动。\n\n田野里，麦苗大口大口地喝着雨水，一天一个样。老农站在田埂上，笑眯眯地说："春雨贵如油啊！"\n\n雨停了，太阳出来了，天边挂着一道淡淡的彩虹。',
 questions:[{q:'短文把春雨比作了什么？',ref:'牛毛、细丝'},{q:'为什么说"春雨贵如油"？',ref:'春雨能滋润庄稼，对农作物生长非常重要'}]},
{id:'b-rongshu',grade:'四年级',title:'村口的老榕树',author:'原创·写景状物',genre:'写景状物',outputPrompt:'你的家乡有一棵特别的树吗？介绍一下它。',
 content:'村口有一棵老榕树，听说它有两百多岁了。\n\n它的树干粗得要五六个孩子才能合抱，树皮上有一道道裂纹，像老人脸上的皱纹。最特别的是它的根：有的从枝干上垂下来，扎进土里，又长成新的树干；有的在地面上隆起，像一条条巨蟒。远远看去，一棵树就像一片树林。\n\n老榕树的树冠像一把巨大的绿伞，遮住了半条街。夏天，知了在树上唱歌，老人们在树荫下摇着蒲扇聊天，孩子们在树根上爬上爬下。\n\n老榕树看着一代代孩子长大，它是村子里最老的"居民"。',
 questions:[{q:'老榕树"一棵树就像一片树林"的原因是什么？',ref:'它的气根垂下来扎进土里，又长成新的树干'},{q:'短文表达了作者对老榕树怎样的感情？',ref:'喜爱和敬佩，把它当作村子的老朋友、老居民'}]},
{id:'b-qiutian',grade:'三年级',title:'秋天的田野',author:'原创·写景状物',genre:'写景状物',outputPrompt:'秋天到了，你眼中的田野或校园是什么样的？',
 content:'秋天的田野是一幅彩色的画。\n\n稻田里，金黄的稻穗笑弯了腰，风一吹，翻起金色的波浪。高粱举起了红红的火把，玉米露出了金黄的牙齿，棉花吐出雪白的云朵。\n\n果园里更热闹。苹果涨红了脸，柿子挂起一盏盏小灯笼，石榴咧开嘴，露出玛瑙般的籽儿。\n\n天上，一群大雁排成"人"字形，向南方飞去。它们一边飞一边叫，好像在说："明年再见！"\n\n田埂上，农民伯伯忙着收割，脸上挂着汗珠，也挂着笑容。',
 questions:[{q:'短文用了哪些修辞方法把田野写得生动？举一例。',ref:'拟人，如"稻穗笑弯了腰""苹果涨红了脸"；比喻，如"柿子挂起小灯笼"'},{q:'结尾"脸上挂着汗珠，也挂着笑容"说明了什么？',ref:'农民虽然辛苦，但为丰收感到高兴'}]},
{id:'b-yueliangchi',grade:'二年级',title:'月亮池塘',author:'原创·写景状物',genre:'写景状物',outputPrompt:'晚上你看过月亮在水里的倒影吗？它像什么？',
 content:'晚上，月亮升起来了，圆圆的，亮亮的。\n\n村边的池塘里也有一个月亮。它静静地躺在水面上，像一个白玉盘。小鱼游过来，碰了一下，月亮就碎成了银色的鳞片。小鱼游走了，鳞片又慢慢拼在一起，还是一个圆圆的月亮。\n\n青蛙蹲在荷叶上，看着水里的月亮，"呱呱"叫了两声，好像在问："天上的月亮掉下来了吗？"\n\n风来了，水面的月亮晃啊晃；风走了，月亮又安安静静地睡着了。',
 questions:[{q:'小鱼碰到水里的月亮后发生了什么？',ref:'月亮碎成银色的鳞片，小鱼游走后又拼在一起'},{q:'短文把水里的月亮比作了什么？',ref:'白玉盘'}]},
{id:'b-haibian',grade:'四年级',title:'海边的早晨',author:'原创·写景状物',genre:'写景状物',outputPrompt:'按时间或空间顺序，写一处你喜欢的景物。',
 content:'海边的早晨是热闹的。\n\n天刚蒙蒙亮，海鸥就醒了，它们贴着海面飞翔，偶尔俯冲下去，叼起一条银亮的小鱼。太阳从海平面探出半个脸，把海水染成了橘红色。\n\n沙滩上，赶海的人渐渐多了。老爷爷弯腰捡着海带，小姑娘蹲在礁石边捉小螃蟹，渔民们喊着号子，把一网活蹦乱跳的鱼拉上岸。\n\n潮水"哗哗"地涌上来，又"哗哗"地退下去，在沙滩上留下一道道白色的泡沫，还有贝壳、海螺，和闪闪发光的细沙。\n\n海边的早晨，每一处都是风景。',
 questions:[{q:'短文是按什么顺序写海边早晨的？',ref:'时间顺序（天刚亮→太阳升起→人渐渐多起来）'},{q:'文中写了哪些赶海的人？',ref:'捡海带的老爷爷、捉小螃蟹的小姑娘、拉网的渔民'}]},
// ---------- 科普说明（原创）----------
{id:'b-yinghuochong',grade:'三年级',title:'萤火虫为什么会发光',author:'原创·科普说明',genre:'科普说明',outputPrompt:'你还知道哪些会发光的动物？查一查资料。',
 content:'夏天的夜晚，萤火虫提着小灯笼飞来飞去。它为什么会发光呢？\n\n原来，萤火虫的腹部有一个"发光器"，里面有很多发光细胞。发光细胞里有两种特别的物质，它们遇到氧气就会发生反应，发出光来。萤火虫通过控制氧气的进出，让光一闪一闪的。\n\n萤火虫的光是"冷光"，几乎不发热。如果像电灯那样发热，萤火虫早就把自己烧坏了。\n\n萤火虫发光有什么用呢？主要是为了和同伴"打招呼"，寻找朋友。不同种类的萤火虫，闪光的节奏还不一样呢！科学家模仿萤火虫的发光原理，正在研制更安全的人工冷光源。',
 questions:[{q:'萤火虫的光为什么叫"冷光"？',ref:'因为这种光几乎不发热'},{q:'萤火虫发光主要是为了什么？',ref:'和同伴打招呼、寻找朋友'}]},
{id:'b-mifeng-yuyan',grade:'四年级',title:'蜜蜂的"语言"',author:'原创·科普说明',genre:'科普说明',outputPrompt:'动物之间还有哪些有趣的交流方式？说一说。',
 content:'蜜蜂不会说话，可它们能准确地告诉同伴花丛在哪里。秘密在哪里呢？在它们的舞蹈里。\n\n当一只蜜蜂发现蜜源，它会飞回蜂巢，跳起特殊的舞。如果它跳"圆舞"，就是在说："花就在附近！"如果它跳"8字舞"，还能通过摆动的方向告诉同伴：朝着太阳的哪个方向飞，飞多远。\n\n除了舞蹈，蜜蜂还会用气味传递信息。蜂巢里的女王会散发出特别的气味，让整个蜂群知道她的存在。\n\n小小的蜜蜂，用舞蹈和气味构建了一个高效的"通讯系统"，真不愧是大自然的舞蹈家。',
 questions:[{q:'蜜蜂发现远处的花丛时会跳什么舞？',ref:'8字舞'},{q:'蜜蜂还用什么方式传递信息？',ref:'气味'}]},
{id:'b-shuzi',grade:'三年级',title:'叶子为什么会变颜色',author:'原创·科普说明',genre:'科普说明',outputPrompt:'秋天你见过哪些颜色的叶子？捡一片做成书签吧。',
 content:'春天和夏天，叶子大多是绿色的，因为叶子里有很多叶绿素，帮助大树制造养分。\n\n到了秋天，天气变冷，光照变少，叶绿素慢慢分解了，叶子里本来就有的黄色、橙色色素就显露出来，叶子就变黄了。还有一些树的叶子会变红，那是因为秋天叶子里产生了新的红色色素。\n\n不同的树，叶子变色的时间也不一样。银杏变得早，枫叶变得晚。所以从九十月开始，山林先是星星点点地黄，后来漫山遍野地红，像打翻了颜料盘。\n\n来年春天，新叶长出来，又会是一片充满生机的绿。',
 questions:[{q:'叶子在春夏是绿色的原因是什么？',ref:'叶子里有很多叶绿素'},{q:'秋天叶子变黄、变红分别是为什么？',ref:'叶绿素分解后黄色橙色色素显露；有的叶子秋天产生新的红色色素'}]},
{id:'b-zhuomuniao',grade:'二年级',title:'森林医生啄木鸟',author:'原创·科普说明',genre:'科普说明',outputPrompt:'你知道还有哪些动物是"森林医生"或"庄稼卫士"吗？',
 content:'"笃笃笃——"树林里传来敲木头的声音，那是啄木鸟在给大树看病了。\n\n啄木鸟的嘴又硬又尖，像一把凿子。它先用嘴敲敲树干，听听声音，就能知道树皮下面有没有虫子。发现害虫藏身的地方，它就用舌头伸进树洞，把虫子一条条钩出来。啄木鸟的舌头又细又长，舌尖上还长着小钩子，虫子一碰就跑不掉。\n\n一只啄木鸟一天能吃掉一千多条害虫，被称为"森林医生"。它每天这样敲啊敲，一年能保护十几亩树林呢！\n\n啄木鸟真是大树的好朋友。',
 questions:[{q:'啄木鸟怎样判断树里有没有虫子？',ref:'用嘴敲树干，听声音'},{q:'啄木鸟的舌头有什么特点？',ref:'又细又长，舌尖长着小钩子，能钩住虫子'}]},
{id:'b-xuehua',grade:'二年级',title:'雪花的秘密',author:'原创·科普说明',genre:'科普说明',outputPrompt:'下雪的时候仔细观察雪花，它是什么样子的？',
 content:'下雪了，雪花纷纷扬扬地落下来。\n\n你知道吗？每一片雪花都是六角形的，可每一片的样子又都不一样：有的像六角的小花，有的像细细的针，有的像闪闪的星星。世界上找不到两片完全相同的雪花。\n\n雪花是怎么形成的呢？天上的云里有许许多多小水滴，天气很冷的时候，小水滴冻成小冰晶。小冰晶在云里飘啊飘，越变越大，等到空气托不住它的时候，就飘落下来，成了雪花。\n\n雪花落在麦田里，像给麦苗盖了一层棉被，能保护麦苗安全过冬。所以农民说："瑞雪兆丰年。"',
 questions:[{q:'雪花的形状有什么共同点？',ref:'都是六角形的'},{q:'为什么说"瑞雪兆丰年"？',ref:'雪像棉被一样保护麦苗过冬，来年容易丰收'}]},
// ---------- 诗歌 ----------
{id:'b-yongliu',grade:'二年级',title:'咏柳',author:'贺知章·古诗',genre:'诗歌',outputPrompt:'春天的柳树是什么样子的？背一背这首诗给家人听。',
 content:'咏柳\n〔唐〕贺知章\n\n碧玉妆成一树高，万条垂下绿丝绦。\n不知细叶谁裁出，二月春风似剪刀。\n\n【大意】高高的柳树像是用碧玉装扮而成，千万条柳枝垂下来，像绿色的丝带。不知道这细细的柳叶是谁裁剪出来的？原来是二月的春风，它就像一把灵巧的剪刀。\n\n【赏析】诗人把柳树比作碧玉，把柳枝比作丝带，又别出心裁地把春风比作剪刀，想象新奇，写出了春天的勃勃生机。',
 questions:[{q:'诗人把春风比作了什么？',ref:'剪刀'},{q:'"万条垂下绿丝绦"把柳枝比作了什么？',ref:'绿色的丝带'}]},
{id:'b-cunju',grade:'二年级',title:'村居',author:'高鼎·古诗',genre:'诗歌',outputPrompt:'你放过风筝吗？写一写放风筝时的心情。',
 content:'村居\n〔清〕高鼎\n\n草长莺飞二月天，拂堤杨柳醉春烟。\n儿童散学归来早，忙趁东风放纸鸢。\n\n【大意】早春二月，小草生长，黄莺飞舞，杨柳轻拂着堤岸，仿佛陶醉在春天的烟雾里。孩子们放学回来得早，赶忙趁着东风放起了风筝。\n\n【赏析】前两句写春天的美景，后两句写儿童放风筝的快乐，景美人欢，充满了浓郁的春日生活气息。',
 questions:[{q:'"纸鸢"指的是什么？',ref:'风筝'},{q:'这首诗描写的是哪个季节的景色？',ref:'春天（早春二月）'}]},
{id:'b-dengguan',grade:'二年级',title:'登鹳雀楼',author:'王之涣·古诗',genre:'诗歌',outputPrompt:'"欲穷千里目，更上一层楼"对你有什么启发？',
 content:'登鹳雀楼\n〔唐〕王之涣\n\n白日依山尽，黄河入海流。\n欲穷千里目，更上一层楼。\n\n【大意】夕阳依着群山慢慢落下，黄河奔腾着流向大海。想要看到千里之外更远的景色，就要再登上一层高楼。\n\n【赏析】前两句写登楼看到的壮阔景色，后两句由景入理，道出"站得高才能看得远"的道理，激励人们不断向上进取。',
 questions:[{q:'"欲穷千里目"是什么意思？',ref:'想要看到千里之外更远的地方'},{q:'这首诗后两句告诉我们什么道理？',ref:'站得高才能看得远，要不断进取'}]},
{id:'b-wanghu',grade:'六年级',title:'六月二十七日望湖楼醉书',author:'苏轼·古诗',genre:'诗歌',outputPrompt:'你见过夏天的暴雨吗？说说雨来得快去得快的景象。',
 content:'六月二十七日望湖楼醉书\n〔宋〕苏轼\n\n黑云翻墨未遮山，白雨跳珠乱入船。\n卷地风来忽吹散，望湖楼下水如天。\n\n【大意】黑云像打翻的墨汁一样翻滚，还没来得及遮住山，白花花的雨点就像跳动的珍珠，乱纷纷地打进船里。忽然一阵卷地大风把云雨吹散，望湖楼下的湖面又平静得像天空一样。\n\n【赏析】诗人用"翻墨"写云，用"跳珠"写雨，比喻新奇贴切，把夏日暴雨来得急、去得快的特点写得活灵活现。',
 questions:[{q:'诗人把黑云和白雨分别比作了什么？',ref:'打翻的墨汁、跳动的珍珠'},{q:'这首诗写的是哪个季节的雨？',ref:'夏天（夏日暴雨）'}]},
{id:'b-fengqiao',grade:'五年级',title:'枫桥夜泊',author:'张继·古诗',genre:'诗歌',outputPrompt:'诗里写了哪些景物？它们给你怎样的感觉？',
 content:'枫桥夜泊\n〔唐〕张继\n\n月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。\n\n【大意】月亮落下，乌鸦啼叫，秋霜仿佛布满了天空。江边的枫树和渔船上的灯火，伴着愁绪难以入眠的我。姑苏城外的寒山寺里，半夜的钟声悠悠地传到了我的客船上。\n\n【赏析】诗中写了落月、啼乌、霜天、江枫、渔火、钟声，营造出清冷幽静的秋夜意境，含蓄地表达了诗人旅途中的孤寂与愁思。',
 questions:[{q:'诗中的"客"指的是谁？',ref:'诗人自己（旅途中的人）'},{q:'夜半传来的钟声来自哪里？',ref:'姑苏城外的寒山寺'}]},
// ---------- 科幻（原创）----------
{id:'b-shijianyou',grade:'四年级',title:'时间邮局',author:'原创·科幻',genre:'科幻',outputPrompt:'如果可以给十年后的自己寄一封信，你会写什么？',
 content:'2050年，城市里开了一家特别的邮局——时间邮局。在这里，你可以把信寄给未来的自己。\n\n小星走进邮局，机器人营业员递来一张银色的信纸："请写下你想对未来说的话，选择投递时间。"\n\n小星想了想，写道："十年后的我，你好！你现在成为天文学家了吗？还记得我们一起看过的流星吗？"\n\n她按下了"十年后投递"的按钮。信纸闪了一下，消失了。\n\n"它去哪里了？"小星问。机器人笑着说："去了时间仓库。十年后的今天，它会准时出现在你的信箱里。请保管好你的期待。"',
 questions:[{q:'时间邮局特别在哪里？',ref:'可以把信寄给未来的自己'},{q:'小星给十年后的自己写了什么内容？',ref:'问候未来的自己是否成为天文学家，回忆一起看流星的时光'}]},
{id:'b-jiqiren',grade:'三年级',title:'机器人同学',author:'原创·科幻',genre:'科幻',outputPrompt:'如果机器人来到你们班，你希望它帮你做什么？',
 content:'新学期，班里来了一位新同学——机器人"小贝"。它的脑袋圆圆的，眼睛是两块蓝色的屏幕。\n\n小贝的本领可真大：数学题再难，它三秒钟就能算出答案；它的肚子里装着整个图书馆，谁有问题它都能回答。\n\n可是有一次，小星生病了，好几天没来上学。小贝把作业送到小星家，还陪小星聊天，给小星讲班里的趣事，逗得小星哈哈大笑。\n\n"小贝，你不是只会计算吗？"小星问。小贝眨眨蓝色的眼睛："我最近学会了新程序——关心同学。"\n\n从那以后，大家都把小贝当成了真正的朋友。',
 questions:[{q:'小贝的本领有哪些？',ref:'快速计算、回答各种问题，还会关心同学'},{q:'为什么大家把小贝当成了真正的朋友？',ref:'因为它学会了关心同学，给大家带来了温暖'}]},
{id:'b-haidi-cheng',grade:'五年级',title:'海底城市',author:'原创·科幻',genre:'科幻',outputPrompt:'你想象中的海底城市是什么样的？画一画或写一写。',
 content:'2088年，世界上第一座海底城市"蓝鲸城"建成了。\n\n整座城市罩在一个巨大的透明穹顶里，穹顶用的是比钢铁还坚硬的新材料，能抵抗深海的巨大水压。街道两旁种着经过改造的海藻，它们吸收二氧化碳，吐出氧气，让城市里的空气永远清新。\n\n学校的操场是悬浮的，轻轻一蹬地，就能跳起老高。交通工具是"水滴车"，像水滴一样在海水里穿梭，一点噪音也没有。\n\n夜晚，穹顶外游过发光的水母群，整座城市像住进了银河里。住在蓝鲸城的孩子们说："我们每天枕着大海入睡。"',
 questions:[{q:'蓝鲸城的穹顶有什么作用？',ref:'抵抗深海的水压，保护城市'},{q:'城市里的海藻有什么特殊功能？',ref:'吸收二氧化碳、吐出氧气，让空气清新'}]},
// ---------- 神话 ----------
{id:'b-xingtian',grade:'四年级',title:'刑天舞干戚',author:'《山海经》·神话',genre:'神话',outputPrompt:'刑天失去头颅还不放弃战斗，你想对他说什么？',
 content:'刑天是炎帝手下的一位巨人，他力大无穷，勇猛无比。\n\n后来，炎帝与黄帝争战失败。刑天不服，独自一人拿着盾牌和大斧，杀到天庭，要和黄帝一决高下。他们从云端打到山巅，打得难解难分。\n\n黄帝看准机会，一剑砍下了刑天的头颅。失去头颅的刑天并没有倒下。他把胸前的两个乳头当作眼睛，把肚脐当作嘴巴，继续挥舞着盾牌和大斧战斗。\n\n这就是"刑天舞干戚"的故事。人们敬佩他不屈不挠、战斗到底的精神。',
 questions:[{q:'刑天被砍去头颅后是怎样做的？',ref:'以乳为目、以脐为口，继续挥舞盾牌和大斧战斗'},{q:'这个故事歌颂了什么精神？',ref:'不屈不挠、永不放弃的精神'}]},
{id:'b-cangjie',grade:'三年级',title:'仓颉造字',author:'神话传说',genre:'神话',outputPrompt:'如果没有文字，我们的生活会怎样？想一想。',
 content:'很久很久以前，人们没有文字，只能靠结绳子记事。大事打个大结，小事打个小结，可时间一长，谁也记不清了。\n\n黄帝的史官仓颉决心造出一种记事的符号。他走遍了山川大地：看到太阳圆圆的，就画了一个圆圈；看到月牙弯弯的，就画了一道弧线；看到山有三个山峰，就画了三个尖角；看到水波流动，就画了几道弯曲的波纹。\n\n他还观察鸟兽的脚印，发现不同动物的脚印不一样，又照着造出了许多符号。\n\n传说仓颉造字成功的那天，天上落下了粟米，鬼神在夜里哭泣。从此，人们有了文字，文明一代代传了下来。',
 questions:[{q:'仓颉是从哪里得到造字的启发的？',ref:'观察太阳、月亮、山、水等自然事物和鸟兽的脚印'},{q:'文字的出现有什么重要意义？',ref:'人们可以准确记事，文明得以代代相传'}]},
{id:'b-nvwa-zaoren',grade:'三年级',title:'女娲造人',author:'神话传说',genre:'神话',outputPrompt:'你觉得这个故事里最有趣的地方是什么？',
 content:'盘古开天辟地以后，天地间有了山川草木、鸟兽虫鱼，可是没有一个像人一样的生灵，世界显得冷冷清清。\n\n女娲在河边散步，看见水中自己的倒影，忽然想：要是能创造出像自己一样的生灵，该多好！\n\n她抓起河边的黄泥，照着倒影捏起来。泥人放到地上，竟然活蹦乱跳地跳起来，喊着："妈妈，妈妈！"女娲高兴极了，捏了一个又一个。\n\n可是大地太辽阔了，一个个捏太慢了。女娲就拿起一根藤条，蘸上泥浆向地面一挥，溅落的泥点都变成了活生生的人。\n\n从此，大地上有了人类，到处充满了欢声笑语。',
 questions:[{q:'女娲为什么要造人？',ref:'她觉得世界冷冷清清，想创造像自己一样的生灵'},{q:'女娲后来用什么办法加快了造人的速度？',ref:'用藤条蘸泥浆向地面挥洒，泥点变成人'}]},
// ---------- 叙事（原创）----------
{id:'b-diyici',grade:'三年级',title:'第一次做饭',author:'原创·叙事',genre:'叙事',outputPrompt:'你第一次尝试做一件事是什么时候？讲一讲。',
 content:'星期天，妈妈加班，我决定自己做饭——煮面条。\n\n我先往锅里倒水，打开火。水开了，我抓起面条往锅里放，可面条像调皮的孩子，不是掉在锅外，就是戳到我手上。我耐着性子，把面条一根根放好。\n\n接着是放盐。盐罐里没有勺子，我用手捏了一撮撒进去，尝了一口汤——没味道！又捏一撮——还是淡！再捏一撮——哎呀，咸了！\n\n最后，我学着妈妈的样子，放了一把青菜，打了一个鸡蛋。面条出锅了，虽然咸了点，鸡蛋还破了相，可我吃得特别香。\n\n晚上妈妈回来，我自豪地说："妈妈，我学会煮面条了！"妈妈摸着我的头笑了。',
 questions:[{q:'"我"煮面条时遇到了哪些困难？',ref:'面条放不进锅、放盐掌握不好量'},{q:'为什么面条"咸了点"，"我"还吃得特别香？',ref:'因为是自己亲手做的，体会到了劳动的快乐'}]},
{id:'b-shaosheng',grade:'四年级',title:'那一声哨响',author:'原创·叙事',genre:'叙事',outputPrompt:'运动会上你参加过什么项目？写写当时的感受。',
 content:'运动会上，我报名参加了四百米跑。\n\n站在起跑线上，我的心"怦怦"直跳。"砰！"发令枪响了，我冲了出去。第一圈，我跑得还算轻松，风在耳边呼呼地响。\n\n第二圈，我的腿像灌了铅，呼吸也急促起来，一个对手超过了我，又一个超过了。我想停下来，可听见跑道边同学们在喊："加油！加油！"\n\n最后一百米，我咬紧牙关，摆动双臂，拼命冲刺。一个、两个，我超过了两个对手！冲过终点的那一刻，哨声响了。\n\n我得了第三名。虽然没能站上最高领奖台，但那一声哨响，让我明白了：坚持到底，就是胜利。',
 questions:[{q:'第二圈时"我"遇到了什么困难？',ref:'腿像灌了铅、呼吸急促，被对手超过'},{q:'"我"从这次比赛中明白了什么？',ref:'坚持到底就是胜利'}]},
{id:'b-paohu',grade:'三年级',title:'爷爷的葡萄架',author:'原创·叙事',genre:'叙事',outputPrompt:'你和长辈之间有什么温暖的回忆？说一说。',
 content:'爷爷家的院子里有一个葡萄架。夏天，葡萄藤爬满了架子，绿叶一层叠着一层，架下凉快极了。\n\n爷爷常坐在葡萄架下的藤椅里，一边摇着蒲扇，一边给我讲故事。我趴在他膝盖上，听牛郎织女，听孙悟空三打白骨精，听着听着就睡着了。\n\n秋天，葡萄熟了，一串串紫莹莹的，像玛瑙。爷爷挑最甜的一串递给我："尝尝，今年的比去年甜。"我剥开一颗放进嘴里，甜汁一直甜到心里。\n\n现在，我搬到了城里，可我总想起那个葡萄架，想起架下的故事，还有爷爷递给我的那一串葡萄。',
 questions:[{q:'短文围绕葡萄架写了哪几件事？',ref:'夏天爷爷在葡萄架下讲故事；秋天爷爷摘最甜的葡萄给"我"'},{q:'结尾表达了怎样的感情？',ref:'对爷爷和童年生活的怀念'}]},
// ---------- 真题库（真题风格·长文阅读）----------
{id:'tk-xiaomao',grade:'四年级',title:'【真题库】一只小猫的"工作"',author:'真题风格·记叙文',genre:'真题库',outputPrompt:'读完后完成下面的题目，再给短文拟一个小标题。',
 content:'外婆家有一只橘色的猫，叫阿黄。别看它整天懒洋洋地晒太阳，其实它有一份重要的"工作"——捉老鼠。\n\n阿黄捉老鼠很有耐心。它先蹲在墙角，一动不动，眼睛盯着墙根的小洞，一盯就是一个钟头。妹妹嫌它无聊，拿毛线球逗它，它看也不看。我说："阿黄，别傻等啦，老鼠不会出来的。"外婆笑着说："嘘，别打扰它，它在工作呢。"\n\n夜深了，我们都睡了。忽然，厨房传来"扑通"一声，接着是阿黄"喵呜"一声得意的叫。第二天早上，我们在厨房门口看到了阿黄的"战利品"。外婆摸摸阿黄的头说："好样的，今晚给你加餐！"\n\n从那以后，我再也不说阿黄"傻等"了。原来，做好一份工作，最重要的就是耐心。',
 questions:[{q:'阿黄的"工作"是什么？用横线在文中画出相关的句子。（写出句子内容）',ref:'捉老鼠'},{q:'从哪些地方可以看出阿黄捉老鼠很有耐心？（写出两处）',ref:'蹲在墙角一动不动，盯着小洞一盯就是一个钟头；毛线球逗它也不看'},{q:'"我"对阿黄的态度发生了怎样的变化？',ref:'一开始认为它傻等、无聊，后来明白耐心才能做好工作，不再说它傻等'},{q:'这篇短文告诉我们什么道理？',ref:'做好一份工作，最重要的是耐心'}]},
{id:'tk-shu',grade:'四年级',title:'【真题库】会"报警"的树',author:'真题风格·说明文',genre:'真题库',outputPrompt:'边读边思考：科学家从树上得到了什么启示？',
 content:'你知道吗？植物也会"说话"。\n\n科学家发现，当树木遭到害虫啃咬时，会散发出一种特殊的气味。这种气味就像一封"报警信"，附近的树木"闻"到后，会提前分泌出令害虫讨厌的化学物质，做好防御准备。害虫再来啃咬时，发现这些树变得"难吃"了，只好悻悻离开。\n\n更有趣的是，有些树还会发出"求救信号"，引来害虫的天敌。比如，一种柳树被毛虫啃食后，会散发出特殊的气味，把一种小蜂吸引过来。小蜂正是毛虫的天敌，它把卵产在毛虫体内，毛虫就被消灭了。\n\n植物虽然不会开口讲话，却用自己的方式传递信息、保护自己。大自然的奥秘，比我们想象的还要多。',
 questions:[{q:'树木遭到害虫啃咬时会散发出什么？它的作用是什么？',ref:'特殊的气味；像报警信，提醒附近的树提前做好防御'},{q:'柳树是怎样"求救"的？',ref:'散发特殊气味引来小蜂，小蜂是毛虫的天敌，能消灭毛虫'},{q:'这篇短文是围绕哪句话来写的？找出来。',ref:'植物虽然不会开口讲话，却用自己的方式传递信息、保护自己'},{q:'读了短文，你得到了什么启示？',ref:'示例：大自然充满奥秘，要善于观察和发现'}]},
{id:'tk-qiao',grade:'五年级',title:'【真题库】家乡的桥',author:'真题风格·抒情散文',genre:'真题库',outputPrompt:'你的家乡有什么让你难忘的事物？仿照短文写一段。',
 content:'我的家乡在江南水乡，那里河多，桥也多。\n\n最难忘的是村东头那座老石桥。桥栏上刻着莲花，桥墩上爬满了青苔。听爷爷说，这座桥有两百多年了，是我祖上一辈辈人捐钱修建的。\n\n小时候，老石桥是我们乐园。夏天，我们在桥上比赛跳水，"扑通扑通"地扎进河里；雨天，我们躲在桥洞里，看雨点在水面上画出一个个圆晕；夜晚，月亮升起来，月影落在水中央，我们趴在桥栏上，看月亮在水里晃啊晃。\n\n后来，村里修了宽阔的水泥大桥，汽车来来往往，方便多了。可我每次回家，总要到老石桥上走一走。站在桥上，我仿佛又听见了童年的笑声。\n\n家乡的桥，连着河，连着路，也连着我的心。',
 questions:[{q:'短文围绕老石桥回忆了哪几个童年的场景？',ref:'夏天跳水、雨天桥洞避雨看雨点、夜晚趴在桥栏看月影'},{q:'为什么"我"每次回家总要到老石桥上走一走？',ref:'因为老石桥承载着童年的快乐记忆，寄托着对家乡的眷恋'},{q:'结尾"家乡的桥，连着河，连着路，也连着我的心"有什么含义？',ref:'桥不仅连接交通，更寄托着作者对家乡和童年深深的感情'},{q:'文中写了新修的水泥大桥，有什么作用？',ref:'对比突出老石桥在"我"心中的特殊地位，表达对老石桥的怀念'}]},
{id:'tk-yanshi',grade:'五年级',title:'【真题库】岩石里的时钟',author:'真题风格·科普说明',genre:'真题库',outputPrompt:'你还知道哪些记录时间或历史的方式？说一说。',
 content:'钟表能告诉我们时间，可你知道岩石也能"记录"时间吗？\n\n在悬崖的断面上，我们常常能看到一层一层的条纹，就像书页一样。地质学家告诉我们，这些岩层是一层一层慢慢堆积形成的。在自然界，堆积一厘米厚的岩层，往往需要成百上千年。岩层的厚薄、颜色、成分，都记录着那个年代的信息：这一层有贝壳的化石，说明这里曾经是海洋；那一层有黑色的炭层，说明这里曾经是茂密的森林。\n\n科学家研究岩层，就像读一本厚厚的书。他们读懂了地球的年龄——大约四十六亿岁；读懂了恐龙曾经称霸地球上亿年；也读懂了高山曾经是海底，大海曾经是陆地。\n\n原来，脚下的每一块岩石，都是大自然留下的时钟。',
 questions:[{q:'岩层是怎样形成的？',ref:'一层一层慢慢堆积形成的'},{q:'岩层里有贝壳化石说明什么？有炭层说明什么？',ref:'有贝壳化石说明这里曾经是海洋；有黑色炭层说明这里曾经是茂密的森林'},{q:'科学家从岩层这本"书"里读懂了什么？（写出两点）',ref:'地球的年龄约四十六亿岁；恐龙曾称霸地球上亿年；高山曾是海底等'},{q:'题目"岩石里的时钟"好在哪里？',ref:'运用比喻，把岩层记录时间、历史的特点写得生动形象，激发阅读兴趣'}]},
{id:'tk-laowu',grade:'六年级',title:'【真题库】修鞋的老人',author:'真题风格·记叙文',genre:'真题库',outputPrompt:'文中老人的哪些细节最打动你？写下来。',
 content:'街角有一个修鞋的小摊，守摊的是一位驼背的老人。\n\n老人的摊子很简单：一台老式的补鞋机，一个木箱，里面整整齐齐地码着钉子、鞋掌和线团。他修鞋极慢，也极仔细。补一只鞋底，他先打磨，再刷胶，然后一针一线地缝，缝完了还要用小木槌敲得平平整整。有人催他："老师傅，快点嘛！"他头也不抬："慢工出细活，鞋是穿在脚上走路的，马虎不得。"\n\n老人收费很低，学生来修鞋，他常常只收一半的钱，有时还摆摆手："小事情，不要钱。"可他的手艺远近闻名，连隔壁街的人都来找他。\n\n去年冬天，老人出摊时裹着一件洗得发白的棉袄。我问他冷不冷，他笑着指指手里的活计："手里有活，心里就热乎。"\n\n如今走过街角，还能看见那个修鞋的小摊。老人低着头，一针一线，仿佛手里缝的不是鞋，而是一段慢悠悠的时光。',
 questions:[{q:'从哪些细节可以看出老人修鞋"极仔细"？（写出两处）',ref:'先打磨、再刷胶、一针一线地缝、用小木槌敲平整'},{q:'老人为什么给学生修鞋只收一半钱，甚至不要钱？',ref:'他心地善良、乐于助人，不计较金钱'},{q:'"手里有活，心里就热乎"这句话表现了老人怎样的生活态度？',ref:'热爱自己的手艺，勤劳踏实，内心充实'},{q:'结尾把老人缝鞋比作"缝一段慢悠悠的时光"，有什么表达效果？',ref:'写出老人专注从容的姿态，表达了对老人和那种认真、质朴生活态度的赞美与怀念'}]},
{id:'tk-saiji',grade:'六年级',title:'【真题库】最后一圈',author:'真题风格·记叙文',genre:'真题库',outputPrompt:'你坚持完成过一件困难的事吗？写一写经过和感受。',
 content:'校运会一千五百米决赛，我是最后一名。\n\n跑到第三圈的时候，前面的同学已经把我落下了一大截。我的喉咙发干，腿像灌了铅，每一步都像踩在棉花上。看台上的加油声渐渐稀了，我知道，大家都在关注前面的名次之争。\n\n"要不要放弃？"这个念头一冒出来，我就摇了摇头。报名的时候我说过，要跑完全程。我调整呼吸，一步一步向前挪。\n\n最后一圈，我几乎是在凭意志迈步。就在这时，看台上忽然响起一阵掌声，接着，全班同学站了起来，齐声喊我的名字。那声音像一股热流，涌遍我的全身。我挺直腰板，加快了摆臂，冲向终点。\n\n冲过终点线的那一刻，同学们围上来抱住我。虽然我是最后一名，可班主任说："你跑完了全程，你就是我们的冠军。"\n\n那是我运动会上最难忘的一枚"奖牌"。',
 questions:[{q:'跑到第三圈时，"我"的身体状态是怎样的？（用文中的话回答）',ref:'喉咙发干，腿像灌了铅，每一步都像踩在棉花上'},{q:'是什么让"我"坚持跑完了全程？（写出两方面）',ref:'自己报名时"要跑完全程"的承诺；全班同学的掌声和呐喊'},{q:'班主任为什么说"你跑完了全程，你就是我们的冠军"？',ref:'因为坚持到底、战胜自我的精神比名次更可贵'},{q:'结尾"最难忘的一枚奖牌"指的是什么？',ref:'坚持跑完全程获得的肯定与自我超越，它比真正的奖牌更珍贵'}]},
// ---------- 快乐读书吧 ----------
{id:'kldb-1s',grade:'一年级',title:'快乐读书吧·读书真快乐',author:'一年级上册',genre:'快乐读书吧',outputPrompt:'和爸爸妈妈一起读一首儿歌，读给家人听。',
 content:'【推荐阅读】和大人一起读儿歌和童谣：《小兔子乖乖》《摇啊摇，摇到外婆桥》《小老鼠上灯台》等。\n\n【阅读小提示】①大声读，把每个字音读准；②边读边想象画面；③读完了，讲给爸爸妈妈听。\n\n【小剧场】小兔子乖乖，把门儿开开……这首儿歌里，小兔子为什么不给大灰狼开门？因为它记得妈妈的话，不给陌生人开门。读儿歌的时候，可以和家人分角色演一演哦！',
 questions:[{q:'《小兔子乖乖》里，小兔子为什么不给大灰狼开门？',ref:'因为大灰狼是陌生人（坏蛋），要听妈妈的话不给陌生人开门'},{q:'和大人一起读书时，可以怎么做让阅读更有趣？',ref:'分角色朗读、边读边演、读后讲故事等'}]},
{id:'kldb-1x',grade:'一年级',title:'快乐读书吧·读读童谣和儿歌',author:'一年级下册',genre:'快乐读书吧',outputPrompt:'选一首喜欢的童谣背下来，配上动作表演。',
 content:'【推荐阅读】《小青蛙打鼓》《月亮走，我也走》《小燕子》《外婆的澎湖湾》等童谣和儿歌。\n\n【阅读小提示】童谣读起来朗朗上口，可以拍手读、对读、接龙读。遇到不认识的字，可以请大人帮忙，或者圈出来多读几遍。\n\n【读一读】月亮走，我也走，我给月亮提竹篓。竹篓里有两个蛋，留给月亮做早饭。这首童谣多有趣！你也可以编一首属于自己的童谣。',
 questions:[{q:'童谣读起来有什么特点？',ref:'朗朗上口，有节奏，押韵'},{q:'童谣可以用哪些有趣的方法来读？',ref:'拍手读、对读、接龙读、配动作表演等'}]},
{id:'kldb-2s',grade:'二年级',title:'快乐读书吧·读读童话故事',author:'二年级上册',genre:'快乐读书吧',outputPrompt:'讲一个你读过的童话故事给同学听。',
 content:'【推荐阅读】《小鲤鱼跳龙门》《孤独的小螃蟹》《小狗的小房子》《一只想飞的猫》等童话故事。\n\n【阅读小提示】读童话故事时，可以边读边想：故事里有谁？发生了什么有趣的事？把喜欢的句子画下来。\n\n【故事抢先看】小螃蟹一个人住在池塘边，他觉得有点孤独。可是后来，他用自己的大钳子帮小纸鸟画画，帮小乌龟翻跟头，大家都喜欢和他做朋友了。原来，帮助别人能让自己收获友谊！',
 questions:[{q:'读童话故事时可以思考哪些问题？',ref:'故事里有谁？发生了什么事？喜欢哪些句子？'},{q:'小螃蟹的故事告诉我们什么？',ref:'帮助别人能让自己收获友谊，不再孤独'}]},
{id:'kldb-2x',grade:'二年级',title:'快乐读书吧·读读儿童故事',author:'二年级下册',genre:'快乐读书吧',outputPrompt:'故事里的孩子和你有什么相同或不同的地方？',
 content:'【推荐阅读】《神笔马良》《七色花》《一起长大的玩具》《愿望的实现》等儿童故事。\n\n【阅读小提示】儿童故事写的是和我们差不多大的孩子的生活。读的时候可以想一想：如果是我，我会怎么做？\n\n【故事抢先看】马良得到了一支神笔，画什么就有什么。他用神笔给穷人画耕牛、画水车，却不给贪心的大官画金山。马良用神笔帮助别人的样子，真让人敬佩！',
 questions:[{q:'马良用神笔为谁画画？',ref:'为穷人（需要帮助的人）画画'},{q:'如果你有一支神笔，你想画什么？为什么？',ref:'示例：画一所学校给山区的孩子，让他们都能上学'}]},
{id:'kldb-3s',grade:'三年级',title:'快乐读书吧·在那奇妙的王国里',author:'三年级上册',genre:'快乐读书吧',outputPrompt:'你最喜欢哪个童话人物？说说理由。',
 content:'【推荐阅读】《安徒生童话》《格林童话》《稻草人》。\n\n【阅读小提示】童话王国里充满了奇妙的想象。读的时候，可以发挥想象，跟着故事一起旅行；还可以给故事里的人物做一张"名片"：名字、特点、经历。\n\n【你知道吗】安徒生是丹麦的童话作家，他写了《丑小鸭》《卖火柴的小女孩》《海的女儿》等一百多篇童话。叶圣陶爷爷写的《稻草人》，是中国第一本为儿童而写的童话集。',
 questions:[{q:'安徒生是哪个国家的童话作家？他有哪些代表作？',ref:'丹麦；《丑小鸭》《卖火柴的小女孩》《海的女儿》等'},{q:'读童话时可以做什么让阅读更有趣？',ref:'发挥想象跟着故事旅行、给人物做名片、讲故事给别人听等'}]},
{id:'kldb-3x',grade:'三年级',title:'快乐读书吧·小故事大道理',author:'三年级下册',genre:'快乐读书吧',outputPrompt:'选一个寓言故事，说说它蕴含的道理。',
 content:'【推荐阅读】《中国古代寓言》《伊索寓言》《克雷洛夫寓言》。\n\n【阅读小提示】寓言故事篇幅短小，却藏着深刻的道理。读完后想一想：故事讽刺了什么？赞美了什么？联系生活，这个道理对我们有什么用？\n\n【寓言小卡片】《掩耳盗铃》：有人捂住自己的耳朵去偷铃铛，以为自己听不见别人也听不见。这个故事告诉我们：自欺欺人解决不了问题。你还能说出哪些寓言故事的道理呢？',
 questions:[{q:'寓言故事有什么特点？',ref:'篇幅短小，蕴含深刻的道理'},{q:'《掩耳盗铃》告诉我们什么道理？',ref:'自欺欺人解决不了问题，骗得了自己骗不了别人'}]},
{id:'kldb-4s',grade:'四年级',title:'快乐读书吧·很久很久以前',author:'四年级上册',genre:'快乐读书吧',outputPrompt:'中外神话有什么相同和不同？和同学讨论。',
 content:'【推荐阅读】《中国古代神话》《世界经典神话与传说故事》（如希腊神话、北欧神话等）。\n\n【阅读小提示】神话是古人对世界的想象。读神话时，感受故事中神奇的想象，体会人物鲜明的形象：盘古的奉献、精卫的坚持、普罗米修斯的勇敢……\n\n【神话连连看】开天辟地——盘古；填海——精卫；盗火——普罗米修斯；射日——后羿；治水——大禹。神话里的英雄，都有一个共同点：为了大家，不怕困难。',
 questions:[{q:'神话故事是怎样产生的？',ref:'是古人对世界起源和自然现象的想象'},{q:'盘古、精卫、普罗米修斯有什么共同的品质？',ref:'为了他人不怕困难、勇于奉献'}]},
{id:'kldb-4x',grade:'四年级',title:'快乐读书吧·十万个为什么',author:'四年级下册',genre:'快乐读书吧',outputPrompt:'你心中有哪些"为什么"？选一个去书中找答案。',
 content:'【推荐阅读】《十万个为什么》（米·伊林）、《灰尘的旅行》《看看我们的地球》等科普作品。\n\n【阅读小提示】科普作品里有许许多多的"为什么"。读的时候可以边读边提问，把不懂的问题记下来，查资料解决；还可以把自己学到的知识讲给别人听。\n\n【趣味问答】为什么水壶里会有水垢？因为水里溶解着一些矿物质，水烧开后，矿物质沉淀下来，就形成了水垢。看，科学就在我们身边！',
 questions:[{q:'读科普作品时，遇到不懂的问题可以怎么办？',ref:'记下来查资料、请教别人、做实验验证等'},{q:'水壶里的水垢是怎样形成的？',ref:'水里的矿物质在烧开后沉淀下来形成的'}]},
{id:'kldb-5s',grade:'五年级',title:'快乐读书吧·从前有座山',author:'五年级上册',genre:'快乐读书吧',outputPrompt:'创造性地复述一个民间故事，可以换个视角讲。',
 content:'【推荐阅读】《中国民间故事》《欧洲民间故事》《非洲民间故事》。\n\n【阅读小提示】民间故事是口耳相传的艺术，常常有固定的类型和重复的情节。读的时候可以：①了解故事的主要内容；②练习创造性地复述——换个角色讲、加上动作和表情讲、续编故事讲。\n\n【复述小妙招】讲《牛郎织女》时，可以把自己当作老牛，用老牛的口气讲："我是一头老牛，我要告诉你们一个故事……"这样讲，故事是不是更有趣了？',
 questions:[{q:'民间故事有什么特点？',ref:'口耳相传，常有固定的类型和重复的情节'},{q:'创造性复述故事可以用哪些方法？',ref:'换角色讲、加动作表情、续编情节等'}]},
{id:'kldb-5x',grade:'五年级',title:'快乐读书吧·读经典名著',author:'五年级下册',genre:'快乐读书吧',outputPrompt:'四大名著你读过哪一部？讲讲里面的故事。',
 content:'【推荐阅读】《西游记》《三国演义》《水浒传》《红楼梦》（青少年版）。\n\n【阅读小提示】古典名著的语言和现在不同，可以结合影视剧帮助理解；读的时候注意梳理人物关系，把握主要情节。\n\n【名著小档案】《西游记》：唐僧师徒历经九九八十一难去西天取经；《三国演义》：魏蜀吴三国的英雄故事；《水浒传》：一百零八位好汉的故事；《红楼梦》：贾府的兴衰故事。',
 questions:[{q:'中国古典"四大名著"是哪四部？',ref:'《西游记》《三国演义》《水浒传》《红楼梦》'},{q:'读古典名著时遇到困难可以怎么办？',ref:'结合影视剧帮助理解、查工具书、梳理人物关系、和同学讨论'}]},
{id:'kldb-6s',grade:'六年级',title:'快乐读书吧·笑与泪，经历与成长',author:'六年级上册',genre:'快乐读书吧',outputPrompt:'小说里的哪个人物让你想起了自己或身边的人？',
 content:'【推荐阅读】《童年》（高尔基）、《小英雄雨来》《爱的教育》等成长小说。\n\n【阅读小提示】小说有鲜活的人物和曲折的情节。读的时候可以：①关注主要人物和情节，理清故事线索；②体会人物的性格和命运；③联系自己的生活，思考成长的含义。\n\n【人物卡片】阿廖沙（《童年》主人公）：他的童年充满苦难，但他始终保持着善良和坚强，在艰难中成长。苦难没有打败他，反而让他更懂得珍惜光明。',
 questions:[{q:'读小说时可以关注哪些方面？',ref:'主要人物、故事情节、人物性格命运、成长主题'},{q:'阿廖沙的成长经历给你什么启示？',ref:'示例：面对困难要保持善良和坚强，苦难能让人成长'}]},
{id:'kldb-6x',grade:'六年级',title:'快乐读书吧·漫步世界名著花园',author:'六年级下册',genre:'快乐读书吧',outputPrompt:'选一部冒险小说，写一份阅读计划。',
 content:'【推荐阅读】《鲁滨逊漂流记》《骑鹅旅行记》《汤姆·索亚历险记》《爱丽丝漫游奇境》等世界名著。\n\n【阅读小提示】冒险小说情节跌宕起伏，读的时候可以：①跟着主人公经历冒险，预测后面会发生什么；②思考主人公靠什么战胜困难；③写一写读后感。\n\n【阅读计划示例】第一周：读《鲁滨逊漂流记》流落荒岛部分；第二周：读鲁滨逊建房种粮部分；第三周：读救"星期五"部分，完成读书笔记。',
 questions:[{q:'读冒险小说时可以做什么预测和记录？',ref:'预测后面的情节，记录主人公战胜困难的方法，写读后感'},{q:'鲁滨逊在荒岛靠什么活了下来？',ref:'靠智慧、勤劳和乐观，自己动手建房、种粮、养羊'}]},
];

/* ===== 通用工具 ===== */
function $(s){ return document.querySelector(s); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function load(){
  try{ const l=JSON.parse(localStorage.getItem(K_LESSONS)); if(Array.isArray(l)&&l.length) LESSONS=l; else LESSONS=JSON.parse(JSON.stringify(SAMPLE)); }catch(e){ LESSONS=JSON.parse(JSON.stringify(SAMPLE)); }
  try{ if(typeof expandCatalog==='function'){ const ids=new Set(LESSONS.map(x=>x.id)); const tset=new Set(LESSONS.map(x=>x.grade+'|'+x.volume+'|'+x.unit+'|'+x.title)); expandCatalog().forEach(e=>{ const tk=e.grade+'|'+e.volume+'|'+e.unit+'|'+e.title; if(tset.has(tk)) return; if(ids.has(e.id)) e=Object.assign({},e,{id:e.id+'_r'+LESSONS.length}); LESSONS.push(e); tset.add(tk); ids.add(e.id); }); } }catch(e){}
  try{ if(typeof TRAIN_EXTRA!=='undefined'){ LESSONS.forEach(l=>{ const ex=TRAIN_EXTRA[l.id]; if(!ex||!l.train) return; Object.keys(ex).forEach(cat=>{ l.train[cat]=l.train[cat]||[]; const have=new Set(l.train[cat].map(q=>q.q||(q.material||''))); ex[cat].forEach(q=>{ const k=q.q||(q.material||''); if(!have.has(k)) l.train[cat].push(q); }); }); }); } }catch(e){}

 {h:'审题立意',b:'生活像个万花筒，写一件让你印象深刻的事。要把事情的起因、经过、结果写清楚，重点写经过，还要写出自己的真实感受。'},
 {h:'选材锦囊',b:'第一次系列（第一次煎蛋、第一次走夜路、第一次游泳）、家庭趣事（家庭运动会、停电之夜、包饺子大赛）、校园事件（拔河比赛、一次误会、课间十分钟）……选想起来还会笑、还会心跳的那件。'},
 {h:'结构提纲',b:'开头：交代事情（可以直接从最紧张的一幕写起，制造悬念）。中间：按顺序写经过，最精彩的部分放慢写、写具体。结尾：写感受和收获，点明为什么印象深刻。'},
 {h:'写作妙招',b:'① 最精彩处"慢镜头"：动作分解开，加上语言、神态、心理；② 其他部分简要交代，有详有略；③ 声音词是法宝（"啪""哗哗""扑通"），让场面有声有色。'},
 {h:'好词百宝箱',b:'手忙脚乱、哈哈大笑、紧张激烈、欢呼雀跃、记忆犹新、心怦怦直跳、小心翼翼、哭笑不得、热火朝天、不约而同'},
 {h:'避坑提醒',b:'① 从头到尾平铺直叙，像流水账；② 只写事情，不写心情和感受；③ 事情的起因、结果交代不清，读者看了一头雾水。'}
],
xiuzuowenhua:[
 {h:'审题立意',b:'选一处中国的世界文化遗产来介绍：可以写它的样子（位置、外观、结构），也可以写与它有关的历史故事或传说。字里行间要流露出对中华文化的自豪与热爱。'},
 {h:'选材锦囊',b:'长城、故宫、秦兵马俑、莫高窟、颐和园、泰山、苏州园林……选你资料找得最全、最感兴趣的一处。写之前先查查资料，把关键数据（长度、高度、年代、数量）记下来。'},
 {h:'结构提纲',b:'开头：点明写哪处遗产，可用名言或地位引入（如"不到长城非好汉"）。中间：按一定顺序介绍（由远到近、整体到部分），写最打动你的特点，穿插历史故事。结尾：赞叹古代劳动人民的智慧，抒发自豪之情。'},
 {h:'写作妙招',b:'① 列数字让介绍更具体（"一万三千多里""近八千个"）；② 用比喻写出气势（"像一条巨龙""像一支整装待发的军队"）；③ 加入传说或历史故事，让遗产"有故事、有温度"。'},
 {h:'好词百宝箱',b:'举世闻名、雄伟壮观、巧夺天工、历史悠久、气势磅礴、金碧辉煌、惟妙惟肖、世界奇迹、古色古香、叹为观止'},
 {h:'避坑提醒',b:'① 只堆资料和数据，没有自己的感受；② 介绍顺序混乱，东一句西一句；③ 一次写好几个遗产，哪个都写不透。'}
],
xiuzuo8:[
 {h:'审题立意',b:'写一件让你"心儿怦怦跳"的事：紧张、害怕、激动、担心都算。要把事情的经过写清楚，更要把当时的心理活动写具体——心怎么跳的、身体什么反应、心里想了什么。'},
 {h:'选材锦囊',b:'第一次登台表演、等待宣布成绩、一个人在家、走夜路、参加决赛、生日惊喜、打碎东西怕被发现……选那件让你现在想起来心还会跳快一拍的事。'},
 {h:'结构提纲',b:'开头：交代是什么事。中间：按顺序写经过，在"心跳得最厉害"的地方停下来，细写心理和身体反应。结尾：写事情的结果、感受和成长。'},
 {h:'写作妙招',b:'① 心跳有过程：越来越紧张 → 到达顶点 → 慢慢平静，写出变化；② 身体反应帮大忙：手心出汗、双腿发抖、屏住呼吸、心提到嗓子眼；③ 用环境烘托心情（安静、黑暗、风声）。'},
 {h:'好词百宝箱',b:'心儿怦怦跳、忐忑不安、七上八下、心惊肉跳、屏住呼吸、手忙脚乱、喜出望外、如释重负、提心吊胆、心里像揣了只小兔子'},
 {h:'避坑提醒',b:'① 只写事情经过，不写"怦怦跳"的感觉；② 全篇只会说"我很紧张"，没有具体描写；③ 心情从头到尾一个样，没有起伏变化。'}
],
xiuzuo7:[
 {h:'审题立意',b:'学写一封信，把想说的话写清楚、写真：感谢、道歉、想念、分享快乐都可以。写信就像和对方面对面说话，语气要真诚、自然。'},
 {h:'格式口诀（必背）',b:'称呼顶格冒号跟，正文空两格写分明；祝语"此致"或"祝愿"，署名日期右下角。——①称呼：第一行顶格写，后面加冒号；②正文：另起一行空两格；③祝语：写表示祝愿的话；④署名：靠右写自己的名字；⑤日期：写在署名的正下方。'},
 {h:'选材锦囊',b:'写给谁：亲人、老师、好朋友，甚至未来的自己、远方的同学。写什么：一件具体的事 + 你的心里话。比如感谢妈妈照顾生病的你，想念转学的好朋友，向爷爷汇报学习进步。'},
 {h:'写作妙招',b:'① 用"你"来称呼对方，像聊天一样亲切；② 正文写 1~2 件具体的事，别只说空话套话；③ 结尾送上真诚的祝福。'},
 {h:'避坑提醒',b:'① 忘记称呼或署名，格式不完整；② 祝语位置写错；③ 正文空话连篇，没有具体内容。'}
]

const XIZUO_FANWEN={
xiuzuo1:[
 {title:'推荐家乡的小河',text:'城里有很多高楼大厦，可我最想推荐的，是家乡的那条小河。\n小河的水清极了，清得能看见水底的沙石。夏天，河边的柳树垂下长长的枝条，随风轻轻摆动。我们脱掉鞋子，踩进水里，凉丝丝的，真舒服！小鱼从脚边游过，好像在和我们捉迷藏。翻开一块石头，说不定还能捉到一只小螃蟹呢。\n岸边有一片软软的草地。玩累了，我们就躺在草地上，看天上的云慢悠悠地飘，听树上的知了唱歌。傍晚，夕阳把河水染成了金色，整条小河闪闪发光。\n如果你来我的家乡，我一定带你去小河边。相信你也会喜欢上它的！',note:'用看、听、触多种感受写小河的"好"，捉鱼、躺草地这些活动充满童趣，让人一读就想去。'},
 {title:'推荐人民公园',text:'我要推荐的地方，是市中心的人民公园。\n一走进公园大门，首先看到的是一片大草坪。小草绿油油的，像一块柔软的大地毯。周末，草坪上可热闹了，小朋友们放着风筝，"燕子""蝴蝶"在天空中你追我赶。\n顺着小路往前走，就到了人工湖。湖水静得像一面大镜子，倒映着亭子和柳树。租一条小船，在水面上慢慢划行，偶尔有红色的鲤鱼跃出水面，吓你一跳。\n公园东边还有一个小动物园，最有趣了。猴子在假山上跳来跳去，孔雀展开漂亮的尾巴，羊驼歪着头看你，逗得大家哈哈大笑。\n人民公园又美又好玩，真是周末游玩的好去处。快来玩吧！',note:'按游览顺序移步换景——草坪、人工湖、小动物园，一处一个亮点，结尾发出邀请，紧扣"推荐"。'},
 {title:'推荐我的"宝藏"书店',text:'我要推荐的地方，是街角的一家小书店。它是我心里的"宝藏"。\n书店不大，书却特别多：漫画、童话、科普……整整齐齐地排在木架上，随便抽出一本，都能看上一个下午。店主是一位白发老爷爷，他从不催我们走，还会摆好小板凳让我们坐。\n每个周六下午，我都泡在书店里。有时跟着恐龙回到远古时代，有时跟着尼尔斯骑鹅去旅行。读到有趣的地方，我会忍不住笑出声来。老爷爷扶扶眼镜，笑着说："小书虫，又来喽！"\n这家小书店，就像一艘神奇的小船，载着我去看大大的世界。爱看书的你，一定要来！',note:'选材与众不同，不写风景写书店。"摆小板凳""小书虫"这些细节，让推荐的地方有了温度和故事。'},
 {title:'推荐外婆家的菜园',text:'你要问我最想去哪儿，我会大声说："外婆家的菜园！"\n菜园不大，却是个热闹的小世界。春天，油菜花金黄金黄的，蝴蝶在花间跳舞；夏天，西红柿像一个个小红灯笼，挂在枝头；黄瓜顶着黄花，懒洋洋地躺在架子上。外婆说，这些都是她一锄头一锄头种出来的。\n我最爱帮外婆摘菜。我提着竹篮，钻进菜地，摘下一个红彤彤的西红柿，擦一擦就咬一口，酸酸甜甜的汁水一下子溢满嘴巴。外婆在旁边笑："小馋猫！"\n傍晚，我们用刚摘的菜做了一大桌好吃的。我觉得，那是世界上最美味的饭菜。\n外婆家的菜园，有好看的景，有好吃的菜，还有外婆的爱。这样的地方，难道不值得推荐吗？',note:'按季节写菜园的样子，又写摘西红柿、吃晚饭的事，景、事、情融为一体，结尾反问有力。'}
],
xiuzuo2:[
 {title:'幽默的爸爸',text:'我的爸爸高高的，戴着一副黑框眼镜，眼睛里总是藏着笑。他是我们家的"开心果"。\n有一回，我数学没考好，垂头丧气地坐在沙发上。爸爸走过来，看了看试卷，没有批评我，反而清了清嗓子，一本正经地说："这位同志，不要灰心，在哪里摔倒，就在哪里……先躺一会儿，再爬起来嘛！"我"扑哧"一声笑了。接着，他坐下来，一道题一道题地给我讲，直到我全部弄懂。\n爸爸还特别爱讲笑话，每次讲完，自己先笑得前仰后合。妈妈总说："你们爷俩，真是一对活宝。"\n这就是我的幽默爸爸，他让我们家充满了笑声。我爱我的爸爸。',note:'"先躺一会儿再爬起来"，一句话就把爸爸的幽默和温柔都写活了。一件事，特点立住。'},
 {title:'我的"百变"妈妈',text:'我的妈妈像一位魔术师，会"变"出很多角色。\n我写作业时，她是严格的老师。有一次我写字潦草，妈妈眉头一皱："重写！"我只好擦掉，一笔一画重新写。写完后，妈妈又笑着说："看，这不是写得很漂亮嘛！"\n在厨房里，她是厉害的厨师。西红柿炒蛋、红烧排骨、清蒸鲈鱼……香味飘到我的房间里，馋得我直流口水。\n到了周末，她又成了我的玩伴。陪我打羽毛球、放风筝，笑得比我还大声。\n这就是我的妈妈，严格的、能干的、爱玩的妈妈。不管哪一个，都是我最爱的妈妈。',note:'用"百变"的构思串起三个小场景，段落整齐，一个立体的妈妈跃然纸上。'},
 {title:'"百事通"爷爷',text:'我的爷爷头发花白，鼻梁上架着一副老花镜。别看他年纪大，在我们家，人人都叫他"百事通"。\n爷爷特别爱读书，报纸、《十万个为什么》都是他的好朋友。不管问什么，他都能答上来。有一次我问："爷爷，月亮为什么老跟着我走？"爷爷扶扶眼镜，认真地讲："月亮离我们很远很远，你走的时候，看过去它就像在跟着你。"说完，他还带我到院子里，用放大镜观察树叶上的纹路。\n爷爷的手也很巧。家里的钟表、风扇不转了，他拆开摆弄几下，就修好了。我说，爷爷的手是魔法手。\n我爱我的"百事通"爷爷。长大后，我也要像他一样，做一个有学问的人。',note:'外号开头，特点鲜明。"问月亮"和"修家电"两件事，把"百事通"撑了起来，有理有据。'},
 {title:'家有"调皮鬼"',text:'我的妹妹今年三岁，扎着两个小辫子，眼睛圆圆的，看上去特别乖巧。可实际上，她是个不折不扣的"调皮鬼"。\n上星期天，我正在房间里画画。妹妹摇摇晃晃地走进来，趁我不注意，抓起蜡笔在我的画上涂了一大片。我回头一看，气得正要发火，她却举着画，眨巴着眼睛说："姐姐，我帮你画了个大恐龙！"看着她那副可爱的样子，我的气一下子消了，真是哭笑不得。\n不过，调皮鬼也有贴心的时候。妈妈下班回家，她会"哒哒哒"跑过去拿拖鞋，甜甜地喊一声"妈妈辛苦啦"，把妈妈一天的疲劳都喊跑了。\n这就是我的妹妹，一个让人又气又爱的小家伙。',note:'先写调皮、再写贴心，先抑后扬，妹妹的形象真实可爱，"哭笑不得"用得很准。'}
],
xiuzuo3:[
 {title:'绿豆发芽观察日记',text:'9月20日 星期六 晴\n今天，我把一把绿豆泡进了水里。绿豆小小的、绿绿的，硬邦邦的，像一颗颗小石子。我在碗口蒙上湿纱布，悄悄说："小绿豆，快快发芽吧！"\n9月22日 星期一 晴\n一早掀开纱布，哇！绿豆喝饱了水，变得胖乎乎的，有的还撑破了绿衣裳，露出白白的肚皮。裂缝里钻出一个小芽，白白的、尖尖的，大约 5 毫米长。\n9月25日 星期四 多云\n豆芽长得真快！茎又白又嫩，挺得直直的，顶上张开两片小叶子，像一把把小剪刀。我量了量，最高的已经有 7 厘米了！\n这次观察让我发现：小小的绿豆，竟然有这么大的生长力量。',note:'日期天气齐全，变化过程写得清清楚楚，还用上"5 毫米""7 厘米"这样的数字，观察真细致。'},
 {title:'养蚕观察日记',text:'4月3日 星期三 多云\n妈妈给我带回五条小蚕。它们黑黑的、瘦瘦的，像小蚂蚁一样。我把新鲜的桑叶放进盒子里，它们慢吞吞地爬过去，一点一点啃起来。\n4月9日 星期二 晴\n小蚕蜕皮了！现在的它们白白的、胖胖的，身体上一节一节的。吃桑叶的时候，会发出"沙沙"的声音，像下小雨一样好听。\n4月18日 星期五 晴\n小蚕开始吐丝了！它的身体变得亮晶晶的，头抬起来，摇啊摇，吐出细细的丝。两天后，它把自己裹进了一个雪白的茧里。\n养蚕的这段日子，我亲眼看到了生命的奇迹。蚕宝宝真了不起！',note:'三则日记抓住蜕皮、吃叶、吐丝三个关键变化，"沙沙"声是听出来的，观察有方法。'},
 {title:'月亮观察日记',text:'10月2日 星期一 晴\n今晚的月亮细细的，弯弯的，像天空剪下的一片指甲。爷爷说，这叫新月。我走，月亮也跟着走；我停，它也停，真奇怪！\n10月8日 星期日 晴\n月亮变胖了！今晚它已经是半个了，像一块被咬了一半的烧饼，把银色的光洒在地上。\n10月15日 星期日 晴\n今天是十五，月亮圆了，像一个大大的白玉盘。月光洒下来，地上像铺了一层霜。我还发现月亮上有黑影，那真的是桂花树和玉兔吗？\n月亮每天都在变，大自然真是太奇妙了！',note:'从月牙到满月连续观察，比喻一个比一个有趣，结尾的疑问给日记添了探索的味道。'}
],
xiuzuo4:[
 {title:'我和孙悟空过一天',text:'早上，我正在写作业，窗外突然闪过一道金光——孙悟空踩着筋斗云，落在了我的窗台上！\n"小孩儿，今天俺老孙带你去玩！"他吹了口气，我就坐上了筋斗云。"嗖"的一声，我们飞上了天。地上的房子变成了火柴盒，大河变成了一条银丝带，风在耳边呼呼地响。\n我们先到了花果山。小猴子们叽叽喳喳地围上来，捧来桃子、野果。孙悟空拔下一根毫毛一吹，变出几十只小猴子，陪我们捉迷藏、荡秋千。下午，他又带我去了东海龙宫，老龙王领着我们看了定海神针，那金箍棒粗得我们三个人都抱不过来！\n太阳落山时，孙悟空送我回家。他拍拍我的肩膀："好好学习，俺老孙还来找你玩！"这真是我最快乐的一天。',note:'筋斗云、花果山、龙宫，每个情节都用了孙悟空的本领，想象大胆又合理，读着过瘾。'},
 {title:'我和哪吒过一天',text:'"咚咚咚！"有人敲门。我打开门一看，竟然是踩着风火轮的哪吒！他胳膊上还戴着亮闪闪的乾坤圈。\n"走，去海边玩！"眨眼间，我们就站在了沙滩上。海浪一排排涌过来，哪吒教我踩着浪花奔跑，风火轮贴着水面飞，溅起的水花像一串串珍珠。我们还一起捡贝壳，他用乾坤圈当线，给我串了一个"贝壳风铃"。\n下午，我们看见一艘小船被浪冲上了礁石，动弹不得。哪吒二话不说，跳进水里，用肩膀把船顶了起来，我在岸上帮忙喊方向。渔船得救了，渔民伯伯连连向我们道谢。\n分别时，哪吒把风铃送给我："听到风铃响，就当我在你身边。"我会一直珍惜这个风铃的。',note:'既有玩的乐趣，又有救渔船的有意义情节，想象故事里藏着助人为乐的主题，立意高了一层。'},
 {title:'我和女娲过一天',text:'晚上，我做了一个奇妙的梦：一位面容慈祥的女神站在我面前，手里捧着五色的石子。她是女娲！\n女娲带我去天边。天上破了一个小洞，冷风呼呼地往里灌。女娲聚来五色石，用神火炼啊炼，炼成了稠稠的液体，她端起液体，对准洞口轻轻一泼——金光四射，天补好了！天边的云，一下子变成了五彩的晚霞。\n接着，女娲又捏起黄泥，教我捏小泥人。我捏呀捏，捏出了一只小泥兔。女娲朝它吹了口气，小泥兔竟然活了，围着我的脚蹦来蹦去，痒得我咯咯直笑。\n"起床啦！"妈妈叫醒了我。原来是梦啊！可是那片五彩的天空，好像还在我眼前闪着光。',note:'梦中相遇的开头自然巧妙，补天、捏泥人两个情节都呼应神话故事本身，想象有根有据。'}
],
xiuzuo5:[
 {title:'第一次煎蛋',text:'今天妈妈不在家，我决定自己煎一个鸡蛋。\n我先打开火，往锅里倒了点油。等油热了，我拿起鸡蛋在锅边一磕，"咔嚓"一声，蛋清流进了锅里。锅里立刻"噼里啪啦"响起来，油星四溅，我吓得连退两步。\n"该翻面了！"我提醒自己，握锅铲的手都有点抖。我用力一翻——糟糕，用力过猛，鸡蛋飞到了锅外！我赶紧把它"请"回锅里，还好，虚惊一场。不一会儿，鸡蛋变得金黄金黄的，边缘还有点焦。\n妈妈回来，尝了一口我煎的蛋，笑着说："有点焦，不过真香！"听了这话，我心里比吃了蜜还甜。\n这次煎蛋让我明白：看似简单的事，自己动手才知道不容易。',note:'"咔嚓""噼里啪啦"让场面有声有色，"连退两步""手有点抖"把第一次的手忙脚乱写活了。'},
 {title:'停电之夜',text:'上周五晚上，我们一家人正看电视，突然眼前一黑——停电了！\n爸爸摸黑找来手电筒，妈妈点起蜡烛。烛光摇摇晃晃，客厅一下子变得神秘起来。爸爸提议："来玩手影游戏吧！"\n我们围在蜡烛边。爸爸两手一搭，墙上出现一只竖着耳朵的"小兔子"。我也不甘示弱，做了一只"大老鹰"，张开翅膀朝"小兔子"扑过去。妈妈笑着加入，她的"小狗"还会"汪汪"叫——那是妈妈配的音。我们三个人笑得前仰后合。\n那个晚上没有电视，也没有游戏，可笑声比哪天都多。我忽然明白：最温暖的不是明亮的灯光，而是和家人在一起的时光。',note:'停电本是意外，却写出了快乐。手影游戏的细节生动，结尾的感悟自然升华，是全文的点睛之笔。'},
 {title:'拔河比赛',text:'"预备——开始！"裁判一声令下，拔河比赛开始了！\n我们死死攥住麻绳，身子向后倾，脚蹬着地，使出了全身的力气。绳子中间的红领巾一会儿移过来，一会儿移过去，我的心也跟着忽上忽下。对方的力气真大，我的手被绳子勒得生疼，可我咬紧牙关，就是不松手。\n"四班加油！四班加油！"两边的呐喊声一阵高过一阵。就在这时，我们班的"大力士"张小明大吼一声："大家一起拉！"我们喊着号子，一鼓作气往后拽——红领巾一点一点过来了！\n"我们赢啦！"大家跳啊，喊啊，有的同学激动得坐在了地上。\n这场拔河比赛让我真正懂得了：团结，就是力量！',note:'比赛过程写得有起伏，"攥""蹬""咬紧牙关"等动作词用得好，结尾点题简洁有力。'},
 {title:'家庭包饺子大赛',text:'星期天，我家举行了一场包饺子大赛。参赛选手：爸爸、妈妈和我。裁判：奶奶。\n比赛一开始，爸爸就暴露了"急性子"的本色，抓起一张皮，塞了一大团馅，使劲一捏——"噗"，馅从另一边挤了出来，饺子变成了"开口笑"。妈妈包的饺子整整齐齐，像一排小士兵。可我包的饺子呢？扁扁的，立都立不稳，活像一只只小懒猪。\n奶奶看了，笑着教我："馅放少一点，边儿要捏紧。"我照着做，果然，一个胖乎乎的饺子稳稳地站在了案板上！\n饺子出锅了，热气腾腾的。吃着自己包的饺子，我觉得格外香。奶奶宣布："本届大赛，人人都是冠军！"\n这场比赛没有输赢，却装满了我们全家的笑声。',note:'比赛形式让普通家务变得好玩，爸爸的"开口笑"、我的"小懒猪"画面感十足，详略得当。'}
],
xiuzuowenhua:[
 {title:'雄伟的长城',text:'人们常说："不到长城非好汉。"去年暑假，我终于登上了向往已久的长城。\n远远望去，长城像一条巨龙，蜿蜒盘旋在崇山峻岭之间。走上长城，脚下的方砖又宽又平，城墙高大坚固。城墙外沿有垛子，垛子上有瞭望口和射口，每隔一段就有一座方形的城台，那是屯兵的堡垒。\n爸爸告诉我，长城从东头的山海关到西头的嘉峪关，有一万三千多里。那时候没有火车、汽车，没有起重机，全靠劳动人民的肩膀和双手，一步一步把这无数的条石抬上陡峭的山岭。多少人的血汗和智慧，才凝结成这前不见头、后不见尾的万里长城。\n站在城台上放眼望去，群山连绵起伏，风从耳边吹过，我仿佛听到了千年前的战马嘶鸣。\n长城，是中华民族的象征。我为自己是中国人而自豪！',note:'由远望到登上再联想，顺序清楚；引用数据和"肩膀和双手"的故事，让长城既有气势又有温度。'},
 {title:'秦兵马俑',text:'在西安，有一处让全世界惊叹的文化遗产——秦兵马俑，它被称为"世界第八大奇迹"。\n走进一号坑，我一下子惊呆了：坑里的兵马俑一行行、一列列，密密麻麻，足有几千个，就像一支整装待发的威武之师。它们个个身材魁梧，神态各不相同：有的颔首低眉，若有所思；有的目光炯炯，凝视远方；有的紧握双拳，好像随时准备冲上战场。仔细看，它们的发型、表情竟没有一模一样的！\n导游阿姨说，兵马俑有近八千个，都是两千多年前的工匠一个一个塑出来的。它们本来还有鲜艳的彩绘，只是岁月让它们褪了色。\n站在坑边，我仿佛听到了秦军隆隆的战鼓声。古代工匠的智慧和手艺，真让人佩服！',note:'用"有的……有的……有的……"写出兵马俑的神态各异，"近八千个"的数据让介绍具体可信。'},
 {title:'故宫，你真伟大',text:'在北京城的中心，有一片金碧辉煌的宫殿群——故宫。它是明清两代二十四位皇帝的家，也是世界上最大的皇宫之一。\n走进午门，首先看到的是内金水河，五座汉白玉石桥横跨河上，像五条玉带。再往北走，就到了太和殿。太和殿俗称金銮殿，高约三十五米，建在高高的汉白玉台基上。金黄色的琉璃瓦在阳光下闪闪发光，两根盘龙柱威风凛凛。爸爸告诉我，故宫有大小宫殿七十多座，房屋九千多间，光走一圈就要大半天。\n我摸着台基上精美的雕刻，想象着几百年前这里的样子：文武百官排队进宫，皇帝在这里举行大典，该是多么庄严啊！\n如今的故宫，珍藏着上百万件文物，默默讲述着中华民族悠久的历史。故宫，你真伟大！',note:'按游览顺序介绍，太和殿写得最细；数据与想象结合，让读者如临其境，结尾直呼抒情有力。'}
],
xiuzuo8:[
 {title:'第一次登台',text:'学校艺术节到了，我要第一次上台表演钢琴。\n在后台等待的时候，我的心"怦怦"地越跳越快，像揣了一只蹦跳的小兔子。我不停地擦着手心的汗，一遍遍想：万一忘谱了怎么办？万一大家笑我怎么办？\n"下面有请下一位表演者！"听到我的名字，我的腿有点发软，一步一步走上台。聚光灯打在我身上，台下黑压压的一片。我深吸一口气，坐下来，把手放在琴键上。音乐响起，我渐渐忘记了紧张，世界里只剩下我和我的琴声。\n最后一个音符落下，台下响起了热烈的掌声。我站起来鞠躬，心还在"怦怦"跳——不过这一次，是因为激动！',note:'从后台到台上，心理变化层层推进；"擦汗""腿发软"这些身体反应，把紧张写得特别真实。'},
 {title:'独自在家',text:'上个星期六，爸爸妈妈出门了，我第一次一个人看家。\n天慢慢黑下来，屋里越来越安静。突然，"哐当"一声，风把窗户吹开了，窗帘晃来晃去。我的心猛地一紧：会不会……我大气都不敢出，竖起耳朵听，只有风声呼呼地响。\n"别怕，世界上没有鬼。"我给自己打气，把家里所有的灯都打开。屋子一下子亮堂堂的，我的胆子也大了起来。我打开电视，放了一部动画片，不一会儿就看得哈哈大笑，早把害怕抛到了九霄云外。\n爸爸妈妈回来，我自豪地宣布："我今天一个人看家！"他们夸我真勇敢。其实只有我知道，刚才我的心跳得像打鼓。不过我也明白了：害怕，常常是自己吓自己。',note:'用风声和窗帘制造紧张气氛，心理描写细腻，结尾"害怕是自己吓自己"的感悟是点睛之笔。'},
 {title:'宣布成绩前',text:'"这节课宣布数学考试成绩。"老师抱着试卷走进教室，我的心一下子提到了嗓子眼。\n老师一个一个念着分数。我的手紧紧抓住桌角，心"怦怦"跳得越来越快，像敲小鼓。我暗暗想：老天保佑，让我上九十分吧！我明明检查了两遍，可那道应用题……到底做对了没有？\n"李小雨，九十六分！"我愣了一下，随即兴奋地跳起来，三步并作两步冲上讲台领试卷。看着卷子上红红的"96"，我的心又"怦怦"跳起来——这回，是因为高兴。\n我捧着试卷想：努力真的不会白费。平时认真复习，宣布成绩的那一刻，才能心里有底。',note:'用"念分数"的过程一点点推高紧张感，两次"怦怦跳"一紧张一高兴，情绪写得有层次。'},
 {title:'走夜路',text:'那天晚上，我在同学家写完作业，抬头一看——呀，已经八点多了！我只好一个人走回家。\n刚出楼道，我就后悔了。路灯把我的影子拉得长长的，风一吹，树叶"沙沙"响，像有人在后面跟着我。我走得越来越快，心"怦怦"直跳，总觉得身后有脚步声。猛一回头，什么也没有，只有自己的影子。\n"哼，我都是四年级的学生了，还怕黑？"我给自己壮胆，哼起了最喜欢的歌，脚步也稳了下来。走着走着，我看到了小区门口熟悉的灯光，看到了等我的妈妈，心一下子踏实了。\n原来，夜路并没有那么可怕。害怕的时候，给自己一点勇气，路就亮起来了。',note:'影子、树叶声、脚步声，用环境一步步烘托害怕；"哼歌壮胆"的转变真实可爱，结尾感悟温暖。'}
],
xiuzuo7:[
 {title:'给奶奶的一封信',text:'亲爱的奶奶：\n您好！\n好久没见到您了，我很想念您。您的身体好吗？天冷了，一定要记得多穿衣服，按时吃药。\n奶奶，告诉您一件高兴的事：上周学校运动会，我参加了六十米短跑，得了第二名！冲过终点的时候，我听见同学们为我欢呼。我当时想，要是您在场，一定会笑得合不拢嘴。\n我还学会了一项新本领——煎鸡蛋。等放假回老家，我煎给您吃，您一定会夸我棒的！\n奶奶，我真盼望假期快点到来。到时候，我还要听您讲过去的故事。\n祝您\n身体健康！\n您的孙女 小雨\n12月10日',note:'格式规范：称呼顶格带冒号、正文空两格、祝语署名日期齐全。内容讲获奖和学煎蛋两件具体的事，真情自然流露。'},
 {title:'给好朋友的一封信',text:'亲爱的小华：\n你好！\n你转学走了以后，我特别想念你。你在新学校过得好吗？\n还记得上学期我们一起在操场上踢球吗？你踢进了那个精彩的球，我们抱在一起又蹦又跳。现在每次路过操场，我都会想起你进球的样子。\n告诉你几个班里的新闻：我们教室换了新的大屏幕；张小明在朗诵比赛里拿了一等奖。对了，下个月学校有读书节，要是你在，我们就可以一起逛书市了。\n你在新学校交到新朋友了吗？学习忙不忙？有空的时候，记得给我回信哦！\n祝你\n学习进步！\n你的好朋友 小杰\n3月15日',note:'回忆共同经历、分享班级新闻、关心对方近况——内容充实有来有往，语气就像面对面聊天。'},
 {title:'给未来自己的一封信',text:'未来的我：\n你好！\n我是 2026 年的你，今年十岁。写这封信，是想看看未来的你变成了什么样。\n我有很多问题想问你：你当航天员的梦想实现了吗？书架上那套《十万个为什么》读完了吗？你还坚持每天晨跑吗？\n先说说现在的我吧：我正在练书法，已经能写出一手工整的字了；数学刚学完乘法口诀，背得滚瓜烂熟；我最好的朋友是我的同桌，我们拉过钩，要做一辈子的好朋友。\n希望你已经长成一个善良、勇敢、努力的人。如果遇到了困难，别忘了，十岁的你正在为你加油呢！\n祝\n天天开心！\n十岁的你\n8月14日',note:'写给未来的自己，构思新颖。一问一答之间，既有好奇又有期待，结尾的鼓励充满成长的力量。'}
]
};

'2 乡下人家':{
 author:'陈醉云',
 read:[
  {p:1,s:['乡下人家，虽然住着小小的房屋，但总爱在屋前搭一瓜架，或种南瓜，或种丝瓜，让那些瓜藤攀上棚架，爬上屋檐。','当花儿落了的时候，藤上便结出了青的、红的瓜，它们一个个挂在房前，衬着那长长的藤，绿绿的叶。','青、红的瓜，碧绿的藤和叶，构成了一道别有风趣的装饰，比那高楼门前蹲着一对石狮子或是竖着两根大旗杆，可爱多了。']},
  {p:2,s:['有些人家，还在门前的场地上种几株花，芍药，凤仙，鸡冠花，大丽菊，它们依着时令，顺序开放，朴素中带着几分华丽，显出一派独特的农家风光。','还有些人家，在屋后种几十枝竹，绿的叶，青的竿，投下一片绿绿的浓阴。','几场春雨过后，到那里走走，常常会看见许多鲜嫩的笋，成群地从土里探出头来。']},
  {p:3,s:['鸡，乡下人家照例总要养几只的。','从他们的房前屋后走过，肯定会瞧见一只母鸡，率领一群小鸡，在竹林中觅食；或是瞧见耸着尾巴的雄鸡，在场地上大踏步地走来走去。','他们的屋后倘若有一条小河，那么在石桥旁边，在绿树阴下，会见到一群鸭子，游戏水中，不时地把头扎到水下去觅食。即使附近的石头上有妇女在捣衣，它们也从不吃惊。']},
  {p:4,s:['若是在夏天的傍晚出去散步，常常会瞧见乡下人家吃晚饭的情景。','他们把桌椅饭菜搬到门前，天高地阔地吃起来。','天边的红霞，向晚的微风，头上飞过的归巢的鸟儿，都是他们的好友，它们和乡下人家一起，绘成了一幅自然、和谐的田园风景画。']},
  {p:5,s:['秋天到了，纺织娘寄住在他们屋前的瓜架上。','月明人静的夜里，它们便唱起歌来："织，织，织，织呀！织，织，织，织呀！"','那歌声真好听，赛过催眠曲，让那些辛苦一天的人们，甜甜蜜蜜地进入梦乡。']},
  {p:6,s:['乡下人家，不论什么时候，不论什么季节，都有一道独特、迷人的风景。']}
 ],

'3 天窗':{
 author:'茅盾',
 read:[
  {p:1,s:['乡下的房子只有前面一排木板窗。','暖和的晴天，木板窗扇扇打开，光线和空气都有了。','碰着大风大雨，或者北风呼呼叫的冬天，木板窗只好关起来，屋子里就黑得像地洞里似的。','于是乡下人在屋面开一个小方洞，装一块玻璃，叫作"天窗"。']},
  {p:2,s:['夏天阵雨来了时，孩子们顶喜欢在雨里跑跳，仰着脸看闪电，然而大人们偏就不许。','"到屋里来啊！"跟着木板窗的关闭，孩子们也就被关在地洞似的屋里了。','这时候，小小的天窗是你唯一的慰藉。']},
  {p:3,s:['从那小小的玻璃，你会看见雨脚在那里卜落卜落跳，你会看见带子似的闪电一瞥；你想象到这雨，这风，这雷，这电，怎样猛厉地扫荡了这世界，你想象它们的威力比你在露天真实感到的要大十倍二十倍。','小小的天窗会使你的想象锐利起来！']},
  {p:4,s:['晚上，当你被逼着上床去"休息"的时候，也许你还忘不了月光下的草地河滩。','你偷偷地从帐子里伸出头来，仰起了脸。这时候，小小的天窗又是你唯一的慰藉！']},
  {p:5,s:['你会从那小玻璃上面的一粒星，一朵云，想象到无数闪闪烁烁可爱的星，无数像山似的、马似的、巨人似的奇幻的云彩；你会从那小玻璃上面掠过的一条黑影，想象到这也许是灰色的蝙蝠，也许是会唱歌的夜莺，也许是霸气十足的猫头鹰……','总之，夜的美丽神奇，立刻会在你的想象中展开。']},
  {p:6,s:['发明这天窗的大人们，是应得感谢的。','因为活泼会想的孩子们知道怎样从"无"中看出"有"，从"虚"中看出"实"，比任何他看到的都更真切，更阔达，更复杂，更确实！']}
 ],

 author:'刘湛秋',

  {p:1,s:['是什么声音，像一串小铃铛，轻轻地走过村边？','是什么光芒，像一匹明洁的丝绸，映照着蓝天？']},
  {p:2,s:['啊，河流醒来了！','三月的桃花水，舞动着绮丽的朝霞，向前流啊。','有一千朵桃花，点点洒上了河面，有一万个小酒窝，在水中回旋。']},

  {p:4,s:['三月的桃花水，是春天的明镜。','它看见燕子飞过天空，翅膀上裹着白云；它看见垂柳披上了长发，如雾如烟；它看见一群姑娘来到河边，水底立刻浮起一朵朵红莲，她们捧起了水，像抖落一片片花瓣……']},
  {p:5,s:['啊，地上草如茵，两岸柳如眉，三月桃花水，叫人多沉醉。']}

'5 琥珀':{
 author:'柏吉尔（德国）',
 read:[
  {p:1,s:['这个故事发生在很久很久以前，约莫算来，总有几万年了。','一个夏天，太阳暖暖地照着，海在很远的地方翻腾怒吼，绿叶在树上飒飒地响。']},
  {p:2,s:['那里长着许多老松树，被太阳晒得渗出厚厚的松脂。','一只小苍蝇展开柔嫩的绿翅膀，在太阳光里快乐地飞舞。','忽然，有个蜘蛛慢慢爬过来，想把那只苍蝇当作一顿美餐。','它小心地划动长长的腿，沿着树干向下爬，离小苍蝇越来越近了。']},
  {p:3,s:['晌午的太阳热辣辣地照射着整个树林。','许多老松树渗出厚厚的松脂，在太阳光里闪闪地发出金黄的光彩。','蜘蛛刚扑过去，突然发生了一件可怕的事情。','一大滴松脂从树上滴下来，刚好落在树干上，把苍蝇和蜘蛛一齐包在里头。','小苍蝇不能掸翅膀了，蜘蛛也不能再想什么美餐了。','两只小虫都淹没在老松树的黄色泪珠里。','它们前俯后仰地挣扎了一番，终于不动了。']},
  {p:4,s:['松脂继续滴下来，最后积成了一个松脂球，把两只小虫重重地包裹在里面。','几十年，几百年，几千年，时间一转眼就过去了。','后来，陆地渐渐沉下去，海水渐渐漫上来，逼近那古老的森林。','有一天，水把森林淹没了，波浪不断向树干冲刷，甚至把树连根拔起。','那些松脂球，淹没在泥沙下面，成了化石。']},
  {p:5,s:['又是几千年过去了，这些化石成了被人们发现的琥珀。','在那块透明的琥珀里，两个小东西仍旧好好地躺着。','我们可以看见它们身上的每一根毫毛，还可以想象它们当时在黏稠的松脂里怎样挣扎。','从那块琥珀，我们可以推测发生在几万年前的故事的详细情形，并且可以知道，在远古时代，世界上就已经有苍蝇和蜘蛛了。']}

 anno:[{s:'两只小虫都淹没在老松树的黄色泪珠里。',x:'把滴落的松脂比作"黄色泪珠"，既形象又暗示这个巧合的珍贵。'},{s:'从那块琥珀，我们可以推测发生在几万年前的故事的详细情形。',x:'"推测"是有依据的推理：琥珀里的两只小虫、松脂、腿四周的黑色圆环，都是推测的依据。'}],
 homework:[{q:'琥珀的形成需要哪些条件？',a:'①炎热的夏天，老松树渗出松脂；②松脂恰好滴落包住两只小虫；③松脂继续滴落积成松脂球；④地壳变迁，森林被海水淹没，松脂球埋在泥沙下变成化石。'}]},

 课内阅读:[{type:'reading',material:'晌午的太阳热辣辣地照射着整个树林。许多老松树渗出厚厚的松脂，在太阳光里闪闪地发出金黄的光彩。蜘蛛刚扑过去，突然发生了一件可怕的事情。一大滴松脂从树上滴下来，刚好落在树干上，把苍蝇和蜘蛛一齐包在里头。',questions:[{type:'fill',q:'故事发生在____午，太阳热辣辣地照射着树林。',a:['晌']},{type:'choice',q:'"刚好"一词说明了什么？',options:['松脂滴落包住所虫是十分巧合的事','太阳很大','蜘蛛跑得快'],a:0},{type:'judge',q:'这个自然段写了琥珀形成的关键一步。',a:true}]}],
 课外阅读:[{type:'reading',material:'【延伸阅读·会"说话"的化石】化石是保存在岩层里的远古生物遗体或遗迹。科学家通过研究化石，能了解亿万年前的世界：恐龙的骨骼化石告诉我们恐龙的样子和大小；树叶的化石告诉我们远古植物的样子；三叶虫的化石告诉我们几亿年前的海洋里生活着什么。琥珀更特别，它像一块透明的"时间胶囊"，把远古的小虫原封不动地保存下来。每一块化石，都是大自然写给我们的信，等着我们去读懂它。',questions:[{type:'fill',q:'琥珀像一块透明的"______"，把远古的小虫原封不动地保存下来。',a:['时间胶囊']},{type:'judge',q:'化石只能保存在冰层里。',a:false},{type:'choice',q:'研究化石可以帮助我们什么？',options:['了解亿万年前的世界','预测明天的天气','制造新动物'],a:0}]}]

'6 飞向蓝天的恐龙':{
 author:'徐星等（整理）',
 read:[
  {p:1,s:['说到恐龙，人们往往想到凶猛的霸王龙或者笨重、迟钝的马门溪龙；谈起鸟类，我们头脑中浮现的不是轻灵的鸽子，就是五彩斑斓的孔雀。','二者似乎毫不相干，但近年来发现的大量化石显示：在中生代时期，恐龙的一支经过漫长的演化，最终变成了凌空翱翔的鸟儿。']},
  {p:2,s:['早在19世纪，英国学者赫胥黎就注意到恐龙和鸟类在骨骼结构上有许多相似之处。','在研究了大量恐龙和鸟类化石之后，科学家们提出，鸟类不仅和恐龙有亲缘关系，而且很可能就是一种小型恐龙的后裔。']},
  {p:3,s:['20世纪末期，我国科学家在辽宁西部首次发现了保存有羽毛的恐龙化石，顿时使全世界的研究者们欣喜若狂。','辽西的发现向世人展示了恐龙长羽毛的证据，给这幅古生物学家们描绘的画卷涂上了点睛之笔。']},
  {p:4,s:['原本不会飞的恐龙最终变成了天之骄子——鸟类，它们飞向了蓝天，从此开辟了一个崭新的生活天地。','科学家们希望能够全面揭示这一历史进程。']}
 ],

'7 纳米技术就在我们身边':{
 author:'刘忠范等（整理）',
 read:[
  {p:1,s:['纳米技术是20世纪90年代兴起的高新技术。','如果说20世纪是微米的世纪，21世纪必将是纳米的世纪。']},
  {p:2,s:['什么是纳米技术呢？这得从纳米说起。','纳米是非常非常小的长度单位，1纳米等于十亿分之一米。','如果把直径为1纳米的小球放到乒乓球上，就好像把地球放在乒乓球上，可见纳米有多么小。','纳米技术的研究对象一般在1纳米到100纳米之间，不仅肉眼根本看不见，就是普通的光学显微镜也无能为力。']},
  {p:3,s:['纳米技术就在我们身边。','冰箱里如果使用纳米涂层，就会具有杀菌和除臭功能，能够使蔬菜保鲜期更长。','有一种叫作"碳纳米管"的神奇材料，比钢铁结实百倍，而且非常轻，将来我们有可能坐上"碳纳米管天梯"到太空旅行。','在最先进的隐形战机上，用到一种纳米吸波材料，能够把探测雷达波吸收掉，所以雷达根本看不见它。']},
  {p:4,s:['纳米技术可以让人们更加健康。','癌症很可怕，但如果在只有几个癌细胞的时候就能发现的话，死亡率会大大降低。','利用极其灵敏的纳米检测技术，可以实现疾病的早期检测与预防。','未来的纳米机器人甚至可以通过血管直达病灶，杀死癌细胞。']},
  {p:5,s:['纳米技术将给人类的生活带来深刻的变化。','在不远的将来，我们的衣食住行都会有纳米技术的影子。']}

'8* 千年梦圆在今朝':{
 author:'佚名（整理）',
 read:[
  {p:1,s:['飞离地球，遨游太空，是中华民族很久以来的梦想。','在中国的古代，早就流传着"嫦娥奔月"的神话，人飞于天、车走空中的传说，以及"鲲鹏展翅""九天揽月"的奇妙想象。']},
  {p:2,s:['中国明代的官员万户，是世界历史上第一个试验乘火箭上天的人。','他用47支火箭捆绑在椅子下面，自己坐在椅子上，两手举着两只大风筝，然后叫人点火发射。','但是，随着一声巨响，他消失在了火焰和烟雾中。','人类首次火箭飞行尝试没有成功。','尽管如此，万户仍然被国际航天史学家公认为人类升空探索的先驱。']},
  {p:3,s:['1949年，新中国成立，中华民族千年的梦想终于有了实现的希望。','1970年4月24日，寂寞而辽阔的太空中，第一次响起了中国人的声音——那穿越苍穹的《东方红》乐曲。','中国成为世界上第五个能够发射人造卫星的国家。']},
  {p:4,s:['2003年10月15日早晨9时，在酒泉卫星发射中心，随着一声震耳欲聋的巨响，我国自行研制的"神舟五号"飞船被送上太空。','火箭宛若一条巨龙，划出一道绚丽的曲线，瞬间便消失在了苍穹之中。','航天员杨利伟在太空飞行21小时后安全返回，中华民族千年的飞天梦想终于圆满。']},

 read:[
  {p:1,s:['猫的性格实在有些古怪。','说它老实吧，它的确有时候很乖。','它会找个暖和的地方，成天睡大觉，无忧无虑，什么事也不过问。','可是，它决定要出去玩玩，就会出走一天一夜，任凭谁怎么呼唤，它也不肯回来。','说它贪玩吧，的确是啊，要不怎么会一天一夜不回家呢？','可是，它听到老鼠的一点响动，又是多么尽职。','它屏息凝视，一连就是几个钟头，非把老鼠等出来不可！']},
  {p:2,s:['它要是高兴，能比谁都温柔可亲：用身子蹭你的腿，把脖儿伸出来要求给抓痒，或是在你写作的时候，跳上桌来，在稿纸上踩印几朵小梅花。','它还会丰富多腔地叫唤，长短不同，粗细各异，变化多端。','在不叫的时候，它还会咕噜咕噜地给自己解闷。','这可都凭它的高兴。','它若是不高兴啊，无论谁说多少好话，它也一声不出。']},
  {p:3,s:['它什么都怕，总想藏起来。','可是它又那么勇猛，不要说见着小虫和老鼠，就是遇上蛇也敢斗一斗。']},
  {p:4,s:['小猫满月的时候更可爱，腿脚还不稳，可是已经学会淘气。','一根鸡毛，一个线团，都是它的好玩具，耍个没完没了。','一玩起来，它不知要摔多少跟头，但是跌倒了马上起来，再跑再跌。','它的头撞在门上，桌腿上，撞疼了也不哭。','它的胆子越来越大，逐渐开辟新的游戏场所。','你见了，绝不会责打它，它是那么生气勃勃，天真可爱！']}

 read:[
  {p:1,s:['我一向讨厌母鸡。','听吧，它由前院嘎嘎到后院，由后院再嘎嘎到前院，没完没了，并且没有什么理由，讨厌！','有的时候，它不这样乱叫，而是细声细气的，有什么心事似的，颤颤巍巍的，顺着墙根，或沿着田坝，那么扯长了声如怨如诉，使人心中立刻结起个小疙瘩来。']},
  {p:2,s:['可是，现在我改变了心思，我看见一只孵出一群小雏鸡的母鸡。','不论是在院里，还是在院外，它总是挺着脖儿，表示出世界上并没有可怕的东西。','一只鸟儿飞过，或是什么东西响了一声，它立刻警戒起来：歪着头听；挺着身儿预备作战；看看前，看看后，咕咕地警告鸡雏要马上集合到它身边来。']},
  {p:3,s:['发现了一点儿可吃的东西，它咕咕地紧叫，啄一啄那个东西，马上便放下，让它的儿女吃。','结果，每一只鸡雏的肚子都圆圆地下垂，像刚装了一两个汤圆儿似的，它自己却消瘦了许多。','假若有别的大鸡来抢食，它一定出击，把它们赶出老远，连大公鸡也怕它三分。']},
  {p:4,s:['在夜间若有什么动静，它便放声啼叫，顶尖锐，顶凄惨，无论多么贪睡的人都得起来看看，是不是有了黄鼠狼。']},
  {p:5,s:['它负责、慈爱、勇敢、辛苦，因为它有了一群鸡雏。','它伟大，因为它是鸡母亲。','一个母亲必定就是一位英雄。','我不敢再讨厌母鸡了。']}

'15 白鹅':{
 author:'丰子恺',
 read:[
  {p:1,s:['这白鹅，是一位即将远行的朋友送给我的。','我抱着这雪白的"大鸟"回家，放在院子里。','我一伸手指着它说："好一个高傲的动物！"']},
  {p:2,s:['鹅的高傲，更表现在它的叫声、步态和吃相中。']},
  {p:3,s:['鹅的叫声，音调严肃郑重，似厉声呵斥。','它的旧主人告诉我：养鹅等于养狗，它也能看守门户。','后来我看到果然如此：凡有生客进来，鹅必然厉声叫嚣；甚至篱笆外有人走路，它也要引吭大叫，不亚于狗的狂吠。']},
  {p:4,s:['鹅的步态，更是傲慢了。','大体上与鸭相似，但鸭的步调急速，有局促不安之相；鹅的步调从容，大模大样的，颇像京剧里的净角出场。','它常傲然地站着，看见人走来也毫不相让；有时非但不让，竟伸过颈子来咬你一口。']},
  {p:5,s:['鹅的吃饭，常常使我们发笑。','我们的鹅是吃冷饭的，一日三餐。','它需要三样东西下饭：一样是水，一样是泥，一样是草。','先吃一口冷饭，再喝一口水，然后再到别处去吃一口泥和草。','这些食料并不奢侈，但它的吃法，三眼一板，一丝不苟。','譬如吃了一口饭，倘若水盆放在远处，它一定从容不迫地大踏步走上前去，饮一口水，再大踏步走去吃泥、吃草。','吃过泥和草再回来吃饭。','这样从容不迫地吃饭，必须有一个人在旁侍候，像饭馆里的堂倌一样。']}

'16 海上日出':{
 author:'巴金',
 read:[
  {p:1,s:['为了看日出，我常常早起。','那时天还没有大亮，周围非常清静，船上只有机器的响声。','天空还是一片浅蓝，颜色很浅。','转眼间天边出现了一道红霞，慢慢地在扩大它的范围，加强它的亮光。','我知道太阳要从天边升起来了，便不转眼地望着那里。']},
  {p:2,s:['果然，过了一会儿，在那个地方出现了太阳的小半边脸，红是真红，却没有亮光。','太阳好像负着重荷似的一步一步，慢慢地努力上升，到了最后，终于冲破了云霞，完全跳出了海面，颜色红得非常可爱。','一刹那间，这个深红的圆东西，忽然发出了夺目的亮光，射得人眼睛发痛，它旁边的云片也突然有了光彩。']},
  {p:3,s:['有时太阳走进了云堆中，它的光线却从云里射下来，直射到水面上。','这时候要分辨出哪里是水，哪里是天，倒也不容易，因为我就只看见一片灿烂的亮光。']},
  {p:4,s:['有时天边有黑云，而且云片很厚，太阳出来，人眼还看不见。','然而太阳在黑云里放射的光芒，透过黑云的重围，替黑云镶了一道发光的金边。','后来太阳才慢慢地冲出重围，出现在天空，甚至把黑云也染成了紫色或者红色。','这时候发亮的不仅是太阳、云和海水，连我自己也成了光亮的了。']},
  {p:5,s:['这不是很伟大的奇观么？']}
 ],

'17 记金华的双龙洞':{
 author:'叶圣陶',
 read:[
  {p:1,s:['4月14日，我在浙江金华，游北山的两个双龙洞。','出金华城大约五公里到罗店，过了罗店就渐渐入山。','公路盘曲而上。','山上开满了映山红，无论花朵还是叶子，都比盆栽的杜鹃显得有精神。','粉红色的山，各色的映山红，再加上或浓或淡的新绿，眼前一片明艳。']},
  {p:2,s:['一路迎着溪流。','随着山势，溪流时而宽，时而窄，时而缓，时而急，溪声也时时变换调子。','入山大约五公里就来到双龙洞口，那溪流就是从洞里出来的。']},
  {p:3,s:['在洞口抬头望，山相当高，突兀森郁，很有气势。','洞口像桥洞似的，很宽。','走进去，仿佛到了个大会堂，周围是石壁，头上是高高的石顶，在那里聚集一千或是八百人开个会，一定不觉得拥挤。','泉水靠着洞口的右边往外流。这是外洞。']},
  {p:4,s:['在外洞找泉水的来路，原来从靠左边的石壁下方的孔隙流出。','虽说是孔隙，可也容得下一只小船进出。','怎样小的小船呢？两个人并排仰卧，刚合适，再没法容第三个人，是这样小的小船。','我怀着好奇的心情独个儿仰卧在小船里，自以为从后脑到肩背，到臀部，到脚跟，没有一处不贴着船底了，才说一声"行了"，船就慢慢移动。','眼前昏暗了，可是还能感觉左右和上方的山石似乎都在朝我挤压过来。','我又感觉要是把头稍微抬起一点儿，准会撞破额角，擦伤鼻子。','大约行了二三丈的水程吧，就登陆了。这就到了内洞。']},
  {p:5,s:['内洞一团漆黑，什么都看不见。','工人提着汽油灯，也只能照见小小的一块地方，余外全是昏暗，不知道有多么宽广。','先看到的是蜿蜒在洞顶的双龙，一条黄龙，一条青龙。','其他那些石钟乳和石笋，这是什么，那是什么，大都依据形状想象成神仙、动物以及宫室、器用，名目有四十多。','这些石钟乳和石笋，形状变化多端，再加上颜色各异，即使不比作什么，也很值得观赏。']},
  {p:6,s:['在洞里走了一转，觉得内洞比外洞大得多，大概有十来进房子那么大。','我排队等候，又仰卧在小船里，出了洞。']}

'18 小英雄雨来（节选）':{
 author:'管桦',
 read:[
  {p:1,s:['晋察冀边区的北部有一道还乡河，河里长着很多芦苇。','河边有个小村庄。','芦花开的时候，远远望去，黄绿的芦苇上好像盖了一层厚厚的白雪。','风一吹，鹅毛般的苇絮就飘飘悠悠地飞起来，把这几十家小房屋都罩在柔软的芦花里。','因此，这村就叫芦花村。','十二岁的雨来就是这村的。']},
  {p:2,s:['雨来最喜欢这条紧靠着村边的还乡河。','每到夏天，雨来和铁头、三钻儿，还有很多小朋友，好像一群鱼，在河里钻上钻下，藏猫猫，狗刨，立浮，仰浮。','雨来仰浮的本领最高，能够脸朝天在水里躺着，不但不沉底，还要把小肚皮露在水面上。']},
  {p:3,s:['秋天，爸爸从集上回来，跟妈妈商量："叫雨来上夜校吧。"','雨来就在三钻儿家的豆腐房里上夜校。','女老师走到黑板前面，嗡嗡嗡嗡地念着："我们——是——中国人，我们——爱——自己的——祖国。"','大家就随着女老师的手指，齐声轻轻地念起来。']},
  {p:4,s:['有一天，鬼子又来"扫荡"了。','交通员李大叔忙把墙角的缸搬开，跳进洞里，说："把缸搬回原地方。你就快到别的院里去，对谁也不许说。"','雨来刚到堂屋，见十几把刺刀从门缝里往里伸，他撒腿就往后院跑。','可是鬼子已经追了上来，把他抓住了。']},
  {p:5,s:['扁鼻子军官把雨来抱起来，假装温和地说："不要害怕！小孩，皇军是爱护的！"','他从衣袋里掏出一把雪白的糖块，往雨来手里一塞："吃！你大大的好！"','雨来没有接他的糖，也没有回答他。','扁鼻子军官立刻变得凶恶起来，伸出两只像鹰爪一样的手，扭着雨来的两只耳朵，向两边拉。','雨来疼得直咧嘴。','鬼子又抽出一只手来，在雨来的脸上打了两巴掌。','雨来的脸立刻变成白一块，青一块，紫一块。','鬼子又向他胸脯上打了一拳。','雨来打个趔趄，后退几步，后脑勺正碰在柜板上。','他咬着牙，说："没看见！"']},
  {p:6,s:['鬼子打得累了，雨来还是咬着牙，说："没看见！"','扁鼻子军官气得暴跳起来，嗷嗷地叫："拉出去，枪毙！"','枪声在还乡河边响起来。','芦花村的乡亲们以为雨来牺牲了，都伤心地流下眼泪。','可是，在鬼子开枪以前，雨来趁鬼子不防备，一头扎到河里去，从水底游到远处去了。','原来，雨来仰浮的本领最高，他早就做好了准备。']}

 author:'王安忆',
 read:[
  {p:1,s:['我们家里有一个男子汉，那是我姐姐的孩子。','我们给他起了个外号，叫"男子汉"。']},
  {p:2,s:['他对食物的兴趣。','他吃饭吃得很好，量很多，范围很广。','他吃大拇指吃得津津有味，吃得专心致志。','为了吃一小口青菜，他可以等上很久。']},
  {p:3,s:['他对父亲的要求。','他向往着去少林寺当和尚。','他问："当和尚是不是可以吃肉？"','听说当和尚不能吃肉，他犹豫了，说："那算了。"']},
  {p:4,s:['他对独立的要求。','不知从什么时候起，和他出去，他不愿让人牵他的手了。','一只胖胖的手在我的手掌里，像一条倔强的活鱼一样挣扎着。','他另一只手也伸过来，要把我的手推开。','我让他自己走，他果然就自己走了，走得很快，很得意。']},
  {p:5,s:['他面对生活挑战的沉着。','上托儿所的时候，他不哭不闹，只是镇静地看着别的孩子哭。','后来他生病了，打针的时候，他咬紧牙关，一声不吭。','医生说："这孩子真勇敢。"']},
  {p:6,s:['这就是我们家的男子汉。','看着他一点儿一点儿长大，他的脸盘的轮廓，他的手掌上的细纹，他的身体，他的力气，他的智慧，他的性格，还有他的性别，那样神秘地一点儿一点儿鲜明，突出，扩大，再扩大，实在是一件最最奇妙的事情。']}

  {p:1,s:['青铜一家，做了一百零一双芦花鞋。','那一百零一双芦花鞋，被挂在了草绳上，像一排排等待出发的小船。','这些鞋是青铜一家人用整整一个秋天的时间，采芦花、搓草绳、一针一线编成的。']},

 read:[

  {p:2,s:['哈尔威船长站在指挥台上，大声吼喝："全体安静，注意听命令！把救生艇放下去。妇女先走，其他乘客跟上，船员断后。必须把六十人救出去！"','实际船上一共有六十一人，但是他把自己给忘了。']},
  {p:3,s:['"洛克机械师在哪儿？"','"船长叫我吗？"','"炉子怎么样了？"','"海水淹了。"','"火呢？"','"灭了。"','"机器怎样？"','"停了。"','哈尔威船长喊了一声："奥克勒福大副？"','大副回答："到！"','"还有多少分钟？"','"二十分钟。"','"够了，"船长说，"让每个人都下到小艇上去。奥克勒福大副，你的手枪在吗？"','"在，船长。"','"哪个男人胆敢抢在女人前面，你就开枪打死他。"','大家立时不出声了。没有一个人违抗他的意志。']},
  {p:4,s:['救援工作进行得井然有序。','二十分钟到了，船上除了船长，没有一个人。','哈尔威船长一个手势也没有做，一句话也没有说，犹如铁铸，纹丝不动，随着轮船一起沉入了深渊。','人们透过阴惨惨的薄雾，凝视着这尊黑色的雕像徐徐沉进大海。']},
  {p:5,s:['哈尔威船长的生命就这样结束了。','在英伦海峡上，没有任何一个海员能与他相提并论。','他一生都要求自己忠于职守，履行做人之道。','面对死亡，他又践行了一次英雄的壮举。']}

 author:'佚名（整理）',
 read:[
  {p:1,s:['1952年10月，上甘岭战役打响了。','这是朝鲜战场上最激烈的一次阵地战。','黄继光所在的营已经持续战斗了四天四夜。','第五天夜晚，上级命令他们必须在黎明之前夺下被敌人占领的597.9高地。']},
  {p:2,s:['进攻开始了，战士们像海涛一样向上冲。','可是，敌人一个火力点里的机枪疯狂地扫射着，战士们一次又一次地冲锋，都被压了回来。','眼看就要到黎明了，如果不能很快摧毁这个火力点，夺下高地，就会影响整个战役。']},
  {p:3,s:['黄继光愤怒地注视着敌人的火力点，他转过身来坚定地对营参谋长说："参谋长，请把这个任务交给我吧！"','参谋长紧握着黄继光的手，说："好，我相信你一定能完成这个光荣而艰巨的任务。"','黄继光带上两个战士，拿了两个手雷，向火力点爬去。']},
  {p:4,s:['敌人的机枪不停地吼叫，一颗子弹打中了黄继光的肩膀，他忍着伤痛继续前进。','快要接近火力点了，一个战士倒下了，另一个战士也负伤了。','黄继光一个人继续向前爬。','突然，他站起来了！在暴风雨一样的子弹中，他张开双臂，向喷射着火舌的火力点猛扑上去，用自己的胸膛堵住了敌人的枪口。']},
  {p:5,s:['"冲啊！为黄继光报仇！"','战士们像海涛一样冲上去，夺下了597.9高地，消灭了阵地上的全部敌人。','黄继光英勇牺牲了，他的英雄事迹永远激励着我们。']}

'25 宝葫芦的秘密（节选）':{
 author:'张天翼',
 read:[
  {p:1,s:['我来给你们讲个故事。','可是我先得声明：这个故事可不完全是我编的，是我听来的。','不过，听来的故事，也可以讲给大家听嘛。']},
  {p:2,s:['从前有一个人，叫张三。','他天天干活，可是日子还是过得紧紧巴巴的。','有一天，张三到山里去砍柴，碰见了一位神仙。','神仙送给他一个宝葫芦。','这个宝葫芦可了不得，想要什么，它就有什么。','张三想要粮食，宝葫芦就变出了粮食；张三想要新衣裳，宝葫芦就变出了新衣裳。','张三的日子一下子就好起来了。']},
  {p:3,s:['还有一个人，叫李四。','李四是个渔夫。','有一天，他到海里去打鱼，捞上来一个宝葫芦。','李四希望有一条大花狗，马上就冒出了那么一条——冲着他摇尾巴，舔他的手。','后来呢？后来不用说，他们全都过上了好日子。']},
  {p:4,s:['王五呢，他因为是一个好孩子，肯让奶奶给他换衣裳，所以也得到了一个宝葫芦。','赵六，他是因为掘地掘出来的。']},
  {p:5,s:['不管张三也好，李四也好，一得到了这个宝葫芦，可就幸福极了，要什么有什么。','张三想："我要吃水蜜桃。"','立刻就有一盘水蜜桃。','李四希望有一条大花狗，马上就冒出了那么一条。']},
  {p:6,s:['王葆听了这些故事，常常想：要是我也有一个宝葫芦，那该多好啊！','想要什么，就有什么，那多幸福！','可是，宝葫芦真的能给人带来幸福吗？','这个故事，还得从王葆得到宝葫芦以后说起……']}

  {p:2,s:['有一年秋天，巨人突然回来了。','他见到孩子们在花园里玩耍，很生气："谁允许你们到这儿来玩的！都滚出去！"','孩子们吓坏了，四处逃散。']},

  {p:1,s:['在海的深处，水是那么蓝，像最美丽的矢车菊花瓣，同时又是那么清，像最明亮的玻璃。','然而它又是那么深，深到任何锚链都达不到底。','海里住着海王的六个女儿，其中最小的那个最美丽，她的皮肤像玫瑰叶子一样光洁，眼睛像最深的海水一样蓝。','不过，像所有的小人鱼一样，她没有腿，只有一条鱼尾巴。']},
  {p:2,s:['小公主最喜欢听姐姐们讲海面上的故事。','她们说，海面上有城市、有森林、有会唱歌的鸟儿，还有人类。','小公主听得入了迷，她多么想亲眼看看海面上的世界啊！']},
  {p:3,s:['终于，小公主满十五岁了，她可以浮出海面了。','她轻轻地浮出水面，看到一艘大船，船上灯火辉煌，正在举行盛大的宴会。','船上站着一位年轻的王子，他英俊、善良，大家正在为他庆祝生日。','小公主一下子就爱上了王子。']},
  {p:4,s:['忽然，海上刮起了大风，掀起了巨浪，船被打翻了，王子落进了海里。','小公主不顾一切地游过去，抱住王子，带着他在海浪里漂流。','天亮的时候，小公主把王子放在沙滩上，自己躲进了礁石后面。','一个小姑娘发现了王子，叫人来救了他。']},

 fanwen:[
  {title:'我的乐园——外婆家的菜园',text:'我的乐园，是外婆家屋后的那片菜园。\n菜园不大，却像个热闹的百宝箱。春天，韭菜探出绿油油的小脑袋；夏天，西红柿像一个个小灯笼挂在枝头，黄瓜顶着黄花懒洋洋地躺在架子上；秋天，南瓜挺着大肚子躺在地上晒太阳。菜园边上，还种着一排向日葵，它们天天仰着脸追着太阳跑。\n我最喜欢在菜园里捉蝴蝶。蝴蝶在花间飞来飞去，我举着网兜追过去，它却一转身，飞进了西红柿丛里。我猫着腰，屏住呼吸，猛地一扑——蝴蝶没捉到，我倒摔了个屁股墩儿，惹得外婆哈哈大笑。\n玩累了，我就坐在菜园边的石头上，听蛐蛐弹琴，看蜻蜓点水。夕阳把菜园染成金色，外婆喊我吃饭的声音飘过来，那声音也是暖暖的。\n外婆家的菜园，装着我金色的童年。它就是我的乐园。',note:'按季节写菜园的样子，又写捉蝴蝶的趣事，景中有事，事中有趣，结尾点题，乐园的味道就出来了。'},
  {title:'我的小房间',text:'我的乐园，是我那间小小的房间。\n推开门，靠窗是一张书桌，书桌上摆着我喜欢的书；靠墙是我的小床，床头贴着我画的画；床底下藏着一个大箱子，里面装着我的积木、玩具小汽车和弹珠。别看房间小，它可是一个"宝藏基地"。\n放学后，我最喜欢趴在书桌前看书。我跟着尼尔斯骑鹅飞上天空，跟着孙悟空大闹天宫，跟着法布尔蹲在草丛里看昆虫。看着看着，我常常忘了时间，直到妈妈喊："吃饭啦！"\n周末，我就在地上搭积木城堡。我先搭高高的塔楼，再修弯弯的护城河，最后插上一面小旗子。城堡搭好了，我就让玩具小人们住进去，自己当国王，指挥他们巡逻、打仗。\n我的小房间虽然不大，却装满了我的快乐和梦想。这就是我的乐园。',note:'先写房间的样子，再写看书、搭积木两件事，一个"宅"在家里的乐园也写得有滋有味，"宝藏基地""国王"的说法很有童趣。'},
  {title:'村头的小河',text:'我们村头有一条小河，那是我的乐园。\n小河的水清清的，能看见水底的沙石和游来游去的小鱼。河边长着一排柳树，长长的柳条垂到水面上，风一吹，就像小姑娘在梳头。河上还有一座小石桥，我们常常趴在桥栏杆上，看水里的鱼。\n夏天，小河最热闹。我们脱了鞋，挽起裤腿，到河里摸鱼。我把手伸进石头缝里，轻轻一摸——呀，一条滑溜溜的小鱼从我指缝里溜走了！我不甘心，又去摸，这回可算逮住了一条，我高兴得大喊："我捉到鱼啦！"\n有时候，我们还在河边打水漂。捡起一块扁扁的石子，侧着身子一甩，石子在水面上"点、点、点"地跳过去，能跳出五六朵小水花呢！\n小河的水哗哗地流，流过了我的童年。村头的小河，我永远的快乐园。',note:'摸鱼、打水漂两件事写得有声有色，"滑溜溜""点、点、点"这样的词语让画面活了起来，快乐是"玩"出来的，不是"喊"出来的。'},
  {title:'学校的篮球场',text:'要说我的乐园，那一定是学校的篮球场。\n篮球场很大，红色的塑胶地面，两个高高的篮球架像两个巨人站在两头。下课铃一响，篮球场就成了我们的天下。\n我最喜欢和同学们打篮球。记得有一次班级比赛，比分咬得很紧，离结束只剩一分钟了，我们还落后一分。队友把球传给我，我拍着球冲向篮下，对方的两个人围了过来。我深吸一口气，看准篮筐，用力一跳，把球投了出去——球在空中画了一道弧线，"唰"的一声，进了！"我们赢啦！"大家抱在一起又蹦又跳。\n不打球的时候，我就坐在场边的台阶上看别人打球，或者和好朋友在球场边聊天、晒太阳。风吹过来，带着橡胶的味道，那也是快乐的味道。\n篮球场给了我汗水，也给了我欢笑。它就是我心中的乐园。',note:'一场紧张的比赛写出了乐园的激情，"唰"的一声进球是全篇的高潮，结尾"汗水和欢笑"总结得很到位。'}
 ]
},
'习作·我的奇思妙想':{
 guide:[
  {h:'审题立意',b:'写自己的奇思妙想：你想发明什么？它是什么样子的？有哪些神奇的功能？把它的样子和功能介绍清楚，还可以写写它是怎么工作的、会给人们的生活带来什么便利。'},
  {h:'选材锦囊',b:'从生活中的烦恼出发最好：书包太重——发明会飞的书包；房间乱——发明自动整理机器人；怕下雨淋湿——发明能变形的智能伞……"需要"是发明之母，这样的奇思妙想更有意义。'},
  {h:'结构提纲',b:'开头：引出你的奇思妙想（可以从一个烦恼说起）。中间：先写它的样子（形状、颜色、材料），再写它的功能（2~3个，重点写最神奇的一个）。结尾：写它能给人们带来什么便利，表达美好的愿望。'},
  {h:'写作妙招',b:'① 介绍要有序：样子→功能→用途；② 功能要写具体，最好举一个小例子；③ 想象可以大胆，但要说得有条理，让人听得明白。'},
  {h:'好词百宝箱',b:'奇思妙想、神奇、方便、快捷、自动、智能、焕然一新、一应俱全、大显身手、如虎添翼'},
  {h:'避坑提醒',b:'① 只写功能不写样子，读者不知道它长什么样；② 功能罗列一大堆，哪个都没写清楚；③ 想象没有条理，想到哪写到哪。'}
 ],
 fanwen:[
  {title:'会飞的书包',text:'每天上学，我的书包都沉甸甸的，压得我肩膀疼。要是书包能自己飞，那该多好啊！于是，我有了这个奇思妙想——发明一个会飞的书包。\n这个书包的样子和普通书包差不多，不过它是蓝色的，上面有两个银色的按钮，两侧还藏着一对小小的翅膀。\n只要按下红色按钮，书包两侧的翅膀就会张开，"呼"的一声飞起来，稳稳地跟在我身后，像一只听话的小鸟。我再也不用背着沉甸甸的书包赶路了。\n要是遇到下雨，按下银色按钮，书包顶上就会弹出一把小伞，既给我挡雨，又不会淋湿书包里的课本。\n最神奇的是，它还有"防丢"功能。要是我不小心把书包落在哪里，它就会发出"滴滴"的叫声，还会自己飞回我身边。\n怎么样，我的会飞的书包不错吧？我真希望有一天，它能真的来到我们身边。',note:'从"书包太重"的真实烦恼出发，翅膀、小伞、防丢三个功能写得有条有理，还配上了按钮操作的细节，想象既大胆又清楚。'},
  {title:'自动整理机器人',text:'我的房间总是乱糟糟的：书桌上堆着书，地上躺着玩具，床上还扔着衣服。妈妈常说："你的房间像被台风刮过！"我想：要是有个自动整理机器人就好了。\n我发明的机器人圆圆的，像一个大皮球，底下装着轮子，眼睛是两个闪着蓝光的小灯。\n它的第一样本领是"火眼金睛"。它一进房间，眼睛一亮，就能看出什么东西放错了地方。\n第二样本领是"巧手整理"。它的肚子里伸出两只灵活的机械手，把书一本一本放回书架，把玩具一件一件收进箱子，把衣服叠得整整齐齐。不到五分钟，房间就变得干干净净。\n它还会"垃圾分类"呢！地上的废纸、果皮，它会分别放进不同的垃圾袋里，真是一个环保小能手。\n有了这个机器人，我就能把整理房间的时间省下来看书、做游戏了。我一定要好好学习，争取早日把它发明出来！',note:'先写房间乱的原因，再介绍机器人的样子和三个本领，"火眼金睛""巧手整理"这样的命名很有创意，条理清楚。'},
  {title:'智能调温衣服',text:'夏天热得穿短袖还出汗，冬天冷得穿棉袄还发抖。要是有一件能自己调温度的衣服，那该多舒服啊！\n这件衣服看起来和普通的运动服一样，轻便又漂亮。秘密在于它的布料里藏着许多肉眼看不见的"小空调"，衣领上还有一颗纽扣大小的感应器。\n感应器能感觉到天气的冷热。夏天，它会让"小空调"吹出凉风，衣服就变得凉丝丝的；冬天，它又会放出热气，衣服就变得暖烘烘的。不管外面是严寒还是酷暑，穿上它，总是那么舒服。\n这件衣服还能根据主人的心情变颜色呢！开心的时候是鲜艳的红色，安静的时候是温柔的蓝色，就像会说话一样。\n更妙的是，它不用洗衣服——布料能自动除尘，永远干干净净。\n这就是我的奇思妙想——智能调温衣服。我相信，随着科技的发展，它一定会变成现实。',note:'"小空调""感应器"的设想具体可信，调温、变色、除尘三个功能层层递进，结尾联系科技发展，立意有高度。'}
 ]
},
'习作·写诗':{
 guide:[
  {h:'审题立意',b:'试着写一首小诗：选一个你熟悉、喜爱的事物——春天、云、星星、月亮、妈妈、老师、校园、小动物……把看到的、想到的、感受到的，分行写下来。'},
  {h:'选材锦囊',b:'诗要有"我"：写你真正观察过的东西，写你真正心里的感受。一片落叶、一场雨、妈妈的白发、同桌的笑，都是好素材。'},
  {h:'结构提纲',b:'小诗一般 2~4 节，每节 2~4 行。可以先写看到的事物，再写产生的联想，最后写出心里的感受。分行写，注意停顿和节奏。'},
  {h:'写作妙招',b:'① 大胆想象：把事物当作人来写（拟人），或者把它比作别的东西（比喻）；② 语言简洁：诗不用长句子，能省的字就省；③ 有节奏：读一读，顺口才好；④ 有真情：结尾写出心里的感受。'},
  {h:'好词百宝箱',b:'轻轻、悄悄、闪闪、静静、好像、仿佛、是、像、梦、笑、歌、翅膀'},
  {h:'避坑提醒',b:'① 把一段话简单地拆成行，没有诗的节奏；② 全是"啊，真美呀"这样的空话；③ 没有想象，只是平淡地叙述。'}
 ],
 fanwen:[
  {title:'春天的画笔',text:'春天有一支神奇的画笔，\n她走到哪里，\n就把颜色涂到哪里。\n\n她给柳树涂上嫩绿，\n柳条就跳起了舞；\n她给桃花涂上粉红，\n桃花就笑红了脸；\n她给小河涂上蓝色，\n小河就唱起了歌。\n\n最后，她把画笔交给我，\n让我给春天，\n再添上几笔。',note:'把春天想象成拿画笔的人，柳树、桃花、小河一个个"被涂色"，排比整齐，结尾"把画笔交给我"更是神来之笔。'},
  {title:'云',text:'云是天上的一群羊，\n风是牧羊的孩子。\n\n一会儿，\n羊儿在草地上吃草；\n一会儿，\n羊儿又跑远了。\n\n太阳落山的时候，\n风把羊儿赶回了家，\n只留下几朵红红的晚霞，\n那是羊儿落下的羊毛。',note:'把云比作羊群，把风比作牧羊的孩子，晚霞是"落下的羊毛"——想象一环扣一环，读起来像一个温柔的小故事。'},
  {title:'妈妈的爱',text:'妈妈的爱，\n是夏天的风扇，\n给我送来清凉；\n\n妈妈的爱，\n是冬天的棉衣，\n给我裹住温暖；\n\n妈妈的爱，\n是夜晚的灯光，\n陪我做甜甜的梦。\n\n妈妈的爱，\n是什么呢？\n哦，我知道了——\n妈妈的爱，\n就是妈妈。',note:'三个比喻整齐温暖，结尾"妈妈的爱就是妈妈"出人意料又合情合理，小诗的妙处就在这灵光一闪的结尾。'}
 ]
},
'习作·我的动物朋友':{
 guide:[
  {h:'审题立意',b:'写自己的动物朋友：可以写自己养的小动物，也可以写熟悉的别人家的动物。要写清它的外形、脾气、喜好，用一两件具体的事写出它的特点，表达你对它的感情。'},
  {h:'选材锦囊',b:'给小动物起个外号，抓住它最突出的特点来写：贪吃的猫、爱撒娇的狗、慢吞吞的乌龟、爱唱歌的蝈蝈……特点越鲜明，文章越有趣。'},
  {h:'结构提纲',b:'开头：介绍你的动物朋友（可以用外号开头）。中间：先写它的外形，再用一两件具体的事写它的脾气、喜好。结尾：表达你对它的感情。'},
  {h:'写作妙招',b:'① 外形描写抓特点，不必面面俱到；② 事例要具体，有动作、有声音；③ 把它当作人来写，写它的小心思；④ 可以写你和它之间的小故事，更有真情。'},
  {h:'好词百宝箱',b:'活泼可爱、机灵、贪吃、撒娇、慢吞吞、摇头摆尾、津津有味、虎头虎脑、形影不离、忠实'},
  {h:'避坑提醒',b:'① 外形从头写到脚，像说明书；② 只写动物不写"我"，缺少真情；③ 事例空泛，"它很可爱"却不说怎么可爱。'}
 ],
 fanwen:[
  {title:'贪吃的"汤圆"',text:'我家有一只小猫，浑身雪白，缩起来就像一个汤圆，所以我叫它"汤圆"。\n汤圆的眼睛像两颗绿宝石，一到晚上就闪闪发亮。它的胡子又细又长，走路的时候一翘一翘的，可神气了。\n汤圆什么都爱吃，尤其是小鱼干。有一次，妈妈刚把小鱼干拿出来，汤圆就从沙发底下钻了出来，围着妈妈"喵喵"地叫，还用头蹭妈妈的腿。妈妈给了它一条，它叼着跑进窝里，吃得津津有味。吃完，它还跑回来，眼巴巴地望着妈妈，好像在说："再来一条嘛！"\n汤圆还会"偷吃"呢！一天中午，桌上的鱼没盖好，它纵身一跃，跳上桌子，叼起鱼就逃。等我发现时，它已经躲在床底下，把鱼吃得只剩骨头了。我气得要揍它，它却冲我"喵"了一声，好像在说："小主人，别生气嘛！"\n瞧，这就是我家贪吃的汤圆，它给我带来了数不清的快乐。',note:'外号"汤圆"贯穿全文，等鱼干、偷鱼吃两件事把"贪吃"写活了，小猫的"话"用心理描写来呈现，亲切有趣。'},
  {title:'慢吞吞的小乌龟',text:'我养了一只小乌龟，它背着一个坚硬的壳，走起路来慢吞吞的，我给它起名叫"慢慢"。\n慢慢的头小小的，眼睛像两粒黑芝麻。它特别胆小，只要有一点动静，就把头、尾巴和四条腿全都缩进壳里，半天也不肯出来。\n慢慢吃东西的样子最有趣。我把一小块肉放进水缸，它先是伸长脖子看了看，确定没有危险，才慢悠悠地游过去。它先碰了碰肉，又退回来，好像在试探。过了一会儿，它才张开嘴，一口咬住肉，慢慢地嚼。一顿饭，它要吃上老半天。\n别看慢慢平时慢吞吞的，翻壳的时候可灵活了。有一次我把它翻过来，它四脚朝天，急得划来划去。突然，它把头一伸，顶住地面，用力一翻——嘿，翻过来了！它得意地划着水，好像在说："怎么样，我厉害吧？"\n我喜欢我的慢慢，它虽然慢，却慢得可爱，慢得有趣。',note:'"慢"是全文的线：走路慢、吃食慢，偏偏翻壳灵活，一慢一快形成反差，小乌龟的形象就立起来了。'},
  {title:'爱唱歌的蝈蝈',text:'爷爷给我捉了一只蝈蝈，装在一个精致的竹笼子里。我给它取名叫"歌唱家"。\n歌唱家长得很威风：碧绿的衣裳，长长的触须，一对大眼睛滴溜溜地转。它的肚子鼓鼓的，翅膀薄薄的，一看就是唱歌的好手。\n歌唱家真爱唱啊！天一亮，它就开始练嗓子："蝈蝈，蝈蝈……"中午太阳越晒，它唱得越起劲，声音又响又亮，像在开演唱会。晚上，它也不休息，轻轻地唱着，像一首摇篮曲，伴着我入睡。\n歌唱家还很挑食呢。我给它喂米饭，它看都不看；喂它毛豆，它就抱着毛豆啃得津津有味。爷爷说，蝈蝈喜欢吃毛豆，果然不错。\n现在，歌唱家已经成了我们家的一员。每次写作业累了，听它唱上一曲，我就又有了精神。',note:'按"外形—爱唱歌—挑食"的顺序来写，把蝈蝈的叫声比作练嗓子、演唱会、摇篮曲，既准确又富有童趣。'}
 ]
},
'习作·游____':{
 guide:[
  {h:'审题立意',b:'按游览顺序写一处景物：先确定游览路线，把路线理清楚；再按顺序写看到的景物，用过渡句衔接；印象最深的景物要作为重点写具体。'},
  {h:'选材锦囊',b:'选你真正游览过、印象深的地方：公园、动物园、博物馆、名胜古迹、家乡的山水……写之前先画一画游览路线图，想清楚先写哪里、后写哪里、重点写哪里。'},
  {h:'结构提纲',b:'开头：交代游览的时间、地点、心情。中间：按游览顺序写，从一个景点到另一个景点用过渡句衔接，重点景物写具体（样子+感受）。结尾：写游览的感受，总结全文。'},
  {h:'写作妙招',b:'① 过渡句是法宝："走完……就来到了……""从……出来，就看到了……"；② 重点景物调动多种感官来写（看、听、闻、触）；③ 把自己的心情融进景物，情景交融。'},
  {h:'好词百宝箱',b:'游览、风景如画、美不胜收、流连忘返、目不暇接、心旷神怡、雄伟壮观、别有洞天、移步换景、印象深刻'},
  {h:'避坑提醒',b:'① 游览顺序混乱，东写一句西写一句；② 景点平均用力，没有重点；③ 只写景物没有感受，像导游词。'}
 ],
 fanwen:[
  {title:'游动物园',text:'星期天，爸爸妈妈带我去动物园玩，我高兴得像只出笼的小鸟。\n走进动物园大门，首先来到的是熊猫馆。隔着玻璃，我终于见到了传说中的"国宝"。大熊猫穿着黑白相间的大衣，戴着一副"墨镜"，正坐在地上吃竹子。它双手抱着竹子，咬一口，嚼一嚼，吃得津津有味。吃饱了，它就往地上一躺，呼呼大睡，那懒洋洋的样子逗得游客哈哈大笑。\n穿过熊猫馆，就来到了猴山。猴子们可调皮了！有的荡秋千，有的挠痒痒，还有的冲着游客做鬼脸。一只小猴子跳到我面前，伸出手来，好像在要吃的。我扔给它一块饼干，它接住就跑，逗得我直笑。\n从猴山出来，我们又看了大象、长颈鹿和孔雀。最幸运的是，我们还看到了孔雀开屏！孔雀抖动着身子，"唰"的一下，尾巴像一把彩色的大扇子展开了，美丽极了。\n夕阳西下，我依依不舍地离开了动物园。这真是快乐的一天！',note:'"熊猫馆→猴山→大象、长颈鹿、孔雀"路线清楚，熊猫吃竹、猴子要食、孔雀开屏三个重点有详有略，过渡句用得自然。'},
  {title:'游西湖',text:'"欲把西湖比西子，淡妆浓抹总相宜。"去年暑假，我终于来到了向往已久的杭州西湖。\n站在湖边放眼望去，西湖的水绿得像一块巨大的翡翠。阳光洒在湖面上，波光粼粼，像撒了一层碎金子。湖边的柳树垂下长长的枝条，随风轻轻摆动，好像在欢迎我们的到来。\n沿着湖边的小路往前走，我们来到了断桥。桥上游人如织，大家都想看看这个传说中白娘子与许仙相遇的地方。站在桥上向远处望，西湖的美景尽收眼底。\n最有趣的要数坐船游湖了。小船慢慢地划过湖面，来到了湖心的三潭印月。三个石塔立在水中，像三个小葫芦。船夫说，要是中秋节的晚上，石塔里点上灯，天上一个月亮，水里就有三十三个月亮呢！我听了，真想等到中秋节再来看一看。\n西湖的美景说也说不尽，难怪人们说"上有天堂，下有苏杭"。再见了，美丽的西湖，我一定还会再来的！',note:'引用古诗开头，"湖边→断桥→坐船游湖"顺序分明，三潭印月的传说给游记增添了趣味，首尾呼应。'},
  {title:'游家乡的小山',text:'我的家乡有一座小山，虽然它不出名，却是我最爱去的地方。上个周末，我又去爬了这座小山。\\n山脚下是一片果园。春天，桃花、梨花竞相开放，白的像雪，粉的像霞；秋天，苹果涨红了脸，柿子挂起了小灯笼。果园的主人总是笑眯眯地跟我们打招呼。\n顺着弯弯曲曲的小路向上爬，路两旁是茂密的树林。树上的鸟儿叽叽喳喳地叫着，好像在给我们唱歌。草丛里开着五颜六色的野花，蝴蝶在花间翩翩起舞。走着走着，我听见了"哗哗"的水声，原来是一条小瀑布！清澈的水从石头上冲下来，溅起一朵朵水花，凉丝丝的水汽扑到脸上，舒服极了。\n爬到山顶，家乡的美景尽收眼底：一条条马路像丝带，一栋栋楼房像积木，田野像一块块拼图。风吹过来，带来泥土和青草的香味，我张开双臂，忍不住大喊："家乡真美啊！"\n这就是家乡的小山，一座让我百游不厌的小山。',note:'"山脚→山腰→山顶"顺序清楚，果园、树林、瀑布、山顶眺望各有特色，比喻生动，字里行间满是对家乡的热爱。'}
 ]
},
'习作·我学会了____':{
 guide:[
  {h:'审题立意',b:'写自己学会一件事的经历：学骑自行车、学游泳、学做饭、学滑冰、学下棋……要按顺序写学习的过程，把遇到的困难、怎样克服的、当时的心情写具体，写出收获与感受。'},
  {h:'选材锦囊',b:'选学习过程中有过"波折"的事：从不会到会，一定遇到过困难、想过放弃，最后坚持下来了——这样的经历最有内容可写，也最能打动人。'},
  {h:'结构提纲',b:'开头：交代学的是什么，为什么学。中间：按顺序写学习过程——开始的笨拙、遇到的困难、想放弃的念头、怎样克服的（重点写）。结尾：写学会后的快乐和懂得的道理。'},
  {h:'写作妙招',b:'① 困难要写具体：怎么难、什么心情、什么动作；② 克服的过程是重点，写清楚是谁帮助的、自己怎么做的；③ 用心理描写写出心情的变化：紧张→灰心→坚持→快乐。'},
  {h:'好词百宝箱',b:'笨手笨脚、小心翼翼、垂头丧气、咬紧牙关、坚持不懈、熟能生巧、欣喜若狂、如鱼得水、功夫不负有心人'},
  {h:'避坑提醒',b:'① 过程一笔带过，"我练了几天就会了"；② 没有困难，一学就会，缺少波折；③ 只写事情，不写心情和收获。'}
 ],
 fanwen:[
  {title:'我学会了骑自行车',text:'每当看到别人骑着自行车飞驰而过，我就想起自己学骑自行车的经历。\n八岁生日那天，爸爸送给我一辆崭新的自行车。我迫不及待地推着车来到广场，心想：骑车有什么难的，看我的！我跨上车，双手握住车把，脚一蹬——哎呀，车子一歪，我摔了个四脚朝天。\n我不服气，爬起来再骑。可是车子像一头不听话的小牛，一会儿往左歪，一会儿往右倒。我摔了一次又一次，膝盖都磕破了皮。我气呼呼地把车一扔："不学了！"\n爸爸走过来，扶起自行车，语重心长地说："孩子，做什么事都不能半途而废。眼睛看前方，身子坐正，别怕，爸爸扶着你。"听了爸爸的话，我又鼓起勇气骑了上去。爸爸在后面扶着车尾，我慢慢地蹬着，车子渐渐稳了。不知过了多久，我回头一看——咦，爸爸早就松手了！我竟然自己骑出去了老远！"我会骑车啦！"我兴奋地大喊起来。\n现在，我骑车的技术越来越好了。这次经历让我明白：世上无难事，只怕有心人。只要坚持不懈，就一定能成功。',note:'"想学→摔跤→想放弃→鼓励→学会"一波三折，摔跤、赌气、回头的细节真实生动，结尾的道理水到渠成。'},
  {title:'我学会了游泳',text:'暑假里，妈妈给我报了游泳班。看着别人在水里像鱼儿一样自在，我羡慕极了，可轮到自己下水，我却成了"旱鸭子"。\n第一节课，教练教我们憋气。我深吸一口气，把头埋进水里——"咕咚"，我呛了一大口水，鼻子酸酸的，难受极了。我吓得爬上岸，说什么也不肯再下水了。教练笑着说："别怕，呛水是常事。慢慢来，先憋三秒，再憋五秒。"我鼓起勇气，一次次地练，终于可以憋半分钟了。\n学会了憋气，教练又教我们蛙泳的动作：双手向外划，双腿向后蹬，抬头换口气。我趴在浮板上练，手臂酸得抬不起来，腿也蹬得生疼。可我咬紧牙关，一遍又一遍地练。\n一个星期后，教练让我丢开浮板，自己游。我的心怦怦直跳，深吸一口气，跳进水里。划手，蹬腿，换气……我竟然游起来了！一米，两米，五米……"我学会游泳啦！"我在水里欢呼起来。\n这次学游泳让我懂得：困难像弹簧，你弱它就强。只要勇敢面对，坚持练习，就一定能战胜它。',note:'从憋气呛水到丢开浮板，学习过程写得层次分明，"心怦怦直跳"的心理描写和"划手，蹬腿，换气"的动作描写都很到位。'},
  {title:'我学会了包饺子',text:'大年三十，我们全家围在一起包饺子。看着妈妈包的饺子像一排排小元宝，我也跃跃欲试："妈妈，教我包饺子吧！"\n妈妈爽快地答应了。我学着妈妈的样子，拿起一张饺子皮，夹了一大团馅放在皮中央，然后用力一捏——哎呀，馅太多了，饺子皮被撑破了，馅从破口里探出头来，好像在笑话我。我不好意思地笑了。\n妈妈说："馅要放得适量，捏边的时候要用力均匀。来，再试一次。"这回，我只夹了一小团馅，小心翼翼地把皮对折，一点一点地捏紧。嘿，饺子包好了！可是它扁扁的，站都站不稳，活像一只小懒猪。再看看妈妈包的，鼓鼓的，精神极了。\n"别灰心，多包几个就好了。"在妈妈的鼓励下，我包了一个又一个，越包越熟练。饺子们一个个挺起了肚子，像列队的士兵。\n吃年夜饭的时候，我吃着自己包的饺子，觉得格外香。这次包饺子让我明白：看起来简单的事，做起来也要下功夫。',note:'第一次馅多破皮、第二次扁扁站不稳，两次失败写得具体有趣，"小懒猪""列队的士兵"两个比喻前后对比，进步看得见。'}
 ]
},
'习作·我的"自画像"':{
 guide:[
  {h:'审题立意',b:'向别人介绍自己，就像给自己画一张"自画像"：写清自己的外貌特点，写出自己的性格、爱好、特长，也可以用事例说说自己的小缺点，让别人读完就能"认识"你。'},
  {h:'选材锦囊',b:'抓住自己最突出的特点：爱看书、爱运动、马虎、幽默、爱帮助别人……特点不必多，两三个写透就好。给每个特点配一件具体的事。'},
  {h:'结构提纲',b:'开头：介绍自己的基本情况（可以用外貌描写开头）。中间：写 2~3 个特点，每个特点用一件具体的事来表现。结尾：总结自己的特点，表达愿望（如"你愿意和我做朋友吗"）。'},
  {h:'写作妙招',b:'① 外貌描写抓一两个最有特点的地方写；② 特点+事例的组合最有说服力；③ 写缺点要真诚，写出来反而更可爱；④ 语言可以活泼些，像在跟朋友聊天。'},
  {h:'好词百宝箱',b:'活泼开朗、安静内向、幽默风趣、爱书如命、运动健将、马马虎虎、乐于助人、坚持不懈、这就是我'},
  {h:'避坑提醒',b:'① 外貌从头写到脚，没有重点；② 特点罗列很多，却没有事例支撑；③ 只写优点不写缺点，不够真实。'}
 ],
 fanwen:[
  {title:'我的"自画像"',text:'瞧，镜子里这个男孩：圆圆的脸蛋，大大的眼睛，笑起来还有两个小酒窝。这就是我——一个活泼开朗、爱看书的小男孩。\n我是个十足的"书虫"。我的书架上摆满了书：童话、科普、历史，应有尽有。每天睡觉前，我都要看上半小时书才肯睡。有一次，我看《西游记》入了迷，妈妈喊我吃饭，喊了三遍我都没听见。妈妈走过来，一把夺过我的书："吃饭了！"我这才依依不舍地放下书。吃完饭，我又立刻捧起书，连水果都顾不上吃了。\n我还是个"马大哈"。做作业的时候，我经常把"+"看成"-"，把"已经"写成"以经"。有一次考试，我因为粗心丢了六分，看着试卷上的红叉叉，我暗暗下决心：一定要改掉粗心的毛病！\n别看我缺点不少，可我也有优点——我特别爱帮助别人。同学忘了带橡皮，我会主动借给他；下雨天，我会和同学共撑一把伞。\n这就是我，一个爱看书、有点粗心、乐于助人的男孩。你愿意和我做朋友吗？',note:'"书虫""马大哈""爱助人"三个特点，每个都用一件具体的事来表现，优点缺点都写，形象真实可爱，结尾的邀请很亲切。'},
  {title:'一个爱画画的女孩',text:'大家好，我叫小雨，今年十岁。我扎着一条马尾辫，鼻梁上架着一副小眼镜。大家都说，我一笑起来，眼睛就眯成了两条缝。\n我最大的爱好是画画。我的书包里总装着一本画册和几支彩笔，一有空就涂涂画画。课间画，放学画，连等公交车的时候也画。我的画册里，有飞翔的龙，有会说话的花，还有住在云朵上的城市。\n记得有一次美术课，老师让我们画"未来的世界"。我画了一座悬浮在天空中的城市：房子建在云朵上，人们坐着飞行器上班，机器人在公园里给花浇水。老师看了，把我的画贴在了展示栏里。那一刻，我心里比吃了蜜还甜。\n画画让我变得有耐心。以前我做事总是三分钟热度，可画画的时候，我一坐就是一两个小时，一点也不觉得累。妈妈说，画画让我变成了另一个样子。\n这就是爱画画的我。我的梦想是当一名画家，用画笔画出世界上所有的美好。',note:'围绕"爱画画"一个特点深挖：随身带画册、美术课获奖、画画改变性格，材料集中，梦想结尾有力量。'},
  {title:'幽默的我',text:'我嘛，个子不高，皮肤有点黑，最特别的是那张嘴——能说会道，还爱开玩笑。同学们都说，我是班里的"开心果"。\n有一次，同桌因为考试没考好，趴在桌上闷闷不乐。我走过去，一本正经地说："报告长官，我发现了一个重大问题！"同桌抬起头，疑惑地看着我。我清了清嗓子，说："经过我的严密调查，这次考试的卷子，它——出题出得太狡猾了！我建议，把它抓起来，好好教训一顿！"同桌听了，"扑哧"一声笑了。我又凑过去，压低声音说："下次咱们一起“报仇”，把分数抢回来，怎么样？"同桌点点头，眼睛又亮了起来。\n还有一次，课间大家都在抱怨作业多。我站起来，假装严肃地说："同学们，我有一个重大宣布——"大家都安静下来，看着我。我慢悠悠地说："经过我的反复研究，作业它……是躲不掉的！所以，咱们还是乖乖投降吧！"教室里顿时爆发出一阵笑声。\n妈妈常说："你这张嘴啊，真是让人又爱又恨。"我知道，幽默是我的优点，它能给别人带来快乐。不过，我也提醒自己：开玩笑要有分寸，不能拿别人的缺点取乐。\n这就是我，一个爱开玩笑、给大家带来欢笑的男孩。你愿意和我做朋友吗？',note:'用"开心果"这个外号统领全文，安慰同桌、调侃作业两件事都通过对话来表现，幽默感十足，结尾还写出"开玩笑有分寸"的自省，人物更立体。'}
 ]
},
'习作·故事新编':{
 guide:[
  {h:'审题立意',b:'选一个熟悉的故事，重新编一编：可以改变故事的起因、经过、结果，可以给人物增加新的经历，也可以换一个结局。想象要大胆合理，故事要完整有趣，最好还能有点新道理。'},
  {h:'选材锦囊',b:'选大家都熟悉的故事最好：《龟兔赛跑》《狐狸和乌鸦》《守株待兔》《井底之蛙》《狼来了》……越熟悉，新编的反差越有趣。先想好：我要改变什么？新故事要说明什么道理？'},
  {h:'结构提纲',b:'开头：简要交代故事背景（可以点明这是新编）。中间：按新编的情节写，重点写"改变"的部分，要有对话、有细节。结尾：写出新结局，可以点明新的道理。'},
  {h:'写作妙招',b:'① "旧瓶装新酒"：保留原故事的人物和框架，情节大胆创新；② 改变要有理由：为什么兔子不再睡觉？为什么乌鸦不上当了？③ 新故事有新道理，让人读完会心一笑。'},
  {h:'好词百宝箱',b:'话说、却说、这一次、没想到、谁知、吸取教训、将计就局、恍然大悟、皆大欢喜'},

  {p:1,s:['一夜秋风，一夜秋雨。','我背着书包去上学时，天开始放晴了。','啊！多么明朗的天空。','可是，地面还是潮湿的，不时还能看见一个亮晶晶的水洼，映着一角小小的蓝天。']},

  {p:3,s:['每一片法国梧桐树的落叶，都像一个金色的小巴掌，熨帖地、平展地粘在水泥道上。','它们排列得并不规则，甚至有些凌乱，然而，这更增添了水泥道的美。']},

  {p:5,s:['一夜秋风，一夜秋雨。','当我背着书包去上学时，第一回觉得，门前的水泥道真美啊！']}

 read:[
  {p:1,s:['老屋已经活了一百多岁了。','它的窗户变成了黑窟窿，门板也破了洞。','它很久很久没人住了。','"好了，我到了倒下的时候了！"它自言自语着，准备往旁边倒去。']},
  {p:2,s:['"等等，老屋！再过一个晚上，行吗？今天晚上有暴风雨，我找不到一个安心睡觉的地方。"','一个小小的声音在它门前响起。','老屋低头看看，眼睛眯成一条缝："哦，是小猫啊。好吧，我就再站一个晚上。"']},

  {p:4,s:['"等等，老屋！再过二十一天，行吗？主人想拿走我的蛋，可是我想孵小鸡。我找不到一个安心孵蛋的地方。"','老屋低头看看，墙壁吱吱呀呀地响："哦，是老母鸡啊。好吧，我就再站二十一天。"']},

  {p:2,s:['红头悄悄地躲在一个草堆里。','正在这时，一头大黄牛低下头来吃草，把红头和草一起卷进了嘴里。','"救命啊！救命啊！"红头拼命地叫起来。']},
  {p:3,s:['青头大吃一惊，它一下子蹦到牛身上，隔着肚皮对红头喊："别怕，红头！牛有四个胃，前三个胃是贮藏食物的，只有第四个胃才是管消化的。你先躲过它的牙齿，我马上想办法救你！"']},
  {p:4,s:['红头听了青头的话，咬着牙在牛肚子里躲避。','青头又告诉红头，等牛把草送回嘴里的时候，就趁机跳出来。','果然，红头随着草回到了牛嘴边，它纵身一跃，跳了出来。','"谢谢你，青头！"红头感激地说。']},
  {p:5,s:['青头笑眯眯地说："不用谢，咱们是好朋友嘛。这次旅行可真惊险啊！"']}

  {p:1,s:['我们住在乡下，窗前是一大片草地。','草地上长满了蒲公英。','当蒲公英盛开的时候，这片草地就变成金色的了。']},
  {p:2,s:['我和弟弟常常在草地上玩耍。','有一次，弟弟跑在我前面，我装着一本正经的样子，喊："谢廖沙！"','他回过头来，我就使劲一吹，把蒲公英的绒毛吹到他的脸上。','弟弟也假装打哈欠，把蒲公英的绒毛朝我脸上吹。','就这样，这些并不引人注目的蒲公英，给我们带来了不少快乐。']},
  {p:3,s:['有一天，我起得很早去钓鱼，发现草地并不是金色的，而是绿色的。','中午回家的时候，我看见草地是金色的。','傍晚的时候，草地又变绿了。','这是为什么呢？']},
  {p:4,s:['我来到草地上，仔细观察，发现蒲公英的花瓣是合拢的。','原来，蒲公英的花就像我们的手掌，可以张开、合上。','花朵张开时，花瓣是金色的，草地也是金色的；花朵合拢时，金色的花瓣被包住了，草地就变成绿色的了。']},
  {p:5,s:['多么可爱的草地！多么有趣的蒲公英！','从那时起，蒲公英成了我们最喜爱的一种花。','它和我们一起睡觉，和我们一起起床。']}

 read:[
  {p:1,s:['西沙群岛位于南海的西北部，是我国海南省的一群岛屿。','那里风景优美，物产丰富，是个可爱的地方。']},
  {p:2,s:['西沙群岛一带海水五光十色，瑰丽无比：有深蓝的，淡青的，浅绿的，杏黄的。','一块块，一条条，相互交错着。','因为海底高低不平，有山崖，有峡谷，海水有深有浅，从海面看，色彩就不同了。']},
  {p:3,s:['海底的岩石上长着各种各样的珊瑚，有的像绽开的花朵，有的像分枝的鹿角。','海参到处都是，在海底懒洋洋地蠕动。','大龙虾全身披甲，划过来，划过去，样子挺威武。','鱼成群结队地在珊瑚丛中穿来穿去，好看极了。','有的全身布满彩色的条纹；有的头上长着一簇红缨；有的周身像插着好些扇子，游动的时候飘飘摇摇；有的眼睛圆溜溜的，身上长满了刺，鼓起气来像皮球一样圆。']},
  {p:4,s:['西沙群岛也是鸟的天下。','岛上有一片片茂密的树林，树林里栖息着各种海鸟。','遍地都是鸟蛋。','树下堆积着一层厚厚的鸟粪，这是非常宝贵的肥料。']},
  {p:5,s:['富饶的西沙群岛，是我们祖祖辈辈生活的地方。','随着祖国建设事业的发展，可爱的西沙群岛，必将变得更加美丽，更加富饶。']}

 author:'林遐',
 read:[
  {p:1,s:['我的家乡在广东，是一座海滨小城。']},
  {p:2,s:['天是蓝的，海也是蓝的。','海天交界的水平线上，有棕色的机帆船和银白色的军舰来来往往。','天空飞翔着白色的、灰色的海鸥，还飘着跟海鸥一样颜色的云朵。']},
  {p:3,s:['早晨，机帆船、军舰、海鸥、云朵，都被朝阳镀上了一层金黄色。','帆船上的渔民，军舰上的战士，他们的脸和胳膊也镀上了一层金黄色。']},
  {p:4,s:['海边是一片沙滩，沙滩上遍地是各种颜色、各种花纹的贝壳。','这里的孩子见得多了，都不去理睬这些贝壳，贝壳只好寂寞地躺在那里。','远处响起了汽笛声，那是出海捕鱼的船队回来了。','船上满载着银光闪闪的鱼，还有青色的虾和蟹，金黄色的海螺。']},
  {p:5,s:['小城里每一个庭院都栽了很多树。','有桉树、椰子树、橄榄树、凤凰树，还有别的许多亚热带树木。','初夏，桉树叶子散发出来的香味，飘得满街满院都是。','凤凰树开了花，开得那么热闹，小城好像笼罩在一片片红云中。']},
  {p:6,s:['小城的公园更美。','这里栽着许许多多榕树。','一棵棵榕树就像一顶顶撑开的绿绒大伞，树叶密不透风，可以遮太阳，挡风雨。']},
  {p:7,s:['这座海滨小城真是又美丽又整洁。']}

 author:'佚名',
 read:[
  {p:1,s:['我国东北的小兴安岭，有数不清的红松、白桦、栎树……几百里连成一片，就像绿色的海洋。']},
  {p:2,s:['春天，树木抽出新的枝条，长出嫩绿的叶子。','山上的积雪融化了，雪水汇成小溪，淙淙地流着。','小鹿在溪边散步，它们有的俯下身子喝水，有的侧着脑袋欣赏自己映在水里的影子。']},
  {p:3,s:['夏天，树木长得葱葱茏茏，密密层层的枝叶把森林封得严严实实的，挡住了人们的视线，遮住了蓝蓝的天空。','早晨，雾从山谷里升起来，整个森林浸在乳白色的浓雾里。','太阳出来了，千万缕耀眼的金光穿过树梢，照射在工人宿舍门前的草地上。','草地上盛开着各种各样的野花，红的、白的、黄的、紫的，真像个美丽的大花坛。']},
  {p:4,s:['秋天，白桦和栎树的叶子变黄了，松柏显得更苍翠了。','秋风吹来，落叶在林间飞舞。','这时候，森林向人们献出了酸甜可口的山葡萄，又香又脆的榛子，鲜嫩的蘑菇和木耳，还有人参等名贵药材。']},
  {p:5,s:['冬天，雪花在空中飞舞。','树上积满了白雪。','地上的雪厚厚的，又松又软，常常没过膝盖。','西北风呼呼地刮过树梢，紫貂和黑熊不得不躲进各自的洞里。']},
  {p:6,s:['小兴安岭一年四季景色诱人，是一座美丽的大花园，也是一座巨大的宝库。']}
 ],

'19* 香港，璀璨的明珠':{
 author:'',
 read:[
  {p:1,s:['香港位于我国南部，南海之滨，虽然面积不大，却是享誉世界的金融、航运和贸易中心，还是购物、品尝美食和旅游的好去处。']},
  {p:2,s:['香港有着繁荣的贸易活动，是一座举世闻名的贸易港城市。','世界各地的商人都乐意来这里做生意，来自不同国家和地区的商品，琳琅满目，应有尽有，"万国市场"的名号当之无愧。']},
  {p:3,s:['人们爱把香港称作"美食天堂"。','名满天下的粤菜、川菜，东南亚各地的风味饮食，欧洲各国的佳肴，一应俱全。','游客不仅能大饱口福，还可以在享受美食盛宴的同时，体验香港的多元文化。']},
  {p:4,s:['香港还是一个旅游胜地。','美不胜收的维多利亚港，让人流连忘返。','位于国际会议展览中心东北侧广场上的金紫荆雕塑，是中外游客的必到之处，这是1997年香港回归祖国时中央政府赠送的礼物。','每当夜幕降临，香港便成了灯的海洋。','大型灯光音乐汇演"幻彩咏香江"将声和光交织在一起，把香港的夜景映照得绚丽多姿。','港湾里闪烁的灯光，像五颜六色的焰火洒落人间。','马路上一串串明亮的车灯，如同闪光的长河，奔流不息。','高楼大厦的霓虹灯流光溢彩，热情欢迎来自五洲四海的游客。']},
  {p:5,s:['未来，在共建"一带一路"和粤港澳大湾区建设的进程中，香港将扮演重要角色，祖国南海之滨的这颗明珠必定更加璀璨夺目。']}

'21 大自然的声音':{
 author:'佚名',
 read:[
  {p:1,s:['大自然有许多美妙的声音。']},
  {p:2,s:['风，是大自然的音乐家。','他会在森林里演奏他的手风琴。','当他翻动树叶，树叶便像歌手一样，唱出各种不同的歌曲。','不一样的树叶，有不一样的声音；不一样的季节，有不一样的音乐。','当微风拂过，那声音轻轻柔柔的，好像呢喃细语，让人感受到大自然的温柔；当狂风吹起，整座森林都激动起来，合奏出一首雄伟的乐曲，那声音充满力量，令人感受到大自然的威力。']},
  {p:3,s:['水，也是大自然的音乐家。','下雨的时候，他喜欢玩打击乐器。','小雨滴敲敲打打，一场热闹的音乐会便开始了。','滴滴答答……叮叮咚咚……所有的树林，树林里的每片树叶；所有的房子，房子的屋顶和窗户，都发出不同的声音。','当小雨滴汇聚起来，他们便一起唱着歌：小溪淙淙，流向河流；河流潺潺，流向大海；大海哗哗，汹涌澎湃。']},
  {p:4,s:['动物也是大自然的歌手。','走在公园里，听听树上叽叽喳喳的鸟叫；坐在一棵树下，听听唧哩哩唧哩哩的虫鸣；在水塘边散步，听听青蛙的歌唱。','你知道他们唱的是什么吗？他们的歌声好像告诉我们："我在歌唱，我很快乐！"']}

  {p:1,s:['1939年春，著名的齐会战斗打响了。','战斗非常激烈，我军伤员陆续从火线上抬下来。']},
  {p:2,s:['在离火线不远的一座小庙里，白求恩大夫正在给伤员做手术。','他已经两天两夜没休息了，眼球上布满了血丝。','突然，几发炮弹落在小庙前的空地上。','硝烟滚滚，弹片纷飞，小庙被烟雾淹没了。','白求恩仍然镇定地站在手术台旁。','他接过助手递来的镊子，敏捷地从伤员的腹腔里取出一块弹片，丢在盘子里。']},
  {p:3,s:['敌机不断地在上空吼叫，炮弹不断地在周围爆炸。','师卫生部长匆匆赶来，对白求恩说："师长决定让您和一部分伤员离开这里。"','白求恩沉思了一会儿，说："我同意撤走部分伤员。至于我个人，要和战士们在一起，不能离开。"']},
  {p:4,s:['部长恳求说："白求恩同志，这儿危险，让您离开，是战斗形式的需要啊！"','白求恩说："谢谢师长的关心。可是，手术台是医生的阵地。战士们没有离开他们的阵地，我怎么能离开自己的阵地呢？"']},
  {p:5,s:['白求恩低下头，继续给伤员做手术。','一连几发炮弹落在小庙的周围，庙的一角落下了许多瓦片。','挂在门口的布帘烧着了，火苗向手术台扑过来。','白求恩仍然争分夺秒地给伤员做手术，做了一个又一个。']},
  {p:6,s:['齐会战斗进行了三天三夜，胜利结束了。','白求恩大夫在手术台旁，连续工作了六十九个小时。']}

  {p:1,s:['中国人民革命军事博物馆里，陈列着一个粗瓷大碗。','这个碗，赵一曼在东北打游击的时候用过。']},
  {p:2,s:['有一回，一场激烈的战斗刚刚结束，小通讯员给赵一曼送来一个鼓鼓的挎包。','打开一看，是个粗瓷大碗。','赵一曼吃饭用的搪瓷缸子，早就送给一个新战士了。','通讯员一直想给她另找一个碗，好不容易在前线找到了这个粗瓷大碗。']},
  {p:3,s:['赵一曼看着这个碗，对通讯员说："从哪里拿来的，请你还到哪里去！"','通讯员为难地说："这……这……敌人都消灭了，往哪儿还呢！"']},
  {p:4,s:['开饭了，通讯员用这个大碗，给赵一曼盛了满满一碗高粱米饭。','他想："这回我们政委该吃顿饱饭了。"','赵一曼端着碗走进炊事棚，趁人不注意，把碗里的饭倒进锅里，又从另一口锅里盛了半碗野菜粥。']},
  {p:5,s:['第二天开饭，通讯员又用这个大碗给赵一曼盛了满满一碗高粱米饭。','赵一曼又把饭倒进锅里，盛了半碗野菜粥。','就这样，这个粗瓷大碗，赵一曼一直没有用。','后来，这个碗又传给了别的战士，大家用它盛过饭，盛过水，谁也不舍得用它盛一次高粱米饭。']},
  {p:6,s:['这个粗瓷大碗，凝结着革命先辈艰苦奋斗、关心战友的精神。']}

  {p:1,s:['一身乌黑光亮的羽毛，一对轻快有力的翅膀，加上剪刀似的尾巴，凑成了那样活泼可爱的小燕子。']},
  {p:2,s:['二三月的春日里，轻风微微地吹拂着，如毛的细雨由天上洒落着，千条万条的柔柳，红的白的黄的花，青的草，绿的叶，都像赶集似的聚拢来，形成了烂漫无比的春天。','这时候，那些小燕子，那么伶俐可爱的小燕子，也由南方飞来，加入了这个光彩夺目的图画中，为春光平添了许多生趣。']},
  {p:3,s:['小燕子带了它的剪刀似的尾巴，在阳光满地时，斜飞于旷亮无比的天空，叽的一声，已由这里的稻田上，飞到那边的高柳下了。']},
  {p:4,s:['另有几只却在波光粼粼的湖面上横掠着，小燕子的翼尖或剪尾，偶尔沾了一下水面，那小圆晕便一圈一圈地荡漾开去。']},
  {p:5,s:['那边还有飞倦了的几对，闲散地在纤细的电线上休憩——嫩蓝的春天，几支木杆，几痕细线连于杆与杆之间，线上停着几个粗黑的小圆点，那便是燕子。','多么有趣的一幅图画呀！']}

'6 会摇尾巴的狼':{
 author:'佚名',
 read:[
  {p:1,s:['一只狼掉进了陷阱里，怎么也爬不上来。','这时候，一只老山羊从陷阱旁边路过。','狼赶紧装出一副可怜的样子，摇着尾巴对老山羊说："好心的老山羊，救救我吧！我是一只狗，不小心掉下来了。"']},
  {p:2,s:['老山羊看了它一眼，说："你不是一只狗，你是一只狼。你的眼睛凶狠，你的尾巴硬邦邦的。"','狼连忙把尾巴摇得更欢了，说："我是狗，你看我会摇尾巴呀！狗会摇尾巴，我也会摇尾巴，不信你看！"']},
  {p:3,s:['老山羊说："会摇尾巴的不一定都是狗。你的尾巴摇得再欢，也改变不了你是狼的事实。你骗得了别人，骗不了我！"']},
  {p:4,s:['说完，老山羊头也不回地走了。','狼在陷阱里又气又急，可是谁让它是一只狡猾的狼呢？']}

'7 鹿角和鹿腿':{
 author:'佚名',
 read:[
  {p:1,s:['丛林中，住着一只漂亮的鹿。','有一天，鹿来到池塘边喝水，看着水中自己的倒影，欣赏起自己来。']},
  {p:2,s:['"啊！我的身段多么匀称，我的角多么精美别致，好像两束美丽的珊瑚！"','鹿看着自己美丽的角，越看越喜欢。','可是，当它看到自己的腿时，不禁撅起了嘴，皱起了眉头："唉，这四条腿太细了，怎么配得上这两只美丽的角呢！"']},
  {p:3,s:['就在鹿抱怨自己的腿的时候，忽然听到远处传来一阵脚步声。','鹿侧耳一听，不错，是狮子！','鹿撒开长腿就跑，有力的长腿在灌木丛中蹦来跳去，不一会儿，就把凶猛的狮子远远地甩在了后面。','可是，鹿的角却被树枝挂住了。','狮子赶紧抓住这个机会，猛扑过来。','眼看就要追上了，鹿用尽全身力气，使劲一扯，才把两只角从树枝中挣脱出来，拼命向前奔去，终于逃脱了狮子的追捕。']},
  {p:4,s:['鹿喘着气，回头看了看，说："今天多亏了我的腿！我原来抱怨自己的腿难看，可今天救了我的命的，正是这四条难看的腿！而这两只美丽的角，却差点儿让我送了命！"']}

'8* 池子与河流':{
 author:'克雷洛夫（俄国）',
 read:[
  {p:1,s:['"这是怎么回事？"池子对河流说，"我什么时候看见你，你总是滚滚滔滔！亲爱的姐姐，你难道不会疲劳？"']},
  {p:2,s:['"我差不多老是看见，你一会儿背着沉重的货船，一会儿驮着长串的木筏，还有小划子啊小船，简直数也数不完。"']},
  {p:3,s:['"你几时才能抛开这样的生涯？要是换了我，说句老实话，我可真要愁死啦！我的命运有多好，比起来，你我相差竟这么大！"']},
  {p:4,s:['"固然，我并不出名，我没有出现在地图上，像你那样蜿蜒地贯穿全国，也没有行吟诗人为我弹琴歌唱。——这一切其实都是空的。"']},
  {p:5,s:['"可是，我安闲地躺在柔软的泥土里，像贵妇人躺在鸭绒垫上一样。我不用考虑小划子啊小船，更不用惦记大木筏。"']},
  {p:6,s:['河流回答道："水要流动才能保持清洁，这是自然规律。我是一条伟大的河流，那是因为我遵循着这条规律，不顾自身的安逸。我用源源不断的清洁的水，年年给人们带来利益。这就使我受到尊敬，光荣无比。"']},
  {p:7,s:['池子听不进河流的话，依然安闲地躺着。','结果，池子里的水越来越脏，长满了青苔，最后完全干涸了。','而河流，至今还在滚滚滔滔地流淌，给人们带来利益。']}

 read:[
  {p:1,s:['你可知道，大海深处是怎样的吗？']},
  {p:2,s:['当海面上波涛汹涌的时候，海底依然是宁静的。','最大的风浪，也只能影响到海面以下几十米深。','阳光很难射进深海，水越深光线越暗，五百米以下就全黑了。','在这一片黑暗的深海里，却有许多光点像闪烁的星星，那是有发光器官的深水鱼在游动。']},
  {p:3,s:['海底是否没有一点儿声音呢？不是的。','海底的动物常常在窃窃私语。','你用水中听音器一听，就能听见各种声音：有的像蜜蜂一样嗡嗡，有的像小鸟一样啾啾，有的像小狗一样汪汪，有的还好像在打鼾……它们吃东西的时候发出一种声音，行进的时候发出另一种声音，遇到危险还会发出警报。']},
  {p:4,s:['海里的动物，各有各的活动方法。','海参靠肌肉伸缩爬行，每小时只能前进四米。','有一种鱼身体像梭子，每小时能游几十千米，攻击其他动物的时候，比普通的火车还快。','乌贼和章鱼能突然向前方喷水，利用水的反推力迅速后退。','还有些贝类自己不动，却能巴在轮船底下做免费的长途旅行。']},
  {p:5,s:['海底的植物差异也很大。','它们的色彩多种多样，有褐色的，有紫色的，还有红色的。','最小的单细胞海藻，要用显微镜才能看清楚。','最大的海藻长达二三百米，是地球上最长的生物。']},
  {p:6,s:['海底蕴藏着丰富的煤、铁、石油和天然气，还有陆地上储量很少的稀有金属。']},
  {p:7,s:['海底真是个景色奇异、物产丰富的世界。']}
 ],

'10 石蜂':{
 author:'佚名',
 read:[
  {p:1,s:['石蜂是一种有趣的昆虫。','它们不像蜜蜂那样住在蜂巢里，而是住在自己用泥土筑成的"小房子"里。']},
  {p:2,s:['石蜂筑巢的本领可大了。','它们用嘴巴衔来泥土，和上唾液，一点一点地筑成一个个像小葫芦一样的巢。','这些巢牢牢地粘在墙壁上、树枝上，非常坚固。','每个巢里，石蜂妈妈会产下卵，还放进充足的食物，给将来的宝宝吃。']},
  {p:3,s:['石蜂很勤劳。','天一亮，它们就飞出巢去采花蜜。','它们在花丛中飞来飞去，从这朵花飞到那朵花，忙个不停。','石蜂采花蜜的时候，也给花传了粉，帮助植物结出果实。']},
  {p:4,s:['石蜂还是出色的建筑师和勤劳的劳动者，它们为大自然做出了贡献。','仔细观察这些小小的昆虫，你会发现很多有趣的秘密。']}

'11* 小虾':{
 author:'菁莽',
 read:[
  {p:1,s:['我家院子里有一口缸，缸里养着几只小虾。']},
  {p:2,s:['小虾真有趣。','它们有的独自荡来荡去，有的互相追逐，有的紧贴住缸壁休息。','要是你用小竹枝去动动那些正在休息的小虾，它们会立即向别的安静的角落蹦去，一路上像生了气似的，不停地舞动着前面那双细长的腿，腿末端那副钳子一张一张的，胡须也一翘一翘地摆动着，连眼珠子也一突一突的。']},
  {p:3,s:['小虾脾气不好，一受到惊扰就发脾气。','可是它们搏斗起来却很勇敢，两只小虾会打起来，打得十分激烈，常常是两败俱伤。']},
  {p:4,s:['我喜欢这些小虾，常常给它们喂食。','小虾吃食的时候很小心，先用钳子碰一碰食物，觉得没有危险，才放心地吃起来。','看着这些小虾，我觉得生活真有趣。']}

'13 纸的发明':{
 author:'佚名',
 read:[
  {p:1,s:['造纸术的发明，是中国对世界文明的伟大贡献之一。']},
  {p:2,s:['很早以前，人们把文字刻在龟甲和兽骨上，或者铸在青铜器上。','后来，人们又把文字写在竹片和木片上，用绳子穿起来，成了一册一册的书。','这种书很笨重，阅读、携带都不方便。','再后来，人们又把字写在丝绸上，丝绸又轻又软，可是价钱太贵，只有少数人用得起。']},
  {p:3,s:['大约在两千多年前的西汉时代，人们已经懂得用麻来造纸。','可是麻纸比较粗糙，不好书写。']},
  {p:4,s:['大约在一千九百年前的东汉时代，有个叫蔡伦的人，改进了造纸术。','他把树皮、麻头、破布等原料剪碎或切断，浸在水里捣烂成浆；再把浆捞出来晒干，就成了一种既轻便又好用的纸。','用这种方法造的纸，原料容易得到，可以大量制造，价格又便宜，能满足多数人的需要，所以这种造纸方法就传承下来了。']},
  {p:5,s:['我国的造纸术首先传到邻近的朝鲜半岛和日本，后来又传到阿拉伯世界和欧洲，极大地促进了人类社会的进步和文化的发展。']},
  {p:6,s:['造纸术的发明，是中国对世界文明的伟大贡献之一。','我们要为祖先的伟大创造感到自豪。']}

'14 赵州桥':{
 author:'茅以升',
 read:[
  {p:1,s:['河北省赵县的洨河上，有一座世界闻名的石拱桥，叫安济桥，又叫赵州桥。','它是隋朝的石匠李春设计和参加建造的，到现在已经有一千四百多年了。']},
  {p:2,s:['赵州桥非常雄伟。','桥长五十多米，有九米多宽，中间行车马，两旁走人。','这么长的桥，全部用石头砌成，下面没有桥墩，只有一个拱形的大桥洞，横跨在三十七米多宽的河面上。','大桥洞顶上的左右两边，还各有两个拱形的小桥洞。','平时，河水从大桥洞流过，发大水的时候，河水还可以从四个小桥洞流过。','这种设计，在建桥史上是一个创举，既减轻了流水对桥身的冲击力，使桥不容易被大水冲毁，又减轻了桥身的重量，节省了石料。']},
  {p:3,s:['这座桥不但坚固，而且美观。','桥面两侧有石栏，栏板上雕刻着精美的图案：有的刻着两条相互缠绕的龙，嘴里吐出美丽的水花；有的刻着两条飞龙，前爪相互抵着，各自回首遥望；还有的刻着双龙戏珠。','所有的龙似乎都在游动，真像活了一样。']},
  {p:4,s:['赵州桥表现了劳动人民的智慧和才干，是我国宝贵的历史文化遗产。']}

'15* 一幅名扬中外的画':{
 author:'佚名',
 read:[
  {p:1,s:['北宋时候，有位画家叫张择端。','他画了一幅著名的画——《清明上河图》。','画的是北宋都城汴梁热闹的场面。','这幅画有八九百年的历史，早已名扬中外，现在完整地保存在北京故宫博物院里。']},
  {p:2,s:['张择端画这幅画的时候，下了很大的功夫。','光是画上的人物，就有五百多个：有从乡下来的农民，有撑船的船工，有做各种买卖的生意人，有道士，有医生，有走江湖的医生，有摆小摊的摊贩，有官吏和读书人……三百六十行，哪一行的人都画在上面了。']},
  {p:3,s:['画上的街市可热闹了。','街上有挂着各种招牌的店铺、作坊、酒楼、茶馆……走在街上的，是来来往往、形态各异的人：有的骑着马，有的挑着担，有的赶着毛驴，有的推着独轮车，有的悠闲地在街上溜达。','画面上的这些人，有的不到一寸，有的甚至只有黄豆那么大。','别看画上的人小，每个人在干什么，都能看得清清楚楚。']},
  {p:4,s:['最有意思的是桥北头的情景：一个人骑着马，正往桥下走。','因为人太多，眼看就要碰上对面来的一乘轿子。','就在这个紧急时刻，那个骑马人一下子拽住了马笼头，这才没碰上那乘轿子。','站在桥栏杆边欣赏风景的人，被小毛驴惊扰了，连忙回过头来赶小毛驴……']},
  {p:5,s:['《清明上河图》使我们看到了八九百年以前的古都风貌，看到了当时普通百姓的生活情景。']}

 author:'王一梅',
 read:[
  {p:1,s:['胡萝卜先生常常为胡子发愁，因为他长着浓密的胡子，必须每天刮。']},
  {p:2,s:['有一天，胡萝卜先生匆匆忙忙刮了胡子，就吃着果酱面包上街去了。','因为他近视，就没有发现漏刮了一根胡子。','这根胡子长在下巴的右边，胡萝卜先生吃果酱面包的时候，胡子沾到了甜甜的果酱。','对一个胡子来说，果酱是多么好的营养品啊！']},
  {p:3,s:['于是，胡萝卜先生一步一步走的时候，这根胡子就在一点儿一点儿地变长。','只要看看胡萝卜先生走了多长的路，就可以知道他的这根胡子已经长了多长了。']},
  {p:4,s:['胡萝卜先生还在继续走，长胡子被风吹到了身体后面，他完全不知道。']},
  {p:5,s:['在很远的街口，有一个男孩正在放风筝。','线实在太短了，他的风筝只能飞过屋顶。','男孩扯了扯胡萝卜先生的长胡子，这胡子够长够牢固，就剪了一段用来放风筝。','胡萝卜先生的胡子刚好在风里飘动着。']},
  {p:6,s:['胡萝卜先生继续往前走，当他走过鸟太太家的树底下，鸟太太正在找绳子晾小鸟的尿布。','胡萝卜先生的胡子刚好在风里飘动着，鸟太太剪了一段胡子，系在两根树枝的中间，用来晾小鸟的尿布。']}

'17 我变成了一棵树':{
 author:'顾鹰',
 read:[
  {p:1,s:['"我真希望变成一棵树，这样就没人在我玩的时候叫我吃饭了。"我心里想着，就觉得身上痒痒的，低头一看，发现许多小树枝正从我身上冒出来。呀，我真的变成了一棵树！']},
  {p:2,s:['我变的树上长满了各种形状的鸟窝：三角形的、正方形的，还有长方形的、圆形的、椭圆形的、菱形的……风一吹，它们就在枝头跳起了舞。']},
  {p:3,s:['我会请小兔、小刺猬、小松鼠、小鸭子、小鳄鱼、小狐狸住在鸟窝里，如果你喜欢也可以住进来。']},
  {p:4,s:['你怎么住进来？别担心，我会弯下腰，让鸟窝离你很近很近，你只需轻轻一跳或者轻轻一爬，就像平时上你的小床那么容易。']},
  {p:5,s:['傍晚的时候，妈妈背着一个大包过来了，我的心嗵嗵地跳着，震得树上的鸟窝都一动一动的，发出丁零丁零的声音。']},
  {p:6,s:['"你好！"妈妈向我点了点头，"请问我可以住在那个三角形的鸟窝里吗？"她不知道我变成了树！我有点儿高兴，又有些失望。一些树枝轻轻地垂下，妈妈顺着这些树枝爬了上来，坐在那个三角形的鸟窝里。']},
  {p:7,s:['妈妈打开背包，从里面拿出好多东西：巧克力、香肠、面包、花生、牛奶……她把这些好吃的分给小动物们。他们一起在我的鸟窝里津津有味地吃了起来。']},
  {p:8,s:['"咕噜噜……"我的肚子里发出一种怪怪的声音，把他们吓了一跳。他们也只是奇怪地互相看了一眼，又继续吃起来。']},
  {p:9,s:['"咕噜噜……"我肚子里的声音越来越响了。这时候，我开始想念家里那些香喷喷的饭菜，好像还看见爸爸正在大口大口地啃着一块糖醋排骨。天哪，那可是我最喜欢吃的东西！']},
  {p:10,s:['"咦，下雨了。"小狐狸抬头望了望，可天空中一丝乌云都没有。']},
  {p:11,s:['"是你的牛奶打翻了吗？"小鳄鱼问小松鼠。']},
  {p:12,s:['"你看，这不好好的嘛。"小松鼠说。']},
  {p:13,s:['"那么，可能是一只虫子撒的尿。"小鳄鱼说。']},
  {p:14,s:['"不对，是大树在哭。"小白兔发现了树干上不断往下滴的水珠。']},
  {p:15,s:['唉，变成了树真麻烦。他们连水珠是从我的嘴巴里流出来的都不知道。']},
  {p:16,s:['"小馋猫，肚子饿了，对吧？"妈妈说话了，还对我眨了一下眼睛。']},
  {p:17,s:['噢，最了解我的人到底还是妈妈。哎呀，她是怎么知道我的秘密的？']}

'19 肥皂泡':{
 author:'冰心',
 read:[
  {p:1,s:['小时候，我玩儿过很多游戏，其中最爱玩儿的是吹肥皂泡。']},
  {p:2,s:['我们把用剩的肥皂头儿，放在一只小木碗里，加上点儿水，和弄和弄，使它融化。','然后用一支竹笔套管，蘸上那黏稠的肥皂水，慢慢地吹起来，吹成一个又轻又圆的泡儿。','再轻轻地一提，那轻圆的球儿，便从竹管上落了下来，慢悠悠地在空中飘游。','如果用扇子在下面轻轻地扇，它们有时能飞得很高很高。']},
  {p:3,s:['这肥皂泡很美丽，五色的浮光，在那清澈透明的球面上乱转。','若是扇得好，一个大球，会分裂成两三个玲珑娇软的小球，四散分飞。','有时吹得太大了，扇得太急了，这脆薄的球，会扯成长圆的形式，颤巍巍的，光影零乱。']},
  {p:4,s:['这肥皂泡，吹起来很美丽，五色的浮光，在那清澈透明的球面上乱转。','若是扇得好，一个大球，会分裂成两三个玲珑娇软的小球，四散分飞。','这时大家都悬着心，仰着头，屏住呼吸，——不久，这光丽的薄球就无声地散裂了，肥皂水落了下来，洒到眼睛里，大家都忽然低了头，揉出了眼泪。']},
  {p:5,s:['那一个个轻清脆丽的球儿，像一串美丽的梦，是我们自己小心地轻轻吹起的，吹了起来，又轻轻地飞起，是那么圆满，那么自由，那么透明，那么美丽。','目送着她们，我心里充满了快乐、骄傲与希望。']}

'20 灰雀':{
 author:'佚名',
 read:[
  {p:1,s:['有一年冬天，列宁在郊外养病。','他每天到公园散步。','公园里有一棵高大的白桦树，树上有三只灰雀：两只胸脯是粉红的，一只胸脯是深红的。','它们在树枝间来回跳动，婉转地歌唱，非常惹人喜爱。','列宁每次走到白桦树下，都要停下来，仰望这三只欢快的灰雀，还经常给它们带来面包渣和谷粒。']},
  {p:2,s:['一天，列宁又来到公园，走到白桦树下，发现那只胸脯深红的灰雀不见了。','他在周围的树林中找遍了，也没有找到。']},
  {p:3,s:['这时，列宁看见一个小男孩，就问："孩子，你看见过一只深红色胸脯的灰雀吗？"','男孩说："没……我没看见。"','列宁说："一定是飞走了或者是冻死了。天气严寒，它怕冷。"','那个男孩本来想告诉列宁灰雀没有死，但又不敢讲。']},
  {p:4,s:['列宁自言自语地说："多好的灰雀呀，可惜再也飞不回来了。"','男孩看看列宁，说："会飞回来的，一定会飞回来的。它还活着。"','列宁问："会飞回来？"','"一定会飞回来！"男孩肯定地说。']},
  {p:5,s:['第二天，列宁来到白桦树下，果然又看到那只灰雀欢蹦乱跳地在枝头歌唱。','那个男孩站在白桦树旁，低着头。']},
  {p:6,s:['列宁看看男孩，又看看灰雀，微笑着说："你好！灰雀，昨天你到哪儿去了？"','当然，灰雀没有告诉列宁昨天它去哪儿了。','列宁也没再问那个男孩，因为他已经知道，男孩是诚实的。']}

'21* 我不能失信':{
 author:'佚名',
 read:[
  {p:1,s:['一个星期天，宋庆龄一家用过早餐，准备到一位朋友家去。','二女儿宋庆龄显得特别高兴，她早就盼着到这位伯伯家去了。','可是，她刚走到门口，突然停住了脚步，皱起了眉头。']},
  {p:2,s:['"爸爸，我昨天和小珍约好了，今天她来我们家，我教她叠花篮。"庆龄说。']},
  {p:3,s:['"以后再教她吧！"父亲说完，拉起庆龄的手就要走。']},
  {p:4,s:['"不行！我已经和她约好了，她来了我就得等她。"庆龄说。']},
  {p:5,s:['"不，妈妈。您说过，做人要信守诺言。如果我忘记了这件事，见到她时向她道歉是可以的，但我已经想起来了，就不能失信了！"庆龄坚定地说。']},
  {p:6,s:['"我明白了，我们的庆龄是个守信用的孩子。"妈妈望着庆龄笑了笑，说，"那你就留下来吧！"']},
  {p:7,s:['送走了爸爸妈妈，庆龄一个人回到房间里，耐心地等候着小珍。','可是，直到全家人都回来了，小珍也没有来。','妈妈心疼地说："我的女儿一个人在家，该多没意思啊！"','庆龄仰起脸回答道："一个人在家，是很没劲。可是，我并不后悔，因为我没有失信。"']}

 author:'萧红',
 read:[
  {p:1,s:['晚饭过后，火烧云上来了。','霞光照得小孩子的脸红红的。','大白狗变成红的了。','红公鸡变成金的了。','黑母鸡变成紫檀色的了。','喂猪的老头儿在墙根靠着，笑盈盈地看着他的两头小白猪变成小金猪了。']},
  {p:2,s:['这地方的火烧云变化极多，一会儿红彤彤的，一会儿金灿灿的，一会儿半紫半黄，一会儿半灰半百合色。','葡萄灰、梨黄、茄子紫，这些颜色天空都有。','还有些说也说不出来、见也没见过的颜色。']},
  {p:3,s:['一会儿，天空出现一匹马，马头向南，马尾向西。','马是跪着的，像等人骑上它的背，它才站起来似的。','过了两三秒钟，那匹马大起来了，腿伸开了，脖子也长了，尾巴却不见了。','看的人正在寻找马尾巴，那匹马变模糊了。']},
  {p:4,s:['忽然又来了一条大狗。','那条狗十分凶猛，在向前跑，后边似乎还跟着好几条小狗。','跑着跑着，小狗不知哪里去了，大狗也不见了。']},
  {p:5,s:['接着又来了一头大狮子，跟庙门前的石头狮子一模一样，也那么大，也那样蹲着，很威武很镇静地蹲着。','可是一转眼就变了，再也找不着了。']},
  {p:6,s:['一时恍恍惚惚的，天空里又像这个又像那个，其实什么也不像，什么也看不清了。','必须低下头，揉一揉眼睛，沉静一会儿再看。','可是天空偏偏不等待那些爱好它的孩子。','一会儿工夫，火烧云就下去了。']}

'23 暴风雨来临之前':{
 author:'佚名',
 read:[
  {p:1,s:['夏天的一天，天气又闷又热。','太阳像个大火球，烤得大地滚烫滚烫的。','树叶一动不动，蝉在树上不停地叫着，好像在说："热死了，热死了！"']},
  {p:2,s:['忽然，天空暗了下来，乌云从四面八方聚拢来，越聚越厚。','一阵大风刮来，树枝被吹得乱摆，地上的灰尘和纸片被卷上了天。','闪电一道接着一道，把天空照得雪亮。','雷声也由远而近，轰隆隆地响着，震得窗户嗡嗡作响。']},
  {p:3,s:['"要下雨了！"人们纷纷往家里跑。','不一会儿，豆大的雨点落了下来，打在屋顶上、玻璃上，发出噼噼啪啪的声音。','雨越下越大，像瓢泼一样，天地间挂起了一道宽大的雨帘。']},
  {p:4,s:['过了一会儿，雨渐渐小了，停了。','太阳又露出了笑脸，天边出现了一道美丽的彩虹。','树叶被雨水冲洗得干干净净，绿得发亮。','空气格外清新，人们走出家门，脸上露出了笑容。']},
  {p:5,s:['暴风雨来临之前的景象，真是又奇特又有趣。','只要我们留心观察，就能发现大自然很多的奥秘。']}
 ],

'24 我们奇妙的世界':{
 author:'彼得·西摩（英国）',
 read:[
  {p:1,s:['这是一个奇妙的世界，一切看上去都是有生命的。']},
  {p:2,s:['你看天空的珍藏——','清晨，太阳升起，带来新的一天。','开始，天空呈粉红色，慢慢地变成了蔚蓝色，太阳就像一个大火球一样升起来了。','有时，云彩在蓝色的天空中飞行，如同经过雕饰一样，呈现出各种奇妙的形状，告诉我们许多奇妙的故事……']},
  {p:3,s:['当云彩变得又黑又重时，雨点就会噼噼啪啪地降落到大地上。','雨后，我们会看到地上有许多水洼，就像有趣的镜子，映射着我们的脸。']},
  {p:4,s:['一天结束了，落日的余晖不时变幻着颜色，好像有谁在天空涂上了金色、红色和紫色。','黑夜降临了，我们看见夜空中群星闪烁，就像千千万万支极小的蜡烛在发光。']},
  {p:5,s:['再看大地的珍藏——','我们能看到植物生长的奇迹——极小的一粒种子种到地里，生根、发芽，不久就开花了，花很漂亮。','我们能看到各种水果诱人的颜色，圆润的鲜红色的樱桃，深紫色的李子，黄色的梨子。','夏日，在大树下乘凉，我们会感叹：大树带来这么多绿荫。','秋天带着金黄色的光辉神奇地到来了，那时，道路上好像洒满了光芒。','冬天，我们看到了冰雪，它们好像一把把锋利的刀剑在阳光下闪耀。']},
  {p:6,s:['是的，世界上存在的奇妙的事物是无穷的，只要我们去寻找。']}
 ],

'25 慢性子裁缝和急性子顾客':{
 author:'周锐',
 read:[
  {p:1,s:['故事发生在冬天。','裁缝店里走进一位顾客，把一卷布料放到桌上，对裁缝说："我想做件棉袄。我已经跑了三家裁缝店了。第一家说要到秋天才能做好。第二家问我有没有等到夏天的耐心。第三位师傅倒是强些，但他最早也要到开春才能交货。我可等不及，都没让他们做。告诉您，我和别的顾客不一样，我是个性子最急的顾客。请问师傅，您准备让我什么时候来取衣服——秋天？夏天？春天？……"']},
  {p:2,s:['"不，"裁缝说，"就在冬天。"']},
  {p:3,s:['急性子顾客挺纳闷："冬天？"']},
  {p:4,s:['"不对，"裁缝说，"是明年冬天。"']},
  {p:5,s:['顾客噌的一下子跳起来："这么慢啊！"']},
  {p:6,s:['裁缝慢悠悠地说："您别急，我做的活儿是最漂亮的。不过您既然性子急，我就把它改成夹袄，让您在秋天穿，怎么样？"']},
  {p:7,s:['"那太好了！"顾客满意地走了。','可是第二天，顾客又来了，说："师傅，还是改成夏天穿的短袖衬衫吧！"','第三天，顾客又来了，说："还是改成春天穿的春装吧！"']},
