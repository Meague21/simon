async function startRecSheet(t){
  const r=REC[t]||(REC[t]={ai:null});
  if(r.mr && r.mr.state==='recording'){ try{ r.mr.stop(); }catch(e){} return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(!window.MediaRecorder){ toast('当前浏览器不支持录音功能，请改用 Chrome / Edge 浏览器'); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('当前环境无法访问麦克风（请确认用 https 网址打开）'); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ const nm=(e&&e.name)||''; toast(nm==='NotAllowedError'?'麦克风权限被拒绝：请点浏览器地址栏左侧图标，把麦克风设为允许':('麦克风打开失败'+(nm?'（'+nm+'）':'')+'，请检查设备占用或浏览器设置')); return; }
  let mr=null;
  try{ const m=pickMime(); mr=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream); }
  catch(e){ try{ mr=new MediaRecorder(stream); }catch(e2){ stream.getTracks().forEach(x=>x.stop()); toast('录音组件初始化失败，请改用 Chrome / Edge 浏览器'); return; } }
  const chunks=[];
  r.mr=mr; r.recording=true; r.dur=0;
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onerror=e=>{ toast('录音出错'+(e&&e.error?('：'+e.error):'')+'，请重试'); try{ clearInterval(r.timer); mr.stop(); }catch(err){} };
  mr.onstop=()=>{
    stream.getTracks().forEach(x=>x.stop());
    if(chunks.length){ const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); REPLAY_CACHE[t]=URL.createObjectURL(blob); r.recording=false; r.mr=null; renderSheet(); toast('录音完成，点▶回放试听'); }
    else { r.recording=false; r.mr=null; renderSheet(); toast('没录到声音，请重试'); }
  };
  try{ mr.start(100); }
  catch(e){ stream.getTracks().forEach(x=>x.stop()); r.mr=null; r.recording=false; renderSheet(); toast('启动录音失败：'+(e.message||e)); return; }
  const t0=Date.now();
  r.timer=setInterval(()=>{ r.dur=(Date.now()-t0)/1000; renderSheet(); },200);
  renderSheet();
}
function doAssessSheet(text){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('当前浏览器不支持联网AI评测（请用 Chrome / Edge）'); return; }
  REC[text]=REC[text]||{};
  const rec=new SR(); rec.lang='zh-CN'; rec.interimResults=false; rec.maxAlternatives=1; let done=false;
  rec.onresult=e=>{ const txt=e.results[0][0].transcript; done=true; REC[text].ai={text:txt,score:simil(text,txt)}; renderSheet(); };
  rec.onerror=()=>{ if(!done){ REC[text].ai={text:'识别失败',score:0}; renderSheet(); toast('AI识别失败，可重录再试'); } };
  rec.onend=()=>{ if(!done){ REC[text].ai={text:'未识别到',score:0}; renderSheet(); } };
  try{ rec.start(); toast('AI聆听中，请开始朗读'); }catch(e){ REC[text].ai={text:'识别失败',score:0}; renderSheet(); }
}
function playUrl(url, btn){
  try{
    const a=new Audio(url);
    let old=null;
    if(btn){ old=btn.textContent; btn.disabled=true; btn.textContent='🔊 播放中…'; btn.classList.add('playing'); a.onended=()=>{ btn.disabled=false; btn.textContent=old; btn.classList.remove('playing'); }; }
    a.onerror=()=>{ toast('该录音格式当前浏览器无法回放，请换 Chrome / Edge'); if(btn){ btn.disabled=false; btn.textContent=old; btn.classList.remove('playing'); } };
    const p=a.play();
    if(p&&p.catch) p.catch(()=>{ toast('回放失败：请允许声音并用 Chrome / Edge'); if(btn){ btn.disabled=false; btn.textContent=old; btn.classList.remove('playing'); } });
  }catch(e){ toast('回放失败'); }
}

{t:'山行',a:'杜牧',d:'唐',lines:['远上寒山石径斜，','白云生处有人家。','停车坐爱枫林晚，','霜叶红于二月花。'],y:'沿着弯弯曲曲的石径登上深秋的山，白云生出的地方有人家居住。停下车来，是因为喜爱这傍晚的枫林，那经霜的枫叶比二月的花还要红。',x:'写深秋山行的所见所感。"霜叶红于二月花"赞美经霜的枫叶比春花更红，表达诗人对秋天的喜爱。'},
{t:'赠刘景文',a:'苏轼',d:'宋',lines:['荷尽已无擎雨盖，','菊残犹有傲霜枝。','一年好景君须记，','正是橙黄橘绿时。'],y:'荷花凋谢，连擎雨的荷叶也枯萎了；菊花残败，却还有傲霜的枝条。一年中最好的光景你要记住，正是橙子金黄、橘子青绿的时节。',x:'诗写秋末冬初的景色，用"橙黄橘绿"赞美这是一年中最好的光景，勉励朋友要乐观向上。'},
{t:'夜书所见',a:'叶绍翁',d:'宋',lines:['萧萧梧叶送寒声，','江上秋风动客情。','知有儿童挑促织，','夜深篱落一灯明。'],y:'萧萧秋风吹动梧桐叶，送来阵阵寒意，江上的秋风触动了游子的思乡之情。料想是孩子们在捉蟋蟀，因为夜深了篱笆下还亮着一盏灯。',x:'写秋夜所见。用儿童捉蟋蟀的欢乐，反衬诗人的思乡之情。'},
{t:'望天门山',a:'李白',d:'唐',lines:['天门中断楚江开，','碧水东流至此回。','两岸青山相对出，','孤帆一片日边来。'],y:'天门山被长江从中间断开，碧绿的江水向东流到这里回旋。两岸青山相对耸立，一叶孤舟从日边驶来。',x:'写长江流经天门山的壮阔景象。"两岸青山相对出，孤帆一片日边来"气势雄伟，画面感强。'},
{t:'饮湖上初晴后雨',a:'苏轼',d:'宋',lines:['水光潋滟晴方好，','山色空蒙雨亦奇。','欲把西湖比西子，','淡妆浓抹总相宜。'],y:'晴天，西湖水波荡漾，光彩熠熠；雨天，山色迷蒙，也别有一番奇妙。若把西湖比作美女西施，无论淡妆浓抹都那样合适美丽。',x:'把西湖比作西施，是写西湖的绝妙比喻。无论晴雨，西湖都美，表达对西湖的喜爱。'},
{t:'望洞庭',a:'刘禹锡',d:'唐',lines:['湖光秋月两相和，','潭面无风镜未磨。','遥望洞庭山水翠，','白银盘里一青螺。'],y:'洞庭湖的水光与秋月交相辉映，湖面平静得像一面没有打磨的镜子。远远望去，洞庭山水一片翠绿，好像白银盘里托着一枚青螺。',x:'把洞庭湖比作白银盘，把君山比作青螺，比喻新奇，写出洞庭湖的秀美。'},
{t:'早发白帝城',a:'李白',d:'唐',lines:['朝辞白帝彩云间，','千里江陵一日还。','两岸猿声啼不住，','轻舟已过万重山。'],y:'清晨告别彩云缭绕的白帝城，千里之外的江陵一天就能到达。两岸猿猴的啼声不断，轻快的小舟已经驶过了万重青山。',x:'写船行之快，表达诗人遇赦后轻松喜悦的心情。"轻舟已过万重山"是千古名句。'},
{t:'采莲曲',a:'王昌龄',d:'唐',lines:['荷叶罗裙一色裁，','芙蓉向脸两边开。','乱入池中看不见，','闻歌始觉有人来。'],y:'采莲女的绿罗裙和荷叶一个颜色，荷花朝着她们的脸庞两边盛开。她们混入莲池中不见了踪影，听到歌声才发觉有人来。',x:'写采莲女与荷花融为一体，不直接写人，却处处写人，构思巧妙，充满生活气息。'}
]},
{g:'四年级',list:[
{t:'暮江吟',a:'白居易',d:'唐',lines:['一道残阳铺水中，','半江瑟瑟半江红。','可怜九月初三夜，','露似真珠月似弓。'],y:'一道残阳铺在江面上，江水一半碧绿一半艳红。最可爱的是九月初三的夜晚，露水像珍珠，月亮像弯弓。',x:'写秋天傍晚到夜晚的江边美景。用比喻把露珠比作珍珠、月亮比作弯弓，画面优美。'},
{t:'题西林壁',a:'苏轼',d:'宋',lines:['横看成岭侧成峰，','远近高低各不同。','不识庐山真面目，','只缘身在此山中。'],y:'横着看是连绵的山岭，侧着看是陡峭的山峰，从远近高低各处看，样子各不相同。看不清庐山的真面目，只因为自己就在这座山中。',x:'后两句蕴含深刻哲理：身在其中，反而看不清事物的全貌。告诉我们要客观、全面地看问题。'},
{t:'雪梅',a:'卢钺',d:'宋',lines:['梅雪争春未肯降，','骚人阁笔费评章。','梅须逊雪三分白，','雪却输梅一段香。'],y:'梅花和雪花争春，谁也不肯服输，文人墨客放下笔，难以评判。梅花比起雪花要逊色三分洁白，雪花却输给梅花一段清香。',x:'写梅和雪各有所长：梅有香，雪白。告诉我们人和事物各有长处，要互相学习。'},
{t:'出塞',a:'王昌龄',d:'唐',lines:['秦时明月汉时关，','万里长征人未还。','但使龙城飞将在，','不教胡马度阴山。'],y:'还是秦汉时的明月和边关，远征万里的将士还没有回来。只要有像李广那样的飞将军在，就不会让敌人的战马越过阴山。',x:'这是一首边塞诗，表达诗人希望有良将守边、平息战争、让人民安居乐业的愿望。'},
{t:'凉州词',a:'王翰',d:'唐',lines:['葡萄美酒夜光杯，','欲饮琵琶马上催。','醉卧沙场君莫笑，','古来征战几人回？'],y:'葡萄美酒盛在夜光杯里，正要畅饮，马上响起了催人出征的琵琶声。如果我醉卧在沙场上，请你不要笑话，自古以来出征打仗的有几个人能回来？',x:'写边塞将士出征前豪饮的情景，表现将士们豪放、豪迈的气概。'},
{t:'夏日绝句',a:'李清照',d:'宋',lines:['生当作人杰，','死亦为鬼雄。','至今思项羽，','不肯过江东。'],y:'活着就要做人中的豪杰，死了也要成为鬼中的英雄。直到今天人们还在怀念项羽，因为他宁可战死也不肯逃回江东。',x:'借歌颂项羽宁死不屈，表达诗人的爱国情怀和宁死不屈的气节。'},
{t:'别董大',a:'高适',d:'唐',lines:['千里黄云白日曛，','北风吹雁雪纷纷。','莫愁前路无知己，','天下谁人不识君。'],y:'漫天的黄云遮天蔽日，北风吹着大雁，大雪纷纷。不要担心前面的路上没有知己，天下有谁不认识您呢？',x:'这是一首送别诗。后两句"莫愁前路无知己，天下谁人不识君"是对朋友的安慰和鼓励，豪迈感人。'}
]},
{g:'五年级',list:[
{t:'示儿',a:'陆游',d:'宋',lines:['死去元知万事空，','但悲不见九州同。','王师北定中原日，','家祭无忘告乃翁。'],y:'本来就知道人死后万事皆空，只是悲痛看不到国家统一。等到朝廷的军队收复中原的那一天，祭祀时千万不要忘记告诉你的父亲。',x:'这是陆游的绝笔诗。表达诗人至死不忘国家统一、渴望收复失地的强烈爱国之情。'},
{t:'题临安邸',a:'林升',d:'宋',lines:['山外青山楼外楼，','西湖歌舞几时休？','暖风熏得游人醉，','直把杭州作汴州。'],y:'青山之外还有青山，高楼之外还有高楼，西湖的歌舞什么时候才能停止？暖风把游人们吹得醉醺醺，简直把杭州当成了汴州。',x:'讽刺南宋统治者不思收复失地，只顾在杭州寻欢作乐，表达诗人的忧国之情。'},
{t:'己亥杂诗',a:'龚自珍',d:'清',lines:['浩荡离愁白日斜，','吟鞭东指即天涯。','落红不是无情物，','化作春泥更护花。'],y:'满怀离愁，正对着夕阳西下，挥鞭东去，从此便是要到天涯。落花不是无情的东西，它化作春天的泥土，更能滋养花朵。',x:'后两句"落红不是无情物，化作春泥更护花"以落花自喻，表达诗人虽然辞官离京，仍愿为国效力的奉献精神。'},
{t:'山居秋暝',a:'王维',d:'唐',lines:['空山新雨后，','天气晚来秋。','明月松间照，','清泉石上流。','竹喧归浣女，','莲动下渔舟。','随意春芳歇，','王孙自可留。'],y:'空旷的群山刚下过一场雨，夜晚的天气带着秋天的凉意。明月照着松林，清泉在山石上流淌。竹林里传来喧笑声，那是洗衣的女子归来；莲叶摇动，是渔船顺流而下。任凭春天的花草凋谢，秋天的山中景色依然值得留恋。',x:'写秋天雨后山中的清幽美景。"明月松间照，清泉石上流"是千古名句，诗中有画，画中有诗。'},
{t:'枫桥夜泊',a:'张继',d:'唐',lines:['月落乌啼霜满天，','江枫渔火对愁眠。','姑苏城外寒山寺，','夜半钟声到客船。'],y:'月亮落下，乌鸦啼叫，寒霜满天，对着江边的枫树和渔家的灯火，满怀忧愁难以入眠。姑苏城外的寒山寺，半夜的钟声传到了客船上。',x:'写秋夜江边的景色和诗人的羁旅愁思。用月落、乌啼、霜天、渔火、钟声，营造出清冷孤寂的意境。'},
{t:'长相思',a:'纳兰性德',d:'清',lines:['山一程，水一程，','身向榆关那畔行，','夜深千帐灯。','风一更，雪一更，','聒碎乡心梦不成，','故园无此声。'],y:'翻过一座座山，涉过一道道水，向着山海关那边行进，夜深了，千万个帐篷里都点起了灯。风一阵阵地刮，雪一阵阵地下，嘈杂的声音打碎了思乡的梦，家乡可没有这样的声音啊。',x:'这是一首词。写将士们行军途中的艰辛和浓浓的思乡之情。'},
{t:'乞巧',a:'林杰',d:'唐',lines:['七夕今宵看碧霄，','牵牛织女渡河桥。','家家乞巧望秋月，','穿尽红丝几万条。'],y:'七夕的夜晚仰望碧蓝的天空，牵牛和织女正渡过银河相会。家家户户都在秋月下乞巧，穿过的红丝线有几万条之多。',x:'写七夕节人们乞巧的习俗，表达人们对美好生活的向往。'},
{t:'蝉',a:'虞世南',d:'唐',lines:['垂緌饮清露，','流响出疏桐。','居高声自远，','非是藉秋风。'],y:'蝉垂下触须吸饮清甜的露水，清脆的鸣声从稀疏的梧桐树间传出。它站在高处，声音自然传得远，并不是凭借秋风的力量。',x:'这是一首咏物诗。借蝉"居高声自远"，表达品格高洁的人，不需要外在的凭借，自能声名远播。'}
]},
{g:'六年级',list:[
{t:'七律·长征',a:'毛泽东',d:'近代',lines:['红军不怕远征难，','万水千山只等闲。','五岭逶迤腾细浪，','乌蒙磅礴走泥丸。','金沙水拍云崖暖，','大渡桥横铁索寒。','更喜岷山千里雪，','三军过后尽开颜。'],y:'红军不怕长征的艰难，把万水千山看作平常的事。五岭山脉绵延起伏，在红军看来像翻腾的细小波浪；乌蒙山气势磅礴，在红军眼里像滚动的小泥丸。金沙江的波浪拍打着高耸的山崖，让人感到温暖；大渡河上的铁索桥横架着，让人心生寒意。更令人欣喜的是岷山的千里积雪，红军翻过之后个个笑逐颜开。',x:'这首诗高度概括了红军长征的艰难历程，表现红军不畏艰险、英勇顽强的英雄气概和革命乐观主义精神。'},
{t:'宿建德江',a:'孟浩然',d:'唐',lines:['移舟泊烟渚，','日暮客愁新。','野旷天低树，','江清月近人。'],y:'把小船停靠在烟雾迷蒙的小洲边，日暮时分，游子的愁绪又涌上心头。原野空旷，远处的天空显得比树还低；江水清澈，月亮倒映水中，仿佛与人亲近。',x:'写旅途中夜宿江上的所见所感。"野旷天低树，江清月近人"以景写情，表达游子的孤寂与愁思。'},
{t:'六月二十七日望湖楼醉书',a:'苏轼',d:'宋',lines:['黑云翻墨未遮山，','白雨跳珠乱入船。','卷地风来忽吹散，','望湖楼下水如天。'],y:'黑云像打翻的墨汁，还没来得及遮住山，白花花的雨点就像跳动的珍珠，乱纷纷地打进船里。忽然一阵大风卷地而来，把云雨吹散了，望湖楼下的湖水像天空一样明净。',x:'写西湖夏日骤雨骤晴的奇景。用"翻墨""跳珠"比喻云和雨，生动形象，写出雨的急促和雨后的明净。'},
{t:'西江月·夜行黄沙道中',a:'辛弃疾',d:'宋',lines:['明月别枝惊鹊，','清风半夜鸣蝉。','稻花香里说丰年，','听取蛙声一片。','七八个星天外，','两三点雨山前。','旧时茅店社林边，','路转溪桥忽见。'],y:'明亮的月光惊起了枝头的喜鹊，清凉的夜风送来了蝉的鸣叫。稻花飘香，人们谈论着丰收的年景，耳边传来一片蛙声。天边有七八颗星星，山前落下两三点雨。从前土地庙旁边的茅草小店，转过溪上的小桥忽然就出现了。',x:'这是一首词。写夏夜行走在乡村路上的所见所闻，稻香、蛙声、星光、细雨，充满乡村生活气息，表达丰收在望的喜悦。'},
{t:'浪淘沙（其一）',a:'刘禹锡',d:'唐',lines:['九曲黄河万里沙，','浪淘风簸自天涯。','如今直上银河去，','同到牵牛织女家。'],y:'弯弯曲曲的黄河夹带着万里泥沙，波涛翻滚，大风颠簸，仿佛来自天涯。如今好像可以直上银河，一同到达牛郎织女的家。',x:'写黄河的雄伟气势，并展开奇特想象，要直上银河到牵牛织女家，表现出豪迈的气概。'},
{t:'江南春',a:'杜牧',d:'唐',lines:['千里莺啼绿映红，','水村山郭酒旗风。','南朝四百八十寺，','多少楼台烟雨中。'],y:'千里江南，处处莺歌燕舞，绿树掩映着红花；水边的村庄、依山的城郭，酒旗在风中招展。南朝遗留下的四百八十多座古寺，有多少楼台都笼罩在迷蒙的烟雨之中。',x:'写江南春天的美丽景色。有声有色，有山有水，还有烟雨中的古寺，画面辽阔而朦胧。'},
{t:'书湖阴先生壁',a:'王安石',d:'宋',lines:['茅檐长扫净无苔，','花木成畦手自栽。','一水护田将绿绕，','两山排闼送青来。'],y:'茅草房庭院经常打扫，洁净得没有一丝青苔，花草树木成行成垄，都是主人亲手栽种。庭院外一条小河环绕着碧绿的田地，两座青山推开门，把青翠的山色送进来。',x:'写湖阴先生庭院的清幽和周围山水的美丽。"一水护田""两山排闼"用拟人手法，把山水写得有情有义。'},
{t:'马诗',a:'李贺',d:'唐',lines:['大漠沙如雪，','燕山月似钩。','何当金络脑，','快走踏清秋。'],y:'塞外大漠的沙在月光下像雪一样白，燕山上空的月亮像一把弯钩。什么时候才能戴上贵重的笼头，在秋高气爽的疆场上奔驰？',x:'这是一首咏物诗，借马喻人。借马盼望戴上笼头、驰骋疆场，表达诗人渴望建功立业、施展抱负的愿望。'},
{t:'石灰吟',a:'于谦',d:'明',lines:['千锤万凿出深山，','烈火焚烧若等闲。','粉骨碎身浑不怕，','要留清白在人间。'],y:'经过千万次锤打从深山里开采出来，把烈火的焚烧看得平平常常。即使粉身碎骨也毫不惧怕，只要能把清白留在人间。',x:'这是一首咏物诗，借石灰自喻。表达诗人不怕艰难、坚贞不屈，要保持清白品格的高尚情操。'},

// ===== v2.9 多用户系统 + 学习行为明细 =====
// USYS：单机多用户。每个用户独立保存课文进度、学习统计、积分、行为明细。
const USYS=(function(){
  const UKEY='xyt_users_v1';
  let users={list:[],cur:''};
  function loadUsers(){ try{ users=JSON.parse(localStorage.getItem(UKEY)||'null')||{list:[],cur:''}; }catch(e){ users={list:[],cur:''}; } }
  function saveUsers(){ try{ localStorage.setItem(UKEY,JSON.stringify(users)); }catch(e){} }
  function key(k){ return 'xyt_u_'+users.cur+'_'+k; }
  function migrate(baseKeys){
    // 首次使用：把旧的无前缀数据迁移给默认用户
    baseKeys.forEach(k=>{
      const old=localStorage.getItem(k); const nk=key(k);
      if(old!==null && localStorage.getItem(nk)===null){ try{ localStorage.setItem(nk,old); }catch(e){} }
    });
  }
  function applyKeys(){
    K_LESSONS=key('wb_yuwen_lessons_v6');
    K_PROGRESS=key('wb_yuwen_progress_v4');
    K_STATS=key('wb_yuwen_stats_v2');
  }
  function init(){
    loadUsers();
    if(!users.list.length){
      users.list.push({id:'u'+Date.now(),name:'小书童',emoji:'📖',createdAt:Date.now()});
      users.cur=users.list[0].id;
      applyKeys();
      migrate(['wb_yuwen_lessons_v6','wb_yuwen_progress_v4','wb_yuwen_stats_v2','xyt_pts_v1','xyt_trace_v1']);
      saveUsers();
    } else {
      if(!users.list.find(u=>u.id===users.cur)) users.cur=users.list[0].id;
      applyKeys(); saveUsers();
    }
  }
  function cur(){ return users.list.find(u=>u.id===users.cur)||users.list[0]; }
  return {
    init, key, applyKeys, cur,
    list(){ return users.list; },
    create(name,emoji){ const u={id:'u'+Date.now(),name:name||('学员'+(users.list.length+1)),emoji:emoji||'🙂',createdAt:Date.now()}; users.list.push(u); saveUsers(); return u; },
    remove(id){ if(users.list.length<=1) return false; users.list=users.list.filter(u=>u.id!==id); ['wb_yuwen_lessons_v6','wb_yuwen_progress_v4','wb_yuwen_stats_v2','xyt_pts_v1','xyt_trace_v1'].forEach(k=>{ try{ localStorage.removeItem('xyt_u_'+id+'_'+k); }catch(e){} }); if(users.cur===id) users.cur=users.list[0].id; saveUsers(); return true; },
    rename(id,name){ const u=users.list.find(x=>x.id===id); if(u&&name){ u.name=name; saveUsers(); } },
    switchTo(id){ users.cur=id; saveUsers(); applyKeys(); }
  };
})();
// TRACE：学习行为明细——记录在哪个功能/课文停留多久，为积分提供依据
const TRACE=(function(){
  let st={segs:[]}; let prev=null; let lastMilestone=0;
  function load(){ try{ st=JSON.parse(localStorage.getItem(USYS.key('xyt_trace_v1'))||'null')||{segs:[]}; }catch(e){ st={segs:[]}; }
    lastMilestone=Math.floor((todayMin())/5); }
  function save(){ try{ localStorage.setItem(USYS.key('xyt_trace_v1'),JSON.stringify(st)); }catch(e){} }
  function todayMin(){ const d=new Date(); const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); let s=0; st.segs.forEach(x=>{ if(x.day===k) s+=x.dur; }); return s/60; }
  function secLabel(page,sec){
    if(page==='home') return '首页';
    const M={read:'跟读',words:'字词',study:'精读',train:'训练',tingxie:'听写默写',games:'趣学游戏',reading:'快乐读书吧',chen:'晨读'};
    return M[sec]||sec;
  }
  function end(){
    if(!prev) return;
    const dur=Math.round((Date.now()-prev.start)/1000);
    if(dur>=5){
      const d=new Date(); const day=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      st.segs.push({t:prev.start,day,page:prev.page,sec:prev.sec,lesson:prev.lesson,dur});
      if(st.segs.length>400) st.segs=st.segs.slice(-400);
      save();
      // 每满 5 分钟学习时长奖励 1 积分（积分依据之一）
      const m=Math.floor(todayMin()/5);
      if(m>lastMilestone&&typeof PTS!=='undefined'&&PTS){ PTS.add(1,'学习时长奖励'); lastMilestone=m; }
    }
    prev=null;
  }
  function begin(){ prev={page:(typeof PAGE!=='undefined')?PAGE:'',sec:(typeof SEC!=='undefined')?SEC:'',lesson:(typeof CUR!=='undefined')?CUR:'',start:Date.now()}; }
  function today(){ const d=new Date(); const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); return st.segs.filter(x=>x.day===k); }
  return {load,save,end,begin,today,secLabel,reload(){ load(); }};
})();
function openUsers(){

  let h=`<h3>👤 用户管理 <span class="tag">单机本地保存</span></h3>
   <div class="cbhint">每个用户独立保存学习进度、积分和行为明细。数据存在本机浏览器里，切换用户不会互相影响。</div>`;
  h+=list.map(u=>`<div class="userrow ${u.id===c.id?'cur':''}">
     <span class="uemoji">${u.emoji}</span><b>${esc(u.name)}</b>${u.id===c.id?'<span class="tag">当前</span>':''}

       ${u.id!==c.id?`<button class="mini" data-sw="${u.id}">切换</button>`:''}
       <button class="mini" data-rn="${u.id}">改名</button>
       ${list.length>1?`<button class="mini" data-del="${u.id}">删除</button>`:''}
     </span></div>`).join('');
  h+=`<div class="subh">新建用户</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
     <input id="nuName" placeholder="输入名字（如：小明）" style="flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:10px">
     <select id="nuEmoji" style="padding:8px;border:1px solid var(--line);border-radius:10px">
       ${['🙂','😎','🦄','🐯','🐼','🌟','🚀','🌸'].map(e=>`<option>${e}</option>`).join('')}
     </select>
     <button class="btn primary sm" id="nuAdd">＋创建</button>
   </div>
   <div class="grow" style="margin-top:10px"><button class="btn" onclick="closeModal()">关闭</button></div>`;
  openModal(h);
  document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{
    try{ save(); saveStats(); }catch(e){}
    USYS.switchTo(b.dataset.sw); load(); loadStats(); if(typeof PTS!=='undefined'&&PTS&&PTS._reload) PTS._reload(); TRACE.reload();
    buildNav(); CUR=''; render(); syncUserName(); closeModal(); toast('已切换用户：'+USYS.cur().name);
  });
  document.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>{
    const nm=prompt('输入新名字：'); if(nm&&nm.trim()){ USYS.rename(b.dataset.rn,nm.trim()); openUsers(); }
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(confirm('删除该用户后，这个用户的学习记录、积分都会被清除，确定吗？')){ USYS.remove(b.dataset.del); openUsers(); }
  });
  $('#nuAdd').onclick=()=>{
    const nm=$('#nuName').value.trim(); const em=$('#nuEmoji').value;
    const u=USYS.create(nm,em);
    try{ save(); saveStats(); }catch(e){}
    USYS.switchTo(u.id); load(); loadStats(); if(typeof PTS!=='undefined'&&PTS&&PTS._reload) PTS._reload(); TRACE.reload();
    buildNav(); CUR=''; render(); syncUserName(); closeModal(); toast('已创建并切换到：'+u.name);
  };
}

function openTrace(){
  const segs=TRACE.today();
  const total=segs.reduce((s,x)=>s+x.dur,0);
  const byFn={};
  segs.forEach(x=>{ const k=TRACE.secLabel(x.page,x.sec); byFn[k]=(byFn[k]||0)+x.dur; });
  const pts=(typeof PTS!=='undefined'&&PTS)?PTS.balance():null;
  let h=`<h3>📊 学习行为明细 <span class="tag">今日</span></h3>
   <div class="statrow">
     <div class="stat"><b>${Math.round(total/60)}</b><span>今日分钟</span></div>
     <div class="stat"><b>${segs.length}</b><span>学习次数</span></div>
     <div class="stat"><b>${pts?pts.today+'/'+pts.cap:'-'}</b><span>今日积分/上限</span></div>
   </div>
   <div class="cbhint">积分来源：跟读、字词、做题、打卡等学习行为 + 每学满 5 分钟奖励 1 分（每日上限 ${pts?pts.cap:40} 分）。</div>`;
  const fnKeys=Object.keys(byFn).sort((a,b)=>byFn[b]-byFn[a]);
  if(fnKeys.length){
    h+=`<div class="subh">各功能用时</div>`+fnKeys.map(k=>{
      const pct=Math.round(byFn[k]/Math.max(1,total)*100);
      return `<div class="ritem" style="display:flex;justify-content:space-between"><span>${k}</span><span><b>${Math.round(byFn[k]/60)}</b> 分钟（${pct}%）</span></div>`;
    }).join('');
  }
  h+=`<div class="subh">最近学习记录</div>`;
  if(segs.length){
    h+=segs.slice(-15).reverse().map(x=>{
      const d=new Date(x.t); const ts=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      const L=LESSONS.find(l=>l.id===x.lesson);
      return `<div class="ritem" style="display:flex;justify-content:space-between;gap:8px"><span>${ts} · ${esc(TRACE.secLabel(x.page,x.sec))}${L?' · '+esc(L.title):''}</span><b>${x.dur>=60?Math.round(x.dur/60)+'分钟':x.dur+'秒'}</b></div>`;
    }).join('');
  } else h+=`<div class="cbhint">今天还没有记录，去学习吧～</div>`;
  h+=`<div class="grow" style="margin-top:10px"><button class="btn" onclick="closeModal()">关闭</button></div>`;
  openModal(h);
}

{g:'六年级',t:'学弈',src:'《孟子》',lines:['弈秋，通国之善弈者也。','使弈秋诲二人弈，','其一人专心致志，','惟弈秋之为听；','一人虽听之，','一心以为有鸿鹄将至，','思援弓缴而射之。','虽与之俱学，弗若之矣。','为是其智弗若与？','曰：非然也。'],y:'弈秋是全国最擅长下棋的人。让他教两个人下棋，其中一个人专心致志，只听弈秋的教导；另一个人虽然也在听，心里却想着有天鹅要飞来，想要拉弓搭箭去射它。虽然他同前一个人一起学习，却学得不如人家。是因为他的智力不如人家吗？回答说：不是这样的。',x:'学习必须专心致志，不可三心二意。同样的老师、同样的条件，学习态度不同，结果就不同。'},
{g:'六年级',t:'两小儿辩日',src:'《列子》',lines:['孔子东游，见两小儿辩斗，','问其故。一儿曰：','"我以日始出时去人近，','而日中时远也。"','一儿曰："我以日初出远，','而日中时近也。"','一儿曰："日初出大如车盖，','及日中则如盘盂，','此不为远者小而近者大乎？"','一儿曰："日初出沧沧凉凉，','及其日中如探汤，','此不为近者热而远者凉乎？"','孔子不能决也。','两小儿笑曰：','"孰为汝多知乎？"'],y:'孔子到东方游历，看见两个小孩在争辩，就问他们原因。一个小孩说："我认为太阳刚出来时离人近，中午时离人远。"另一个小孩说："我认为太阳刚出来时离人远，中午时离人近。"一个小孩说："太阳刚出来时大得像车盖，到了中午就像盘盂，这不是远的显得小、近的显得大吗？"另一个小孩说："太阳刚出来时凉飕飕的，到了中午就像把手伸进热水里，这不是近的觉得热、远的觉得凉吗？"孔子也不能判断谁对谁错。两个小孩笑着说："谁说你知道得多呢？"',x:'两个小孩善于观察、大胆质疑，孔子实事求是、"知之为知之"。学无止境，认识自然需要不断探索。'}

// ===== v2.8 积分养成系统（参照烧脑数学：积分获取 + 每日上限 + 明细 + 领养宠物养成）=====
const PTS_CAP=40; // 每日积分上限（防沉迷）
const PTS=(function(){
  let KEY=(typeof USYS!=='undefined')?USYS.key('xyt_pts_v1'):'xyt_pts_v1';
  function dayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||def(); }catch(e){ return def(); } }
  function def(){ return {points:0,total:0,byDay:{},ledger:[],owned:[],startedAt:Date.now()}; }
  function save(s){ try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){} }
  let st=load();
  function todayEarned(){ return (st.byDay[dayKey()]||0); }
  function add(n,reason){
    const t=dayKey(); const earned=st.byDay[t]||0;
    if(earned>=PTS_CAP) return 0;
    const addv=Math.min(n,PTS_CAP-earned);
    st.byDay[t]=(st.byDay[t]||0)+addv;
    st.points=Math.round((st.points+addv)*10)/10;
    st.total=Math.round((st.total+addv)*10)/10;
    st.ledger.unshift({t:Date.now(),n:addv,r:reason||'学习'});
    if(st.ledger.length>120) st.ledger=st.ledger.slice(0,120);
    save(st); return addv;
  }
  function spend(n,reason){
    if(st.points<n) return false;
    st.points=Math.round((st.points-n)*10)/10;
    st.ledger.unshift({t:Date.now(),n:-n,r:reason||'兑换'});
    save(st); return true;
  }
  function balance(){ return {points:st.points,total:st.total,today:todayEarned(),cap:PTS_CAP}; }
  function ledger(){ return st.ledger; }
  function owned(){ return st.owned; }
  function adopt(item){ st.owned.push({id:item.id,name:item.name,emoji:item.emoji,stage:0,acc:Date.now()}); save(st); }
  function feed(id){ const o=st.owned.find(x=>x.id===id); if(o&&o.stage<4){ o.stage++; save(st); return true;} return false; }
  function _reload(){ KEY=(typeof USYS!=='undefined')?USYS.key('xyt_pts_v1'):'xyt_pts_v1'; st=load(); }
  return {add,spend,balance,ledger,owned,adopt,feed,CAP:PTS_CAP,_reload};
})();

function openGarden(){
  const pts=PTS.balance(); const owned=PTS.owned();
  let h=`<h3>🐣 我的家园 <span class="tag">积分 ${pts.points}</span></h3>
    <div class="cbhint">学习得积分，用积分领养小动物、种花草，喂养它们长大。每日积分上限 ${PTS_CAP} 分。</div>`;
  h+=`<div class="subh">我的伙伴（${owned.length}）</div>`;
  if(owned.length){
    h+=`<div class="funcgrid">`+owned.map(o=>{
      const def=GARDEN_PETS.find(p=>p.id===o.id); const stg=o.stage||0;
      return `<div class="funccard owned-pet" data-pet="${o.id}"><div class="ficon" style="font-size:26px;background:#fff7ec">${def?def.stages[stg]:'🐾'}</div><div class="fname">${o.name}</div><div class="p" style="font-size:10px;color:var(--sub)">${def?def.names[stg]:''} · 点我喂养(5分)</div></div>`;
    }).join('')+`</div>`;
  } else h+=`<div class="cbhint">还没有伙伴，去领养一个吧！</div>`;
  h+=`<div class="subh">领养中心</div><div class="funcgrid">`+GARDEN_PETS.map(p=>{
    const ownedIds=owned.map(o=>o.id); const isOwned=ownedIds.includes(p.id);
    return `<div class="funccard adopt-pet" data-adopt="${p.id}" style="${isOwned?'opacity:.4':''}"><div class="ficon" style="font-size:26px;background:#f0f7ff">${p.emoji}</div><div class="fname">${p.name}</div><div class="p" style="font-size:10px;color:var(--sub)">${isOwned?'已领养':p.cost+' 积分领养'}</div></div>`;
  }).join('')+`</div>
    <div class="grow" style="margin-top:10px"><button class="btn" onclick="closeModal()">关闭</button></div>`;
  openModal(h);
  document.querySelectorAll('.adopt-pet').forEach(c=>c.onclick=()=>{
    const p=GARDEN_PETS.find(x=>x.id===c.dataset.adopt);
    if(PTS.owned().some(o=>o.id===p.id)){ toast('已经领养过啦'); return; }
    if(PTS.spend(p.cost,'领养'+p.name)){ PTS.adopt(p); toast('领养成功：'+p.name); openGarden(); }
    else toast('积分不足，需要 '+p.cost+' 分');
  });
  document.querySelectorAll('.owned-pet').forEach(c=>c.onclick=()=>{
    const id=c.dataset.pet;
    if(PTS.spend(5,'喂养'+id)){ if(PTS.feed(id)) toast('喂养成功，长大了一点！'); openGarden(); }
    else toast('积分不足，喂养需要 5 分');
  });
}
function openLedger(){
  const pts=PTS.balance(); const led=PTS.ledger();
  let h=`<h3>📒 积分明细 <span class="tag">余额 ${pts.points}</span></h3>
    <div class="statrow"><div class="stat"><b>${pts.points}</b><span>当前积分</span></div><div class="stat"><b>${pts.total}</b><span>累计获得</span></div><div class="stat"><b>${pts.today}/${pts.cap}</b><span>今日/上限</span></div></div>`;
  if(led.length){

function monthCheckinCount(){ const y=HOME_MONTH.y,m=HOME_MONTH.m; return Object.keys(STATS.checkins).filter(k=>k.startsWith(y+'-'+(m+1)+'-')).length; }
function renderCal(){
  const y=HOME_MONTH.y, m=HOME_MONTH.m;
  const first=new Date(y,m,1).getDay(); const days=new Date(y,m+1,0).getDate();
  const t=todayStr(); let cells='';
  for(let i=0;i<first;i++) cells+='<div class="calcell empty"></div>';
  for(let dd=1;dd<=days;dd++){ const k=y+'-'+(m+1)+'-'+dd; const ck=!!STATS.checkins[k]; const isToday=(k===t); cells+=`<div class="calcell${ck?' ck':''}${isToday?' today':''}" data-day="${k}">${dd}</div>`; }
  const labels=['日','一','二','三','四','五','六'];
  return `<div class="calgrid"><div class="calrow">${labels.map(x=>'<span>'+x+'</span>').join('')}</div>${cells}</div>`;
}
function renderWeekBars(){
  const d=new Date(); const days=[];
  for(let i=6;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); const k=x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); days.push({k, min:Math.round((STATS.days[k]?STATS.days[k].sec:0)/60)}); }
  const max=Math.max(1,...days.map(x=>x.min));
  const bw=22, gap=8, h=58; const W=days.length*(bw+gap);
  const bars=days.map((x,i)=>{ const bh=Math.max(3,Math.round((x.min/max)*(h-20))); const bx=i*(bw+gap); const lab=x.k.slice(5); return `<rect x="${bx}" y="${h-16-bh}" width="${bw}" height="${bh}" rx="4" fill="#e8543f"></rect><text x="${bx+bw/2}" y="${h-4}" font-size="9" text-anchor="middle" fill="#9aa">${lab}</text><text x="${bx+bw/2}" y="${h-18-bh}" font-size="8" text-anchor="middle" fill="#666">${x.min}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" style="max-width:300px;display:block;margin:4px auto">${bars}</svg>`;
}

const TRAIN_CATS=['基础','拼音','填空','判断','句式','课内阅读','课外阅读'];
function renderTrain(){
  const L=curLesson();
  const chips=['全部',...TRAIN_CATS].map(c=>`<div class="chip ${trainFilter===c?'active':''}" data-filter="${c}">${c}</div>`).join('');
  return `<div class="card"><h3>专项训练 <span class="tag">${esc(L.title)}</span></h3>
    <div class="train-head">${chips}<button class="btn primary" id="btnDraw">🎲 随机出题</button></div>
    <div id="trainBody"><div class="empty">点上方题型可直接练习，或点「随机出题」混合抽题。<br>支持基础/拼音/填空/判断/句式/课内·课外阅读。</div></div></div>`;
}
function gatherQuestions(L,filter){ const t=L.train||{}; let pool=[]; (filter==='全部'?TRAIN_CATS:[filter]).forEach(c=>(t[c]||[]).forEach(q=>pool.push(Object.assign({cat:c},q)))); return pool; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function selectFilter(f){ trainFilter=f; trainState=null; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.filter===f)); drawTrain(); }
function drawTrain(){
  const L=curLesson(); if(!L) return;
  const pool=gatherQuestions(L,trainFilter); const body=$('#trainBody');
  if(!pool.length){ toast('该题型暂无题目，去「随机出题」或切换题型试试'); if(body)body.innerHTML='<div class="empty">该题型暂无题目。</div>'; return; }
  const n=Math.min(pool.length, trainFilter==='全部'?8:6);
  trainState={qs:shuffle(pool).slice(0,n), ans:Array.from({length:n},()=>null), locked:false, score:0};
  renderTrainBody();
}
function renderTrainBody(){
  const body=$('#trainBody'); if(!body||!trainState) return; const qs=trainState.qs; let h='';
  if(trainState.locked){ const right=qs.filter((q,i)=>isCorrect(q,trainState.ans[i])).length; const pct=Math.round(right/qs.length*100); h+=`<div class="scorebox"><div class="n">${pct}分</div><div>答对 ${right} / ${qs.length} 题</div></div>`; }
  qs.forEach((q,i)=>h+=renderQuestion(q,i));
  if(!trainState.locked) h+=`<div style="text-align:center;margin-top:6px"><button class="btn primary" id="btnSubmit">交卷并看解析</button></div>`;
  else h+=`<div style="text-align:center;margin-top:6px"><button class="btn primary" id="btnRedo">再做一次</button></div>`;
  body.innerHTML=h; bindTrain();
  if(trainState.locked && $('.scorebox')) $('.scorebox').scrollIntoView({behavior:'smooth',block:'center'});
}
function renderQuestion(q,i){
  const ans=trainState.ans[i]; let inner='';
  if(q.type==='fill') inner=`<input class="qfill" data-i="${i}" placeholder="输入答案" value="${ans&&typeof ans==='string'?esc(ans):''}">`;
  else if(q.type==='judge') inner=`<div class="opts"><div class="opt ${ans===true?'sel':''}" data-i="${i}" data-v="1">✔ 正确</div><div class="opt ${ans===false?'sel':''}" data-i="${i}" data-v="0">✘ 错误</div></div>`;
  else if(q.type==='choice') inner=`<div class="opts">${q.options.map((o,oi)=>`<div class="opt ${ans===oi?'sel':''}" data-i="${i}" data-v="${oi}">${String.fromCharCode(65+oi)}. ${esc(o)}</div>`).join('')}</div>`;
  else if(q.type==='sentence') inner=`<textarea class="qfill" data-i="${i}" rows="2" placeholder="写一写…">${ans&&typeof ans==='string'?esc(ans):''}</textarea>`;
  else if(q.type==='reading') inner=`<div class="material">${esc(q.material)}</div>`+q.questions.map((sq,si)=>renderSubQuestion(q,i,sq,si)).join('');
  let ansHtml='';
  if(trainState.locked){ ansHtml = q.type==='reading' ? q.questions.map((sq,si)=>subAnsHtml(q,i,sq,si)).join('') : ansHtmlFor(q,ans); }
  const tyMap={fill:q.cat==='拼音'?'拼音':(q.cat==='基础'?'基础':'填空'),judge:'判断',choice:'选择',sentence:'句式练笔',reading:'阅读理解'};
  return `<div class="qitem">${q.type==='reading'?'':`<div class="qt"><span class="no">${i+1}.</span><span>${esc(q.q)}</span><span class="ty">${tyMap[q.type]||''}</span></div>`}${inner}${ansHtml?'<div class="qans show">'+ansHtml+'</div>':''}</div>`;
}
function renderSubQuestion(q,i,sq,si){
  const key=i+'-'+si; const ans=trainState.ans[i]&&trainState.ans[i][key]; let inner='';
  if(sq.type==='fill') inner=`<input class="qfill" data-ri="${i}" data-rs="${si}" placeholder="输入答案" value="${ans&&typeof ans==='string'?esc(ans):''}">`;
  else if(sq.type==='judge') inner=`<div class="opts"><div class="opt ${ans===true?'sel':''}" data-ri="${i}" data-rs="${si}" data-v="1">✔ 正确</div><div class="opt ${ans===false?'sel':''}" data-ri="${i}" data-rs="${si}" data-v="0">✘ 错误</div></div>`;
  else if(sq.type==='choice') inner=`<div class="opts">${sq.options.map((o,oi)=>`<div class="opt ${ans===oi?'sel':''}" data-ri="${i}" data-rs="${si}" data-v="${oi}">${String.fromCharCode(65+oi)}. ${esc(o)}</div>`).join('')}</div>`;
  return `<div class="qt" style="margin-top:6px"><span class="no">(${si+1})</span><span>${esc(sq.q)}</span></div>${inner}`;
}
function subAnsHtml(q,i,sq,si){
  const key=i+'-'+si; const ans=trainState.ans[i]&&trainState.ans[i][key];
  if(sq.type==='fill') return `<div class="qans show" style="margin:2px 0 8px">参考答案：<span class="ref">${sq.a.map(esc).join(' / ')}</span>${ans!==undefined&&!eqArr(ans,sq.a)?'（你的：'+esc(ans)+'）':''}</div>`;
  if(sq.type==='judge') return `<div class="qans show" style="margin:2px 0 8px">参考答案：<span class="ref">${sq.a?'正确':'错误'}</span>${ans!==undefined&&ans!==sq.a?'（你的：'+(ans?'正确':'错误')+'）':''}</div>`;
  if(sq.type==='choice') return `<div class="qans show" style="margin:2px 0 8px">参考答案：<span class="ref">${String.fromCharCode(65+sq.a)}</span>${ans!==undefined&&ans!==sq.a?'（你的：'+String.fromCharCode(65+ans)+'）':''}</div>`;
  return '';
}
function eqArr(a,b){ if(!Array.isArray(a))return false; return b.every(x=>a.includes(x))&&a.length===b.length; }
function ansHtmlFor(q,ans){
  if(q.type==='fill') return `参考答案：<span class="ref">${q.a.map(esc).join(' / ')}</span>${ans&&!eqArr(ans,q.a)?'（你的：'+esc(ans)+'）':''}`;
  if(q.type==='judge') return `参考答案：<span class="ref">${q.a?'正确':'错误'}</span>${ans!==undefined&&ans!==q.a?'（你的：'+(ans?'正确':'错误')+'）':''}`;
  if(q.type==='choice') return `参考答案：<span class="ref">${String.fromCharCode(65+q.a)}</span>${ans!==undefined&&ans!==q.a?'（你的：'+String.fromCharCode(65+ans)+'）':''}`;
  if(q.type==='sentence') return `参考：${esc(q.ref||'')}`;
  return '';
}
function isCorrect(q,ans){
  if(q.type==='fill') return eqArr(ans,q.a);
  if(q.type==='judge') return ans===q.a;
  if(q.type==='choice') return ans===q.a;
  if(q.type==='sentence') return typeof ans==='string'&&ans.trim().length>0;
  if(q.type==='reading') return q.questions.every((sq,si)=>isCorrect(sq,ans&&ans[i+'-'+si]));
  return false;
}
function submitTrain(){
  trainState.locked=true;
  const right=trainState.qs.filter((q,i)=>isCorrect(q,trainState.ans[i])).length;
  const pct=Math.round(right/trainState.qs.length*100);
  trainState.score=pct;
  const p=prog(CUR); p.quizBest=Math.max(p.quizBest||0,pct); p.last=new Date().toISOString().slice(0,10); save();
  recordLearn(12, CUR+'·训练');
  renderTrainBody(); (pct>=60?playOk():playErr());
}
function bindTrain(){

  document.querySelectorAll('input.qfill[data-ri]').forEach(inp=>inp.oninput=e=>{ const i=+e.target.dataset.ri,si=e.target.dataset.rs; trainState.ans[i]=trainState.ans[i]||{}; trainState.ans[i][i+'-'+si]=e.target.value; });
  document.querySelectorAll('.opt[data-ri]').forEach(o=>o.onclick=()=>{ const i=+o.dataset.ri,si=o.dataset.rs; trainState.ans[i]=trainState.ans[i]||{}; trainState.ans[i][i+'-'+si]=o.dataset.v==='1'?true:(o.dataset.v==='0'?false:+o.dataset.v); o.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); });
  const sub=$('#btnSubmit'); if(sub) sub.onclick=submitTrain;
  const redo=$('#btnRedo'); if(redo) redo.onclick=()=>{ trainState=null; selectFilter(trainFilter); };
}

let JS={chest:0,qi:0,gems:0,hp:5,combo:0,done:[],qs:[]};
function jsStartChest(ci){ JS.chest=ci; JS.qi=0; JS.qs=shuffle(JUSHI_CHESTS[ci].qs.slice()); renderJushi(); }
function renderJushi(){
  const area=$('#gameArea');
  // 地图模式：选宝箱
  if(JS.chest<0||JS.showMap){
    const map=JUSHI_CHESTS.map((c,i)=>{
      const st=JS.done.includes(i)?'done':(i===Math.min(...JUSHI_CHESTS.map((_,k)=>JS.done.includes(k)?99:k))||i===0&&!JS.done.length?'cur':'lock');
      const unlocked=JS.done.includes(i)||i===0||JS.done.includes(i-1);
      return `<div class="lvl ${JS.done.includes(i)?'done':''}" data-chest="${i}" style="${unlocked?'':'opacity:.45;pointer-events:none'}"><div class="u">${unlocked?'':'🔒 '}${c.name}</div><div class="n" style="font-size:22px">${c.icon}</div><div class="p">${JS.done.includes(i)?'✅ 已通关':unlocked?'点击闯关':'先通过上一关'}</div></div>`;
    }).join('');
    const hearts='❤️'.repeat(JS.hp)+'🤍'.repeat(5-JS.hp);
    area.innerHTML=`<div class="ghead">句式改写 · 寻宝之旅</div>
     <div class="czprog">${hearts} · 宝石 <b>💎 ${JS.gems}</b> · 连对 <b>${JS.combo}</b></div>
     <div class="cbhint">闯过一座座岛屿，收集语言宝石！每座岛 5~6 道题，答错扣 1 颗心，心用完寻宝失败。</div>
     <div class="grid">${map}</div>
     ${JS.hp<=0?'<div class="cbreport"><div class="h">💔 心用完了，重整旗鼓再出发吧！</div></div>':''}
     <div class="grow"><button class="btn" id="jsReset">🔄 重置寻宝</button><button class="btn" id="jsBack">返回游戏</button></div>`;
    area.querySelectorAll('[data-chest]').forEach(c=>c.onclick=()=>{ JS.showMap=false; jsStartChest(+c.dataset.chest); });
    $('#jsReset').onclick=()=>{ JS={chest:0,qi:0,gems:0,hp:5,combo:0,done:[],qs:[],showMap:true}; renderJushi(); };
    $('#jsBack').onclick=renderGames;
    return;
  }
  // 答题模式
  const chest=JUSHI_CHESTS[JS.chest];
  if(JS.qi>=JS.qs.length){
    // 宝箱通关
    JS.done.push(JS.chest); JS.gems+=3;
    if(typeof PTS!=='undefined'&&PTS) PTS.add(2,'句式寻宝通关');
    recordLearn(5,'句式寻宝');
    const allDone=JS.done.length>=JUSHI_CHESTS.length;
    area.innerHTML=`<div class="ghead">${chest.icon} ${chest.name} · 通关！</div>
     <div class="cbwin">🎉 宝箱打开啦！获得 3 颗宝石 💎${allDone?'<br>👑 恭喜！你集齐了所有宝藏，成为句式小达人！':''}</div>
     <div class="grow"><button class="btn primary" id="jsNext">${allDone?'再看一次宝藏地图 ▶':'前往下一座岛 ▶'}</button></div>`;
    $('#jsNext').onclick=()=>{ JS.showMap=true; renderJushi(); };
    return;
  }
  const q=JS.qs[JS.qi];
  const hearts='❤️'.repeat(JS.hp)+'🤍'.repeat(5-JS.hp);
  area.innerHTML=`<div class="ghead">${chest.icon} ${chest.name} · 第 ${JS.qi+1}/${JS.qs.length} 题</div>
   <div class="czprog">${hearts} · 宝石 <b>💎 ${JS.gems}</b> · 连对 <b>${JS.combo}</b></div>
   <div class="cbq">${esc(q.q)}</div>
   <div class="gopts v">${q.opts.map((o,i)=>`<button class="gopt" data-oi="${i}">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>
   <div id="gfb"></div>`;
  area.querySelectorAll('.gopt').forEach(b=>b.onclick=()=>{
    if(area.dataset.lock) return; area.dataset.lock='1';
    const i=+b.dataset.oi; const ok=i===q.a;
    area.querySelectorAll('.gopt').forEach(x=>{ x.classList.add('done'); if(+x.dataset.oi===q.a) x.classList.add('ok'); });
    if(ok){ b.classList.add('ok'); playOk(); JS.combo++; JS.gems++; if(typeof PTS!=='undefined'&&PTS) PTS.add(0.5,'句式寻宝'); }
    else { b.classList.add('no'); playErr(); JS.combo=0; JS.hp--; }
    $('#gfb').innerHTML=`<div class="cbreport"><div class="h">${ok?'✅ 答对了！宝石+1':'❌ 再想想！'}</div><div class="ritem" style="border:none">${esc(q.x)}</div></div>
     <div class="grow"><button class="btn primary" id="jsNextQ">${JS.hp<=0?'查看结果':'下一题 ▶'}</button></div>`;
    $('#jsNextQ').onclick=()=>{ area.dataset.lock=''; if(JS.hp<=0){ JS.showMap=true; renderJushi(); return; } JS.qi++; renderJushi(); };
  });
}

function renderGames(){
  const h=`<div class="card"><h3>趣学 · 边玩边学 <span class="tag">游戏闯关</span></h3>
    <div class="grid" id="gameGrid">${GAMES.map(g=>`<div class="lvl" data-game="${g.id}"><div class="u">${({'cz':'组词挑战','py':'读音挑战','poem':'古诗接龙','idiom':'成语接龙','cuobie':'错字侦探','qiqiu':'气球大战','juhe':'句子闯关','jushi':'寻宝挑战'})[g.type]||'趣味游戏'}</div><div class="n">${esc(g.name)}</div><div class="p">点我开始 ▶</div></div>`).join('')}</div>
    <button class="btn" id="gameBack" style="display:none;margin:2px 0 10px">← 返回游戏列表</button>
    <div id="gameArea"></div></div>`;
  $('#app').innerHTML=h;
  $('#gameBack').onclick=renderGames;
  document.querySelectorAll('#gameGrid .lvl').forEach(c=>c.onclick=()=>{ const g=GAMES.find(x=>x.id===c.dataset.game); GAME.id=c.dataset.game; GAME.i=0; GAME.score=0; GAME.level=0; GAME.formed=[]; GAME.sel=[]; GAME.cleared=[]; GAME.grid=null; GAME.cz=null; GAME.czQueue=[]; GAME.items=[]; GAME.pi=0; GAME.order=[]; GAME.bank=[]; GAME.used=[]; GAME.submitted=false; GAME.si=0; GAME.ans=[]; GAME.czHistory=[]; GAME.czDone=false; GAME.czCount=0; GAME.czTotal=0; GAME.idiomPos=0;
    if(g.type==='py') GAME.items=buildPyItems();
    else if(g.type==='poem') GAME.pi=Math.floor(Math.random()*GAMES.find(x=>x.id==='poem').poems.length);
    else if(g.type==='idiom') GAME.si=Math.floor(Math.random()*GAMES.find(x=>x.id==='idiom').sets.length);
    else if(g.type==='cuobie'){ CB.stage=1; CB.text=''; CB.giveup=false; }
    else if(g.type==='qiqiu'){ QQ.items=[]; }
    else if(g.type==='juhe'){ JH={level:1,hp:3,score:0,combo:0,order:[],picked:[],answer:null}; jhNewRound(); }
    else if(g.type==='jushi'){ JS={chest:0,qi:0,gems:0,hp:5,combo:0,done:[],qs:[],showMap:true}; }
    if(CUR) recordLearn(10, CUR+'·游戏·'+g.name);

function czWordPool(L,ch){
  const set=new Set();
  if(L&&L.words){
    [...(L.words.huiXie||[]),...(L.words.huiRen||[])].forEach(o=>{ if(o&&o.ch===ch) (o.zc||[]).forEach(w=>{ if(w&&w.length===2) set.add(w); }); });
    (L.words.ciyu||[]).forEach(w=>{ if(w&&w.length===2&&w.indexOf(ch)>=0) set.add(w); });
  }
  (CZ_DICT[ch]||[]).forEach(w=>{ if(w&&w.length===2) set.add(w); });
  return [...set].filter(w=>w[0]!==w[1]);
}
// 校验：这个字能否组出 2 个「配对字互不相同」的词
function czQualified(L,ch){
  const pool=czWordPool(L,ch); const partners=new Set();
  pool.forEach(w=>{ partners.add(w[0]===ch?w[1]:w[0]); });
  return partners.size>=2;
}
// 干扰字候选池：当前课文生字 + 内置词典字 + 常用字（后续会逐一验证与生字组不成词）
function czDistractorPool(L,t){
  const set=new Set();
  if(L&&L.words){ [...(L.words.huiXie||[]),...(L.words.huiRen||[])].forEach(o=>{ if(o&&o.ch) set.add(o.ch); }); }
  Object.keys(CZ_DICT).forEach(c=>set.add(c));
  set.delete(t);
  return [...set];
}
// 重建本轮生字队列（每个字只出一题；只收能组 2 词的字）
function czBuildQueue(){
  const L=curLesson(); const map=new Map();
  if(L&&L.words){ [...(L.words.huiXie||[]),...(L.words.huiRen||[])].forEach(o=>{ if(o&&o.ch&&!map.has(o.ch)) map.set(o.ch,o); }); }
  let chars=[...map.keys()].filter(c=>czQualified(L,c));
  if(chars.length<4){ Object.keys(CZ_DICT).forEach(c=>{ if(chars.length>=12) return; if(!map.has(c)&&chars.indexOf(c)<0&&czQualified(L,c)) chars.push(c); }); }
  GAME.czQueue=shuffle(chars); GAME.czTotal=GAME.czQueue.length; GAME.czCount=0;
}
function buildCz(){
  const L=curLesson();
  if(!GAME.czQueue||!GAME.czQueue.length) czBuildQueue();
  if(!GAME.czQueue.length){ GAME.cz=null; return; }
  const t=GAME.czQueue.shift();
  const pool=czWordPool(L,t);
  // 贪心选 2 个「配对字不重复」的词
  const words=[]; const pset=new Set();
  for(const w of shuffle(pool)){ const p=(w[0]===t?w[1]:w[0]); if(!pset.has(p)){ pset.add(p); words.push(w); if(words.length>=2) break; } }
  const need=Math.max(1,words.length);
  const partners=[...pset];
  // 干扰字：必须与生字组不成任何词（对照完整词库验证），凑满 9 格
  const extra=[];
  for(const c of shuffle(czDistractorPool(L,t))){
    if(extra.length+partners.length>=9) break;
    if(c===t||pset.has(c)||extra.indexOf(c)>=0) continue;
    if(pool.indexOf(t+c)>=0||pool.indexOf(c+t)>=0) continue;
    extra.push(c);
  }
  GAME.cz={target:t, words:words.slice(), partners:partners.slice(), extra:extra.slice(), need};
  GAME.grid=null; GAME.cleared=[]; GAME.formed=[]; GAME.czDone=false;
}

// 从当前课文 + 通用词库收集「词语 + 形近字替换」陷阱，混合随机，保证每轮多样
function cbTraps(need){
  const L=curLesson(); const lesson=[];
  if(L&&L.words){
    const ws=new Set();
    (L.words.ciyu||[]).forEach(w=>{ if(w&&w.length>=2&&w.length<=4&&!/[\s，。、·]/.test(w)) ws.add(w); });
    [...(L.words.huiXie||[]),...(L.words.huiRen||[])].forEach(o=>(o.zc||[]).forEach(w=>{ if(w&&w.length>=2&&w.length<=4) ws.add(w); }));
    [...ws].forEach(w=>{ [...w].forEach((c,i)=>{ const cw=CONFUSE_EXT[c]; if(cw) lesson.push({w,i,right:c,wrong:cw}); }); });
  }
  const generic=CB_GENERIC.map(g=>{ const idx=g[0].indexOf(g[1]); return {w:g[0],i:idx>=0?idx:0,right:g[1],wrong:g[2]}; }).filter(t=>t.wrong);
  // 混合：课文候选为主，通用兜底，一起打乱 → 每轮组合不同
  const pool=shuffle([...lesson,...generic,...generic]);
  const picked=[]; const usedW=new Set(); const usedPos=new Set();
  // 第一遍：每个词只用一次
  for(const t of pool){ if(picked.length>=need) break; if(usedW.has(t.w)) continue; usedW.add(t.w); usedPos.add(t.w+'#'+t.i); picked.push(t); }
  // 第二遍：不够则允许同词不同位
  for(const t of pool){ if(picked.length>=need) break; const k=t.w+'#'+t.i; if(usedPos.has(k)) continue; usedPos.add(k); picked.push(t); }
  return picked;
}

  const stage=CB.stage||1;
  const need=stage===1?2:(stage===2?3:(4+Math.floor(Math.random()*2)));
  const traps=cbTraps(need);
  const tpls=shuffle(CB_TPL.slice());
  // 字符级构建：逐字 push，错字位置在 push 当下记录，保证位置 100% 准确
  const chars=[]; const errors={};
  traps.forEach((tp,ti)=>{
    const seg=tpls[ti%tpls.length]('\u0000');
    for(let i=0;i<seg.length;i++){
      if(seg[i]==='\u0000'){
        const word=tp.w;
        for(let wi=0;wi<word.length;wi++){
          const idx=chars.length;
          if(wi===tp.i){ chars.push(tp.wrong); errors[idx]={wrong:tp.wrong,right:tp.right}; }
          else chars.push(word[wi]);
        }
      } else chars.push(seg[i]);
    }
  });
  CB.text=chars.join('');
  CB.errors=errors; CB.need=Object.keys(errors).length;
  CB.found=0; CB.foundPos=[]; CB.giveup=false;
}
function cbReport(){
  return `<div class="cbreport"><div class="h">${CB.giveup?'⚑ 已认输，本关错别字是：':'✅ 找齐 '+CB.need+' 个错别字，对比记忆：'}</div>${Object.values(CB.errors).map(e=>`<div class="ritem">「<span class="wrong">${esc(e.wrong)}</span>」应为「<span class="right">${esc(e.right)}</span>」（形近/同音，注意区分）</div>`).join('')}</div>`;
}
function renderCuobie(){
  const area=$('#gameArea'); if(!CB.text) buildCuobie();
  const total=Object.keys(CB.errors).length;
  const done=CB.found>=total;
  let html='';
  for(let i=0;i<CB.text.length;i++){
    const ch=CB.text[i]; const e=CB.errors[i];
    if(e){
      if(CB.foundPos.includes(i)) html+=`<span class="cbch found">${esc(e.right)}</span>`;
      else if(CB.giveup) html+=`<span class="cbch missed">${esc(e.right)}</span>`;
      else html+=`<span class="cbch err-hit" data-pos="${i}">${esc(ch)}</span>`;
    } else html+=`<span class="cbch">${esc(ch)}</span>`;
  }
  const dots=[1,2,3].map(s=>`<span class="cbdot ${s<CB.stage?'done':(s===CB.stage?'cur':'')}">${s<CB.stage?'✓':s}</span>`).join('');
  const L=curLesson();
  const hasLesson=(L&&L.words&&((L.words.huiXie||[]).length||(L.words.huiRen||[]).length));
  const srcTxt=hasLesson?('错字多来自《'+L.title+'》生字的形近字/同音字'):'错字来自常用字词的形近字/同音字';
  let foot='';
  if(done){
    if(CB.stage>=3){
      foot=`<div class="cbwin">🎉 太厉害了！三关全部通过，错别字全被你消灭啦！</div>
        <div class="grow"><button class="btn primary" id="cbAgain">再玩一轮 ▶</button><button class="btn" id="cbBack">返回游戏</button></div>`;
    } else {
      foot=`<div class="grow"><button class="btn primary" id="cbNext">进入第 ${CB.stage+1} 关 ▶</button></div>`;
    }
  } else {
    foot=`<div class="grow"><button class="btn warn" id="cbGive">🏳 认输·看答案</button><button class="btn" id="cbNew">换一段</button></div>`;
  }
  area.innerHTML=`<div class="ghead">消灭错别字 · 火眼金睛三关挑战</div>
    <div class="czprog">第 <b>${CB.stage}</b>/3 关 ${dots} · 本关藏了 <b>${total}</b> 个错别字 · 已找出 <b>${CB.found}</b>/${total}</div>
    <div class="cbhint">${esc(srcTxt)}。仔细读短文，把写错的字点出来！（第一关 2 个 → 第二关 3 个 → 第三关 4~5 个）</div>
    <div class="cbtext">${html}</div>
    ${(done?cbReport():'')+foot}`;
  area.querySelectorAll('.cbch.err-hit').forEach(s=>s.onclick=()=>{
    const i=+s.dataset.pos; if(CB.foundPos.includes(i)) return;
    CB.foundPos.push(i); CB.found++; playOk();
    if(typeof PTS!=='undefined'&&PTS) PTS.add(0.5,'消灭错别字');
    if(CB.found>=Object.keys(CB.errors).length){
      if(CB.stage>=3){ setTimeout(flowerRain,200); setTimeout(playWin,260); if(typeof PTS!=='undefined'&&PTS) PTS.add(2,'错别字通关'); recordLearn(15,(CUR||'')+'·错别字通关'); }
    }
    renderCuobie();
  });
  area.querySelectorAll('.cbch:not([data-pos]):not(.found):not(.missed)').forEach(s=>s.onclick=()=>{ s.classList.add('shake'); setTimeout(()=>s.classList.remove('shake'),420); });
  const nx=$('#cbNext'); if(nx) nx.onclick=()=>{ CB.stage++; CB.text=''; buildCuobie(); renderCuobie(); };
  const nw=$('#cbNew'); if(nw) nw.onclick=()=>{ CB.text=''; CB.giveup=false; buildCuobie(); renderCuobie(); };
  const gv=$('#cbGive'); if(gv) gv.onclick=()=>{ CB.giveup=true; playErr(); renderCuobie(); };
  const ag=$('#cbAgain'); if(ag) ag.onclick=()=>{ CB.stage=1; CB.text=''; buildCuobie(); renderCuobie(); };
  const bk=$('#cbBack'); if(bk) bk.onclick=renderGames;
}

}
function renderQiqiu(){
  const area=$('#gameArea'); if(QQ.raf) cancelAnimationFrame(QQ.raf);

  shuffle(balloons);

  const xs=[22,50,78];
  area.innerHTML=`<div class="ghead">打气球 · 趣学</div>
    <div class="czprog">第 <b>${QQ.i+1}</b>/<b>${QQ.total}</b> 个 · 击破 <b>${QQ.score}</b></div>
    <div class="cbhint">气球升起啦！看准读音对应的字，选对读音就<b>瞄准击破</b>它。小心干扰气球～</div>
    <div class="sky" id="sky">${balloons.map((b,bi)=>`<div class="balloon ${b.target?'target':''}" id="bq${bi}" style="left:${xs[bi]}%">${esc(b.word)}</div>`).join('')}</div>
    <div class="qopts">${opts.map(o=>`<button class="qopt" data-py="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="gfb" id="qqFb"></div>
    <div class="grow"><button class="btn" id="qqSkip">换一个</button></div>`;
  QQ.answered=false; const sky=$('#sky'); const H=(sky?sky.clientHeight:300)||300;
  const bl=sky?Array.from(sky.querySelectorAll('.balloon')):[];
  const tops=bl.map(()=>Math.random()*40); const spds=bl.map(()=>0.55+Math.random()*0.5);
  const step=()=>{ for(let k=0;k<bl.length;k++){ if(bl[k].classList.contains('pop')) continue; tops[k]+=spds[k]; if(tops[k]>H-46) tops[k]=0; bl[k].style.bottom=tops[k]+'px'; } if(!QQ.answered) QQ.raf=requestAnimationFrame(step); };
  QQ.raf=requestAnimationFrame(step);
  area.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
    if(QQ.answered) return; QQ.answered=true; const ok=b.dataset.py===it.py;

      playOk(); setTimeout(()=>{ QQ.i++; renderQiqiu(); },620);
    } else { b.classList.add('no'); toast('再瞄准一下～'); QQ.answered=false; }
  });

}

      <p class="hint">直接把课文<b>全文</b>粘贴到下面（自动按换行分段）。点「解析并覆盖」：若标题与已有课文相同则<b>覆盖更新</b>，否则新增。字词/练习可之后再编辑。</p>
      <textarea id="addText" rows="9" placeholder="秋天的夜晚，月亮升起来了，从洱海那边升起来了。&#10;是在洱海里淘洗过吗？月盘是那样明亮……（直接粘贴全文）"></textarea>
      <div class="row"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="mergeText">解析并覆盖 / 新增</button></div>
    </div>`);
  document.querySelectorAll('#addMode .chip').forEach(c=>c.onclick=()=>{ const m=c.dataset.m; document.querySelectorAll('#addMode .chip').forEach(x=>x.classList.toggle('active',x===c)); $('#addJsonBox').style.display=m==='json'?'':'none'; $('#addTextBox').style.display=m==='text'?'':'none'; });
  $('#mergeJson').onclick=()=>{ try{ const o=JSON.parse($('#addJson').value);
      if(!o.id||!o.title) throw 0;
      o.grade=o.grade||selGrade; o.volume=o.volume||selVol; o.unit=o.unit||selUnit;
      const idx=LESSONS.findIndex(x=>x.id===o.id); const isNew=idx<0;
      if(idx>=0) LESSONS[idx]=o; else LESSONS.push(o);
      CUR=o.id; save(); buildPyMap(); buildNav(); render(); toast((isNew?'已新增':'已更新')+'：'+o.title); closeModal();
    }catch(e){ toast('JSON 格式有误，请检查字段'); } };
  $('#mergeText').onclick=()=>{
    const title=$('#txTitle').value.trim(); const text=$('#addText').value.trim();
    if(!title){ toast('请填写课文标题'); return; }
    if(!text){ toast('请粘贴课文全文'); return; }
    const grade=$('#txGrade').value, vol=$('#txVol').value, unit=$('#txUnit').value;
    const paras=text.split(/\n+/).map(s=>s.trim()).filter(Boolean).map((s,i)=>({p:i+1,s:[s]}));
    const ex=LESSONS.find(l=>l.grade===grade&&l.volume===vol&&l.title===title);
    const id=ex?ex.id:('t_'+Date.now());
    const o={id,grade,volume:vol,unit,title,author:'',read:paras,words:{huiRen:[],huiXie:[],ciyu:[]},study:{theme:'',struct:[],anno:[],homework:[]},train:{基础:[],拼音:[],填空:[],判断:[],句式:[],课内阅读:[],课外阅读:[]}};
    const idx=LESSONS.findIndex(x=>x.id===id); if(idx>=0) LESSONS[idx]=o; else LESSONS.push(o);
    CUR=id; save(); buildPyMap(); buildNav(); render(); toast((ex?'已覆盖更新':'已新增')+'：'+title); closeModal();
  };
}
