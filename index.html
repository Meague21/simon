  {title:'猜猜他是谁（二）',text:'她是我们班的"开心果"。她扎着两条小辫子，一笑起来就有两个小酒窝，眼睛眯成一条缝。\n她特别会讲笑话。有一次，我考试没考好，闷闷不乐地坐在座位上。她走过来，凑到我耳边讲了一个笑话，我忍不住"扑哧"一声笑了。她还经常模仿动画片里的人物，逗得大家哈哈大笑。\n有她在的地方，就有笑声。你猜出她是谁了吗？',note:'用"小酒窝、眯成缝"写外貌，用讲笑话、模仿人物表现"开心果"的特点，结尾点题。'},
  {title:'猜猜他是谁（三）',text:'他是我们班的"运动健将"。他皮肤黝黑，腿很长，跑起来像一阵风。\n每次体育课，他都最活跃。上学期的运动会，他参加了六十米短跑。发令枪一响，他就像离弦的箭一样冲了出去，把别人远远地甩在后面，第一个冲过了终点。我们为他欢呼，他抹了抹汗，笑得露出两排白牙。\n他还爱打篮球、踢足球，操场上总能看到他的身影。你猜出他是谁了吗？',note:'抓住"爱运动"的特点，用运动会跑步夺冠的具体事例来表现，"像离弦的箭"比喻生动。'}
 ]
},
'习作·那次玩得真高兴':{
 guide:[
  {h:'审题立意',b:'写一次玩得特别高兴的经历：可以写玩游戏、去游乐场、捉迷藏、打水仗……要把玩的过程写下来，把高兴的心情写出来。'},
  {h:'选材锦囊',b:'选你玩得最开心的一次：捉迷藏、老鹰捉小鸡、放风筝、堆雪人、去游乐园……选印象最深的写。'},
  {h:'结构提纲',b:'开头：交代时间、地点、玩什么。中间：按顺序写玩的过程，最精彩的部分写具体。结尾：写高兴的心情。'},
  {h:'写作妙招',b:'① 玩的过程要有动作、有语言；② 写出当时的心情，如"我高兴得跳了起来"；③ 最精彩的部分放慢写。'},
  {h:'好词百宝箱',b:'兴高采烈、手舞足蹈、哈哈大笑、乐不可支、欢呼雀跃、你追我赶、欢声笑语'},
  {h:'避坑提醒',b:'① 过程写得像流水账，没有重点；② 只写结果，不写过程；③ 没有写出高兴的心情。'}
 ],
 fanwen:[
  {title:'捉迷藏真好玩',text:'星期六，我和小伙伴们在小区里玩捉迷藏。\n我们用"石头剪刀布"决定谁来找。小明输了，他闭上眼睛，靠着墙数数："一、二、三……"我们赶紧四处躲藏。我躲在一棵大树后面，心里怦怦直跳，大气都不敢出。\n小明数完数，开始找了。他找到了躲在花坛后面的小红，又找到了躲在汽车后面的小刚。我正暗自得意，忽然听到脚步声越来越近。不好！小明朝我这边来了！我屏住呼吸，紧紧贴着树干。"找到你了！"小明猛地从树后探出头来，吓了我一跳。\n我们都哈哈大笑起来。捉迷藏真好玩，我们玩得满头大汗，一直到天黑才回家。',note:'按"决定谁找—躲藏—被找到"的顺序写，"心里怦怦直跳""屏住呼吸"写出了躲藏时的紧张，结尾点出高兴。'},
  {title:'放风筝',text:'春天的一个星期天，爸爸带我去公园放风筝。\n我拿着"老鹰"风筝，爸爸帮我举着。我一边跑一边放线，爸爸一松手，风筝就飞起来了。可是没飞多高，风筝就一头栽了下来。我有点灰心，爸爸说："别急，等风来的时候再放。"\n过了一会儿，风吹来了。我又跑起来，风筝慢慢地升上了天空，越飞越高。我拉着线，一松一紧，风筝在天空中自由地飞翔，像一只真的老鹰。我高兴得又蹦又跳。\n看着天空中飞翔的风筝，我心里充满了快乐。放风筝真好玩！',note:'写放风筝的过程，从失败到成功，"一松一紧""又蹦又跳"写出动作和心情，感情真实。'},
  {title:'堆雪人',text:'冬天，下了一夜的大雪。早上起来，地上白茫茫的一片。我和小伙伴约好一起堆雪人。\n我们先滚了一个大雪球做雪人的身子，又滚了一个小雪球做雪人的头。我们把小雪球放在大雪球上，雪人的身体就做好了。接着，我们用纽扣做雪人的眼睛，用胡萝卜做雪人的鼻子，用树枝做雪人的手。我还把自己的围巾给雪人围上。\n雪人做好了，它站在雪地里，笑眯眯地看着我们，好像在说："谢谢你们！"我们围着雪人又唱又跳，开心极了。\n虽然手冻得通红，但我们一点儿也不觉得冷。堆雪人真好玩！',note:'按"滚雪球—做身体—装饰"的顺序写堆雪人的过程，"笑眯眯地看着我们"用拟人手法，结尾写出快乐。'}
 ]
},
'习作·续写故事':{
 guide:[
  {h:'审题立意',b:'根据给定的开头，发挥想象，把故事续编完整。要读懂给定的开头，想想接下来会发生什么。'},
  {h:'选材锦囊',b:'读懂开头，顺着故事情节去想象：接下来会发生什么？结果会怎样？想象要合理，不能脱离开头。'},
  {h:'结构提纲',b:'开头：读懂给定的开头。中间：顺着情节续编，写清接下来发生的事。结尾：把故事编完整，可以有个有趣的结局。'},
  {h:'写作妙招',b:'① 想象要合理，顺着开头的情节去编；② 故事要完整，有头有尾；③ 可以加上人物的语言、动作，让故事更生动。'},
  {h:'好词百宝箱',b:'忽然、接着、后来、最后、没想到、出乎意料、灵机一动'},
  {h:'避坑提醒',b:'① 脱离开头，随便编；② 故事不完整，没有结尾；③ 想象不合理，前后矛盾。'}
 ],
 fanwen:[
  {title:'续写《总也倒不了的老屋》',text:'小蜘蛛的故事讲完了，它对老屋说："老屋，谢谢你！我要走了。"\n老屋说："再见！好了，我到了倒下的时候了！"\n"等等，老屋！"一个小小的声音在它门前响起，"再过几天，行吗？我找不到一个安心过冬的地方。"\n老屋低头看看，眼睛眯成一条缝："哦，是小燕子啊。好吧，我就再站几天。"\n就这样，老屋帮助了一个又一个需要帮助的朋友。小燕子、小松鼠、小刺猬都来老屋这里过冬。老屋听着朋友们的欢笑声，心里暖暖的。\n老屋想：能帮助大家，我站着真快乐！从此，老屋再也没有倒下。',note:'顺着原文的情节和风格续编，保持了老屋乐于助人的形象，结尾温暖。'},
  {title:'续写《小狗学叫》',text:'小狗继续往前走，它遇到了一只真正的小狗。\n"汪汪，汪汪！"那只小狗叫着。小狗听了，心想：这才是真正的狗叫啊！它赶紧跟着学："汪……汪……"\n一开始，它叫得不太好，声音又细又小。可是它不灰心，天天练习。早上练，晚上也练。慢慢地，它的声音越来越响亮，越来越像真正的狗叫了。\n终于有一天，小狗也能像别的狗一样，"汪汪"地叫了。它高兴极了，逢人就"汪汪"地叫几声，好像在说："我会叫了！我会叫了！"\n小狗终于学会了叫，它成了一只真正的狗。',note:'顺着"小狗学叫"的情节续编，写小狗向真正的狗学习、坚持练习，最后学会叫，故事完整，主题积极。'},
  {title:'续写《犟龟》',text:'陶陶参加了狮王二十九世的婚礼，看到了从未有过的、最美丽的庆典。\n庆典结束后，陶陶要回家了。它慢慢地往回爬，一路上，又遇到了蜘蛛、蜗牛和壁虎。\n"陶陶，你真的赶上庆典了？"蜘蛛惊讶地问。\n"是的，"陶陶说，"我一直说，我会准时赶到的！"\n蜗牛佩服地说："陶陶，你真了不起！"\n陶陶笑了笑，继续往家爬。虽然爬得很慢，但它心里很高兴。因为它明白了一个道理：只要坚持，就一定能到达目的地。',note:'顺着原文的结尾续编，写陶陶回家路上又遇到当初劝阻它的动物，呼应前文，点明"坚持就能到达"的道理。'}
 ]
},
'习作·我来编童话':{
 guide:[
  {h:'审题立意',b:'从给定的词语（如国王、黄昏、厨房、啄木鸟、冬天、森林超市、玫瑰花、星期天、小河边）中选几个，发挥想象，编一个有趣的童话故事。'},
  {h:'选材锦囊',b:'选好几个角色，想清楚它们之间会发生什么故事。可以编国王的故事、啄木鸟的故事、玫瑰花的故事……让故事有趣、有道理。'},
  {h:'结构提纲',b:'开头：交代时间、地点、角色。中间：写它们之间发生的故事，有对话、有情节。结尾：把故事编完整，可以点明一个道理。'},
  {h:'写作妙招',b:'① 童话里的角色可以像人一样说话、做事；② 想象要大胆、有趣；③ 故事可以告诉我们一个道理。'},
  {h:'好词百宝箱',b:'从前、有一天、忽然、后来、最后、高兴地、着急地、连忙'},
  {h:'避坑提醒',b:'① 角色太多，故事混乱；② 没有对话，故事平淡；③ 故事没有结尾。'}
 ],
 fanwen:[
  {title:'啄木鸟医生',text:'森林里有一棵老树，它生病了，叶子都黄了。\n啄木鸟医生飞来了，它敲了敲老树的树干，"笃笃笃"，听见里面有空洞的声音。啄木鸟说："老树爷爷，您生病了，我来给您治病。"\n老树担心地说："会不会很疼啊？"\n啄木鸟安慰它："别怕，一会儿就好了。"\n啄木鸟用尖尖的嘴啄开树皮，从里面捉出一条条虫子。它捉了一条又一条，一共捉了二十多条虫子。老树的病好了，叶子又变绿了。\n老树感激地说："谢谢你，啄木鸟医生！"\n啄木鸟笑着说："不用谢，这是我应该做的。"说完，它又飞到别的树上，去给别的树治病了。',note:'选了啄木鸟这个角色，编了它给老树治病的故事，有对话、有情节，结尾点明"帮助别人"的主题。'},
  {title:'森林超市',text:'冬天到了，森林里下起了大雪。小动物们都找不到食物，饿得肚子咕咕叫。\n小松鼠想：我要开一家森林超市，帮助大家过冬。于是，它把自己储存的松果、蘑菇都拿出来，开了一家森林超市。\n小兔子来买胡萝卜，小松鼠说："不用钱，拿去吃吧。"小刺猬来买苹果，小松鼠也说："不用钱，拿去吃吧。"\n小动物们都拿到了食物，过了一个温暖的冬天。大家都感谢小松鼠。\n春天来了，小动物们把找到的食物送给小松鼠，森林超市变得更热闹了。小松鼠明白了：帮助别人，自己也会快乐。',note:'选了"冬天、森林超市"这些词语，编了小松鼠开超市帮助大家的故事，主题温暖，结尾点明道理。'},
  {title:'玫瑰花的骄傲',text:'小河边有一朵玫瑰花，她长得可漂亮了，红红的脸，绿绿的叶子。可是她很骄傲，谁也不放在眼里。\n小草对她说："玫瑰花姐姐，你真漂亮！"玫瑰花撇撇嘴说："那当然，你那么矮，怎么能和我比！"\n小蜜蜂飞来采蜜，玫瑰花说："走开走开，别碰坏了我的花瓣！"\n后来，下起了大雨，刮起了大风。玫瑰花的花瓣被打落了好几片，她难过地哭了。小草和小蜜蜂都来安慰她，帮她挡风遮雨。\n玫瑰花明白了：不能骄傲，大家要互相帮助。从此，她变得谦虚了，和大家成了好朋友。',note:'选了玫瑰花这个角色，编了她从骄傲到谦虚的故事，情节完整，告诉我们"不能骄傲"的道理。'}
 ]
},
'习作·我们眼中的缤纷世界':{
 guide:[
  {h:'审题立意',b:'写自己观察的一种事物：可以是植物、动物，也可以是一处场景。要把观察到的写下来，注意写清事物的样子、变化和你的发现。'},
  {h:'选材锦囊',b:'选你仔细观察过的事物：含羞草、金鱼、蚂蚁、月亮、下雨……把观察时看到的、听到的、想到的写下来。'},
  {h:'结构提纲',b:'开头：交代观察的对象。中间：按顺序写观察到的样子、变化、发现。结尾：写你的感受和收获。'},
  {h:'写作妙招',b:'① 观察要仔细，用眼睛看、用耳朵听、用心想；② 写出事物的样子和变化；③ 写出自己的发现。'},
  {h:'好词百宝箱',b:'仔细观察、聚精会神、目不转睛、惊喜地发现、原来、我终于知道了'},
  {h:'避坑提醒',b:'① 观察不仔细，写得空泛；② 没有写变化；③ 没有写自己的发现。'}
 ],
 fanwen:[
  {title:'有趣的含羞草',text:'我家阳台上有一盆含羞草，我可喜欢它了。\n含羞草的叶子是绿色的，一片一片的，像小鸟的羽毛。它开的花是粉红色的，圆圆的，像一个小绒球。\n最有趣的是，你只要碰一下它的叶子，它就会马上合拢起来，像个害羞的小姑娘。过了一会儿，它又会慢慢地张开。我觉得很奇怪，就问爸爸："为什么含羞草一碰就会合拢呢？"\n爸爸告诉我："含羞草的叶子里有一种东西，一碰到它，叶子就会合拢。这是它保护自己的办法。"\n原来是这样！我仔细观察，发现含羞草合拢的速度很快，张开的时候很慢。大自然真奇妙，只要我们留心观察，就能发现很多有趣的秘密。',note:'观察含羞草的样子和"一碰就合拢"的特点，还写了向爸爸请教后的发现，内容具体，结尾点题。'},
  {title:'观察金鱼',text:'我家鱼缸里有两条金鱼，一条是红色的，一条是黑色的。我经常观察它们。\n金鱼的眼睛鼓鼓的，像两颗小灯泡。它们的尾巴大大的，游起来一摆一摆的，像穿着一条漂亮的裙子。\n金鱼吃东西的时候最有趣。我把鱼食撒进水里，它们马上游过来，张开小嘴，一口一个。吃饱了，它们就在水里悠闲地游来游去，有时还会吐泡泡。\n晚上，金鱼一动不动地停在水里。我以为它们死了，赶紧去问妈妈。妈妈笑着说："金鱼没有眼皮，它们睁着眼睛睡觉呢。"\n原来金鱼是睁着眼睛睡觉的！观察金鱼真有趣，我发现了它们的很多秘密。',note:'观察金鱼的外形、吃食、睡觉，写出自己的发现（金鱼睁着眼睛睡觉），内容真实有趣。'},
  {title:'观察月亮',text:'晚上，我喜欢抬头看月亮。\n我发现，月亮有时候是弯弯的，像一条小船；有时候是半圆的，像一块饼干；有时候是圆圆的，像一个白玉盘。\n我问妈妈："月亮为什么会变形状呢？"\n妈妈说："月亮自己不会发光，我们看到的亮光是太阳照在月亮上的。太阳、地球、月亮的位置不断变化，我们看到的月亮形状也就不同。"\n我仔细观察，发现月亮有时候跟着我走。我走，它也走；我停，它也停。真有趣！\n观察月亮让我知道了很多知识。大自然真奇妙，只要我们留心观察，就能发现很多奥秘。',note:'观察月亮的形状变化，写了向妈妈请教后的发现，还有"月亮跟着我走"的有趣发现，结尾点题。'}
 ]
},
'习作·这儿真美':{
 guide:[
  {h:'审题立意',b:'介绍一处美丽的地方：可以是公园、校园、家乡的一处景物。要围绕一个意思写，按一定的顺序把景物写具体，表达出对它的喜爱之情。'},
  {h:'选材锦囊',b:'选你熟悉又觉得美的地方：公园、校园、小河边、果园、家乡的山……选最美的、最有话写的。'},
  {h:'结构提纲',b:'开头：交代要介绍的地方，总写它的美。中间：按顺序写景物，围绕"美"把景物写具体。结尾：总结，表达对它的喜爱。'},
  {h:'写作妙招',b:'① 围绕一个意思（美）来写；② 按顺序写，如从远到近、从上到下；③ 用比喻、拟人把景物写生动。'},
  {h:'好词百宝箱',b:'风景优美、景色宜人、绿树成荫、鲜花盛开、鸟语花香、五彩缤纷、美不胜收'},
  {h:'避坑提醒',b:'① 景物写得杂乱，没有顺序；② 没有围绕"美"来写；③ 没有表达喜爱之情。'}
 ],
 fanwen:[
  {title:'美丽的公园',text:'我家附近有一个美丽的公园，我最喜欢去那里玩。\n走进公园，首先看到的是一片大草坪。小草绿油油的，像给大地铺上了一层绿色的地毯。草坪上开满了五颜六色的花，红的、黄的、紫的，美丽极了。\n草坪旁边有一个湖。湖水清澈见底，能看见水里的小鱼在游来游去。湖面上有几只小船，游客们划着船，唱着歌，可开心了。\n湖边种着一排柳树。柳树的枝条长长的，垂到水面上，风一吹，就像小姑娘在梳头。树上的小鸟叽叽喳喳地叫着，好像在欢迎我们的到来。\n公园真美啊！我爱这个美丽的公园。',note:'按"走进公园—草坪—湖—柳树"的顺序写，围绕"美"把景物写具体，用比喻、拟人手法，结尾表达喜爱。'},
  {title:'美丽的校园',text:'我们的校园又美丽又整洁，我非常喜欢它。\n走进校门，首先看到的是一个大花坛。花坛里种着各种各样的花，有月季、菊花、一串红……五颜六色，美丽极了。蝴蝶在花丛中飞来飞去，好像在跳舞。\n花坛后面是教学楼。教学楼又高又大，教室里传来同学们琅琅的读书声。教学楼前有一棵大榕树，像一把撑开的绿绒大伞，我们经常在树下乘凉、做游戏。\n操场在教学楼的东边。操场上有跑道、篮球场，下课了，同学们在这里跑步、打球，热闹极了。\n我们的校园真美啊！我爱我的校园。',note:'按"校门—花坛—教学楼—操场"的顺序写，围绕"美丽整洁"来写，用"绿绒大伞"比喻榕树，结尾表达喜爱。'},
  {title:'家乡的小河',text:'我的家乡有一条美丽的小河，那是我心目中最美的地方。\n小河的水清澈见底，能看见水底的沙石和游来游去的小鱼。河水缓缓地流着，发出"哗哗"的声音，好像在唱一首动听的歌。\n小河边种着一排柳树。柳树的枝条长长的，垂到水面上，风一吹，就随风舞动。柳树下面是一片草地，草地上开满了野花，红的、黄的、紫的，像给小河编了一个花环。\n夏天，我们最喜欢到小河边玩。我们在河里捉小鱼、打水仗，玩得可开心了。小河给我们带来了许多快乐。\n家乡的小河真美啊！我爱家乡的小河。',note:'写小河的水、柳树、草地，还写夏天在小河边玩耍的快乐，围绕"美"来写，结尾表达对家乡小河的喜爱。'}
 ]
},
'习作·写日记':{
 guide:[
  {h:'审题立意',b:'学写日记：把日期、星期、天气写在第一行，然后写这一天里印象深刻的人、事、景、物，写出自己的感受。'},
  {h:'选材锦囊',b:'选这一天里印象最深的事：学会了一项本领、看到了一处美景、做了一件好事、发生了一件趣事……'},
  {h:'结构提纲',b:'第一行：日期、星期、天气。正文：写印象深刻的事，写清经过和感受。'},
  {h:'写作妙招',b:'① 日记格式要对，第一行写日期、星期、天气；② 写真实的事和感受；③ 把事情写清楚。'},
  {h:'好词百宝箱',b:'今天、早上、中午、晚上、我学会了、我发现、我很高兴、我明白'},
  {h:'避坑提醒',b:'① 忘记写日期、星期、天气；② 写成流水账，什么都写一点；③ 没有写自己的感受。'}
 ],
 fanwen:[
  {title:'我学会了煎蛋',text:'10月15日 星期六 晴\n今天，妈妈教我煎蛋。\n妈妈先给我示范。她打开火，往锅里倒了一点油，等油热了，把一个鸡蛋打进锅里。鸡蛋"滋滋"地响，蛋白慢慢凝固，蛋黄像一个小太阳。\n轮到我煎了。我学着妈妈的样子，把鸡蛋打进锅里。可是我怕油溅出来，离得远远的，结果鸡蛋没煎熟。妈妈说："别怕，离近一点，用小火慢慢煎。"\n我又试了一次。这次，我小心地把鸡蛋打进锅里，用小火慢慢煎。鸡蛋慢慢地凝固了，变得金黄金黄的。我把鸡蛋翻了个面，又煎了一会儿，鸡蛋就煎好了。\n我吃着自己煎的鸡蛋，觉得特别香。我学会了煎蛋，真高兴！',note:'日记格式正确，写学煎蛋的经过，从失败到成功，有动作、有语言，结尾写出高兴的心情。'},
  {title:'观察蚂蚁',text:'9月20日 星期三 多云\n今天，我在院子里观察蚂蚁。\n我在地上放了一块饼干屑。不一会儿，一只小蚂蚁爬过来了。它围着饼干屑转了几圈，用触角碰了碰，然后急急忙忙地爬走了。\n我以为它不要了，正想走开。没想到，过了一会儿，一大群蚂蚁排着队爬过来了。它们围着饼干屑，有的推，有的拉，有的抬，齐心协力地把饼干屑往洞里搬。\n饼干屑比蚂蚁大好几倍，可是它们一点儿也不放弃。终于，饼干屑被搬进了洞里。\n蚂蚁真团结啊！我明白了一个道理：团结就是力量。',note:'观察蚂蚁搬饼干屑的过程，写出蚂蚁"齐心协力"的特点，结尾点明"团结就是力量"的道理。'},
  {title:'第一次走夜路',text:'11月8日 星期三 晴\n今天晚上，妈妈让我去奶奶家送东西。这是我第一次一个人走夜路。\n天黑了，路上没有几个人。我走在路上，心里怦怦直跳。风一吹，树叶"沙沙"地响，我以为是有人跟着我，吓得不敢回头。\n我壮着胆子往前走，一边走一边给自己打气："别怕，别怕，马上就到家了。"走着走着，我看到了奶奶家的灯光，心里一下子踏实了。\n我快步走到奶奶家，把东西交给了奶奶。奶奶夸我勇敢，我心里美滋滋的。\n回来的路上，我不那么害怕了。我明白了：只要勇敢，就什么都不怕。',note:'写第一次走夜路的经历，写出从害怕到勇敢的心理变化，"心里怦怦直跳""壮着胆子"写得很真实。'}
 ]
},
'习作·我有一个想法':{
 guide:[
  {h:'审题立意',b:'生活中有哪些现象或问题引起了你的关注？你对这些现象有什么想法？把现象和你的想法写下来，如果有改进的办法或建议，也可以写下来。'},
  {h:'选材锦囊',b:'选你关注的现象或问题：乱扔垃圾、沉迷手机、浪费粮食、不爱护公物……说出你的想法和改进建议。'},
  {h:'结构提纲',b:'开头：写你关注的现象或问题。中间：写你对这个现象的想法，可以写改进的办法或建议。结尾：总结，希望大家重视。'},
  {h:'写作妙招',b:'① 现象要写清楚；② 想法要具体，有改进建议更好；③ 语气要真诚。'},
  {h:'好词百宝箱',b:'我发现、我觉得、我建议、我们应该、希望大家'},
  {h:'避坑提醒',b:'① 现象写得不清不楚；② 只有现象，没有想法；③ 想法空洞，没有具体建议。'}
 ],
 fanwen:[
  {title:'关于乱扔垃圾的想法',text:'我发现，有些同学喜欢乱扔垃圾。教室里、操场上、走廊上，经常能看到纸屑、食品袋。\n乱扔垃圾很不文明。它不仅让校园变得脏乱，还会影响我们的健康。而且，清洁工人要打扫很久，很辛苦。\n我有一个想法：我们可以在教室里多放几个垃圾桶，方便大家扔垃圾。学校可以开展"爱护环境"的活动，让大家知道乱扔垃圾的危害。同学们也要互相监督，看到乱扔垃圾的行为要及时提醒。\n我希望，大家都能爱护环境，不乱扔垃圾，让我们的校园变得更加美丽。',note:'写乱扔垃圾的现象，说出自己的想法和改进建议（多放垃圾桶、开展活动、互相监督），内容具体。'},
  {title:'关于沉迷手机的想法',text:'我发现，很多同学喜欢玩手机，一玩就是很久。\n玩手机时间太长不好。首先，它伤害眼睛，很多同学因此戴上了眼镜。其次，它影响学习，有的同学因为玩手机，作业都没完成。而且，长时间低头玩手机，对身体也不好。\n我有一个想法：同学们可以约定玩手机的时间，每天不超过半小时。家长也可以监督，不让我们玩太久。我们还可以多参加户外活动，多看书，做更有意义的事。\n我希望，同学们都能合理安排时间，少玩手机，健康快乐地成长。',note:'写沉迷手机的现象，说出危害和改进建议（约定时间、家长监督、参加活动），想法具体可行。'},
  {title:'关于浪费粮食的想法',text:'我发现，有些同学吃饭时浪费粮食，吃了几口就把饭菜倒掉。\n"谁知盘中餐，粒粒皆辛苦。"粮食是农民伯伯辛辛苦苦种出来的，浪费粮食就是浪费他们的劳动成果。而且，还有很多地方的人吃不饱饭，我们更应该珍惜粮食。\n我有一个想法：同学们吃饭时要吃多少盛多少，不浪费。学校可以开展"光盘行动"，鼓励大家把饭菜吃光。我们还可以互相提醒，养成节约粮食的好习惯。\n我希望，大家都能珍惜粮食，不浪费，做一个勤俭节约的好孩子。',note:'引用古诗，写浪费粮食的现象，说出想法和建议（吃多少盛多少、光盘行动、互相提醒），主题鲜明。'}
 ]
}
},
'三年级下册':{
'习作·我的植物朋友':{
 guide:[
  {h:'审题立意',b:'写自己的植物朋友：先观察一种植物，做一张记录卡，记录它的样子、颜色、气味等，再把观察到的写下来，表达出对它的喜爱之情。'},
  {h:'选材锦囊',b:'选你熟悉又喜欢的植物：桃花、柳树、含羞草、仙人掌、多肉……先观察，做记录卡，再写下来。'},
  {h:'结构提纲',b:'开头：交代你的植物朋友是什么。中间：按顺序写它的样子、颜色、气味等，可以写你和它之间的事。结尾：表达对它的喜爱。'},
  {h:'写作妙招',b:'① 观察要仔细，看样子、颜色，闻气味；② 用比喻、拟人把植物写生动；③ 可以写你和植物之间的事。'},
  {h:'好词百宝箱',b:'绿油油、红彤彤、芬芳、清香、亭亭玉立、生机勃勃、含苞待放、争奇斗艳'},
  {h:'避坑提醒',b:'① 观察不仔细，写得空泛；② 没有写样子、颜色、气味；③ 没有表达喜爱之情。'}
 ],
 fanwen:[
  {title:'我的植物朋友——桃花',text:'春天来了，公园里的桃花开了。桃花是我的植物朋友。\n远远望去，桃花一片粉红，像天边的彩霞。走近一看，桃花有的还是花骨朵儿，饱胀得马上要破裂似的；有的才展开两三片花瓣；有的花瓣全展开了，露出嫩黄色的花蕊。\n桃花的花瓣是粉红色的，一层一层的，摸起来软软的。一阵风吹来，桃花散发出淡淡的清香，引来了许多蜜蜂和蝴蝶。\n我站在桃树下，看着美丽的桃花，觉得自己仿佛也变成了一朵桃花，穿着粉红的衣裳，在风中翩翩起舞。\n我喜欢桃花，它是我的植物朋友。',note:'观察桃花的样子、颜色、气味，用"像天边的彩霞"比喻，还写了自己"仿佛变成桃花"的想象，表达喜爱。'},
  {title:'我的植物朋友——含羞草',text:'我家有一盆含羞草，它是我的植物朋友。\n含羞草的茎细细的，叶子绿绿的，一片一片的，像小鸟的羽毛。它开的花是粉红色的，圆圆的，像一个小绒球。\n含羞草最有趣的地方是，你只要碰一下它的叶子，它就会马上合拢起来，像个害羞的小姑娘。过了一会儿，它又会慢慢地张开。我觉得很神奇。\n我问爸爸："为什么含羞草一碰就会合拢呢？"爸爸说："这是它保护自己的办法。"原来是这样！\n我每天给含羞草浇水，看着它一天天长大。我喜欢我的植物朋友——含羞草。',note:'观察含羞草的样子和"一碰就合拢"的特点，写了向爸爸请教的发现，还写每天浇水的事，表达喜爱。'},
  {title:'我的植物朋友——仙人掌',text:'我的书桌上有一盆仙人掌，它是我的植物朋友。\n仙人掌的样子很特别。它的茎是绿色的，厚厚的，上面长满了尖尖的刺。它没有叶子，爸爸告诉我，仙人掌的刺就是它的叶子，这样可以减少水分的蒸发。\n仙人掌很耐旱。有一次，我们全家出去旅游，一个星期没给它浇水。我回来后，以为它渴死了，没想到它还绿油油的，一点儿也没事。\n仙人掌的生命力真顽强！我喜欢我的植物朋友——仙人掌，我要学习它顽强的精神。',note:'观察仙人掌的样子（茎、刺），写它耐旱的特点，还写了旅游回来它依然绿油油的事，结尾点出学习它的精神。'}
 ]
},
'习作·看图画，写一写':{
 guide:[
  {h:'审题立意',b:'仔细观察图画，看清楚图上有谁、在什么地方、做什么，然后把图画的内容写下来，可以加上自己的想象。'},
  {h:'选材锦囊',b:'仔细观察图画，看清楚图上的人物、地点、事情，想一想他们在说什么、做什么，再加上自己的想象。'},
  {h:'结构提纲',b:'开头：交代图画上的时间、地点、人物。中间：按顺序写图画上的内容，加上想象。结尾：写自己的感受。'},
  {h:'写作妙招',b:'① 观察要仔细，看清人物、地点、事情；② 加上想象，写人物在说什么、想什么；③ 按顺序写。'},
  {h:'好词百宝箱',b:'图上画着、只见、他们正在、一边……一边……、高高兴兴'},
  {h:'避坑提醒',b:'① 观察不仔细，漏掉重要内容；② 没有加想象，写得太干巴；③ 顺序混乱。'}
 ],
 fanwen:[
  {title:'放风筝（看图写话）',text:'春天到了，天气晴朗，小明和小红一起去公园放风筝。\n公园里绿油油的草地上，小明拿着"燕子"风筝，小红拿着线轴。小明把风筝高高地举过头顶，小红一边跑一边放线。小明一松手，风筝就慢慢地飞上了天空。\n"飞起来了！飞起来了！"小红高兴地喊。风筝越飞越高，在天空中自由地飞翔，像一只真的燕子。\n旁边的小弟弟也拿着风筝，羡慕地看着。小明对他说："来，我们一起放吧！"于是，他们一起放起了风筝。\n天空中飞着许多风筝，有"燕子"，有"老鹰"，还有"蜈蚣"。草地上充满了欢声笑语。\n放风筝真好玩！',note:'仔细观察图画，写清人物（小明、小红）、地点（公园）、事情（放风筝），加上想象（风筝像燕子），内容具体。'},
  {title:'植树（看图写话）',text:'植树节到了，老师带着同学们去山坡上植树。\n山坡上，同学们干得热火朝天。小明和小强一组，他们先挖了一个坑，然后把小树苗放进坑里，扶正，再填上土。小红提来一桶水，给小树苗浇水。\n小树苗种好了，它笔直地站在那里，好像在说："谢谢你们！"同学们看着自己种的小树苗，脸上露出了笑容。\n老师对大家说："植树可以绿化环境，让空气更清新。大家要爱护树木。"\n同学们点点头。他们想：等小树苗长大了，这里就会变成一片绿色的森林。植树真有意义！',note:'观察图画，写清植树的过程（挖坑、放树苗、填土、浇水），加上想象（小树苗说话），结尾点出植树的意义。'},
  {title:'帮助老奶奶（看图写话）',text:'放学了，小明走在回家的路上。忽然，他看见一位老奶奶提着满满一篮水果，走得很吃力。\n小明想：老奶奶年纪大了，提这么重的东西多累啊！我应该帮帮她。于是，他快步走过去，对老奶奶说："老奶奶，我帮您提吧！"\n老奶奶笑着说："谢谢你，好孩子！"\n小明接过篮子，和老奶奶一起走。篮子很重，小明累得满头大汗，但他还是坚持把老奶奶送到了家。\n老奶奶感激地说："你真是个乐于助人的好孩子！快进来喝杯水吧！"小明摆摆手说："不用了，老奶奶，这是我应该做的。"\n小明虽然很累，但心里美滋滋的。帮助别人，真快乐！',note:'观察图画，写清小明帮助老奶奶的事，加上想象（小明想什么、说什么），结尾点出"帮助别人真快乐"。'}
 ]
},
'习作·我做了一项小实验':{
 guide:[
  {h:'审题立意',b:'写自己做的一项小实验：先把实验的经过想清楚，再按顺序写下来，写清实验的步骤和观察到的现象，还可以写写自己的心情和发现。'},
  {h:'选材锦囊',b:'选你做过的实验：鸡蛋浮起来、火山爆发、彩虹雨、摩擦起电……把实验的步骤和现象写清楚。'},
  {h:'结构提纲',b:'开头：交代做什么实验，需要什么材料。中间：按顺序写实验步骤和现象。结尾：写实验结果和你的发现。'},
  {h:'写作妙招',b:'① 按顺序写，先……再……然后……；② 写清观察到的现象；③ 写出心情和发现。'},
  {h:'好词百宝箱',b:'先……再……然后……、接着、最后、我发现、原来、真神奇'},

 ],
 fanwen:[
  {title:'鸡蛋浮起来了',text:'今天，我做了一个有趣的小实验——让鸡蛋浮起来。\n我准备了一杯水、一个鸡蛋、一些盐和一根筷子。\n实验开始了。我先往杯子里倒入清水，把鸡蛋放进去。鸡蛋一下子沉到了杯底。我想：鸡蛋怎么会浮起来呢？\n接着，我往水里加了一勺盐，用筷子搅拌。鸡蛋晃了晃，又沉了下去。我又加了几勺盐，继续搅拌。\n慢慢地，鸡蛋开始往上浮了。我激动地继续加盐、搅拌。终于，鸡蛋浮到了水面上！"鸡蛋浮起来了！"我高兴地喊起来。\n妈妈告诉我："盐水的密度比清水大，所以鸡蛋会浮起来。"原来是这样！这次实验真有趣，我不仅看到了神奇的现象，还学到了知识。',note:'按"倒水放鸡蛋—加盐搅拌—鸡蛋浮起"的顺序写，写清现象和发现，结尾点出学到的知识。'},
  {title:'摩擦起电',text:'今天，我做了一个小实验——摩擦起电。\n我准备了一把塑料尺子和一些碎纸屑。\n我先把碎纸屑撒在桌子上。然后，我拿起塑料尺子，在我的头发上使劲地摩擦。摩擦了一会儿，我把尺子慢慢靠近碎纸屑。\n神奇的事情发生了！碎纸屑像被施了魔法一样，纷纷跳起来，粘到了尺子上。"太神奇了！"我惊讶地喊起来。\n我又试了几次，每次都成功。我问爸爸："为什么尺子能吸起纸屑呢？"爸爸说："尺子和头发摩擦后产生了静电，静电能吸起轻小的东西。"\n原来是这样！这次实验让我明白了摩擦起电的道理，真有趣。',note:'按"撒纸屑—摩擦尺子—靠近纸屑"的顺序写，写清"纸屑粘到尺子上"的现象和"摩擦起电"的原理，内容具体。'},
  {title:'彩虹雨',text:'今天，我做了一个美丽的小实验——彩虹雨。\n我准备了一个透明的杯子、水、食用油和几种颜色的食用色素。\n我先往杯子里倒入大半杯水，再倒入一层食用油。油浮在水面上，分成了两层。\n然后，我把红、黄、蓝几种颜色的色素滴在油层上。色素在油里形成了一个个小圆球。\n过了一会儿，神奇的事情发生了！色素慢慢穿过油层，落进水里，像彩色的雨丝一样落下来。红的、黄的、蓝的，美丽极了！"彩虹雨！"我兴奋地喊起来。\n这次实验真有趣，我看到了美丽的"彩虹雨"，感受到了科学的神奇。',note:'按"倒水倒油—滴色素—观察现象"的顺序写，写清"彩虹雨"的美丽现象，表达兴奋的心情。'}
 ]
},
'习作·奇妙的想象':{
 guide:[
  {h:'审题立意',b:'选一个题目（如《滚来滚去的小土豆》《躲在草丛里的星星》《手罢工了》），也可以自己定题目，大胆想象，编一个奇妙的想象故事。'},
  {h:'选材锦囊',b:'选一个事物，想象它有了梦想、有了生命，或者从不同的角度去想。想象要大胆、奇妙、有趣。'},
  {h:'结构提纲',b:'开头：交代故事的主角。中间：展开想象，写奇妙的事情。结尾：把故事编完整。'},
  {h:'写作妙招',b:'① 想象要大胆、奇妙；② 故事要有趣；③ 可以有一定的道理。'},
  {h:'好词百宝箱',b:'有一天、忽然、没想到、竟然、奇妙、有趣、梦想'},

 ],
 fanwen:[
  {title:'滚来滚去的小土豆',text:'菜园里有一个小土豆，它不甘心一直待在土里，它想去看看外面的世界。\n有一天，小土豆趁农民伯伯不注意，从土里钻了出来，"咕噜咕噜"地滚走了。\n小土豆滚到了草地上。小草对它说："小土豆，你怎么到处滚呀？"小土豆说："我想去看看外面的世界。"\n小土豆又滚到了小河边。小鱼对它说："小土豆，你要去哪里呀？"小土豆说："我想去看看外面的世界。"\n小土豆滚啊滚，滚到了城市里。它看到了高楼大厦，看到了来来往往的汽车，开心极了。\n可是，天黑了，小土豆开始想家了。它想：外面的世界虽然精彩，但还是家里好。于是，小土豆又"咕噜咕噜"地滚回了菜园。\n它想：家，才是最温暖的地方。',note:'想象小土豆想去看看外面的世界，滚到草地、小河、城市，最后回家，故事有趣，结尾点出"家最温暖"。'},
  {title:'躲在草丛里的星星',text:'天上有一颗小星星，它觉得天上太无聊了，就悄悄地躲进了草丛里。\n小星星在草丛里一闪一闪的，像一盏小灯笼。一只萤火虫飞过来，问："你是谁呀？"小星星说："我是从天上来的星星。"\n萤火虫惊讶地说："哇，你是星星！你能陪我玩吗？"小星星高兴地说："好啊！"\n小星星和萤火虫一起在草丛里玩，它们捉迷藏、唱歌、跳舞，玩得可开心了。\n后来，草丛里来了很多小星星，它们和萤火虫成了好朋友。每到晚上，草丛里就一闪一闪的，像天上的星星落了下来。\n人们都说："这片草丛真美，像天上的银河。"小星星听了，开心地笑了。',note:'想象小星星躲进草丛里，和萤火虫做朋友，故事奇妙有趣，结尾"草丛像银河"很美。'},
  {title:'手罢工了',text:'有一天，小明的手突然罢工了。\n小明的手说："你总是用我玩手机，都不让我休息，我不干了！"\n小明急了："手啊手，你别罢工啊！我还要写作业呢！"\n手说："那你以后少玩手机，多让我休息。"\n小明只好答应了。手这才说："那好吧，我暂时不罢工了。"\n从那以后，小明少玩手机，多让手休息。他还用手做很多有意义的事：写作业、画画、帮妈妈做家务。\n手高兴地说："这才是我的好主人！"它再也不罢工了。\n小明明白了：要爱护自己的手，不能总是玩手机。',note:'想象手因为主人总玩手机而罢工，故事有趣，结尾点出"要爱护手，少玩手机"的道理。'}
 ]
},

 fanwen:[
  {title:'我们班的"书虫"',text:'我们班的李明是个名副其实的"书虫"。\n他戴着一副眼镜，手里总是捧着一本书。下课了，别人都出去玩，只有他坐在座位上看书。\n有一次，老师让他去办公室拿作业本。他拿着书就走了，到了办公室才想起来没拿作业本，手里还捧着那本书。老师笑着说："你真是个小书虫！"\n还有一次，他看书看得入了迷，连上课铃响了都没听见。老师走到他身边，轻轻敲了敲他的桌子，他才抬起头，茫然地问："怎么上课了？"\n李明看的书可多了，童话故事、科普知识、历史故事，他都爱看。他的作文也写得特别好，老师经常把他的作文当范文读给我们听。\n这就是我们班的"书虫"，我真佩服他。',note:'抓住"爱看书"的特点，用去办公室还拿书、上课没听见铃两件事来表现，人物形象鲜明。'},
  {title:'我的"幽默"爸爸',text:'我的爸爸是个幽默的人，我们都叫他"开心果"。\n爸爸长得胖乎乎的，一笑起来，眼睛就眯成一条缝。他特别会讲笑话，总能把我们逗得哈哈大笑。\n有一次，我考试没考好，闷闷不乐地回到家。爸爸看出我不开心，就凑过来，一本正经地说："闺女，我给你讲个笑话。从前有座山，山上有座庙，庙里有个老和尚在讲故事，讲的什么呢？从前有座山……"\n我忍不住"扑哧"一声笑了。爸爸见我笑了，又讲了一个笑话，还做着滑稽的动作。我笑得肚子都疼了，不开心的事一下子忘到了九霄云外。\n这就是我的"幽默"爸爸，他给我们家带来了许多快乐。我爱我的爸爸。',note:'抓住"幽默"的特点，用爸爸讲笑话逗"我"开心的具体事例来表现，语言生动，感情真挚。'},
  {title:'勤劳的奶奶',text:'我的奶奶是个勤劳的人，我们都叫她"老黄牛"。\n奶奶虽然年纪大了，可一刻也闲不住。每天早上，天还没亮，她就起床做早餐。然后，她洗衣服、拖地、买菜，忙个不停。\n奶奶还在阳台上种了许多菜。她每天给菜浇水、施肥、捉虫。在她的精心照料下，菜长得绿油油的。我们吃着自己种的菜，觉得特别香。\n有一次，我劝奶奶："奶奶，您歇歇吧，别太累了。"奶奶笑着说："闲不住，干活习惯了。"\n这就是我的"老黄牛"奶奶，她用勤劳的双手，把我们家照顾得井井有条。我爱我的奶奶。',note:'抓住"勤劳"的特点，用做家务、种菜的具体事例来表现，"老黄牛"的外号贴切，结尾表达爱。'}
 ]
},
'习作·国宝大熊猫':{
 guide:[
  {h:'审题立意',b:'介绍国宝大熊猫：先收集关于大熊猫的资料，再把这些资料整理一下，按一定的顺序介绍大熊猫，可以介绍它的外形、习性、生活环境等。'},
  {h:'选材锦囊',b:'先收集大熊猫的资料：外形、吃的食物、生活环境、为什么是国宝……把资料整理一下，按顺序介绍。'},
  {h:'结构提纲',b:'开头：交代要介绍大熊猫。中间：按顺序介绍大熊猫的外形、习性、生活环境等。结尾：总结，表达对大熊猫的喜爱。'},
  {h:'写作妙招',b:'① 先收集资料，再整理；② 按顺序介绍，如外形—食物—生活环境；③ 可以加上自己的感受。'},
  {h:'好词百宝箱',b:'国宝、黑白相间、憨态可掬、津津有味、珍贵、可爱'},
  {h:'避坑提醒',b:'① 资料堆砌，没有条理；② 没有按顺序介绍；③ 没有自己的感受。'}
 ],
 fanwen:[
  {title:'国宝大熊猫',text:'大熊猫是我国的国宝，也是世界珍稀动物。它长得可爱极了，我可喜欢它了。\n大熊猫的样子很特别。它的身体胖乎乎的，毛是黑白相间的。它的头圆圆的，耳朵黑黑的，眼睛周围有一圈黑黑的毛，像戴着一副墨镜。它的四肢也是黑色的，走起路来一摇一摆，憨态可掬。\n大熊猫最爱吃竹子。它吃竹子的时候，用前爪抓住竹子，津津有味地啃着，发出"咔嚓咔嚓"的声音。它一天要吃很多竹子。\n大熊猫生活在我国的四川、陕西等地的深山竹林里。因为大熊猫数量稀少，又很可爱，所以被称为"国宝"。\n我喜欢大熊猫，它是我们的国宝，我们要保护它。',note:'按"外形—食物—生活环境—为什么是国宝"的顺序介绍，内容有条理，结尾表达喜爱和保护之情。'},
  {title:'可爱的大熊猫',text:'你见过大熊猫吗？它可是我国的国宝，非常可爱。\n大熊猫穿着一件黑白相间的"大衣"。它的脸白白的，眼睛周围黑黑的，像熬了夜一样。它的耳朵黑黑的，尾巴短短的。它胖乎乎的身体走起路来一摇一摆，真有趣。\n大熊猫最喜欢吃竹子了。你看，它坐在地上，用前爪抱着竹子，大口大口地吃着，吃得可香了。吃饱了，它就躺在地上呼呼大睡，那样子真可爱。\n大熊猫还是"和平使者"呢！我国把大熊猫送给其他国家，增进友谊。大熊猫深受全世界人民的喜爱。\n大熊猫真可爱，它是我们的国宝，我们要好好保护它。',note:'介绍大熊猫的外形、吃食、睡觉，还写它是"和平使者"，内容丰富，语言活泼。'},
  {title:'我眼中的大熊猫',text:'我最喜欢大熊猫了。去年，我还去动物园看过大熊猫呢！\n大熊猫的样子可真逗。它圆圆的脑袋上长着一对黑耳朵，眼睛周围黑黑的，像戴着一副大墨镜。它的身体胖乎乎的，黑白相间，走起路来慢吞吞的，一摇一摆，真像个憨厚的大胖子。\n大熊猫吃竹子的时候最有趣。它盘腿坐着，用两只前爪紧紧抓住竹子，歪着头，津津有味地啃着，发出"咔嚓咔嚓"的声音，好像在说："真好吃！"\n吃饱喝足后，大熊猫就开始睡觉了。它有的趴在木架上，有的躺在地上，睡得可香了。\n大熊猫是我国的国宝，数量稀少，非常珍贵。我们要保护大熊猫，让它快乐地生活。',note:'用"去动物园看大熊猫"的经历来写，观察仔细，把大熊猫吃竹子、睡觉的样子写得生动有趣。'}
 ]
},
'习作·这样想象真有趣':{
 guide:[

  {h:'选材锦囊',b:'选一个动物，想象它的特征反过来：蚂蚁变大、老鹰变小、蜗牛跑得快、兔子跑得慢……会发生什么有趣的事？'},
  {h:'结构提纲',b:'开头：交代动物的特征发生了变化。中间：写变化后发生的有趣故事。结尾：把故事编完整。'},
  {h:'写作妙招',b:'① 想象要大胆，特征反过来；② 故事要有趣；③ 可以有一定的道理。'},
  {h:'好词百宝箱',b:'有一天、忽然、没想到、竟然、奇妙、有趣、不可思议'},
  {h:'避坑提醒',b:'① 想象不够大胆；② 故事没有趣味；③ 前后不连贯。'}
 ],
 fanwen:[
  {title:'蚂蚁变大了',text:'有一只小蚂蚁，它总是被别的动物欺负，它想：要是我能变大就好了。\n有一天，小蚂蚁的愿望实现了，它变得和大象一样大。\n变大的蚂蚁可威风了。它走在路上，别的动物都让着它。以前欺负它的小虫子，现在看到它就赶紧跑。\n变大的蚂蚁帮助了很多小动物。小兔子过不了河，蚂蚁让它站在自己的背上，把它驮过了河。小松鼠够不到树上的松果，蚂蚁帮它把松果摘了下来。\n可是，变大的蚂蚁也有烦恼。它太大了，进不了自己的家，也找不到朋友陪它玩。\n后来，小蚂蚁明白了：每个人都有自己的特点，做原来的自己最好。它又变回了小蚂蚁，和朋友们快乐地生活在一起。',note:'想象蚂蚁变大，写它变大后的威风和烦恼，结尾点出"做原来的自己最好"，故事有趣又有道理。'},
  {title:'老鹰变小了',text:'有一只老鹰，它总是欺负弱小的动物，大家都讨厌它。\n有一天，老鹰突然变小了，变得和麻雀一样小。\n变小的老鹰再也不能欺负别人了。它飞不高，也抓不到猎物，只好找小虫子吃。它还经常被别的鸟追赶。\n老鹰这才明白，被欺负的滋味真不好受。它向以前被它欺负过的动物道歉："对不起，我以前不该欺负你们。"\n动物们原谅了它。从那以后，老鹰再也不欺负别人了，它和大家成了好朋友。\n这个故事告诉我们：不能欺负别人，要和大家友好相处。',note:'想象老鹰变小，写它变小后的遭遇和感悟，结尾点出"不能欺负别人"的道理，故事完整。'},
  {title:'蜗牛健步如飞',text:'有一只小蜗牛，它爬得太慢了，常常被别的动物嘲笑。它想：要是我能跑得快就好了。\n有一天，小蜗牛的愿望实现了，它变得健步如飞，跑得比兔子还快。\n小蜗牛可高兴了。它跑啊跑，一会儿就跑到了山顶。以前它要爬好几天才能到的地方，现在一会儿就到了。\n小蜗牛还参加了森林跑步比赛。它"嗖"的一下冲了出去，第一个冲过了终点，得了第一名。大家都为它欢呼。\n可是，小蜗牛跑得太快了，它错过了沿途的风景。它想：以前我虽然爬得慢，可是我能慢慢欣赏路上的美景啊。\n小蜗牛明白了：快有快的好处，慢有慢的乐趣。',note:'想象蜗牛健步如飞，写它跑得快的好处和遗憾，结尾点出"快有快的好处，慢有慢的乐趣"，故事有趣又有哲理。'}

  {p:1,s:['小时候，我最喜欢去外婆家。外婆家在一个小山村，那里有清清的小河，绿绿的山坡，还有许许多多的小鸟。']},
  {p:2,s:['每次去外婆家，妈妈都会牵着我的手，走过一条弯弯曲曲的小路。路两旁开满了野花，红的、黄的、紫的，美丽极了。']},
  {p:3,s:['外婆总是在村口等我。一看到我，她就笑着迎上来，把我抱起来。外婆的怀抱暖暖的，香香的。']},
  {p:4,s:['外婆会给我做好吃的，给我讲好听的故事。我在外婆家的院子里追小鸡，看蚂蚁搬家，玩得可开心了。']},
  {p:5,s:['现在我已经长大了，可我还是常常想起去外婆家的日子，想起那条弯弯曲曲的小路，想起外婆暖暖的怀抱。']}

'6 数星星的孩子':{
 author:'佚名',
 read:[
  {p:1,s:['晚上，满天的星星像无数珍珠撒在碧玉盘里。一个孩子坐在院子里，靠着奶奶，仰起头，指着天空数星星。一颗，两颗，一直数到了几百颗。']},
  {p:2,s:['奶奶笑着说："傻孩子，又在数星星了。那么多星星，一闪一闪地乱动，眼都看花了，你能数得清吗？"']},
  {p:3,s:['孩子说："奶奶，能看得见，就能数得清。星星是在动，可不是乱动。您看，这颗星星和那颗星星，中间总是隔那么远。"']},
  {p:4,s:['爷爷走过来，说："孩子，你看得很仔细。天上的星星是在动，可是它们之间的距离是不变的。你看，那七颗星，连起来像一把勺子，叫北斗七星。勺口对着的那颗星，就是北极星。北斗七星总是绕着北极星转。"']},
  {p:5,s:['爷爷说的话是真的吗？这孩子一夜没睡好，几次起来看星星。他看清楚了，北斗七星果然绕着北极星慢慢地转动。']},
  {p:6,s:['这个数星星的孩子叫张衡，是汉朝人。他刻苦钻研天文，成了著名的天文学家。']}

 author:'佚名',
 read:[
  {p:1,s:['闻名中外的黄山风景区在我国安徽省南部。那里景色秀丽神奇，尤其是那些怪石，有趣极了。']},
  {p:2,s:['就说"仙桃石"吧，它好像从天上飞下来的一个大桃子，落在山顶的石盘上。']},
  {p:3,s:['在一座陡峭的山峰上，有一只"猴子"。它两只胳膊抱着腿，一动不动地蹲在山头，望着翻滚的云海。这就是有趣的"猴子观海"。']},
  {p:4,s:['"仙人指路"就更有趣了！远远望去，那巨石真像一位仙人站在高高的山峰上，伸着手臂指向前方。']},
  {p:5,s:['每当太阳升起，有座山峰上的几块巨石，就变成了一只金光闪闪的雄鸡。它伸着脖子，对着天都峰不住地啼叫。不用说，这就是著名的"金鸡叫天都"了。']},
  {p:6,s:['黄山的奇石还有很多，像"天狗望月""狮子抢球""仙女弹琴"。那些叫不出名字的奇形怪状的岩石，正等你去给它们起名字呢！']}

'9 日月潭':{
 author:'佚名',
 read:[
  {p:1,s:['日月潭是我国台湾省最大的一个湖。它在台中附近的高山上。那里群山环绕，树木茂盛，周围有许多名胜古迹。']},
  {p:2,s:['日月潭很深，湖水碧绿。湖中央有个美丽的小岛，叫光华岛。小岛把湖水分成两半，北边像圆圆的太阳，叫日潭；南边像弯弯的月亮，叫月潭。']},
  {p:3,s:['清晨，湖面上飘着薄薄的雾。天边的晨星和山上的点点灯光，隐隐约约地倒映在湖水中。']},
  {p:4,s:['中午，太阳高照，整个日月潭的美景和周围的建筑，都清晰地展现在眼前。要是下起蒙蒙细雨，日月潭好像披上轻纱，周围的景物一片朦胧，就像童话中的仙境。']},
  {p:5,s:['日月潭风光秀丽，吸引了许许多多的中外游客。']}

'10 葡萄沟':{
 author:'佚名',
 read:[
  {p:1,s:['新疆吐鲁番有个地方叫葡萄沟。那里出产水果。五月有杏子，七八月有香梨、蜜桃、沙果，到了九十月份，人们最喜爱的葡萄成熟了。']},
  {p:2,s:['葡萄种在山坡的梯田上。茂密的枝叶向四面展开，就像搭起了一个个绿色的凉棚。到了秋季，葡萄一大串一大串地挂在绿叶底下，有红的、白的、紫的、暗红的、淡绿的，五光十色，美丽极了。']},
  {p:3,s:['要是这时候你到葡萄沟去，热情好客的维吾尔族老乡，准会摘下最甜的葡萄，让你吃个够。']},
  {p:4,s:['收下来的葡萄有的运到城市去，有的运到阴房里制成葡萄干。阴房修在山坡上，样子很像碉堡，四壁留着许多小孔，里面钉着许多木架子。成串的葡萄挂在架子上，利用流动的热空气，把水分蒸发掉，就成了葡萄干。这里生产的葡萄干颜色鲜，味道甜，非常有名。']},
  {p:5,s:['葡萄沟真是个好地方。']}

'12 寒号鸟':{
 author:'佚名',
 read:[
  {p:1,s:['山脚下有一堵石崖，崖上有一道缝，寒号鸟就把这道缝当作自己的窝。石崖前面有一条河，河边有一棵大杨树，杨树上住着喜鹊。寒号鸟和喜鹊面对面住着，成了邻居。']},
  {p:2,s:['几阵秋风，树叶落尽，冬天快要到了。','有一天，天气晴朗。喜鹊一早飞出去，东寻西找，衔回来一些枯草，就忙着做窝，准备过冬。寒号鸟却只知道出去玩，累了就回来睡觉。喜鹊说："寒号鸟，别睡了。天气暖和，赶快做窝。"','寒号鸟不听劝告，躺在崖缝里对喜鹊说："傻喜鹊，不要吵。太阳高照，正好睡觉。"']},
  {p:3,s:['冬天说到就到，寒风呼呼地刮着。喜鹊住在温暖的窝里。寒号鸟在崖缝里冻得直打哆嗦，不停地叫着："哆啰啰，哆啰啰，寒风冻死我，明天就做窝。"']},
  {p:4,s:['第二天清早，风停了，太阳暖暖的，好像又是春天了。喜鹊来到崖缝前劝寒号鸟："趁天晴，快做窝。现在懒惰，将来难过。"','寒号鸟还是不听劝告，伸伸懒腰，答道："傻喜鹊，别啰嗦。天气暖和，得过且过。"']},
  {p:5,s:['寒冬腊月，大雪纷飞。北风像狮子一样狂吼，崖缝里冷得像冰窖。寒号鸟重复着哀号："哆啰啰，哆啰啰，寒风冻死我，明天就做窝。"','天亮了，太阳出来了，喜鹊在枝头呼唤寒号鸟。可是，寒号鸟已在夜里冻死了。']}

'15 朱德的扁担':{
 author:'佚名',
 read:[
  {p:1,s:['1928年，朱德同志带领队伍到井冈山，跟毛主席会师了。红军在山上，山下不远处就是敌人。']},
  {p:2,s:['井冈山上生产的粮食不多，常常要抽出一些人到山下宁冈的茅坪去挑粮。从井冈山到茅坪，来回有五六十里，山高路陡，非常难走。可是每次挑粮，大家都争着去。']},
  {p:3,s:['朱德同志也跟战士们一块儿去挑粮。他穿着草鞋，戴着斗笠，挑起粮食，跟大家一块儿爬山。白天挑粮爬山，晚上还常常整夜整夜地研究怎样跟敌人打仗。大家看了心疼，就把他那根扁担藏了起来。不料，朱德同志又找来一根扁担，写上"朱德的扁担"五个字。']},
  {p:4,s:['大家见了，越发敬爱朱德同志，不好意思再藏他的扁担了。']}

'16 难忘的泼水节':{
 author:'佚名',
 read:[
  {p:1,s:['火红火红的凤凰花开了，傣族人民一年一度的泼水节又到了。']},
  {p:2,s:['今年，傣族人民特别高兴，因为敬爱的周恩来总理要和他们一起过泼水节。']},
  {p:3,s:['那天早晨，人们敲起象脚鼓，从四面八方赶来了。为了欢迎周总理，人们在地上撒满了凤凰花的花瓣，好像铺上了鲜红的地毯。一条条龙船驶过江面，一串串花炮升上天空。人们欢呼着："周总理来了！"']},
  {p:4,s:['周总理身穿对襟白褂，咖啡色长裤，头上包着一条水红色头巾，笑容满面地来到人群中。他接过一只象脚鼓，敲着欢乐的鼓点，踩着凤凰花铺成的"地毯"，同傣族人民一起跳舞。']},
  {p:5,s:['开始泼水了。周总理一手端着盛满清水的银碗，一手拿着柏树枝蘸了水，向人们泼洒，为人们祝福。傣族人民一边欢呼，一边向周总理泼水，祝福他健康长寿。']},
  {p:6,s:['清清的水，泼呀，洒呀！周总理和傣族人民笑哇，跳哇，是那么开心！','1961年的泼水节，傣族人民永远难忘。']}

'17 刘胡兰':{
 author:'佚名',
 read:[
  {p:1,s:['1947年1月12日，天阴沉沉的，寒风吹到脸上像刀割一样。国民党反动派的兵包围了云周西村。由于叛徒的出卖，年轻的共产党员刘胡兰被捕了。']},
  {p:2,s:['敌人把刘胡兰拉到庙门口的广场上，当着她和乡亲们的面，铡死了被捕的六位革命群众。敌人指着血淋淋的铡刀，凶狠地说："不说，也铡死你！"刘胡兰挺起胸膛说："要杀要砍由你们，怕死不当共产党员！"']},
  {p:3,s:['敌人恼羞成怒，把刘胡兰拉到铡刀前。刘胡兰像钢铁铸成似的，一点儿也不动摇。她迎着呼呼的北风，踏着烈士的鲜血，走到铡刀前，壮烈牺牲了。那时她才十五岁。']},
  {p:4,s:['毛主席听到这个消息，亲笔为她写了题词："生的伟大，死的光荣。"']}

 author:'佚名',
 read:[
  {p:1,s:['从前有一片雾，他是个又淘气又顽皮的孩子。']},
  {p:2,s:['有一天，雾飞到海上。','"我要把大海藏起来。"于是，他把大海藏了起来。无论是海水、船只，还是蓝色的远方，都看不见了。']},
  {p:3,s:['"现在我要把天空连同太阳一起藏起来。"于是，他把天空连同太阳一起藏了起来。霎时，四周变暗了，无论是天空，还是天空中的太阳，都看不见了。']},
  {p:4,s:['雾来到岸边。','"我要把海岸藏起来。"雾把海岸藏了起来，同时也把城市藏了起来。房屋、街道、树木、桥梁，甚至行人和小黑猫，雾把一切都藏了起来，什么都看不见了。']},
  {p:5,s:['他躲在城市的上空，说道："现在，我该把谁藏起来呢？"看来，再也没有可藏的了。','"我要把自己藏起来。"雾把自己藏了起来。','不久，大海连同船只和远方，天空连同太阳，海岸连同城市，街道连同房屋和桥梁，都露出来了。路上走着行人。小黑猫也出现了，它摇着黑尾巴，悠闲地散步。','雾呢？不知道消失到哪里去了。']}

'20 雪孩子':{
 author:'佚名',
 read:[
  {p:1,s:['雪，下个不停，一连下了好几天。','这天早上，天晴了，兔妈妈要出门去。小白兔嚷起来："妈妈，妈妈，我也要去！"','兔妈妈说："好孩子，妈妈有事，你不能跟着去。"兔妈妈在门外的空地上给小白兔堆了个雪孩子。小白兔有了小伙伴，就不跟妈妈去了。']},
  {p:2,s:['小白兔跳舞给雪孩子看，唱歌给雪孩子听。他玩累了，就回家去睡午觉。"屋子里真冷，赶快往火堆里添把柴吧！"','小白兔添了柴，把火烧得旺旺的，屋子里渐渐暖和了。他躺在床上，闭上眼睛，一会儿就睡着了。']},
  {p:3,s:['火越烧越旺。哎呀，火把身边的柴堆烧着了！可是小白兔睡得正香，他一点儿也不知道。','"不好了！小白兔家着火了！"雪孩子看见小白兔家的窗子里冒出黑烟，蹿出火星，他一边喊，一边向小白兔家奔去。']},
  {p:4,s:['"小白兔，小白兔！你在哪里？"雪孩子冲进屋子里，冒着呛人的烟、烫人的火，找哇找哇，终于找到了小白兔。他连忙把小白兔抱起来，跑到屋外。']},
  {p:5,s:['小白兔得救了，雪孩子却浑身水淋淋的。','这时候，树林里的小猴子、小刺猬都赶来救火了。不一会儿，大家就把火扑灭了。','兔妈妈回来了，激动地说："谢谢大家来救火，救了小白兔，谢谢大家！"','咦，雪孩子呢？"雪孩子到哪里去了呢？"小白兔问。','"瞧，太阳晒着晒着，他变成了水汽，飞上天空，变成了一朵白云。"小猴子指着天空说。']}

'22 纸船和风筝':{
 author:'佚名',
 read:[
  {p:1,s:['松鼠和小熊是好朋友。','松鼠住在山顶，小熊住在山脚。山上的小溪往下流，正好从小熊的家门口流过。']},
  {p:2,s:['松鼠折了一只纸船，放在小溪里。纸船漂哇漂，漂到了小熊家门口。','小熊拿起纸船一看，乐坏了。纸船里放着一个小松果，松果上挂着一张纸条，上面写着："祝你快乐！"']},
  {p:3,s:['小熊也想折一只纸船送给松鼠，可是纸船漂不到松鼠家去。怎么办呢？他想了想，就扎了一只风筝。风筝乘着风，飘哇飘，飘到了松鼠家门口。','松鼠一把抓住风筝的线一看，也乐坏了。风筝上挂着一个草莓，风筝的翅膀上写着："祝你幸福！"']},
  {p:4,s:['纸船和风筝让他们俩成了好朋友。','可是有一天，他们俩为了一点小事吵了一架。山顶上再也看不到飘荡的风筝，小溪里再也看不到漂流的纸船了。']},
  {p:5,s:['小熊很难过。他还是每天扎一只风筝，但是不好意思把风筝放起来，就把风筝挂在高高的树枝上。','松鼠也很难过。他还是每天折一只纸船，他也不好意思把纸船放进小溪，就把纸船放到屋顶上。']},
  {p:6,s:['过了几天，松鼠再也受不了啦。他在一只折好的纸船上写了一句话："如果你愿意和好，就放一只风筝吧！"他把这只纸船放进了小溪。','傍晚，松鼠看见一只美丽的风筝朝他飞来，高兴得哭了。他连忙爬上屋顶，把一只只纸船放到了小溪里。']}

'23 快乐的小河':{
 author:'佚名',
 read:[
  {p:1,s:['有一条小河，他总是快乐地流淌着。他一边跑，一边唱歌，"哗哗哗"，"哗哗哗"，歌声传得很远很远。']},
  {p:2,s:['小河跑过一片草地。小草对他说："小河，小河，请你慢点儿跑，让我喝饱水吧。"小河说："好呀，好呀！"他就放慢脚步，让小草喝个够。小草喝饱了水，变得更绿了。']},
  {p:3,s:['小河跑过一片树林。小鸟对他说："小河，小河，请你停一停，让我洗个澡吧。"小河说："好呀，好呀！"他就停下来，让小鸟洗个澡。小鸟洗完了澡，羽毛更亮了。']},
  {p:4,s:['小河跑过田野。稻谷对他说："小河，小河，请你流过来，让我喝饱水吧。"小河说："好呀，好呀！"他就流过去，让稻谷喝个够。稻谷喝饱了水，笑弯了腰。']},
  {p:5,s:['小河帮助了大家，心里真快乐。他一边跑，一边唱歌，"哗哗哗"，"哗哗哗"，歌声传得很远很远。']}

 read:[
  {p:1,s:['一个春天的傍晚，妈妈牵着妹妹，爸爸牵着我，一起到郊外去散步。']},
  {p:2,s:['我们沿着小河走。河水碧绿碧绿的，微风吹过，泛起层层波纹。河岸上垂下来的柳叶，拂过妈妈和爸爸的头发，我和妹妹看着都笑了。']},
  {p:3,s:['路的一边是田野，葱葱绿绿的，非常可爱，像一片柔软的绿毯。']},
  {p:4,s:['春天的郊外，景色异常美丽。我们一边看，一边走，路已经走了不少，却还恋恋不舍，不想回去。']},
  {p:5,s:['当我们往回走的时候，妹妹求妈妈抱她："我很累，走不动了，抱抱我。"','妈妈摇摇头，回答说："不行啊，我也很累，抱不动你了。"']},
  {p:6,s:['妹妹转过头求爸爸。爸爸不作声，他松开我的手，从路旁一株柳树下，拾起一根又长又细的枝条，把它递给了妹妹，说："这是一匹出色的马，你走不动了，就骑着它回家吧。"']},
  {p:7,s:['妹妹高兴地跨上"马"，蹦蹦跳跳地奔向前去。等我们回到家时，她已经在门口迎接我们，笑着说："我早回来啦！"']}

'10 枫树上的喜鹊':{
 author:'佚名',
 read:[
  {p:1,s:['我们村的渡口旁有一棵枫树，我很喜欢它。它好像一把很大又很高的绿色太阳伞，一直打开着。它的绿荫遮蔽了村里的渡口。枫树上有一个喜鹊的窝，我喜欢极了。']},
  {p:2,s:['是的，我喜欢站在枫树下，抬头看喜鹊的窝。我常常觉得喜鹊会跟我说话，我像童话书里那样，在心中称呼她喜鹊阿姨。']},
  {p:3,s:['我真是喜欢极了。上个星期六早上，我正要撑着渡船到对岸的树林里去打柴，发现喜鹊阿姨的鸟窝里有六只小喜鹊了。']},
  {p:4,s:['我真是像童话书里那样，在心中称呼他们喜鹊弟弟。']},
  {p:5,s:['从那天起，我一有空，便来到渡口边，站在枫树下看望我的喜鹊弟弟。喜鹊弟弟长得真快，好极了。我看见喜鹊阿姨站在窝边，一会儿教喜鹊弟弟唱歌，一会儿教他们做游戏，一会儿教他们学自己发明的拼音字母……']},
  {p:6,s:['"鹊！鹊！鹊！"喜鹊阿姨教道。','我知道，这便是a、o、i。','喜鹊弟弟也跟着学："鹊，鹊，鹊……"']},
  {p:7,s:['今天早上，太阳从渡口对岸山冈后面升上来了，我看见喜鹊阿姨站在窝边，指着上升的太阳，问喜鹊弟弟："鹊！鹊鹊鹊？"','我懂得，她问话的意思是："看！那是什么？"','喜鹊弟弟一齐快乐地回答："鹊！鹊鹊！鹊鹊鹊！"','我懂得，喜鹊弟弟很快给出了答案："妈妈，那是太阳！太阳升上来了！"','我真高兴啊！']}

'11 寓言二则':{
 author:'佚名',
 read:[
  {p:1,s:['亡羊补牢','从前有个人，养了几只羊。一天早上，他去放羊，发现羊少了一只。原来羊圈破了个窟窿，夜里狼从窟窿钻进去，把羊叼走了。']},
  {p:2,s:['街坊劝他说："赶紧把羊圈修一修，堵上那个窟窿吧！"','他说："羊已经丢了，还修羊圈干什么？"']},
  {p:3,s:['第二天早上，他去放羊，发现羊又少了一只。原来狼又从窟窿钻进去，把羊叼走了。']},
  {p:4,s:['他很后悔没有接受街坊的劝告，心想，现在修还不晚。他赶紧堵上那个窟窿，把羊圈修得结结实实的。从此，他的羊再也没丢过。']},
  {p:5,s:['揠苗助长','古时候有个人，他巴望自己田里的禾苗长得快些，天天到田边去看。可是一天，两天，三天，禾苗好像一点儿也没有长高。他在田边焦急地转来转去，自言自语地说："我得想个办法帮它们长。"']},
  {p:6,s:['一天，他终于想出了办法，就急忙跑到田里，把禾苗一棵一棵往高里拔。从中午一直忙到太阳落山，弄得筋疲力尽。']},
  {p:7,s:['他回到家里，一边喘气一边说："今天可把我累坏了！力气总算没白费，禾苗都长高了一大截。"','他的儿子不明白是怎么回事，第二天跑到田里一看，禾苗都枯死了。']}

'12 画杨桃':{
 author:'佚名',
 read:[
  {p:1,s:['我读小学四年级的时候，父亲开始教我画画。他对我要求很严，经常叮嘱我："你看见一件东西，是什么样的，就画成什么样，不要想当然，画走了样。"']},
  {p:2,s:['有一次学校上图画课，老师把两个杨桃摆在讲桌上，要同学们画。我的座位在前排靠边的地方，讲桌上那两个杨桃的一端正对着我。我看到的杨桃根本不像平时看到的那样，而像是五个角的什么东西。']},
  {p:3,s:['我认认真真地看，老老实实地画，自己觉得画得很准确。','当我把这幅画交出去的时候，班里几个同学看见了，哈哈大笑起来。','"杨桃是这个样子的吗？"','"倒不如说是五角星吧！"']},
  {p:4,s:['老师看了看这幅画，到我的座位上坐下来，审视了一下讲桌上的杨桃，然后回到讲桌前，举起我的那页画纸，问大家：','"这幅画画得像不像？"','"不像！"','"它像什么？"','"像五角星！"']},
  {p:5,s:['老师让这几个同学坐到我的座位上，让他们看看杨桃是什么样子的。他们看了看，都不说话了。','老师的神情变得严肃了。他说："提起杨桃，大家都很熟悉。但是，看的角度不同，杨桃的样子也就不一样。当我们看见别人把杨桃画成五角星的时候，不要忙着发笑，要看看人家是从什么角度看的。"']},
  {p:6,s:['老师的教诲让我终生难忘。']}

'13 小马过河':{
 author:'佚名',
 read:[
  {p:1,s:['马棚里住着一匹老马和一匹小马。有一天，老马对小马说："你已经长大了，能帮妈妈做点事吗？"小马连蹦带跳地说："怎么不能？我很愿意帮您做事。"老马高兴地说："那好啊，你把这半口袋麦子驮到磨坊去吧。"']},
  {p:2,s:['小马驮起口袋，飞快地往磨坊跑去。跑着跑着，一条小河挡住了去路，河水哗哗地流着。小马为难了，心想：我能不能过去呢？如果妈妈在身边，问问她该怎么办，那多好啊！可是他离家已经很远了。']},
  {p:3,s:['小马向四周望望，看见一头老牛在河边吃草，小马嗒嗒嗒跑过去，问道："牛伯伯，请您告诉我，这条河，我能蹚过去吗？"老牛说："水很浅，刚没小腿，能蹚过去。"']},
  {p:4,s:['小马听了老牛的话，立刻跑到河边，准备蹚过去。突然，从树上跳下一只松鼠，拦住他大叫："小马！别过河，别过河，你会淹死的！"小马吃惊地问："水很深吗？"松鼠认真地说："深得很哩！昨天，我的一个伙伴就是掉在这条河里淹死的！"']},
  {p:5,s:['小马连忙收住脚步，不知道怎么办才好。他叹了口气，说："唉！还是回家问问妈妈吧！"小马甩甩尾巴，跑回家去。妈妈问他怎么回来了，小马难为情地说："一条河挡住了去路，我……我过不去。"妈妈问："那条河不是很浅吗？"小马说："是啊！牛伯伯也这么说。可是松鼠说河水很深，还淹死过他的伙伴呢！"']},
  {p:6,s:['妈妈说："那么河水到底是深还是浅呢？你仔细想过他们的话吗？"小马低下了头，说："没……没想过。"妈妈亲切地对小马说："孩子，光听别人说，自己不动脑筋，不去试试，是不行的。河水是深是浅，你去试一试就知道了。"']},
  {p:7,s:['小马跑到河边，刚刚抬起前蹄，松鼠又大叫起来："怎么？你不要命啦！"小马说："让我试试吧！"他下了河，小心地蹚到了对岸。原来河水既不像老牛说的那样浅，也不像松鼠说的那样深。']}
 ],

 author:'佚名',
 read:[

  {p:2,s:['忽然一阵大风，吹得树枝乱摆。一只蜘蛛从网上垂下来，逃走了。']},

  {p:1,s:['你知道宇航员在太空中怎样生活吗？说起来还挺有趣呢！']},
  {p:2,s:['在宇宙飞船里，站着睡觉和躺着睡觉一样舒服。不过，要想睡上一个安稳觉，宇航员必须把自己绑在睡袋里。不然，翻一个身，就会飘到别处去了。']},
  {p:3,s:['喝水的时候，如果用普通杯子，即使把杯子倒过来，水也不会往下流。因为在宇宙飞船里，水失去了重量。宇航员要想喝到水，得使用一种带吸管的塑料杯。']},
  {p:4,s:['在宇宙飞船里走路更有趣。人稍一使劲就会飘到半空中，咳嗽一声就有可能后退好几步。为了能平稳地走路，宇航员都穿鞋底带钩的鞋子，好牢牢地钩住带网格的地板。']},
  {p:5,s:['在宇宙飞船里洗澡可不是容易的事。从喷头喷出的水总是飘浮在空中。为了解决这个难题，科学家设计了一种特殊的淋浴器，它可以把喷出来的水朝一个方向吸。']},
  {p:6,s:['你看，在太空中生活，是不是很有趣？']}

'18 大象的耳朵':{
 author:'佚名',
 read:[
  {p:1,s:['大象有一对大耳朵，像扇子似的，耷拉着。']},
  {p:2,s:['这一天，大象正在路上慢慢地散步，遇到了小兔子。小兔子说："咦，大象啊，你的耳朵怎么耷拉着？"大象说："我生来就是这样啊。"小兔子说："你看，我的耳朵是竖着的，你的耳朵一定是出毛病了。"']},
  {p:3,s:['后来，大象又遇到了小羊。小羊也说："大象啊，你的耳朵怎么是耷拉着的呢？"']},
  {p:4,s:['小鹿、小马，还有小老鼠，见到了大象，都要说他的耳朵。']},
  {p:5,s:['大象也不安起来，他自言自语地说："他们都这么说，是不是我的耳朵真的有毛病啦？我得让我的耳朵竖起来。"']},
  {p:6,s:['怎么才能让耳朵竖起来呢？后来，大象就用两根竹竿把耳朵撑起来。这样，耳朵就竖起来了。']},
  {p:7,s:['可是，大象的耳朵眼儿里，经常有小飞虫飞进去，还在里面跳舞，吵得他又头痛，又心烦。']},
  {p:8,s:['最后，大象还是把他的耳朵放了下来。这样，虫子飞不进去了。有虫子来的话，大象只要把他的大耳朵一扇，就能把他们赶跑。']},
  {p:9,s:['大象说："我还是让耳朵耷拉着吧。人家是人家，我是我。"']}

'19 蜘蛛开店':{
 author:'佚名',
 read:[
  {p:1,s:['有一只蜘蛛，每天蹲在网上等着小飞虫落在上面，好寂寞，好无聊啊。']},
  {p:2,s:['蜘蛛决定开一家商店。卖什么呢？就卖口罩吧，因为口罩织起来很简单。','于是，蜘蛛在一间小木屋外面挂了一个招牌，上面写着："口罩编织店，每位顾客只需一元钱。"']},
  {p:3,s:['顾客来了，是一只河马。河马嘴巴那么大，口罩好难织啊，蜘蛛用了一整天的工夫，终于织完了。']},
  {p:4,s:['晚上，蜘蛛想：还是卖围巾吧，因为围巾织起来很简单。','第二天，蜘蛛的招牌换了，上面写着："围巾编织店，每位顾客只需一元钱。"']},
  {p:5,s:['顾客来了，只见身子不见头。蜘蛛向上一看，原来是一只长颈鹿，他的脖子和大树一样高，脑袋从树叶间露出来，正对着蜘蛛笑呢。','蜘蛛织啊织，足足忙了一个星期，才织完那条长长的围巾。']},
  {p:6,s:['蜘蛛累得趴倒在地上，心里想：还是卖袜子吧，因为袜子的尺寸很小。','第二天，蜘蛛的招牌又换了，上面写着："袜子编织店，每位顾客只需一元钱。"']},

'20 青蛙卖泥塘':{
 author:'佚名',
 read:[
  {p:1,s:['青蛙住在烂泥塘里。他觉得这儿不怎么样，想把泥塘卖掉，搬到城里去住。']},
  {p:2,s:['于是青蛙在泥塘边竖起一块牌子。','"卖泥塘喽，卖泥塘！"青蛙站在牌子下面，大声吆喝起来。']},
  {p:3,s:['一头老牛走过来，看了看泥塘，说："这个水坑坑嘛，在里面打打滚倒挺舒服。不过，周围没有草，不想买。"','老牛不想买泥塘，走了。']},
  {p:4,s:['青蛙想，要是在泥塘周围种些草，就能卖出去了。于是他就去采集草籽，播撒在泥塘周围的地上。']},
  {p:5,s:['到了春天，泥塘周围长出了绿茵茵的小草。青蛙又站在牌子下面，大声吆喝起来："卖泥塘喽，卖泥塘！"']},
  {p:6,s:['一只野鸭飞来了，看了看泥塘，说："这地方好是好，就是塘里的水太少了。"','野鸭没有买泥塘，飞走了。']},
  {p:7,s:['于是，青蛙又去采集草籽，播撒在泥塘周围的地上，又跑到山里引了水，把泥塘灌满了水。']},
  {p:8,s:['后来，蝴蝶飞来了，说这里缺点花；小鸟飞来了，说这里缺点树；小兔子跑来了，说这里缺条路……']},
  {p:9,s:['每次听了小动物的话，青蛙都想：对！对！要是那样的话，泥塘准能卖出去。于是就照着做，栽了花，种了树，修了路……']},
  {p:10,s:['"卖泥塘喽，卖泥塘！"有一天，青蛙又站在牌子旁吆喝起来，"多好的地方！有树，有花，有草，有水塘。你可以看蝴蝶在花丛中飞舞，听小鸟在树上唱歌。你可以在水里尽情游泳，躺在草地上晒太阳。这儿还有道路通到城里……"说到这里，青蛙突然愣住了，他想：这么好的地方，自己住多好，为什么要卖掉呢？']},
  {p:11,s:['于是青蛙不再卖泥塘了。']}
 ],

'21 小毛虫':{
 author:'佚名',
 read:[
  {p:1,s:['一条小毛虫趴在一片叶子上，用新奇的目光观察着周围的一切：各种昆虫欢歌曼舞，飞的飞，跑的跑，又是唱，又是跳……到处生机勃勃。只有它，可怜的小毛虫，被抛弃在一旁，既不会跑，也不会飞。']},
  {p:2,s:['小毛虫费了九牛二虎之力，才挪动了一点点。当它笨拙地从一片叶子爬到另一片叶子上时，它觉得自己就像是周游了整个世界。']},
  {p:3,s:['尽管如此，它并不悲观失望，也不羡慕任何人。它懂得：每个人都有各自该做的事情。它，一只小小的毛虫，应该学会吐纤细的银丝，为自己编织一间牢固的茧屋。']},
  {p:4,s:['小毛虫一刻也没有迟疑，尽心竭力地做着工作，为自己编织了一间茧屋。它把自己从头到脚裹进了温暖的茧屋里。']},
  {p:5,s:['"以后会怎样呢？"它在与世隔绝的茧屋里问。','"万事万物都有自己的规律！"小毛虫听到一个声音在回答，"你要耐心等待，以后会明白的。"']},
  {p:6,s:['时辰到了，它清醒了过来，再也不是以前那条笨手笨脚的小毛虫。它灵巧地从茧子里挣脱出来，惊奇地发现自己身上生出一对轻盈的翅膀，上面布满色彩斑斓的花纹。它高兴地舞动了一下双翅，竟像一团绒毛，从叶子上飘然而起，它飞啊飞，渐渐地消失在蓝色的雾霭之中。']}

'22 羿射九日':{
 author:'佚名',
 read:[
  {p:1,s:['很久很久以前，天上住着十个太阳。他们都是天帝的儿子，每天轮流在天空值班。']},
  {p:2,s:['可是有一天，十个太阳一齐跑出来，挂在天上。十个太阳像十个大火球，炙烤着大地。禾苗被晒枯了，土地被烤焦了，江河里的水被蒸干了，连地上的沙石好像都要被熔化了。人类的日子非常艰难。']},
  {p:3,s:['神箭手羿决心帮助人们脱离苦海。他翻过九十九座高山，蹚过九十九条大河，来到东海边。他登上一座大山，搭上神箭，拉开神弓，对准天上的一个太阳，嗖地就是一箭。那个太阳一下子爆裂开，一团团火球到处乱窜，接着，噗噗地掉在地上。']},
  {p:4,s:['羿一口气射下了九个太阳，炎热渐渐退去。可是，天上的太阳只剩下一个了。羿想，没有了太阳，世界将一片黑暗，庄稼不能生长，人类和动物也没法活下去。于是，羿留下了最后一个太阳。']},
  {p:5,s:['从此，太阳每天从东方升起，到西方落下。土地渐渐滋润起来，花草树木渐渐繁茂起来，江河奔腾欢唱，大地上重新现出了勃勃生机。人们又重新过上了安居乐业的生活。']}

'23 黄帝的传说':{
 author:'佚名',
 read:[
  {p:1,s:['相传四五千年前，黄河流域住着许多部落，其中有一个部落的首领叫黄帝。他聪明能干，很受人们的爱戴。']},

'2 草原':{
 author:'老舍',
 read:[
  {p:1,s:['这次，我看到了草原。那里的天比别处的更可爱，空气是那么清鲜，天空是那么明朗，使我总想高歌一曲，表示我满心的愉快。','在天底下，一碧千里，而并不茫茫。四面都有小丘，平地是绿的，小丘也是绿的。羊群一会儿上了小丘，一会儿又下来，走在哪里都像给无边的绿毯绣上了白色的大花。','那些小丘的线条是那么柔美，就像只用绿色渲染，不用墨线勾勒的中国画那样，到处翠色欲流，轻轻流入云际。']},
  {p:2,s:['我们访问的是陈巴尔虎旗。汽车走了一百五十里，才到达目的地。一百五十里全是草原。再走一百五十里，也还是草原。草原上行车十分洒脱，只要方向不错，怎么走都可以。']},
  {p:3,s:['初入草原，听不见一点儿声音，也看不见什么东西，除了一些忽飞忽落的小鸟。','走了许久，远远地望见了一条迂回的明如玻璃的带子——河！','牛羊多起来，也看到了马群，隐隐有鞭子的轻响。','快了，快到了。','忽然，像被一阵风吹来似的，远处的小丘上出现了一群马，马上的男女老少穿着各色的衣裳，群马疾驰，襟飘带舞，像一条彩虹向我们飞过来。','这是主人来到几十里外欢迎远客。','见到我们，主人们立刻拨转马头，欢呼着，飞驰着，在汽车左右与前面引路。']},
  {p:4,s:['静寂的草原热闹起来：欢呼声，车声，马蹄声，响成一片。','车跟着马飞过小丘，看见了几座蒙古包。','蒙古包外，许多匹马，许多辆车。人很多，都是从几十里外乘马或坐车来看我们的。','主人们下了马，我们下了车。也不知道是谁的手，总是热乎乎地握着，握住不散。','大家的语言不同，心可是一样。握手再握手，笑了再笑。你说你的，我说我的，总的意思是民族团结互助。']},
  {p:5,s:['也不知怎的，就进了蒙古包。奶茶倒上了，奶豆腐摆上了，主客都盘腿坐下，谁都有礼貌，谁都又那么亲热，一点儿不拘束。','不大一会儿，好客的主人端进来大盘的手抓羊肉。','干部向我们敬酒，七十岁的老翁向我们敬酒。我们回敬，主人再举杯，我们再回敬。','这时候，鄂温克族姑娘们戴着尖尖的帽儿，既大方，又稍有点儿羞涩，来给客人们唱民歌。','我们同行的歌手也赶紧唱起来。歌声似乎比什么语言都更响亮，都更感人，不管唱的是什么，听者总会露出会心的微笑。']},
  {p:6,s:['饭后，小伙子们表演套马、摔跤，姑娘们表演了民族舞蹈。客人们也舞的舞，唱的唱，并且要骑一骑蒙古马。','太阳已经偏西，谁也不肯走。是啊！蒙汉情深何忍别，天涯碧草话斜阳！']}
 ],

'3 草虫的村落':{
 author:'郭枫',
 read:[
  {p:1,s:['今天，我又躺在田野里，在无限的静谧中，忘了世界，也忘了自己。']},
  {p:2,s:['我目光追随着爬行的小虫，作了一次奇异的游历。','空间在我眼前扩大了，细密的草茎组成了茂盛的森林。一只小虫，生着一副坚硬黑甲的小虫，迷失在这座森林里。我想它一定是游侠吧！你看它虽然迷了路，仍傲然地前进着。它不断地左冲右撞，终于走出一条路。我目光跟着它的脚步，它走着，走着，一路上遇到不少同伴，互相打着招呼。我真想也跟它们寒暄一下，可惜我不懂它们的语言。']},
  {p:3,s:['它们的村子散布在森林边缘的小丘上。这里，很多黑甲虫村民，熙熙攘攘地往来。那只英勇的黑甲虫，走进了村子。我看见在许多同类虫子中间，一只娇小从洞里跑出来迎接远归者。它们意味深长地对视良久，然后一齐欢跃地走回洞穴里去。']},
  {p:4,s:['我看得出草虫的村落里哪是街道，哪是小巷。大街小巷里，花色斑斓的小圆虫，披着俏丽的彩衣。在这些粗壮的黑甲虫中间，它们好像南国的少女，逗得多少虫子驻足痴望。']},
  {p:5,s:['我的目光为一群音乐演奏者所吸引，它们有十几个吧，散聚在两棵大树下面——这是两簇野灌丛，紫红的小果实，已经让阳光烘烤得熟透了。甲虫音乐家们全神贯注地振着翅膀，优美的音韵，像灵泉一般流了出来。此时，我觉得它们的音乐优于人间的一切音乐，这是只有虫子们才能演奏出来的！']},
  {p:6,s:['我还看见了许多许多……','我悠悠忽忽地漫游了一个下午，直至夕阳亲吻着西山的时候，红鸠鸟的歌声才把我的心灵唤回来。我发现了草丛中小虫子的快乐天地。我多么得意啊！','我愿意牵着你的手，一起到草虫的村落里去散散步。']}

'4* 丁香结':{
 author:'宗璞',
 read:[
  {p:1,s:['今年的丁香花似乎开得格外茂盛，城里城外，都是一样。有的宅院里探出半树银妆，星星般的小花缀满枝头，从墙上窥着行人，惹得人走过了还要回头望。']},
  {p:2,s:['城外校园里丁香更多。最好的是图书馆北面的丁香三角地，种有十数棵的白丁香和紫丁香。月光下白的潇洒，紫的朦胧。还有淡淡的幽雅的甜香，非桂非兰，在夜色中也能让人分辨出，这是丁香。']},
  {p:3,s:['在我断断续续住了近三十年的斗室外，有三棵白丁香。每到春来，伏案时抬头便看见檐前积雪。雪色映进窗来，香气直透毫端。人也似乎轻灵得多，不那么浑浊笨拙了。从外面回来时，最先映入眼帘的，也是那一片莹白，白下面透出参差的绿，然后才见那两扇红窗。我经历过的春光，几乎都是和这几树丁香联系在一起的。']},
  {p:4,s:['古人词云"芭蕉不展丁香结""丁香空结雨中愁"。在细雨迷蒙中，着了水滴的丁香格外妩媚。花墙边两株紫色的，如同印象派的画，线条模糊了，直向窗前的莹白渗过来。让人觉得，丁香确实该和微雨连在一起。']},
  {p:5,s:['只是赏过这么多年的丁香，却一直不解，何以古人发明了丁香结的说法。今年一次春雨，久立窗前，望着斜伸过来的丁香枝条上一柄花蕾。小小的花苞圆圆的，鼓鼓的，恰如衣襟上的盘花扣。我才恍然，果然是丁香结。']},
  {p:6,s:['丁香结，这三个字给人许多想象。再联想到那些诗句，真觉得它们负担着解不开的愁怨了。每个人一辈子都有许多不顺心的事，一件完了一件又来。所以丁香结年年都有。结，是解不完的；人生中的问题也是解不完的，不然，岂不太平淡无味了吗？']}

'6 狼牙山五壮士':{
 author:'沈重',
 read:[
  {p:1,s:['1941年秋，日寇集中兵力，向我晋察冀根据地的狼牙山区大举进犯。当时，七连奉命在狼牙山一带坚持游击战争。经过一个多月英勇奋战，七连决定向龙王庙转移，把掩护群众和连队转移的任务交给了六班。']},
  {p:2,s:['为了拖住敌人，七连六班的五个战士一边痛击追上来的敌人，一边有计划地把大批敌人引上了狼牙山。他们利用险要的地形，把冲上来的敌人一次又一次地打了下去。班长马宝玉沉着地指挥战斗，让敌人走近了，才下命令狠狠地打。副班长葛振林打一枪就大吼一声，好像细小的枪口喷不完他的满腔怒火。战士宋学义扔手榴弹总要把胳膊抡一个圈，好使出浑身的力气。胡德林和胡福才这两个小战士把脸绷得紧紧的，全神贯注地瞄准敌人射击。']},
  {p:3,s:['五位壮士胜利地完成了掩护任务，准备转移。面前有两条路：一条通往主力转移的方向，走这条路可以很快追上连队，可是敌人跟在身后，容易暴露群众和主力；另一条通向狼牙山的顶峰棋盘陀，那儿三面都是悬崖绝壁。走哪条路呢？为了不让敌人发现群众和连队主力，班长马宝玉斩钉截铁地说了一声"走！"带头向棋盘陀走去。战士们热血沸腾，紧跟在班长后面。他们知道班长要把敌人引上绝路。']},
  {p:4,s:['五位壮士一面向顶峰攀登，一面依托大树和岩石向敌人射击。山路上又留下了许多具敌人的尸体。到了狼牙山峰顶，五位壮士居高临下，继续向紧跟在身后的敌人射击。不少敌人坠落山涧，粉身碎骨。']},
  {p:5,s:['五位壮士屹立在狼牙山顶峰，眺望着群众和部队主力远去的方向。他们回头望望还在向上爬的敌人，脸上露出胜利的喜悦。班长马宝玉激动地说："同志们，我们的任务胜利完成了！"说罢，他把那支从敌人手里夺来的枪砸碎了，然后走到悬崖边上，像每次发起冲锋一样，第一个纵身跳下深谷。战士们也昂首挺胸，相继从悬崖往下跳。狼牙山上响起了他们的壮烈豪迈的口号声：','"打倒日本帝国主义！"','"中国共产党万岁！"','这是英雄的中国人民坚强不屈的声音！这声音惊天动地，气壮山河！']}
 ],

'7 开国大典':{
 author:'佚名',
 read:[
  {p:1,s:['1949年10月1日，中华人民共和国中央人民政府成立，在首都北京举行典礼。参加开国大典的，有中华人民共和国中央人民政府主席、副主席、各位委员，有中国人民政治协商会议全体代表，有工人、农民、市民、学校师生、机关工作人员、城防部队，总数达三十万人。']},
  {p:2,s:['会场在天安门广场。广场呈丁字形。丁字形一横的北面是一道河，河上并排架着五座白石桥；再北面是城墙，城墙中央高高耸起天安门的城楼。丁字形的一竖向南直伸到中华门。在一横一竖的交点的南面，场中挺立着一根电动旗杆。']},
  {p:3,s:['下午三点整，会场上爆发出一阵排山倒海的掌声，中华人民共和国中央人民政府主席毛泽东出现在主席台上，跟群众见面了。三十万人的目光一齐投向主席台。','中央人民政府秘书长林伯渠宣布典礼开始。中央人民政府主席、副主席、各位委员就位。乐队奏起了中华人民共和国国歌——《义勇军进行曲》。正是这战斗的声音，曾经鼓舞中国人民为新中国的诞生而奋斗。接着，毛泽东主席宣布："中华人民共和国中央人民政府在今天成立了！"']},
  {p:4,s:['这庄严的宣告，这雄伟的声音，使全场三十万人一齐欢呼起来。这庄严的宣告，这雄伟的声音，经过无线电的广播，传到长城内外，传到大江南北，使全中国人民的心一齐欢跃起来。']},
  {p:5,s:['接着，升国旗。毛主席亲自按动连通电动旗杆的电钮，新中国的国旗——五星红旗徐徐上升。三十万人一齐脱帽肃立，一齐抬起头，瞻仰这鲜红的国旗。五星红旗升起来了，表明中国人民从此站起来了。']},
  {p:6,s:['接着，毛主席在群众一阵又一阵的掌声中宣读中央人民政府的公告。他用强有力的语调向全世界发出新中国的声音。','阅兵式开始了。开头是海军两个排，雪白的帽子，跟海洋一个颜色的蓝制服。接着是步兵一个师，以连为单位，列成方阵，齐步行进。接着是炮兵一个师，野炮、山炮、榴弹炮、火箭炮，各式各样的炮，都排成一字形的横列。接着是一个战车师，各种装甲车和坦克车两辆或三辆一排，整整齐齐地前进；战士们挺着胸膛站在战车上，像钢铁巨人一样。']},
  {p:7,s:['晚上九点半，游行队伍才完全走出了会场。两股红流分头向东城、西城的街道流去，光明充满了整个北京城。']}

'8* 灯光':{
 author:'王愿坚',
 read:[
  {p:1,s:['我爱到天安门广场走走，尤其是晚上。广场上千万盏灯静静地照耀着天安门广场周围的宏伟建筑，使人心头感到光明，感到温暖。']},
  {p:2,s:['清明节前的一个晚上，我又漫步在广场上，忽然背后传来一声赞叹："多好啊！"我心头微微一震，是什么时候听到过这句话来着？噢，对了，那是很久以前了。于是，我沉入了深深的回忆。']},
  {p:3,s:['1947年的初秋，当时我是战地记者。挺进豫皖苏平原的我军部队，把国民党军五十七师紧紧地包围在一个叫作沙土集的村子里。激烈的围歼战就要开始了。天黑的时候，我摸进一片空地，在交通沟里坐下来。忽然听见有人叫我的名字，我回头一看，是郝副营长。他大约十七八岁，一双眼睛在黑暗的夜色里闪闪发亮。他看见了我，递给我一根烟，自己也点着，靠在交通沟的沟沿上。']},
  {p:4,s:['他划着了一根火柴，点燃了烟，又望了一眼图画，深情地说："赶明儿胜利了，咱们也能用上电灯，让孩子们都在那样亮的灯光底下学习，该多好啊！"他把头靠在胸墙上，望着漆黑的夜空，完全陷入了对未来的憧憬里。']},
  {p:5,s:['半个小时以后，我刚回到团指挥所，战斗就打响了。三发绿色的信号弹升上天空，接着就是震天动地的炸药包爆炸声。守敌的围墙被炸开一个缺口，突击连马上冲了进去。没想到后续部队遭到敌人炮火猛烈的阻击，在黑暗里找不到突破口，和突击连失去了联系。']},
  {p:6,s:['整个团指挥所的人都焦急地钻出了地堡，望着黑魆魆的围墙。突然，黑暗里出现一星火光，一闪，又一闪。这火光虽然微弱，对于寻找突破口的部队来说已经足够亮了。战士们靠着这微弱的火光冲进了围墙，响起了一片喊杀声。','后来才知道，在这千钧一发的时刻，是郝副营长划着了火柴，点燃了那本书，举得高高的，为后续部队照亮了前进的路。可是，火光暴露了他自己，他被敌人的机枪打中了。']},
  {p:7,s:['这一仗，我们消灭了敌人的一个整编师。战斗结束后，我们把郝副营长埋在茂密的沙柳丛里。这位年轻的战友不惜自己的性命，为了让孩子们能够在电灯底下学习，他自己却没有来得及见一见电灯。']},
  {p:8,s:['事情已经过去很长时间了。在天安门前璀璨的华灯下面，我又想起这位亲爱的战友来。']}
 ],

'9* 我的战友邱少云':{
 author:'李元兴',
 read:[
  {p:1,s:['为了夺取"391"高地，消灭盘踞在那里的敌人，1952年10月12日天还没有亮，我们潜伏部队悄悄地在距离敌人前沿阵地很近的地方埋伏下来。太阳渐渐爬上山头。我发现前面六十多米就是敌人的前沿阵地，不但可以看见铁丝网和胸墙，还可以看见地堡。我们趴在地上，纹丝不动。']},
  {p:2,s:['中午的时候，敌人突然打起炮来，炮弹一排又一排地在我们潜伏的地方爆炸。显然，敌人已经感觉到他们的前沿阵地不太安全了，可是没有把握断定我们埋伏着部队。']},
  {p:3,s:['忽然，一颗燃烧弹落在邱少云身边，烧着了他身上的棉衣。这时候，邱少云只要从火里跳出来，就地打几个滚，就可以把身上的火扑灭。可是，这样一来，就会被山头上的敌人发觉，我们整个班，身后潜伏着的整个部队，都会受到重大的损失。']},
  {p:4,s:['为了整个班，为了整个潜伏部队，为了这次战斗的胜利，邱少云像千斤巨石一般，趴在火堆里一动也不动。烈火在他身上烧了半个多钟头才渐渐地熄灭。这个伟大的战士，直到最后一息，也没挪动一寸地方，没发出一声呻吟。']},
  {p:5,s:['黄昏的时候，漫山遍野响起了激动人心的口号："为邱少云同志报仇！"我们怀着满腔怒火，勇猛地冲上"391"高地。敌人全部被歼灭。看看时间，从发起冲锋到战斗结束，才二十分钟。','我永远忘不了那一天——1952年10月12日。']}

 read:[
  {p:1,s:['我们小时候的玩具，都是自己做的，也只能自己做。只要有一个人做了一件新鲜玩意儿，大家看了有趣，很快就能风靡全班，以至全校。']},
  {p:2,s:['有一段时间，我们全迷上了斗竹节人。','把毛笔杆锯成寸把长的一截，这就是竹节人的脑袋连同身躯了，在上面钻一对小眼，供装手臂用。再锯八截短的，分别做四肢，用一根纳鞋底的线把它们穿在一起，就成了。锯的时候要小心，弄不好一个个崩裂，前功尽弃。','把穿着九个竹节的鞋线嵌入课桌裂缝里，在下面一拉紧，那立在裂缝上的竹节们就站成一个壮士模样，叉腿张胳膊，威风凛凛，跟现今健美比赛中那脖子老粗、浑身疙瘩肉的小伙子差不多。','将鞋线一松一紧，那竹节人就手舞之、身摆之地动起来。两个竹节人放在一起，那就是搏斗了，没头没脑地对打着，不知疲倦，也永不会倒下。','有时其中一个的线卡住了，那"斗士"便显出一副呆头呆脑的傻样子，挺着肚子净挨揍。','竹节人手上系上一根冰棍棒，就成了手握金箍棒的孙悟空，号称"齐天小圣"，四个字歪歪斜斜刻在竹节人背上，神气！','找到两根针织机上废弃的钩针，装在竹节人手上，就成了窦尔敦的虎头双钩。把"金钩大王"刻在竹节人的胸口，神气！','用铅皮剪一把偃月刀，用铁丝系一绺红丝做一柄大刀，给竹节人粘上。再锯一节竹节，钻两个孔，穿一根铁丝，把"大刀"和"偃月刀"系在竹节人手上，就成了威风凛凛的"关公"。']},
  {p:3,s:['下课时，教室里摆开场子，吸引了一圈黑脑袋，攒着观战，还跺脚拍手，咋咋呼呼，好不热闹。常要等老师进来，才知道已经上课，便一哄作鸟兽散。','上课了，意兴依然不减，手痒痒的，将课本竖在面前当屏风，跟同桌在课桌上又搏将起来，这会儿，嘴里不便咚锵。','偏偏后面的同学不知趣，看得入了迷，伸长脖子，恨不能从我们肩膀上探过来。','老师大步流星走过来，怒气冲冲伸手一拂，"屏风"颓然倒了，一切秘密暴露无遗。不消说，费了许多功夫做出来的，建立了赫赫伟绩，鏖战犹酣的两个竹节人被一把抓去。','下课后，眼巴巴看别的同学重新开战，玩得欢，不禁沮丧得要命，便一起悄悄溜到办公室窗户下的冬青丛里转悠，希望老师能像往常一样，把没收的东西扯散了，随手扔出窗外。']},
  {p:4,s:['蹲着身子，瞪大眼，可一无所获。正悻悻然准备离去，却见同桌趴在窗玻璃旁看得津津有味。','我也凑过去，一探头，咦，看见了什么？','只见老师在他自己的办公桌上，玩着刚才收去的那竹节人。双手在抽屉里扯着线，嘴里念念有词，全神贯注，忘乎所以，一点儿也没注意到我们。','他脸上的神情，跟我们玩得入迷时一模一样。','于是，我跟同桌相视一笑，虽两手空空，但心满意足，轻手轻脚地溜了。','方才的那份小小的怨恨和沮丧化为乌有。']}

'11 宇宙生命之谜':{
 author:'佚名',
 read:[
  {p:1,s:['古时候，科学不发达，人们一直向往着"天上的世界"。于是，有了许许多多的故事：嫦娥奔月，仙女下凡，蟠桃盛会……现在，科学发达了，人们知道那都是古人编出来的神话。但是，地球之外的太空中到底有没有生命，仍然是一个谜。']},
  {p:2,s:['哪些天体上可能有生命存在呢？这个天体又必须具备什么样的条件呢？人们了解了生命起源的过程之后，认为至少应有这样几个条件：一是适合生物生存的温度，一般应在零下五十摄氏度至零上一百五十摄氏度之间；二是必要的水分，生命物质诸如蛋白质、核酸的活力都和水紧密相关，没有水，也就没有生命；三是适当成分的大气，虽然已发现少数厌氧菌能在没有氧气的条件下生存，但氧气和二氧化碳对于生命的存在是极为重要的；四是要有足够的光和热，为生命体系提供能源。']},
  {p:3,s:['根据这些条件，科学家首先对太阳系除地球以外的其他行星进行了分析。水星离太阳最近，向阳时表面温度达到三百至四百摄氏度，不可能存在生命。金星是一颗缺氧、缺水，有着浓厚云层的行星，阳光辐射和云层造成的"温室效应"，使得金星表面温度极高，不可能有生命存在。木星、土星、天王星和海王星离太阳很远，它们的表面温度，一般都低于零下一百四十摄氏度，因此，也不可能有生命存在。']},
  {p:4,s:['太阳系中唯一还可能存在生命的星球是火星。火星与地球有不少相似之处：地球自转一圈是23小时56分4秒，火星自转一圈是24小时37分；地球倾角约66度，火星倾角约66度1分。所以，昼夜长短相近，而且也有四季。']},
  {p:5,s:['科学家们还发现，火星是一个非常干燥的星球，在它的大气中虽然找到了水汽，但含量极少，只有地球上沙漠地区的百分之一；火星的大气层非常稀薄，百分之九十六是二氧化碳，氧气含量极少；火星表面温度很低；火星上没有磁场。生命物质难以存在。']},
  {p:6,s:['为了揭开火星神秘的面纱，科学家决定利用探测器对火星作近距离的观测。1971年，美国发射的"水手9号"探测器进入了环绕火星飞行的轨道，给火星拍摄了大量的照片。这些照片表明，意大利天文学家观察到的所谓"运河"，原来是一连串的暗环形山和暗的斑点。通过近距离观测还发现，以前观察到的火星表面上所谓颜色的四季变化，并不是植物的生长和枯萎造成的，而是风把火星表面上的尘土吹来吹去引起的颜色明暗变化。']},
  {p:7,s:['科学家们还发现，火星是一个非常干燥的星球，在它的大气中虽然找到了水汽，但含量极少。生命物质难以存在。','人们至今尚未在地球以外的太空中找到生命，但仍然相信遥远的太空存在着生命。近年来，科学家对落在地球上的一些陨石进行分析，发现陨石上存在有机分子，说明太空可能存在生命。','地球之外是否有生命存在，是人类一直探索的宇宙之谜。']}

'12* 故宫博物院':{
 author:'黄传惕',
 read:[
  {p:1,s:['在北京的中心，有一座城中之城，这就是紫禁城。现在人们叫它故宫，也叫故宫博物院。这是明清两代的皇宫，是我国现存的最大最完整的古代宫殿建筑群，有五百多年历史了。']},
  {p:2,s:['紫禁城的城墙高约十米，有四座城门：南面午门，北面神武门，东西面东华门、西华门。宫城呈长方形，占地七十二万平方米，有大小宫殿七十多座、房屋九千多间。城墙外是五十多米宽的护城河。城墙的四角上，各有一座玲珑奇巧的角楼。故宫建筑群规模宏大壮丽，建筑精美，布局统一，集中体现了我国古代建筑艺术的独特风格。']},
  {p:3,s:['从天安门往里走，沿着一条笔直的大道穿过端门，就到午门的前面。午门俗称五凤楼，是紫禁城的正门。走进午门，是一个宽广的庭院，弯弯的金水河像一条玉带横贯东西，河上是五座精美的汉白玉石桥。桥的北面是太和门，一对威武的铜狮守卫在门的两侧。']},
  {p:4,s:['进了太和门，就到紫禁城的中心——三大殿：太和殿、中和殿、保和殿。三座大殿矗立在七米多高的白石台基上。台基有三层，每层的边缘都用汉白玉栏杆围绕着，上面刻着龙凤流云，四角和望柱下面伸出一千多个圆雕鳌头，嘴里都有一个小圆洞，这是台基的排水管道。']},
  {p:5,s:['太和殿俗称金銮殿，高约二十八米，面积两千八百多平方米，是故宫最大的殿堂。在湛蓝的天空下，那金黄色的琉璃瓦重檐屋顶，显得格外辉煌。殿檐斗拱、额枋、梁柱，装饰着青蓝点金和贴金彩画。正面是十二根红色大圆柱，窗棂嵌着玻璃，金琐窗，朱漆门，同台基相互衬映，色彩鲜明，雄伟壮丽。']},
  {p:6,s:['太和殿是举行重大典礼的地方。皇帝即位、生日、婚礼和元旦等都在这里受朝贺。每逢大典，殿外的白石台基上下跪满文武百官，中间御道两边排列着仪仗，皇帝端坐在宝座上。大殿廊下，鸣钟击磬，乐声悠扬。']},
  {p:7,s:['从保和殿出来，下了石级，是一片长方形小广场，西起隆宗门，东到景运门。广场后面，就是内廷了。内廷的中心是乾清宫、交泰殿、坤宁宫，合称"后三宫"。后三宫往北就是御花园。御花园面积不很大，有大小建筑二十多座，但毫无拥挤和重复的感觉。来到这里，仿佛进入苏州园林。']},
  {p:8,s:['从景山下山，站在景山的高处望故宫，重重殿宇，层层楼阁，道道宫墙，错综相连，而井然有序。这样宏伟的建筑群，这样和谐统一的布局，不能不令人惊叹。']}

'13 桥':{
 author:'谈歌',
 read:[
  {p:1,s:['黎明的时候，雨突然大了。像泼。像倒。','山洪咆哮着，像一群受惊的野马，从山谷里狂奔而来，势不可当。','村庄惊醒了。人们翻身下床，却一脚踩进水里。是谁惊慌地喊了一嗓子，一百多号人你拥我挤地往南跑。近一米高的洪水已经在路面上跳舞了。人们又疯了似的折回来。']},
  {p:2,s:['东面、西面没有路。只有北面有座窄窄的木桥。','死亡在洪水的狞笑声中逼近。','人们跌跌撞撞地向那木桥拥去。','木桥前，没腿深的水里，站着他们的党支部书记，那个全村人都拥戴的老汉。','老汉清瘦的脸上淌着雨水。他不说话，盯着乱哄哄的人们。他像一座山。']},
  {p:3,s:['老汉沙哑地喊话："桥窄！排成一队，不要挤！党员排在后边！"','有人喊了一声："党员也是人。"','老汉冷冷地说："可以退党，到我这儿报名。"','竟没人再喊。一百多人很快排成队，依次从老汉身边奔上木桥。']},
  {p:4,s:['水渐渐窜上来，放肆地舔着人们的腰。','老汉突然冲上前，从队伍里揪出一个小伙子，吼道："你还算是个党员吗？排到后面去！"老汉凶得像只豹子。','小伙子瞪了老汉一眼，站到了后面。']},
  {p:5,s:['木桥开始发抖，开始痛苦地呻吟。','水，爬上了老汉的胸膛。最后，只剩下了他和小伙子。','小伙子推了老汉一把，说："你先走。"','老汉吼道："少废话，快走。"他用力把小伙子推上木桥。','突然，那木桥轰的一声塌了。小伙子被洪水吞没了。','老汉似乎要喊什么，猛然间，一个浪头也吞没了他。','一片白茫茫的世界。']},
  {p:6,s:['五天以后，洪水退了。','一个老太太，被人搀扶着，来这里祭奠。','她来祭奠两个人。','她丈夫和她儿子。']}

'14 穷人':{
 author:'列夫·托尔斯泰',
 read:[
  {p:1,s:['渔夫的妻子桑娜坐在火炉旁补一张破帆。屋外寒风呼啸，汹涌澎湃的海浪拍击着海岸，溅起一阵阵浪花。海上正起着风暴，外面又黑又冷，这间渔家的小屋里却温暖而舒适。地扫得干干净净，炉子里的火还没有熄，食具在搁板上闪闪发亮。挂着白色帐子的床上，五个孩子正在海风呼啸声中安静地睡着。']},
  {p:2,s:['丈夫清早驾着小船出海，这时候还没有回来。桑娜听着波涛的轰鸣和狂风的怒吼，感到心惊肉跳。','古老的钟发哑地敲了十下，十一下……始终不见丈夫回来。桑娜沉思：丈夫不顾惜身体，冒着寒冷和风暴出去打鱼，她自己也从早到晚地干活，还只能勉强填饱肚子。孩子们没有鞋穿，不论冬夏都光着脚跑来跑去；吃的是黑面包，菜只有鱼。不过，感谢上帝，孩子们都还健康。没什么可抱怨的。']},
  {p:3,s:['桑娜想起了傍晚就想去探望的那个生病的女邻居。"没有一个人照顾她啊！"桑娜自言自语。她来到邻居门前，敲了敲门，没人答应。她推开门，屋里没有生火，又潮湿又阴冷。女邻居西蒙死了，两个孩子睡在她身边。桑娜用头巾裹住睡着的孩子，把他们抱回家里。']},
  {p:4,s:['桑娜把两个孩子放在床上，让他们同自己的孩子睡在一起，又连忙把帐子拉好。','桑娜脸色苍白，神情激动。她忐忑不安地想："他会说什么呢？这是闹着玩的吗？自己的五个孩子已经够他受的了……是他来啦？……不，还没来！……为什么把他们抱过来啊？……他会揍我的！那也活该，我自作自受……嗯，揍我一顿也好！"']},
  {p:5,s:['门吱嘎一声，仿佛有人进来了。桑娜从椅子上跳起来。','"不，没有人！天啊，我为什么要这样做？……如今叫我怎么对他说呢？……"桑娜沉思着，久久地坐在床前。']},
  {p:6,s:['突然，大门开了，渔夫拖着湿淋淋的撕破了的网走进来。"糟糕，真糟糕！什么也没有打到，还把网给撕破了。倒霉，倒霉！天气可真厉害啊，我简直记不起几时有过这样的夜晚了，还谈得上什么打鱼！感谢上帝，总算活着回来啦。……我不在，你在家里做些什么呢？"']},
  {p:7,s:['"你知道吗？"桑娜说，"咱们的邻居西蒙死了。"','"哦？什么时候？"','"我也不知道，大概是昨天。唉！她死得好惨啊！两个孩子都在她身边，睡着了。他们那么小……一个还不会说话，另一个刚会爬……"桑娜沉默了。']},
  {p:8,s:['渔夫皱起眉，他的脸变得严肃、忧虑。"嗯，是个问题！"他搔搔后脑勺说，"嗯，你看怎么办？得把他们抱来，同死人待在一起怎么行！哦，我们，我们总能熬过去的！快去！别等他们醒来。"','但桑娜坐着一动不动。','"你怎么啦？不愿意吗？你怎么啦，桑娜？"','"你瞧，他们在这里啦。"桑娜拉开了帐子。']}

'15* 金色的鱼钩':{
 author:'杨旭',
 read:[
  {p:1,s:['1935年秋天，红四方面军进入草地，许多同志得了肠胃病。我和两个小同志病得实在跟不上队伍了，指导员派炊事班长照顾我们，让我们走在后面。']},
  {p:2,s:['炊事班长快四十岁了，个儿挺高，背有点儿驼，四方脸，高颧骨，脸上布满皱纹，两鬓都斑白了。因为全连数他岁数大，对大家又特别亲，大伙都叫他"老班长"。']},
  {p:3,s:['三个病号走不快，一天只走二十来里路。一路上，老班长带我们走一阵歇一阵。到了宿营地，他就到处去找野菜，和着青稞面给我们做饭。不到半个月，两袋青稞面吃完了。饥饿威胁着我们。老班长到处找野菜，挖草根，可是光吃这些东西怎么行呢！老班长看我们一天天瘦下去，他整夜整夜地合不拢眼。']},
  {p:4,s:['一天，他在一个水塘边给我们洗衣裳，忽然看见一条鱼跳出水面。他喜出望外地跑回来，取出一根缝衣针，烧红了，弯成个钓鱼钩。这天夜里，我们就吃到了新鲜的鱼汤。尽管没加作料，可我们觉得没有比这鱼汤更鲜美的了，端起碗来吃了个精光。']},
  {p:5,s:['以后，老班长尽可能找有水塘的地方宿营，把我们安顿好，就带着鱼钩出去了。第二天，他总能端着热气腾腾的鲜鱼野菜汤给我们吃。我们虽然还是一天一天衰弱下去，比起光吃草根野菜来毕竟好多啦。可是老班长自己呢，我从来没见他吃过一点儿鱼。']},
  {p:6,s:['有一次，我禁不住问他："老班长，你怎么不吃鱼啊？"','他摸了摸嘴，好像回味似的说："吃过了。我一起锅就吃，比你们还先吃呢。"','我不信，等他收拾完碗筷走了，就悄悄地跟着他。走近前一看，啊！我不由得呆住了。他坐在那里捧着搪瓷碗，嚼着几根草根和我们吃剩的鱼骨头，嚼了一会儿，就皱紧眉头硬咽下去。我觉得好像有万根钢针扎着喉管，失声喊起来："老班长，你怎么……"','老班长猛抬起头，看见我目不转睛地看着他手里的搪瓷碗，就支吾着说："我，我早就吃过了。看到碗里还没吃干净，扔了怪可惜的……"','"不，我全知道了。"我打断了他的话。','老班长转身朝两个小同志睡觉的地方看了一眼，一把把我搂到身边，轻声说："小声点儿，小梁！咱们俩是党员，你既然知道了，可不要再告诉别人。"']},
  {p:7,s:['挨了一天又一天，渐渐接近草地的边了，我们的病却越来越重。我还能勉强挺着走路，那两个小同志连直起腰来的力气也没有了。老班长虽然瘦得只剩皮包骨头，眼睛深深地陷了下去，还一直用饱满的情绪鼓励着我们。我们就这样扶一段，搀一段，终于走到了草地边上。远处，重重叠叠的山峰已经看得见了。']},
  {p:8,s:['这天上午，老班长说："咱们就在这儿弄点儿吃的，你们歇着，我去钓鱼。"','可是，等了很久很久，也不见老班长回来。我们急忙去找，发现老班长昏倒在水塘边。我们把他救醒，他微微地睁开眼睛，看见我端着的鱼汤，头一句话就说："小梁，别浪费东西了。我……我不行啦。你们吃吧！还有二十多里路，吃完了，一定要走出草地去！"','我们扑在老班长身上，抽噎着，很久很久。','擦干了眼泪，我把老班长留下的鱼钩小心地包起来，放在贴身的衣兜里。我想，等革命胜利以后，一定要把它送到革命烈士纪念馆去，让我们的子子孙孙都来瞻仰它。在这个长满了红锈的鱼钩上，闪烁着灿烂的金色的光芒！']}

'16 夏天里的成长':{
 author:'梁容若',
 read:[
  {p:1,s:['夏天是万物迅速生长的季节。']},
  {p:2,s:['生物从小到大，本来是天天长的，不过夏天的长是飞快的长，跳跃的长，活生生的看得见的长。你在棚架上看瓜藤，一天可以长出几寸；你到竹子林、高粱地里听声音，在叭叭的声响里，一夜可以多出半节。昨天是苞蕾，今天是鲜花，明天就变成了小果实。一块白石头，几天不见，就长满了苔藓；一片黄泥土，几天不见，就变成了草坪菜畦。邻家的小猫小狗小鸡小鸭，个把月不过来，再见面，它已经有了妈妈的一半多。']},
  {p:3,s:['草长，树木长，山是一天一天地变丰满。稻秧长，甘蔗长，地是一天一天地高起来。水长，瀑布长，河也是一天一天地变宽变深。俗话说："不热不长，不热不大。"随着太阳威力的增加，温度的增加，什么都在生长。最热的时候，连铁路的铁轨也长，把连接处的缝隙几乎填满。柏油路也软绵绵的，像是高起来。']},
  {p:4,s:['一过夏天，小学生有的成了中学生，中学生有的成了大学生。升级、跳班，快点儿，慢点儿，总是要长。北方农家的谚语说："六月六，看谷秀。"又说："处暑不出头，割谷喂老牛。"农作物到了该长的时候不长，或是长得太慢，就没有收成的希望。人也是一样，要赶时候，赶热天，尽量地用力地长。']}

'17 盼':{
 author:'铁凝',
 read:[
  {p:1,s:['有一天，妈妈下班回来，送给我一个扁扁的纸盒子。我打开一看，是一件淡绿色的、透明的新雨衣。我立刻就抖开雨衣往身上穿。怎么？雨衣上竟然还长着两只袖筒，不像那种斗篷式的：手在雨衣里缩着，什么也干不了。穿上这件情况就不同了，管你下雨不下雨，想干什么就干什么。']},
  {p:2,s:['我一边想，一边在屋里走来走去，戴上雨帽，又抖抖袖子，把雨衣弄得窸窸窣窣响。直到妈妈一声喊："你怎么还不去写作业？"我这才把雨衣脱下来，挂在衣架上。可是我心里还在想：下雨了，下雨了，我就可以穿上新雨衣了。']},
  {p:3,s:['我开始盼着变天。可是一连好多天，白天天上都是瓦蓝瓦蓝的，夜晚又变成满天星斗。我的雨衣一直安安静静地躺在盒子里，盒子一直安安静静地躺在衣柜里。每天放学路上我都在想：太阳把天烤得这样干，还能长云彩吗？为什么我一有了雨衣，天气预报就总是"晴"呢？']},
  {p:4,s:['有一天，快到家时，路边的小杨树忽然沙啦啦地喧闹起来，就像在嘻嘻地笑。还用问，这是起了风。一会儿，几朵厚墩墩的云彩飘游过来，把太阳也给遮盖住了。天一下子变了脸色。路上行人都加快了走路的速度，我却放慢了脚步，心想，雨点儿打在头上，才是世界上最美的事呢！果然，随着几声闷雷，头顶上真的落上了几个雨点儿。我又伸手试了试周围，手心里也落上了两点。我兴奋地仰起头，甩打着书包就大步跑进了楼门。']},
  {p:5,s:['"妈妈！"我嚷着奔进厨房。','"蕾蕾回来得正好，快给妈妈看看，这件雨衣好不好？"','"妈妈，我真的要穿新雨衣！"','"不行，雨太小了，等雨下大了再穿吧。"','我嘟囔着，心想，你怎么就不向窗外看一眼呢？']},
  {p:6,s:['第二天早晨一睁眼，四周还是静悄悄的。我决心不再想什么雨不雨的。谁知等我背着书包走到街上，脑门又落上了几滴水珠。我还以为是树上掉下来的，直到我仰着头躲开树，甜丝丝的雨点儿又滴到我嘴唇上时，我的心才又像要从嗓子里蹦出来一样。我几步跑回家，理直气壮地打开柜门，拿出雨衣冲妈妈说：','"妈妈，下呢，还在下呢！"','妈妈一歪头冲我笑了笑，帮我系好扣，戴上帽子。我挺着脖子，小心翼翼地跑下了楼梯。','我走在街上，甩着两只透明的绿袖子，觉得好像雨点儿也特别爱往我的雨衣上落。它们在我的头顶和肩膀上起劲儿地跳跃：滴答，滴答滴答……']}
 ],

'18 只有一个地球':{
 author:'佚名',
 read:[
  {p:1,s:['据有幸飞上太空的宇航员介绍，他们在天际遨游时遥望地球，映入眼帘的是一个晶莹的球体，上面蓝色和白色的纹痕相互交错，周围裹着一层薄薄的水蓝色"纱衣"。地球，这位人类的母亲，这个生命的摇篮，是那样的美丽壮观，和蔼可亲。']},
  {p:2,s:['但是，同茫茫宇宙相比，地球是渺小的。它是一个半径只有六千三百多千米的星球。在群星璀璨的宇宙中，就像一叶扁舟。它只有这么大，不会再长大。']},
  {p:3,s:['地球所拥有的自然资源也是有限的。拿矿物资源来说，它不是上帝的恩赐，而是经过几百万年，甚至几亿年的地质变化才形成的。地球是无私的，它向人类慷慨地提供矿产资源。但是，如果不加节制地开采，必将加速地球上矿产资源的枯竭。']},
  {p:4,s:['人类生活所需要的水资源、土地资源、生物资源等，本来是可以不断再生，长期给人类作贡献的。但是，因为人们随意毁坏自然资源，不顾后果地滥用化学品，不但使它们不能再生，还造成了一系列生态灾难，给人类生存带来了严重的威胁。']},
  {p:5,s:['有人会说，宇宙空间不是大得很吗，那里有数不清的星球，在地球资源枯竭的时候，我们不能移居到别的星球上去吗？','科学家已经证明，至少在以地球为中心的40万亿千米的范围内，没有适合人类居住的第二个星球。人类不能指望在破坏了地球以后再移居到别的星球上去。']},
  {p:6,s:['不错，科学家们提出了许多设想，例如，在火星或者月球上建造移民基地。但是，即使这些设想能实现，也是遥远的事情。再说，又有多少人能够去居住呢？','"我们这个地球太可爱了，同时又太容易破碎了！"这是宇航员遨游太空目睹地球时发出的感叹。','只有一个地球，如果它被破坏了，我们别无去处。如果地球上的各种资源都枯竭了，我们不能从别的地方得到补充。我们要精心地保护地球，保护地球的生态环境。让地球更好地造福于我们的子孙后代吧！']}

'19* 青山不老':{
 author:'梁晓声',
 read:[
  {p:1,s:['窗外是参天的杨柳。院子在山沟里，山上全是树。我们盘腿坐在土炕上，就像坐在船上，四周全是绿色的波浪，风一吹，树梢卷过涛声，叶间闪着粼粼的波光。']},
  {p:2,s:['我知道这条山沟所处的大环境。这是中国的晋西北，是西伯利亚大风常来肆虐的地方，是干旱、霜冻、沙尘暴等与生命作对的怪物盘踞之地。过去，这里风吹沙起，能一直埋到城头。县志载："风大作时，能逆吹牛马使倒行，或擎之高二三丈而坠。"就在如此险恶的地方，我对面这个手端一杆旱烟袋的瘦小老头，竟创造了这块绿洲。']},
  {p:3,s:['我还知道这个院子里的小环境。一排三间房，就剩下老者一人。老人每天早晨抓把柴煮饭，带上干粮扛上铁锹进沟上山；晚上回来，吃过饭，抽袋烟睡觉。六十五岁那年，他组织了七位老汉开始治理这条沟，现在已有五人离世。他可敬的老伴，与他风雨同舟一生，一天他栽树回来时，发现她已静静地躺在炕上过世了。他已经八十一岁，知道终有一天自己也会爬不起来。他唯一的女儿三番五次地从城里回来，接他去享清福，他不走。他觉得种树是命运的选择，屋后的青山就是生命的归宿。']},
  {p:4,s:['他敲着旱烟袋不紧不慢地说着，村干部在旁边恭敬地补充着……十五年啊，绿化了八条沟，造了七条防风林带，三千七百亩林网，这是多么了不起的奇迹。去年冬天，他用林业收入资助每户村民买了一台电视机——他还有宏伟设想，还要栽树，直到自己爬不起来为止。']},
  {p:5,s:['看完树，我们在村口道别。老人拄着拐杖，慢慢迈进他那个绿风荡漾的小院。我不禁鼻子一酸——也许老人进去后就再也出不来了。作为一个山野老农，他就这样来实现自己的价值。他已经将自己的生命转化为另一种东西。他是真正与山川共存、与日月同辉了。','这位普通老人让我领悟到：青山是不会老的。']}

'21* 三黑和土地':{
 author:'苏金伞',
 read:[
  {p:1,s:['农民一有了土地，就把整个生命投入了土地。活像旱天的鹅，一见了水就连头带尾巴钻进水里。']},
  {p:2,s:['恨不得把每一块土，都送到舌头上，是咸是甜，自己先来尝一尝。恨不得自己变成一粒种子，躺在土里试一试，看温暖不温暖，合适不合适。']},
  {p:3,s:['三黑就是这样地翻着土地。从东到西，从南到北，每一寸土都给翻起，每一块土疙瘩都给细细打碎。','地翻好，又耙了几遍，耙得又平又顺溜，看起来好像妇女们刚梳的头。']},
  {p:4,s:['这么松散的地，简直是一张软床，叫人想在上面打滚，想在上面躺一躺。','三黑耙过地，又耙过地，耙得又平又顺溜。他想：明年要跟人合伙，把地再买几亩，再耙几遍。']},
  {p:5,s:['三黑一边耙地，一边想着：翻身的人儿心里真甜。他笑嘻嘻的，连嘴都合不上。地里的蝈蝈儿也叫得更欢。']},
  {p:6,s:['三黑耙过地，坐下来歇一歇。看见自己种的荞麦已经开花，白霎霎的像一片雪。','荞麦地里还有两个蝈蝈儿在叫唤，吱吱吱……叫得人心里痒抓抓的好喜欢。','小时候因为逮蝈蝈儿，常常挨骂。爹娘骂：不好好拾柴火。丫头骂：不好好干活。','现在蝈蝈儿就在自己地里叫，他想招呼从地头路过的那个孩子："快去逮吧，你听，叫得多好！"']},
  {p:7,s:['他又在打算：明年要跟人合伙，把地浇得肥肥的，让庄稼长得更好，收得更多。','再买头小毛驴，打完场赶着送公粮；驮着老伴儿看闺女，上东沟。','三黑一边耙地，一边想着：翻身的人儿心里真甜。他笑嘻嘻的，连嘴都合不上。地里的蝈蝈儿也叫得更欢。']}

  {p:1,s:['伯牙鼓琴','伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰："善哉乎鼓琴，巍巍乎若太山。"少选之间而志在流水，锺子期又曰："善哉乎鼓琴，汤汤乎若流水。"锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。']},
  {p:2,s:['书戴嵩画牛','蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。','一日曝书画，有一牧童见之，拊掌大笑，曰："此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬矣。"处士笑而然之。古语有云："耕当问奴，织当问婢。"不可改也。']}

'23 表里的生物':{
 author:'冯至',
 read:[
  {p:1,s:['我小时候住在一座小城里，城里没有工厂，所以也没有机器的声音。我那时以为凡能发出声音的，都是活的生物。我以为凡能发出声音的，都是活的生物。早晨有鸟叫得很好听，夜里有狗吠得很怕人，夏天蝉在绿树上叫，秋晚有各种的虫在草丛中唱不同的歌曲。钟楼上的钟不是活的，有时却洪亮地响起来，那是有一个老人在敲；街心有时响着三弦的声音，那是一个盲人在弹。哪里有死的东西会自己走动，并且能自动地发出和谐的声音呢？']},
  {p:2,s:['可是父亲怀里的表有时放在桌子上，不但它的秒针会自己走动，而且它坚硬的表盖里还会发出清脆的声音：滴答，滴答，滴答……没有一刻的停歇，比许多奔跑的马蹄声还要清脆。','这声音比蝉鸣要柔和得多，比虫的歌曲要单调得多。','"为什么还蒙着一层玻璃呢？"','"这就是叫你只许看，不许动。"','"为什么呢？"','"这摆来摆去的是一个小蝎子的尾巴，一动就要蜇你。"']},
  {p:3,s:['我对于它的好奇心一天比一天增加。树上的蝉，草里的虫，都不会轻易被人看见，我想：这里边一定也有一个蝉或虫一类的生物吧，这生物被父亲关在表里，不许小孩子动。']},
  {p:4,s:['越不许我动，我越想动，但是我又不敢，因此很痛苦。这样过了许多天。父亲一把表放在桌子上，我的眼睛就再也离不开它。有一次，父亲也许看我的样子太可怜了，也许自己有什么高兴的事，他对我笑着说："你来，我给你看看表里是什么在响，可是只许看，不许动。"','没有请求，父亲就自动给我看，我高兴极了，同时我的心也加速跳动。父亲取出一把小刀，把表盖拨开，我的面前立即呈现出一个美丽的世界：蓝色的、红色的小宝石，钉住几个金黄色的齿轮，里边还有一个小尾巴似的东西不停地摆来摆去。这小东西把表盖盖上了，表就停了。']},
  {p:5,s:['我看得入神，唯恐父亲再把这美丽的世界盖上。但是，过了一会儿，父亲还是把表盖上了。父亲的表里边真是好看。','此后我就常常请求父亲把他的表打开给我看，有时父亲答应我，有时也拒绝我，就看他高兴不高兴。有一回，父亲又把表打开了，我用手指着里边那个小尾巴似的东西问：','"这是什么？"','"这是表里的生物。"','"为什么把它蒙在玻璃里？"','"这摆来摆去的是一个小蝎子的尾巴，一动就要蜇你。"','我吓了一跳，蝎子是多么丑恶而恐怖的东西，为什么把它放在这样一个美丽的世界里呢？但是我也感到愉快，证实我的猜测没有错：表里边有一个活的生物。']},
  {p:6,s:['这样的话我不知说了多久，也不知道到什么时候才不说了。']}

'24* 他们那时候多有趣啊':{
 author:'艾萨克·阿西莫夫',
 read:[
  {p:1,s:['那天晚上，玛琪甚至把这件事记在自己的日记里了。在2155年5月17日这一天她写道："今天，托米发现了一本真正的书！"']},
  {p:2,s:['那是一本很旧的书。玛琪的爷爷说，当他还是一个小孩子的时候，他的爷爷告诉他，曾经有一个时期，所有的故事都是印在纸上的。','他们把它翻过来看，纸页已经发黄发脆了。他们读到的字全都静止不动，不像他们通常在荧光屏上看到的那样，按顺序移动。这真是有趣极了。然后，他们翻到下一页，页面上又是另外一些静止不动的字。']},
  {p:3,s:['"你是在哪儿找到这本书的？"玛琪问。','"在我们家的顶楼上。"托米说。他指也不指一下，因为他正在专心致志地看书。"它是在哪儿找到的？"玛琪问。','"就在我家的顶楼上。"托米说。他指也不指一下，因为他正在专心致志地看书。']},
  {p:4,s:['玛琪叹了口气，去上课了。她脑子里还在想着当她爷爷的爷爷还是个小孩子的时候，他们上学的情景。那时候，所有年纪差不多的孩子都去同一个地方上学，他们在校园里玩耍，一起回家。他们学同样的功课，所以他们可以互相帮助，讨论功课。','而且，所有的老师都是真人……']},
  {p:5,s:['玛琪讨厌她的机器老师。那个机器老师一次又一次地让她做地理测验，她一次比一次答得糟，最后她妈妈愁眉苦脸地摇摇头，把教学视察员找了来。','教学视察员把机器老师调好，让它慢下来，慢到十岁孩子的水平。可是玛琪还是讨厌它。']},
  {p:6,s:['玛琪叹了口气，去上课了。她脑子里还在想着当她爷爷的爷爷还是个小孩子的时候，他们上学的情景。那时候，他们一起上课，一起回家，一起玩耍。他们那时候多有趣啊！']}

'25 少年闰土':{
 author:'鲁迅',
 read:[
  {p:1,s:['深蓝的天空中挂着一轮金黄的圆月，下面是海边的沙地，都种着一望无际的碧绿的西瓜。其间有一个十一二岁的少年，项带银圈，手捏一柄钢叉，向一匹猹尽力地刺去。那猹却将身一扭，反从他的胯下逃走了。']},
  {p:2,s:['这少年便是闰土。我认识他时，也不过十一二岁，离现在将有三十年了；那时我的父亲还在世，家景也好，我正是一个少爷。那一年，我家是一件大祭祀的值年。这祭祀，说是三十多年才能轮到一回，所以很郑重。正月里供祖像，供品很多，祭器很讲究，拜的人也很多，祭器也很要防偷去。我家只有一个忙月，忙不过来，他便对父亲说，可以叫他的儿子闰土来管祭器的。']},
  {p:3,s:['我的父亲允许了；我也很高兴，因为我早听到闰土这名字，而且知道他和我仿佛年纪，闰月生的，五行缺土，所以他的父亲叫他闰土。他是能装弶捉小鸟雀的。']},
  {p:4,s:['我于是日日盼望新年，新年到，闰土也就到了。好容易到了年末，有一日，母亲告诉我，闰土来了，我便飞跑地去看。他正在厨房里，紫色的圆脸，头戴一顶小毡帽，颈上套一个明晃晃的银项圈，这可见他的父亲十分爱他，怕他死去，所以在神佛面前许下愿心，用圈子将他套住了。他见人很怕羞，只是不怕我，没有旁人的时候，便和我说话，于是不到半日，我们便熟识了。']},
  {p:5,s:['我们那时候不知道谈些什么，只记得闰土很高兴，说是上城之后，见了许多没有见过的东西。','第二日，我便要他捕鸟。他说：','"这不能。须大雪下了才好。我们沙地上，下了雪，我扫出一块空地来，用短棒支起一个大竹匾，撒下秕谷，看鸟雀来吃时，我远远地将缚在棒上的绳子只一拉，那鸟雀就罩在竹匾下了。什么都有：稻鸡，角鸡，鹁鸪，蓝背……"']},
  {p:6,s:['闰土又对我说：','"现在太冷，你夏天到我们这里来。我们日里到海边捡贝壳去，红的绿的都有，鬼见怕也有，观音手也有。晚上我和爹管西瓜去，你也去。"','"管贼么？"','"不是。走路的人口渴了摘一个瓜吃，我们这里是不算偷的。要管的是獾猪，刺猬，猹。月亮地下，你听，啦啦地响了，猹在咬瓜了。你便捏了胡叉，轻轻地走去……"']},
  {p:7,s:['阿！闰土的心里有无穷无尽的希奇的事，都是我往常的朋友所不知道的。他们不知道一些事，闰土在海边时，他们都和我一样只看见院子里高墙上的四角的天空。']}

'26 好的故事':{
 author:'鲁迅',
 read:[
  {p:1,s:['灯火渐渐地缩小了，在预告石油的已经不多；石油又不是老牌，早熏得灯罩很昏暗。鞭爆的繁响在四近，烟草的烟雾在身边：是昏沉的夜。']},
  {p:2,s:['我闭了眼睛，向后一仰，靠在椅背上；捏着《初学记》的手搁在膝髁上。','我在蒙胧中，看见一个好的故事。']},
  {p:3,s:['这故事很美丽，幽雅，有趣。许多美的人和美的事，错综起来像一天云锦，而且万颗奔星似的飞动着，同时又展开去，以至于无穷。']},
  {p:4,s:['我仿佛记得曾坐小船经过山阴道，两岸边的乌桕，新禾，野花，鸡，狗，丛树和枯树，茅屋，塔，伽蓝，农夫和村妇，村女，晒着的衣裳，和尚，蓑笠，天，云，竹，……都倒影在澄碧的小河中，随着每一打桨，各各夹带了闪烁的日光，并水里的萍藻游鱼，一同荡漾。诸影诸物，无不解散，而且摇动，扩大，互相融和；刚一融和，却又退缩，复近于原形。边缘都参差如夏云头，镶着日光，发出水银色焰。凡是我所经过的河，都是如此。']},
  {p:5,s:['现在我所见的故事也如此。水中的青天的底子，一切事物统在上面交错，织成一篇，永是生动，永是展开，我看不见这一篇的结束。','河边枯柳树下的几株瘦削的一丈红，该是村女种的罢。大红花和斑红花，都在水里面浮动，忽而碎散，拉长了，一缕缕的胭脂水，然而没有晕。茅屋，狗，塔，村女，云，……也都浮动着。大红花一朵朵全被拉长了，这时是泼剌奔迸的红锦带。带织入狗中，狗织入白云中，白云织入村女中……。在一瞬间，他们又将退缩了。但斑红花影也已瘦削，并且碎散。']},
  {p:6,s:['但我总记得见过这一篇好的故事，在昏沉的夜……。']},
  {p:7,s:['我正要凝视他们时，骤然一惊，睁开眼，云锦也已皱蹙，凌乱，仿佛有谁掷一块大石下河水中，水波陡然起立，将整篇的影子撕成片片了。我无意识地赶忙捏住几乎坠地的《初学记》，眼前还剩着几点虹霓色的碎影。','我真爱这一篇好的故事，趁碎影还在，我要追回他，完成他，留下他。我抛了书，欠身伸手去取笔，——何尝有一丝碎影，只见昏暗的灯光，我不在小船里了。','但我总记得见过这一篇好的故事，在昏沉的夜……。']}

'27* 我的伯父鲁迅先生':{
 author:'周晔',
 read:[
  {p:1,s:['我的伯父鲁迅先生在世的时候，我年纪还小，根本不知道鲁迅是谁，以为伯父就是伯父，跟任何人的伯父一样。伯父去世了，他的遗体躺在万国殡仪馆的礼堂里，许多人都来追悼他，向他致敬，有的甚至失声痛哭。数不清的挽联挂满了墙壁，大大小小的花圈堆满了整间屋子。送挽联送花圈的有工人，有学生，各色各样的人都有。那时候我有点惊异了，为什么伯父得到这么多人的爱戴？我呆呆地望着来来往往吊唁的人，想到我永远见不到伯父的面了，听不到他的声音了，也得不到他的爱抚了，泪珠就一滴一滴地掉下来。']},
  {p:2,s:['就在伯父去世那一年的正月里，有一天，是星期六的下午，爸爸妈妈带我到伯父家里去。那时候每到周末，我们姐妹三个轮流跟随着爸爸妈妈到伯父家去团聚。这一天在晚餐桌上，伯父跟我谈起《水浒传》里的人物和故事。不知道伯父怎么会知道了我在读书，也许是我告诉他的吧。伯父问："你读过《水浒传》没有？"我老实回答："读过。"伯父又问："《水浒传》里有些什么人物？"我张冠李戴地乱说一气。伯父摸着胡子，笑了笑，说："哈哈！还是我的记性好。"听了伯父这句话，我又羞愧，又悔恨，比挨打挨骂还难受。从此，我读什么书都不再马马虎虎了。']},
  {p:3,s:['有一天黄昏，呼呼的北风怒号着，天色十分阴暗。街上的人都匆匆忙忙赶着回家。爸爸妈妈拉着我的手，到伯父家去。走到离伯父家门口不远的地方，看见一个拉黄包车的坐在地上呻吟，车子扔在一边。','我们走过去，看见他两只手捧着脚，脚上没穿鞋，地上淌了一摊血。他听见脚步声，抬起头来，饱经风霜的脸上现出难以忍受的痛苦。','"怎么了？"爸爸问他。','"先生，"他那灰白的抽动着的嘴唇里发出低微的声音，"没留心，踩在碎玻璃上，玻璃片插进脚底了。疼得厉害，回不了家啦！"','爸爸跑到伯父家里，不一会儿，就跟伯父拿了药和纱布出来。他们把那个拉车的扶上车子，一个蹲着，一个半跪着，爸爸拿镊子夹出碎玻璃片，伯父拿硼酸水给他洗干净。他们又给他敷上药，扎好绷带。','伯父又掏出一些钱来给他，叫他在家里休养几天，把剩下的药和绷带也给了他。','天黑了，路灯发出微弱的光。我站在伯父家门口看着他们，突然感到深深的寒意，摸摸自己的鼻尖，冷得像冰，脚和手也有些麻木了。我想，这么冷的天，那个拉车的怎么能光着脚拉着车在路上跑呢？','伯父和爸爸回来的时候，我就问他们。伯父的回答我现在记不清了，只记得他的话很深奥，不容易懂。我抬起头来，要求他给我详细地解说。这时候，我清清楚楚地看见，而且现在也清清楚楚地记得，他的脸上不再有那种慈祥的愉快的表情了，变得那么严肃。他没有回答我，只把枯瘦的手按在我的头上，半天没动，最后深深地叹了一口气。']},
  {p:4,s:['伯父逝世以后，我见到他家的女佣阿三。阿三是个工人的妻子，她丈夫失了业，她愁得两只眼睛起了蒙，看东西不清楚，模模糊糊的像隔着雾。她跟我谈起伯父生前的事情。她说："周先生自己病得那么厉害，还三更半夜地写文章。有时候我听着他一阵阵接连不断地咳嗽，真替他难受。他对自己的病一点儿也不在乎，倒常常劝我多休息，不叫我干重活儿。"','的确，伯父就是这样的一个人，他为自己想得少，为别人想得多。']},
  {p:5,s:['伯父就是这样一个人，他为自己想得少，为别人想得多。']}

'北京的春节':{
 author:'老舍',
 read:[
  {p:1,s:['按照北京的老规矩，春节差不多在腊月的初旬就开始了。"腊七腊八，冻死寒鸦"，这是一年里最冷的时候。可是，到了严冬，不久便是春天，所以人们并不因为寒冷而减少过年与迎春的热情。在腊八那天，家家都熬腊八粥。这种特制的粥是祭祖祭神的，可是细一想，它倒是农业社会的一种自傲的表现——这种粥是用各种米，各种豆，与各种干果熬成的。这不是粥，而是小型的农业展览会。']},
  {p:2,s:['腊八这天还要泡腊八蒜。把蒜瓣放进醋里，封起来，为过年吃饺子用。到年底，蒜泡得色如翡翠，醋也有了些辣味，色味双美，使人忍不住要多吃几个饺子。在北京，过年时，家家吃饺子。']},
  {p:3,s:['孩子们准备过年，第一件大事就是买杂拌儿。这是用花生、胶枣、榛子、栗子等干果与蜜饯掺和成的。孩子们喜欢吃这些零七八碎儿。第二件大事是买爆竹，特别是男孩子们。恐怕第三件事才是买各种玩意儿——风筝、空竹、口琴等。']},
  {p:4,s:['孩子们忙乱，大人们也紧张。他们必须预备过年吃的、喝的、穿的、用的，好在新年时显出万象更新的气象。','腊月二十三过小年，差不多就是过春节的"彩排"。天一擦黑，鞭炮响起来，便有了过年的味道。']},
  {p:5,s:['过了二十三，大家更忙，春节眨眼就要到了啊。必须大扫除一次，还要把肉、鸡、鱼、青菜、年糕什么的都预备充足——店铺多数正月初一到初五关门，到正月初六才开张。']},
  {p:6,s:['除夕真热闹。家家赶做年菜，到处是酒肉的香味。老少男女都穿起新衣，门外贴上了红红的对联，屋里贴好了各色的年画。除夕夜家家灯火通宵，不许间断，鞭炮声日夜不绝。在外边做事的人，除非万不得已，必定赶回家来吃团圆饭。这一夜，除了很小的孩子，没有什么人睡觉，都要守岁。']},
  {p:7,s:['正月初一的光景与除夕截然不同：除夕，街上挤满了人；正月初一，铺户都上着板子，门前堆着昨夜燃放的爆竹纸皮，全城都在休息。','男人们在午前就出动，到亲戚家、朋友家去拜年。女人们在家中接待客人。城内城外有许多寺院开放，任人游览，小贩们在庙外摆摊，卖茶、食品和各种玩具。']},
  {p:8,s:['元宵上市，春节的又一个高潮到了。正月十五，处处张灯结彩，整条大街像是办喜事，红火而美丽。有名的老铺都要挂出几百盏灯来，各形各色，有的一律是玻璃的，有的清一色是牛角的，有的都是纱灯，有的通通彩绘全部《红楼梦》或《水浒传》故事。这在当年，也是一种广告。灯一悬起，任何人都可以进到铺中参观。晚上灯中点上烛，观者就更多。']},
  {p:9,s:['小孩子们买各种花炮燃放，即使不跑到街上去淘气，在家中照样能有声有光地玩耍。家中也有灯：走马灯、宫灯、各形各色的纸灯，还有纱灯，里面有小铃，到时候就叮叮地响。这一天大家还必须吃元宵呀！这的确是美好快乐的日子。']},
  {p:10,s:['一眨眼，到了残灯末庙，春节在正月十九结束了。学生该去上学，大人又去照常做事。腊月和正月，在农村社会里正是大家最闲在的时候，过了灯节，天气转暖，大家就又都忙着干活了。北京虽然是城市，可是它也跟着农村社会一齐过年，而且过得分外热闹。']}

'腊八粥':{
 author:'沈从文',
 read:[
  {p:1,s:['初学喊爸爸的小孩子，会出门叫洋车了的大孩子，嘴巴上长了许多白胡胡的老孩子，提到腊八粥，谁不是嘴里就立时生一种甜甜的腻腻的感觉呢。把小米、饭豆、枣、栗、白糖、花生仁儿合拢来，糊糊涂涂煮成一锅，让它在锅中叹气似的沸腾着，单看它那叹气样儿，闻闻那种香味，就够咽三口以上的唾沫了，何况是，大碗大碗地装着，大匙大匙朝嘴里塞灌呢！']},
  {p:2,s:['住方家大院的八儿，今天喜得快要发疯了。他一个人进进出出灶房，看到一大锅粥正在叹气，碗盏都已预备整齐，摆到灶边好久了，但妈妈总是说时候还早。']},
  {p:3,s:['"妈，妈，要到什么时候才……"','"要到夜里！"其实他妈妈所说的夜里，并不是上灯以后。但八儿听了这种松劲的话，眼睛可急红了。锅中的粥，有声无力的叹气还在继续。','"那我饿了！"八儿要哭的样子。','"饿了，也得到太阳落下时才准吃。"','饿了，也得到太阳落下时才准吃。你们想，妈妈的命令，看羊还不够资格的八儿，难道还能设什么法来反抗吗？并且八儿所说的饿，也不可靠，不过因为一进灶房，就听到那锅中叹气又像是正在嘟囔的东西，因好奇而急于想尝尝这奇怪东西罢了。']},
  {p:4,s:['"妈，妈，等一下我要吃三碗！我们只准大哥吃一碗。大哥同爹都吃不得甜的，我们俩光吃甜的也行……妈，妈，你吃三碗我也吃三碗，大哥同爹只准各吃一碗；一共八碗，是吗？"','"是呀！孥孥说得对。"','"要不然我吃三碗半，你就吃两碗半……"','"噗……"锅内又叹了声气。八儿回过头来了。','比灶矮了许多的八儿，回过头来的结果，也不过是看到一股淡淡烟气往上一冲而已！']},
  {p:5,s:['锅中的一切，对八儿来说，只能猜想：栗子会已稀烂到认不清楚了吧，饭豆会煮得浑身肿胀了吧，花生仁儿吃来总已是面东郭西山了！枣子必大了三四倍——要是真的干红枣也有那么大，那就妙极了！糖若放多了，它会起锅巴……','妈，妈，你抱我起来看看吧！"于是妈妈就如八儿所求的把他抱了起来。','"呃……"他惊异得喊起来了，锅中的一切已进了他的眼中。','这不能不说是奇怪呀，栗子跌进锅里，不久就得粉碎，那是他知道的。他曾见过跌进黄焖鸡锅子里的一群栗子，不久就融掉了。饭豆煮得肿胀，那也是往常熬粥时常见的事。花生仁儿脱了他的红外套，这是不消说的事。锅巴，正是围了锅边成一圈。总之，一切都成了如他所猜的样子了，但他却没想到今日粥的颜色是深褐。']},
  {p:6,s:['"怎么，黑的！"八儿同时想起了染缸里的脏水。','"枣子同赤豆搁多了。"妈妈解释的结果，是捡了一枚大得特别吓人的赤枣给了八儿。','虽说是枣子同饭豆搁得多了一点儿，但大家都承认味道是比普通的粥要好吃得多了。','晚饭桌边，靠着妈妈斜立着的八儿，肚子已成了一面小鼓了。在他身边桌上那两支筷子，很浪漫地摆成一个十字。桌上那大青花碗中的半碗陈腊肉，八儿的爹同妈也都奈何它不来了。']}

'鲁滨逊漂流记（节选）':{
 author:'笛福',
 read:[
  {p:1,s:['从前，有一个人叫鲁滨逊，他是个英国人，喜欢航海和冒险。有一次，他乘船到南美洲去，途中遇上大风，船翻了，同伴们都死在海里，只有他一个人被大浪冲到海岛边。这是一个无名的、没有人居住的荒岛，到处是乱石野草。他又冷又饿，心里想：流落到这种地方，怎样活下去呢？']},
  {p:2,s:['等到潮水退了，鲁滨逊看到那艘大船还浮在海面上，离岸不远。他游到船边，发现船上有很多有用的东西：食物、工具、枪、火药等。他把这些东西都搬到岸上。']},
  {p:3,s:['鲁滨逊在荒岛上搭起一座帐篷，作为自己的住所。他用船上的帆搭起帐篷，用木头做成栅栏，把帐篷围起来。他每天到船上找有用的东西，把能用的都搬到岸上。']},
  {p:4,s:['鲁滨逊在荒岛上种植大麦和稻子，驯养山羊，晒葡萄干。他还学会了做面包、做家具。他用自己的双手，在荒岛上建立了自己的家园。']},
  {p:5,s:['鲁滨逊在荒岛上生活了二十八年。他遇到了很多困难，但他没有放弃。他用智慧和勤劳，克服了重重困难，终于在荒岛上生存下来。']},
  {p:6,s:['有一天，鲁滨逊看到海边出现了一只船。他跑过去，发现船上的人正在和一个野人搏斗。鲁滨逊开枪打死了野人，救下了那个人。那个人为了感谢鲁滨逊，就跟着他，给他当仆人。鲁滨逊给他取名"星期五"。']},
  {p:7,s:['又过了几年，鲁滨逊终于回到了英国。他在荒岛上生活了二十八年，终于回到了自己的祖国。']}

  {p:1,s:['尼尔斯是个十四岁的男孩子，他生性顽皮，喜欢恶作剧。有一次，他因为捉弄一个小精灵，被小精灵变成了一个拇指大的小人儿。']},
  {p:2,s:['这时候，一群大雁从天空飞过，家里的一只雄鹅想跟着大雁飞走。尼尔斯为了不让雄鹅飞走，就抱住了雄鹅的脖子。可是，雄鹅带着尼尔斯一起飞上了天空。']},
  {p:3,s:['尼尔斯骑在雄鹅背上，跟着大雁们一起旅行。他们飞过了高山，飞过了河流，看到了很多美丽的景色。尼尔斯骑在鹅背上，看到了很多他从来没有看过的东西。']},
  {p:4,s:['在旅途中，尼尔斯经历了很多困难。他遇到了狐狸，遇到了暴风雨，还遇到了很多危险。但是，尼尔斯没有害怕，他用自己的智慧和勇敢，克服了重重困难。']},
  {p:5,s:['在旅途中，尼尔斯也帮助了很多动物。他救了松鼠，救了大雁，还帮助了很多小动物。动物们都很喜欢尼尔斯。']},
  {p:6,s:['经过这次旅行，尼尔斯变得善良、勇敢、乐于助人。他不再是那个顽皮的男孩子了。最后，尼尔斯变回了原来的样子，回到了家里。']}

'匆匆':{
 author:'朱自清',
 read:[
  {p:1,s:['燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？——是有人偷了他们罢：那是谁？又藏在何处呢？是他们自己逃走了罢：现在又到了哪里呢？']},
  {p:2,s:['我不知道他们给了我多少日子，但我的手确乎是渐渐空虚了。在默默里算着，八千多日子已经从我手中溜去，像针尖上一滴水滴在大海里，我的日子滴在时间的流里，没有声音，也没有影子。我不禁头涔涔而泪潸潸了。']},
  {p:3,s:['去的尽管去了，来的尽管来着；去来的中间，又怎样地匆匆呢？早上我起来的时候，小屋里射进两三方斜斜的太阳。太阳他有脚啊，轻轻悄悄地挪移了；我也茫茫然跟着旋转。于是——洗手的时候，日子从水盆里过去；吃饭的时候，日子从饭碗里过去；默默时，便从凝然的双眼前过去。我觉察他去的匆匆了，伸出手遮挽时，他又从遮挽着的手边过去，天黑时，我躺在床上，他便伶伶俐俐地从我身上跨过，从我脚边飞去了。等我睁开眼和太阳再见，这算又溜走了一日。我掩着面叹息。但是新来的日子的影儿又开始在叹息里闪过了。']},
  {p:4,s:['在逃去如飞的日子里，在千门万户的世界里的我能做些什么呢？只有徘徊罢了，只有匆匆罢了；在八千多日的匆匆里，除徘徊外，又剩些什么呢？过去的日子如轻烟，被微风吹散了，如薄雾，被初阳蒸融了；我留着些什么痕迹呢？我何曾留着像游丝样的痕迹呢？我赤裸裸来到这世界，转眼间也将赤裸裸地回去罢？但不能平的，为什么偏要白白走这一遭啊？']},
  {p:5,s:['你聪明的，告诉我，我们的日子为什么一去不复返呢？']}
 ],

'那个星期天':{
 author:'史铁生',
 read:[
  {p:1,s:['我还记得我的第一次盼望。那是一个星期天，从早晨到下午，一直到天色昏暗下去。']},
  {p:2,s:['那个星期天母亲答应带我出去，去哪儿已经记不清了，可能是动物园，也可能是别的什么地方。总之她很久之前就答应了，就在那个星期天带我出去玩，这不会错。一个人平生第一次盼望一个日子，应该不会错。而且就在第二天早晨，母亲也还是这样答应的。']},
  {p:3,s:['那是一个星期天，从早晨到下午，一直到天色昏暗下去。那个星期天母亲答应带我出去，可是她总是很忙。起床，刷牙，吃饭，那是个春天的早晨，阳光明媚。走吗？等一会儿，等一会儿再走。买完菜，买完菜就去。买完菜马上就去吗？嗯。']},
  {p:4,s:['这段时光不好挨。我踏着一块块方砖跳，跳房子，等母亲回来。我看着天看着云彩走，等母亲回来，焦急又兴奋。我蹲在院子的地上，用树枝拨弄着一个蚁穴，爬着去找更多的蚁穴。院子里就我一个孩子，没人跟我玩。我坐在草丛里翻看一本画报，那是一本看了多少回的电影画报。那上面有一群比我大的女孩子，一个个都非常漂亮。我坐在草丛里看她们，想象她们的家，想象她们此刻在干什么，想象她们的兄弟姐妹和她们的父母，想象她们的声音。去年的荒草丛里似乎有了绿色，院子很大，空空落落。']},
  {p:5,s:['母亲买菜回来却又翻箱倒柜忙开了。走吧，您不是说买菜回来就走吗？好啦好啦，没看我正忙呢吗？真奇怪，该是我有理的事啊？不是吗，我不是一直在等着，母亲不是答应过了吗？整个上午我就跟在母亲腿底下：去吗？去吧，走吧，怎么还不走呀？走吧……我就这样念念叨叨地追在母亲的腿底下，看她做完一件事又去做一件事。我还没有她的腿高，那两条不停顿的腿至今都在我眼前晃动，它们不停下来，它们好几次绊在我身上，我好几次差点儿绞在它们中间。']},
  {p:6,s:['下午吧，母亲说，下午，睡醒午觉再去。去，母亲回答，下午，准去。但这次怨我，怨我自己，我把午觉睡过了头。醒来时我看见母亲在洗衣服。要是那时就走还不晚。我看看天，还不晚。还去吗？去。走吧？洗完衣服。这一次不能原谅。我不知道那堆衣服要洗多久，可母亲应该知道。我蹲在她身边，看着她洗。我一声不吭，盼着。我想我再不离开半步，再不把觉睡过头。我想衣服一洗完我马上拉起她就走，决不许她再耽搁。我看着盆里的衣服和盆外的衣服，我看着太阳，看着光线，我一声不吭。看着盆里揉动的衣服和绽开的泡沫，我感觉到周围的光线渐渐暗下去，渐渐地凉下去沉郁下去，越来越远越来越缥缈，我一声不吭，忽然有点儿明白了。']},
  {p:7,s:['我现在还能感觉到那光线漫长而急遽的变化，孤独而惆怅的黄昏的到来，并且听得见母亲咔嚓咔嚓搓衣服的声音，那声音永无休止就像时光的脚步。那个星期天。就在那天。母亲发现男孩儿蹲在那儿一动不动，发现他在哭，在不出声地流泪。我感到母亲惊惶地甩了甩手上的水，把我拉过去拉进她的怀里。我听见母亲在说，一边亲吻着我一边不停地说："噢，对不起，噢，对不起……"那个星期天，本该是出去的，去哪儿记不得了。男孩儿蹲在那个又大又重的洗衣盆旁，依偎在母亲怀里，闭上眼睛不再看太阳，光线正无可挽回地消逝，一派荒凉。']}

'十六年前的回忆':{
 author:'李星华',
 read:[
  {p:1,s:['1927年4月28日，我永远忘不了那一天。那是父亲的被难日，离现在已经十六年了。']},
  {p:2,s:['那年春天，父亲每天夜里回来得很晚。每天早晨，不知道什么时候他又出去了。有时候他留在家里，埋头整理书籍和文件。我蹲在旁边，看他把书和有字的纸片投到火炉里去。']},
  {p:3,s:['我奇怪地问他："爹，为什么要烧掉呢？怪可惜的。"','待了一会儿，父亲才回答："不要了就烧掉。你小孩子家知道什么！"','父亲一向是慈祥的，从没有骂过我们，更没有打过我们。我总爱向父亲问许多幼稚可笑的问题。他不论多忙，对我的问题总是很感兴趣，总是耐心地讲给我听。这一次不知道为什么，父亲竟这样含糊地回答我。']},
  {p:4,s:['后来听母亲说，军阀张作霖要派人来检查。为了避免党组织被破坏，父亲只好把一些书籍和文件烧掉。才过了两天，果然出事了。工友阎振三一早上街买东西，直到夜里还不见回来。第二天，父亲才知道他被抓到警察厅里去了。父亲心里保持着对革命事业的信心，对革命事业充满了信心。']},
  {p:5,s:['可怕的一天果然来了。4月6日的早晨，妹妹换上了新夹衣，母亲带她到娱乐场去散步了。父亲在里间屋里写字，我坐在外间屋的长木椅上看报。短短的一段新闻还没看完，就听见"啪，啪……"几声尖锐的枪声，接着是一阵纷乱的喊叫。','"什么？爹！"我瞪着眼睛问父亲。','"没有什么，不要怕。星儿，跟我到外面看看去。"','父亲不慌不忙地向外走去。我紧跟在他身后，走出院子，暂时躲在一间僻静的小屋里。','一会儿，外面传来一阵沉重的皮鞋声。我的心剧烈地跳动起来，用恐惧的眼光瞅了瞅父亲。','"不要放走一个！"窗外响起粗暴的吼声。穿灰制服和长筒皮靴的宪兵，穿便衣的侦探，穿黑制服的警察，一拥而入，挤满了这间小屋。他们像一群魔鬼似的，把我们包围起来。他们每人拿着一支手枪，枪口对着父亲和我。在军警中间，我发现了前几天被捕的工友阎振三。他的胳膊上拴着绳子，被一个肥胖的便衣侦探拉着。','那个满脸横肉的便衣侦探指着父亲问阎振三："你认识他吗？"','阎振三摇了摇头。','"哼！你不认识？我可认识他。"侦探冷笑着，又吩咐他手下的那一伙，"看好，别让他自杀！"','他们夺下了父亲的手枪，把父亲全身搜了一遍。父亲保持着他那惯有的严峻态度，没有向他们讲任何道理。因为他明白，对他们是没有道理可讲的。']},
  {p:6,s:['在法庭上，我们跟父亲见了面。父亲仍旧穿着他那件灰布旧棉袍，可是没戴眼镜。我看到了他那乱蓬蓬的长头发下面的平静而慈祥的脸。','"爹！"我忍不住喊出声来。母亲哭了，妹妹也跟着哭起来了。','"不许乱喊！"法官拿起惊堂木重重地在桌子上拍了一下。','父亲瞅了瞅我们，没有说一句话。他的神情非常安定，非常沉着。他的心被一种伟大的力量占据着。这个力量就是他平日对我们讲的——他对于革命事业的信心。']},
  {p:7,s:['28日黄昏，警察叫我们收拾行李出拘留所。我们回到家里，天已经全黑了。第二天，舅老爷到街上去买报。他是从街上哭着回来的，手里无力地握着一份报。我看到报上用头号字登着"李大钊等昨已执行绞刑"，立刻感到眼前蒙了一团云雾，昏倒在床上了。母亲伤心过度，昏过去三次，每次都是刚刚叫醒又昏过去了。','过了好半天，母亲醒过来了。她低声问我："昨天是几号？记住，昨天是你爹被害的日子。"','我又哭了，从地上捡起那张报纸，咬紧牙，又勉强看了一遍。我低声对母亲说："妈，昨天是4月28日。"母亲微微点了一下头。']}
 ],

'为人民服务':{
 author:'毛泽东',
 read:[
  {p:1,s:['我们的共产党和共产党所领导的八路军、新四军，是革命的队伍。我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。张思德同志就是我们这个队伍中的一个同志。']},
  {p:2,s:['人总是要死的，但死的意义有不同。中国古时候有个文学家叫做司马迁的说过："人固有一死，或重于泰山，或轻于鸿毛。"为人民利益而死，就比泰山还重；替法西斯卖力，替剥削人民和压迫人民的人去死，就比鸿毛还轻。张思德同志是为人民利益而死的，他的死是比泰山还要重的。']},
  {p:3,s:['因为我们是为人民服务的，所以，我们如果有缺点，就不怕别人批评指出。不管是什么人，谁向我们指出都行。只要你说得对，我们就改正。你说的办法对人民有好处，我们就照你的办。"精兵简政"这一条意见，就是党外人士李鼎铭先生提出来的；他提得好，对人民有好处，我们就采用了。只要我们为人民的利益坚持好的，为人民的利益改正错的，我们这个队伍就一定会兴旺起来。']},
  {p:4,s:['我们都是来自五湖四海，为了一个共同的革命目标，走到一起来了。我们还要和全国大多数人民走这一条路。我们今天已经领导着有九千一百万人口的根据地，但是还不够，还要更大些，才能取得全民族的解放。我们的同志在困难的时候，要看到成绩，要看到光明，要提高我们的勇气。中国人民正在受难，我们有责任解救他们，我们要努力奋斗。要奋斗就会有牺牲，死人的事是经常发生的。但是我们想到人民的利益，想到大多数人民的痛苦，我们为人民而死，就是死得其所。不过，我们应当尽量地减少那些不必要的牺牲。我们的干部要关心每一个战士，一切革命队伍的人都要互相关心，互相爱护，互相帮助。']},
  {p:5,s:['今后我们的队伍里，不管死了谁，不管是炊事员，是战士，只要他是做过一些有益的工作的，我们都要给他送葬，开追悼会。这要成为一个制度。这个方法也要介绍到老百姓那里去。村上的人死了，开个追悼会。用这样的方法，寄托我们的哀思，使整个人民团结起来。']}

  {p:2,s:['两小儿辩日','孔子东游，见两小儿辩斗，问其故。','一儿曰："我以日始出时去人近，而日中时远也。"','一儿曰："我以日初出远，而日中时近也。"','一儿曰："日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？"','一儿曰："日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？"','孔子不能决也。','两小儿笑曰："孰为汝多知乎？"']}

'真理诞生于一百个问号之后':{
 author:'叶永烈',
 read:[
  {p:1,s:['有人说过这样一句话：真理诞生于一百个问号之后。其实，这句话本身就是一个真理。']},
  {p:2,s:['纵观千百年来的科学技术发展史，那些定理、定律、学说的发现者、创立者，差不多都善于从细小的、司空见惯的现象中看出问题，不断发问，不断解决疑问，追根求源，最后把"？"拉直变成"！"，找到了真理。']},
  {p:3,s:['洗澡是一件非常普通的事情，而美国麻省理工学院机械工程系的谢皮罗教授却敏锐地注意到：每次放掉洗澡水时，水的漩涡总是朝逆时针方向旋转的。这是为什么呢？谢皮罗紧紧抓住这个问号不放，进行了反复的实验和研究。1962年他发表了论文，认为这种漩涡与地球的自转有关，如果地球停止旋转，就不会产生这种漩涡。他认为，在北半球，洗澡水朝逆时针方向旋转；如果是在南半球，洗澡水的漩涡则朝顺时针方向旋转；在南极，水的漩涡则朝相反方向旋转。他的这个见解，引起各国科学家的极大兴趣，他们纷纷在各地进行实验，结果证明谢皮罗的结论完全正确。']},
  {p:4,s:['无独有偶。17世纪的一个夏天，英国著名化学家波义耳正急匆匆地向自己的实验室走去，刚要跨入实验室大门，阵阵醉人的香味扑鼻而来，他这才发现花圃里的花开了。他本想好好欣赏一下迷人的花朵，但想到一天的实验安排，便摘下几朵紫罗兰插入一个盛水的烧瓶中，然后急匆匆地走了。没想到的是，在他忙完一天的实验，回到实验室时，那几朵紫罗兰竟变成了红色。波义耳立即敏感地意识到，紫罗兰中有一种成分遇盐酸会变红。那么，这种物质到底是什么？别的植物中会不会有同样的物质？别的酸对这种物质会有什么样的反应？这对化学研究有什么样的意义？这一奇怪的现象以及一连串的问题，促使波义耳进行了许多实验。由此他发现，大部分花草受酸或碱的作用都会改变颜色，其中以石蕊地衣中提取的紫色浸液最明显，它遇酸变成红色，遇碱变成蓝色。利用这一特点，波义耳制成了实验中常用的酸碱试纸——石蕊试纸。在以后的三百多年间，这种试纸一直被广泛应用于化学实验中。']},
  {p:5,s:['最有趣的是一位奥地利医生。一次儿子睡觉时，他发现儿子的眼珠忽然转动起来。他感到很奇怪：为什么睡觉时眼珠会转动？这会不会与做梦有关？会是什么关系呢？他对自己提出了疑问。于是，他以儿子、妻子、邻居为实验对象，进行了反复的观察实验，最后得出结论：当睡觉的人眼珠转动时，他确实正在做梦。如今，人们研究梦的生理学，便根据眼珠转动的次数和时间，来测量人做梦的次数与梦的长短。']},
  {p:6,s:['洗澡水的漩涡，紫罗兰的变色，睡觉时眼珠的转动，这些都是很平常的事情。善于"打破砂锅问到底"的人，却从中有所发现，有所发明，有所创造，有所成就。']},
  {p:7,s:['在科学史上，这样的事例还有很多，它说明科学并不神秘，真理并不遥远。只要你见微知著，善于发问并不断探索，那么，当你解答了若干个问号之后，就能发现真理。','当然，见微知著、善于发问并不断探索的能力，不是凭空产生的。正像数学家华罗庚说过的，科学的灵感，决不是坐等可以等来的。如果说，科学领域的发现有什么偶然的机遇的话，那么这种"偶然的机遇"只能给那些有准备的人，给那些善于独立思考的人，给那些具有锲而不舍精神的人。']}

 fanwen:[
  {title:'变形记——我变成了一棵树',text:'一觉醒来，我发现自己变成了一棵树，一棵高大的梧桐树。\n我的根深深地扎进泥土里，吸收着水分和养分。我的手臂变成了粗壮的树枝，手指变成了茂密的树叶。我站在公园里，看着来来往往的人们。\n春天，我长出嫩绿的叶子，为人们带来一片新绿。夏天，我的叶子长得密密层层，像一把大伞，为人们遮挡烈日。老人在我身下乘凉，孩子们在我身下玩耍，我感到无比快乐。\n秋天，我的叶子变成了金黄色，一片片飘落下来，像一只只蝴蝶在空中飞舞。冬天，我的叶子落光了，但我并不孤单，因为我知道，来年春天，我又会长出新的叶子。\n我变成了一棵树，一棵为人们带来快乐和绿荫的树。我觉得，做一棵树真好。',note:'想象自己变成树，按四季写出树的经历和感受，写出了为人们遮风挡的快乐，想象大胆又合理。'},
  {title:'变形记——我变成了一滴水',text:'我变成了一滴水，一滴小小的水。\n我从云朵里落下来，落进了一条小溪。我跟着溪水一起流淌，流过草地，流过山谷，看到了许多美丽的风景。我看见了绿绿的草地，看见了五颜六色的花朵，还看见了欢快的小鱼。\n我流啊流，流进了一条大河。大河里的水可真多啊！我和许多水滴一起，浩浩荡荡地向前奔流。我们流过田野，滋润了庄稼；我们流过城市，给人们带来了清洁的水。\n后来，我流进了大海。大海可真大啊，一眼望不到边。我和无数水滴在一起，变成了大海的一部分。\n太阳出来了，我变成了水蒸气，慢慢地升上天空，又变成了一朵白云。我知道，过不了多久，我又会变成一滴水，落下来，开始新的旅程。\n我是一滴水，一滴快乐的水。',note:'想象自己变成水，写了水从溪流到大海再到云端的旅程，写出了水滋润万物的快乐，想象丰富。'},
  {title:'变形记——我变成了一只小鸟',text:'我变成了一只小鸟，一只自由自在的小鸟。\n我有一身漂亮的羽毛，一对有力的翅膀。我展开翅膀，飞上了蓝天。天空可真大啊，一眼望不到边。我在天空中自由地飞翔，看到了许多美丽的风景。\n我飞过高山，看到了连绵起伏的山峰；我飞过大海，看到了碧波万顷的海面；我飞过田野，看到了金黄的稻田。\n我飞到一棵大树上，和别的小鸟一起唱歌。我们唱得可开心了，歌声在树林里回荡。\n飞累了，我就停在树枝上休息。看着美丽的天空，我心里充满了快乐。\n我是一只小鸟，一只自由自在的小鸟。我喜欢在天空中飞翔的感觉。',note:'想象自己变成小鸟，写了飞翔的快乐和看到的风景，想象合理，充满童趣。'}
 ]
},
'习作·多彩的活动':{
 guide:[
  {h:'审题立意',b:'写一次参加的活动：可以写运动会、联欢会、拔河比赛、参观、义卖等。要写清活动的过程，注意点面结合——既要写整个场面，又要写个别同学的表现，写出活动的精彩和感受。'},
  {h:'选材锦囊',b:'选你印象最深的一次活动：运动会的激烈、联欢会的欢乐、拔河比赛的团结、参观的收获……选最能体现"多彩"的。'},
  {h:'结构提纲',b:'开头：交代活动的时间、地点、内容。中间：写活动的过程，点面结合，既写场面，又写个别表现。结尾：写活动的感受和收获。'},
  {h:'写作妙招',b:'① 点面结合，既写整个场面，又写个别表现；② 按顺序写活动的过程；③ 写出活动的精彩和感受。'},
  {h:'好词百宝箱',b:'激烈、热闹、欢呼、团结、精彩、难忘、收获、点面结合、欢声雷动、热火朝天'},
  {h:'避坑提醒',b:'① 只写场面，不写个别表现；② 过程写得不清楚；③ 没有写感受。'}
 ],
 fanwen:[
  {title:'难忘的拔河比赛',text:'上周，学校举行了一场拔河比赛。我们班的对手是实力很强的三班。\n比赛开始前，操场上人山人海，同学们都在为自己班加油。我们班的二十名队员个个摩拳擦掌，跃跃欲试。他们紧紧地握住绳子，身子向后倾，做好了准备。\n"嘟——"随着裁判一声哨响，比赛开始了。双方队员都使出了全身的力气，拼命地拉。绳子中间的红领巾一会儿向我们这边移，一会儿又向对方那边移。我们的心也跟着红领巾一上一下。\n"加油！加油！"拉拉队的同学们扯着嗓子喊。我们班的队员听了，更是鼓足了劲。只见他们个个脸涨得通红，身子拼命向后倾。红领巾一点一点地向我们这边移过来。\n"嘟——"裁判的哨声再次响起。"我们赢了！"我们班的同学欢呼起来，有的跳，有的笑，有的拥抱在一起。\n这次拔河比赛让我明白了：团结就是力量。只要我们团结一心，就能战胜任何困难。',note:'点面结合，既写了整个场面，又写了队员的表现，结尾点明"团结就是力量"，主题鲜明。'},
  {title:'精彩的联欢会',text:'元旦那天，我们班举行了一场精彩的联欢会。\n教室里张灯结彩，挂满了彩带和气球，显得格外喜庆。同学们都准备了精彩的节目，有唱歌的，有跳舞的，有讲笑话的，还有表演魔术的。\n联欢会开始了。第一个节目是小红的独唱。她唱得可好听了，歌声婉转动听，同学们都听得入了迷。一曲唱完，教室里响起了热烈的掌声。\n最精彩的要数小明的魔术了。只见他拿出一副扑克牌，洗了洗牌，然后让一位同学抽一张。接着，他把牌放进牌堆，又洗了洗牌，然后一下子就把那张牌找了出来。"哇！真神奇！"同学们都惊叹不已。\n我也表演了一个节目——讲笑话。我讲了一个笑话，同学们都笑得前仰后合，教室里充满了欢声笑语。\n联欢会在欢乐的气氛中结束了。这次联欢会真精彩，给我留下了难忘的回忆。',note:'按顺序写联欢会的过程，写了几个精彩的节目，点面结合，写出了联欢会的精彩。'},
  {title:'记一次参观活动',text:'上周五，老师带我们去参观了科技馆。\n一走进科技馆，我就被眼前的景象吸引住了。这里有各种各样的展品，有航天模型，有机器人，还有许多有趣的科学仪器。\n我们先参观了航天展区。这里陈列着各种火箭和卫星的模型。讲解员阿姨给我们介绍了我国航天事业的发展历程。听着讲解员的介绍，我为祖国的航天事业感到无比自豪。\n接着，我们参观了机器人展区。这里的机器人可真多啊，有的会跳舞，有的会下棋，还有的会和游客对话。我试着和一个机器人对话，它真的回答了我的问题，真神奇！\n最有趣的是科学实验区。我们亲手做了许多有趣的实验，有"静电现象"，有"光的折射"，还有"声音的传播"。这些实验让我明白了许多科学道理。\n这次参观让我大开眼界，也让我爱上了科学。我暗暗下定决心，要好好学习，长大后为祖国的科学事业作贡献。',note:'按参观顺序写，写了几个展区，点面结合，结尾写出收获和决心，主题升华。'}
 ]
},
'习作·笔尖流出的故事':{
 guide:[
  {h:'审题立意',b:'创编一个虚构的故事：可以选一个环境（如开满丁香花的校园、月光下的村庄、冬日黄昏的街头），创编一个故事。要写清故事的起因、经过、结果，人物形象要鲜明，情节要生动。'},
  {h:'选材锦囊',b:'选一个环境，围绕环境创编故事：开满丁香花的校园里，可以写同学之间的友谊；月光下的村庄里，可以写一个感人的故事；冬日黄昏的街头，可以写一个温暖的故事。'},
  {h:'结构提纲',b:'开头：交代环境和人物。中间：写故事的起因、经过、结果。结尾：写故事的结局和感受。'},
  {h:'写作妙招',b:'① 环境描写要烘托气氛；② 人物形象要鲜明；③ 情节要生动，有起伏；④ 可以写一个温暖的故事。'},
  {h:'好词百宝箱',b:'开满丁香花、月光下、冬日黄昏、温暖、感人、友谊、帮助、难忘'},
  {h:'避坑提醒',b:'① 环境描写太少；② 人物形象不鲜明；③ 情节平淡，没有起伏。'}
 ],
 fanwen:[
  {title:'开满丁香花的校园',text:'我们的校园里开满了丁香花。每到春天，丁香花就开了，紫色的、白色的，一簇簇，一丛丛，散发着淡淡的清香。\n那天，我正走在去教室的路上，忽然听到一阵哭声。我循声望去，只见一个小女孩蹲在丁香花丛旁，伤心地哭着。\n"小妹妹，你怎么了？"我走过去，轻声问。\n"我……我的钱包丢了，里面有我交学费的钱。"小女孩抽泣着说。\n我听了，心里一紧。学费丢了，这可怎么办？我摸了摸口袋，里面只有妈妈给我的十块钱。我想了想，把十块钱递给了小女孩。\n"给你，先用这个吧。"\n"可是……这是你的钱啊。"小女孩抬起头，眼睛红红的。\n"没关系，我先借给你，等你找到钱包再还我。"我笑着说。\n小女孩接过钱，感激地说："谢谢你，大姐姐！"\n这时，上课铃响了。我对小女孩说："快上课去吧，别迟到了。"说完，我转身向教室跑去。\n身后，传来小女孩的声音："谢谢你！"\n我回头一看，小女孩正朝我挥手。丁香花的香气飘过来，我觉得，这香气比平时更香了。',note:'环境描写烘托气氛，写了一个温暖的故事，人物形象鲜明，结尾用丁香花的香气点题。'},
  {title:'月光下的村庄',text:'月光如水，洒在村庄的每一个角落。村子里静悄悄的，只有偶尔传来几声狗叫。\n老奶奶坐在院子里，望着天上的月亮，心里想着在外地打工的儿子。儿子已经很久没有回来了，老奶奶很想念他。\n"奶奶，您怎么还不睡啊？"隔壁的小明走过来，关切地问。\n"哦，是小明啊。我在想我的儿子呢。"老奶奶叹了口气。\n小明听了，想了想，说："奶奶，我给您讲个故事吧，讲完您就睡。"\n老奶奶点点头。小明坐在老奶奶身边，给她讲起了故事。他讲了一个又一个故事，老奶奶听得入了迷。\n讲着讲着，老奶奶的脸上露出了笑容。小明看着老奶奶的笑容，心里也很高兴。\n月光下，一老一少坐在院子里，温馨而美好。\n这个故事让我明白了：帮助别人，能给别人带来快乐，也能给自己带来快乐。',note:'月光下的村庄烘托气氛，写了小明陪伴老奶奶的温暖故事，主题温暖感人。'},
  {title:'冬日黄昏的街头',text:'冬日黄昏，寒风刺骨。街上的行人都裹紧了大衣，匆匆往家赶。\n一个小女孩站在街头，焦急地张望着。她的手里攥着几块钱，眼睛里满是焦急。\n"小姑娘，你怎么了？"一位阿姨走过来，关切地问。\n"我……我的钱不够，买不起回家的车票。"小女孩的眼眶红了。\n阿姨听了，从口袋里掏出几块钱，递给了小女孩："给你，够买票了。"\n"可是……这是您的钱啊。"小女孩抬起头，感激地看着阿姨。\n"没关系，快回家吧，别让你妈妈担心。"阿姨笑着说。\n小女孩接过钱，感激地说："谢谢您，阿姨！"\n阿姨笑了笑，转身走了。小女孩望着阿姨远去的背影，心里暖暖的。\n冬日黄昏的街头，虽然寒冷，但小女孩的心里却暖洋洋的。因为她知道，这个世界上，还是好人多。\n这个故事让我明白了：帮助别人，能给别人带来温暖。',note:'冬日黄昏的街头烘托气氛，写了阿姨帮助小女孩的温暖故事，结尾点明主题。'}
 ]
},
'习作·围绕中心意思写':{
 guide:[
  {h:'审题立意',b:'选一个感受最深的汉字（如乐、悔、泪、暖、让、忙、变、迷），想想生活中发生过的事情，围绕中心意思选材，从不同的方面或选择不同的事例来写。'},
  {h:'选材锦囊',b:'选一个感受最深的汉字：选"乐"，就写快乐的事；选"悔"，就写后悔的事；选"暖"，就写温暖的事。围绕中心意思，从不同方面选材。'},
  {h:'结构提纲',b:'开头：点明要写的汉字和中心意思。中间：从不同方面或选不同事例来写。结尾：总结，点明中心。'},
  {h:'写作妙招',b:'① 围绕中心意思选材；② 从不同方面或选不同事例；③ 把事例写具体。'},
  {h:'好词百宝箱',b:'乐、悔、泪、暖、让、忙、变、迷、中心意思、选材'},
  {h:'避坑提醒',b:'① 偏离中心意思；② 事例不具体；③ 没有围绕中心选材。'}
 ],
 fanwen:[
  {title:'暖',text:'暖，是冬日里的一缕阳光，是寒冷中的一丝温暖。在我的生活中，有很多温暖的事。\n记得那是一个寒冷的冬天，我放学回家，发现忘带钥匙了。我站在家门口，急得像热锅上的蚂蚁。爸爸妈妈都不在家，我该怎么办呢？\n就在我着急的时候，隔壁的王奶奶走了出来。"孩子，怎么了？"王奶奶关切地问。\n"我忘带钥匙了，爸爸妈妈都不在家。"我着急地说。\n"哦，那你先到奶奶家来吧，等爸爸妈妈回来。"王奶奶笑着说。\n我跟着王奶奶进了她家。王奶奶给我倒了一杯热水，还给我拿了点心。喝着热水，吃着点心，我心里暖暖的。\n"孩子，冷不冷？要不要再加点衣服？"王奶奶关切地问。\n"不冷，谢谢奶奶。"我感激地说。\n过了一会儿，爸爸妈妈回来了。我谢过王奶奶，回到了家。虽然天气很冷，但我的心里却暖洋洋的。\n暖，是王奶奶的一杯热水，是王奶奶的一句关心。这个世界上，有很多温暖的事，只要我们用心去感受。',note:'围绕"暖"字，写了王奶奶帮助"我"的事，中心明确，事例具体，结尾点题。'},
  {title:'悔',text:'悔，是后悔，是悔恨。在我的生活中，有一件事让我至今后悔。\n记得那是三年级的时候，一次考试，我没有认真复习，结果考得很差。看着试卷上那鲜红的分数，我心里很不是滋味。\n回到家，妈妈问我考得怎么样。我低着头，小声说："考得不好。"妈妈听了，没有骂我，只是叹了口气，说："没关系，下次努力就好。"\n听了妈妈的话，我心里更不是滋味了。我知道，妈妈是为了我好，可是我却没有认真复习，辜负了妈妈的期望。\n从那以后，我暗暗下定决心，一定要认真学习，不再让妈妈失望。我开始认真复习，认真做作业，遇到不懂的问题就请教老师和同学。\n终于，在期末考试中，我取得了好成绩。看着试卷上那鲜红的分数，我心里很高兴。我知道，这是我努力的结果。\n虽然我现在取得了好成绩，但我还是会想起那次考试。它让我明白了：做事要认真，不能马虎。这件事，让我至今后悔，也让我明白了认真的重要性。',note:'围绕"悔"字，写了考试没认真复习的事，中心明确，事例具体，结尾点明道理。'},
  {title:'乐',text:'乐，是快乐，是喜悦。在我的生活中，有很多快乐的事。\n记得那是一个周末，我和爸爸妈妈一起去公园玩。公园里人山人海，热闹极了。\n我们先去了游乐场。我玩了过山车、旋转木马，还玩了碰碰车。我最喜欢的是过山车，坐在上面，风在耳边呼呼地吹，刺激极了。\n接着，我们去了湖边。湖里的水清澈见底，湖里的小鱼自由自在地游来游去。我和爸爸租了一条小船，在湖上划船。划着划着，我看到了湖边的柳树，柳树的枝条垂下来，像小姑娘的辫子。\n划完船，我们去吃了冰淇淋。冰淇淋可真好吃啊，甜甜的，凉凉的，好吃极了。\n天渐渐黑了，我们依依不舍地离开了公园。回家的路上，我还在想着公园里的快乐时光。\n这就是我的快乐的一天。乐，是和家人在一起的快乐，是玩耍的快乐，是品尝美食的快乐。这个世界上，有很多快乐的事，只要我们用心去感受。',note:'围绕"乐"字，写了一家人去公园玩的快乐，中心明确，事例具体，结尾点题。'}
 ]
},
'习作·学写倡议书':{
 guide:[
  {h:'审题立意',b:'针对环境问题或其他社会问题，写一份倡议书。要写清倡议的原因、倡议的内容、希望大家都来做。格式要规范：标题、称呼、正文、署名、日期。'},
  {h:'选材锦囊',b:'选一个你关注的问题：保护环境、节约用水、爱护公物、文明出行等。选你最有感触的，写清倡议的原因和内容。'},

 fanwen:[
  {title:'保护环境倡议书',text:'亲爱的同学们：\n我们的地球是一个美丽的星球，但是，由于人们的破坏，地球的环境越来越差了。为了保护我们的地球，我向大家发出倡议：\n一、不乱扔垃圾。垃圾要分类投放，可回收垃圾和不可回收垃圾要分开。\n二、节约用水。洗手、刷牙时要关紧水龙头，不要浪费水。\n三、节约用电。离开教室时要关灯，不要浪费电。\n四、爱护花草树木。不要踩踏草坪，不要攀折花木。\n五、绿色出行。尽量步行或骑自行车，少坐汽车，减少尾气排放。\n同学们，保护环境，人人有责。让我们一起行动起来，保护我们的地球，让地球变得更加美丽！\n倡议人：小明\n2026年1月10日',note:'格式规范，写清了倡议的原因和内容，语言有号召力，条理清楚。'},
  {title:'节约用水倡议书',text:'亲爱的同学们：\n水是生命之源，没有水，就没有生命。但是，现在有很多人在浪费水。为了保护水资源，我向大家发出倡议：\n一、洗手、刷牙时要关紧水龙头，不要让水白白流走。\n二、洗衣服的水可以留下来冲厕所，做到一水多用。\n三、看到水龙头没关紧，要主动关紧。\n四、不要往河里扔垃圾，保护水资源。\n五、向身边的人宣传节约用水的重要性，让更多的人加入到节约用水的行列中来。\n同学们，节约用水，从我做起。让我们一起行动起来，节约用水，保护水资源！\n倡议人：小红\n2026年1月15日',note:'格式规范，写清了节约用水的具体做法，条理清楚，语言有号召力。'},
  {title:'文明出行倡议书',text:'亲爱的同学们：\n文明出行，是我们每个人的责任。为了营造文明、安全的出行环境，我向大家发出倡议：\n一、遵守交通规则。过马路要走斑马线，红灯停，绿灯行。\n二、不在马路上追逐打闹，不翻越护栏。\n三、乘坐公共交通工具时，要排队上车，主动给老人、孕妇让座。\n四、不乱扔垃圾，保持环境整洁。\n五、文明用语，不说脏话，不讲粗话。\n同学们，文明出行，从我做起。让我们一起行动起来，做一个文明的好少年！\n倡议人：小刚\n2026年2月1日',note:'格式规范，写清了文明出行的具体做法，条理清楚，语言有号召力。'}
 ]
}

 fanwen:[
  {title:'家乡的春节',text:'我的家乡在广西，那里的春节可热闹了。\n腊月二十三，是过小年。这一天，家家都要祭灶，送灶王爷上天。奶奶会在灶台上摆上糖果，让灶王爷"上天言好事"。\n除夕那天，家家都要贴春联、贴年画。红红的春联贴在门上，显得格外喜庆。奶奶还会做很多好吃的，有鱼，有肉，有年糕。鱼代表"年年有余"，年糕代表"年年高升"。\n除夕夜，一家人围坐在一起吃年夜饭。吃完年夜饭，大人们会给小孩子发压岁钱。拿着压岁钱，我们可高兴了。\n晚上，我们还要守岁。一家人围坐在一起，看春节联欢晚会，一直到深夜。\n正月初一，我们要去拜年。见到长辈，要说"新年好"，长辈会给我们发红包。\n正月十五，是元宵节。这一天，家家都要吃元宵，赏花灯。元宵圆圆的，代表团团圆圆。\n这就是家乡的春节，热闹、喜庆。我爱家乡的春节。',note:'按时间顺序写春节的习俗，写清了来历和过程，加入了感受，条理清楚。'},
  {title:'家乡的端午节',text:'我的家乡在广西，那里的端午节可热闹了。\n端午节，是为了纪念爱国诗人屈原。相传，屈原投江后，人们为了不让鱼虾吃他的身体，就把米包成粽子扔进江里。从此，就有了端午节吃粽子的习俗。\n端午节那天，奶奶会包很多粽子。奶奶包的粽子可好吃了，有肉粽，有豆沙粽，还有蜜枣粽。我最喜欢吃肉粽，香香的，好吃极了。\n除了吃粽子，端午节还要赛龙舟。河面上，一条条龙舟像离弦的箭一样冲出去。队员们奋力划桨，岸上的观众大声呐喊。场面可热闹了。\n端午节还要挂艾草、佩香囊。艾草可以驱邪，香囊可以辟邪。奶奶会给我做一个香囊，挂在脖子上。\n这就是家乡的端午节，热闹、有趣。我爱家乡的端午节。',note:'写清了端午节的来历和习俗，写清了吃粽子、赛龙舟等过程，加入了感受，条理清楚。'},
  {title:'家乡的元宵节',text:'我的家乡在广西，那里的元宵节可热闹了。\n元宵节，又叫灯节。这一天，家家都要吃元宵，赏花灯。\n元宵节那天，奶奶会煮很多元宵。元宵圆圆的，代表团团圆圆。元宵有芝麻馅的，有豆沙馅的，还有花生馅的。我最喜欢吃芝麻馅的，香香的，好吃极了。\n晚上，我们去看花灯。公园里挂满了花灯，有兔子灯，有兔子灯，还有龙灯。花灯五颜六色，漂亮极了。我最喜欢的是龙灯，长长的，威风极了。\n除了赏花灯，元宵节还要猜灯谜。灯谜挂在花灯上，猜对了还有奖品呢。我猜对了一个灯谜，得到了一支铅笔，可高兴了。\n这就是家乡的元宵节，热闹、有趣。我爱家乡的元宵节。',note:'写清了元宵节的习俗，写清了吃元宵、赏花灯、猜灯谜等过程，加入了感受，条理清楚。'}
 ]
},

 fanwen:[
  {title:'《鲁滨逊漂流记》梗概',text:'《鲁滨逊漂流记》是英国作家笛福写的一部长篇小说。\n小说的主人公鲁滨逊是个英国人，他喜欢航海和冒险。有一次，他乘船去南美洲，途中遇上大风，船翻了，只有他一个人被大浪冲到一个荒岛上。\n鲁滨逊在荒岛上搭起帐篷，作为自己的住所。他从船上找来食物、工具、枪和火药。他在荒岛上种植大麦和稻子，驯养山羊，晒葡萄干。他还学会了做面包、做家具。他用自己的双手，在荒岛上建立了自己的家园。\n鲁滨逊在荒岛上生活了二十八年。他遇到了很多困难，但他没有放弃。他用智慧和勤劳，克服了重重困难。\n有一天，鲁滨逊救下了一个野人，给他取名"星期五"。又过了几年，鲁滨逊终于回到了英国。\n读了这本书，我被鲁滨逊的勇敢和坚强感动了。他告诉我，遇到困难不要放弃，要用智慧和勤劳去克服困难。',note:'写清了书的主要内容（起因、经过、结果），语言简洁，结尾写了感受。'},
  {title:'《汤姆·索亚历险记》梗概',text:'《汤姆·索亚历险记》是美国作家马克·吐温写的一部长篇小说。\n小说的主人公汤姆·索亚是个调皮的孩子，他喜欢冒险。有一次，他和朋友哈克贝利·费恩一起去冒险。\n有一天，汤姆和贝奇在山洞里迷路了。他们在山洞里走了很久，怎么也找不到出口。他们又累又饿，心里很害怕。但是，汤姆没有放弃，他鼓励贝奇，一起寻找出口。\n汤姆和贝奇在山洞里走了很久，终于看到了亮光。他们高兴极了，朝着亮光走去。终于，他们走出了山洞。\n汤姆和贝奇回到了村里，大家都很高兴。汤姆把在山洞里的经历告诉了大家，大家都夸他勇敢。\n读了这本书，我被汤姆的勇敢和机智感动了。他告诉我，遇到困难不要害怕，要勇敢面对。',note:'写清了书的主要内容，语言简洁，结尾写了感受。'},
  {title:'《西游记》梗概',text:'《西游记》是明代作家吴承恩写的一部长篇小说。\n小说的主人公是唐僧、孙悟空、猪八戒、沙和尚。他们去西天取经，一路上经历了九九八十一难。\n唐僧是个善良的和尚，他去西天取经。孙悟空是个神通广大的猴子，他会七十二变，会腾云驾雾。猪八戒是个贪吃的猪，沙和尚是个老实的人。\n他们一路上遇到了很多妖怪。有白骨精、红孩儿、牛魔王等。孙悟空用他的金箍棒，打败了妖怪，保护唐僧去西天取经。\n经过九九八十一难，他们终于到了西天，取回了真经。\n读了这本书，我被孙悟空的勇敢和机智感动了。他告诉我，遇到困难不要害怕，要勇敢面对，坚持到底。',note:'写清了书的主要内容，语言简洁，结尾写了感受。'}
 ]
},

 fanwen:[
  {title:'感动',text:'感动，是一种温暖的感觉。在我的生活中，有很多感动的事。\n记得那是一个下雨天，我放学回家，发现忘带雨伞了。我站在校门口，看着哗哗的大雨，不知道怎么办。\n就在我着急的时候，一个熟悉的身影走了过来。是我的同学小明。"你没带伞吗？"小明问。\n"嗯，我忘带了。"我着急地说。\n"没关系，我们一起走吧。"小明把伞撑开，和我一起走进了雨中。\n一路上，小明把伞往我这边偏，他自己的肩膀却淋湿了。我看着他被淋湿的肩膀，心里很感动。\n"小明，你的肩膀淋湿了。"我说。\n"没关系，我没事。"小明笑着说。\n回到家，我看着小明远去的背影，心里暖暖的。小明的善良和关心，让我很感动。\n这就是感动，是一种温暖的感觉。这个世界上，有很多感动的事，只要我们用心去感受。',note:'写了一件感动的事，把感受写具体，让真情自然流露，结尾点题。'},
  {title:'愧疚',text:'愧疚，是一种难受的感觉。在我的生活中，有一件事让我至今愧疚。\n记得那是四年级的时候，一次考试，我考得很好。我的同桌小红却考得很差，她很难过。\n下课了，小红来问我一道题。我正忙着玩，就不耐烦地说："你自己想吧，我没空。"小红听了，失望地走了。\n看着小红失望的背影，我心里很不是滋味。我知道，小红是想让我帮她，可是我却拒绝了她。我感到很愧疚。\n从那以后，我暗暗下定决心，以后一定要帮助别人。当同学有困难的时候，我要主动帮助他们。\n虽然这件事已经过去很久了，但我还是会想起它。它让我明白了：要帮助别人，不要拒绝别人的求助。这件事，让我至今愧疚。',note:'写了一件愧疚的事，把感受写具体，让真情自然流露，结尾点明道理。'},
  {title:'盼望',text:'盼望，是一种期待的感觉。在我的生活中，有很多盼望的事。\n记得那是寒假前，我盼望着寒假快点到来。我盼望着能和家人一起过年，能收到压岁钱，能和小伙伴们一起玩。\n寒假终于来了。除夕那天，我和家人一起贴春联、吃年夜饭。晚上，我们一家人围坐在一起看春节联欢晚会，可开心了。\n正月初一，我收到了很多压岁钱。我拿着压岁钱，可高兴了。我还和小伙伴们一起放烟花、做游戏，玩得可开心了。\n寒假很快就过去了。虽然寒假很短，但我过得很开心。\n这就是盼望，是一种期待的感觉。盼望着，盼望着，美好的事情就会到来。',note:'写了一件盼望的事，把感受写具体，让真情自然流露，结尾点题。'}
 ]
},

 fanwen:[
  {title:'我的心愿',text:'每个人都有自己的心愿，我的心愿是当一名老师。\n为什么我想当老师呢？因为我觉得老师很伟大。老师把知识传授给我们，教我们做人。老师就像蜡烛，燃烧自己，照亮别人。\n我的班主任王老师，就是个很好的老师。她讲课很生动，我们都爱听。她还很关心我们，当我们遇到困难的时候，她会耐心地帮助我们。\n我希望能像王老师一样，当一名好老师。我要把知识传授给学生，教他们做人。我要关心我的学生，帮助他们成长。\n为了实现这个心愿，我要好好学习。我要学很多的知识，这样才能教学生。我还要学会关心别人，这样才能当一名好老师。\n我知道，当老师不容易。但是，我会努力的。我相信，只要我努力，我的心愿就一定能实现。',note:'写清了心愿是什么、为什么、怎样实现，条理清楚，结尾表达决心。'},

/* ===== 语音合成（标准普通话） ===== */
let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices(); }catch(e){} }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }
function pickVoice(){
  const zh=VOICES.filter(v=>/^zh/i.test(v.lang||'') && !/yue|粤|cantonese|hong ?kong|\bhk\b/i.test((v.lang||'')+' '+(v.name||'')));
  if(!zh.length) return null;
  let v=zh.find(x=>/普通话|mandarin|china|\bCN\b/i.test((x.lang||'')+' '+(x.name||''))); if(v) return v;
  v=zh.find(x=>/^zh-CN/i.test(x.lang||'')); if(v) return v;
  return zh[0];
}
function speak(text,rate){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持朗读'); return; }
  let spoken=text;
  // 仅「单字」用带声调拼音朗读，保证声调准确（如 霎 shà、鹅 é）；
  // 多字词 / 句子直接读汉字，避免「笼罩」被拼读成 lóng zhào 之类的拼音。
  if(text && /[一-龥]/.test(text)){
    const arr=[...text];
    if(arr.length===1 && PYMAP[arr[0]]) spoken=PYMAP[arr[0]];
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(spoken); u.lang='zh-CN'; u.rate=rate||0.92; u.pitch=1;
  const v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u);
}
function pickMime(){
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported) return '';
  const c=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for(const x of c){ if(MediaRecorder.isTypeSupported(x)) return x; }
  return '';
}
const Recorder={
  _rec:null,
  toggle(btn, cb){
    if(!window.MediaRecorder){ toast('当前浏览器不支持录音，请改用 Chrome / Edge'); return; }
    if(this._rec && this._rec.state==='recording'){ try{ this._rec.stop(); }catch(e){} return; }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('当前环境无法访问麦克风（请确认用 https 网址打开）'); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      let mr;
      try{ const m=pickMime(); mr=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream); }
      catch(e){ try{ mr=new MediaRecorder(stream); }catch(e2){ stream.getTracks().forEach(x=>x.stop()); toast('录音组件初始化失败，请改用 Chrome / Edge'); return; } }
      const chunks=[];
      mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      mr.onstop=()=>{
        stream.getTracks().forEach(x=>x.stop());
        this._rec=null;
        if(btn){ btn.textContent='🎙 口述'; }
        if(chunks.length){ const url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'})); if(cb)cb(url); toast('录音完成'); }
        else toast('没录到声音，请重试');
      };
      this._rec=mr;
      if(btn){ btn.textContent='⏹ 停止录音'; }
      try{ mr.start(100); }catch(e){ this._rec=null; stream.getTracks().forEach(x=>x.stop()); if(btn){ btn.textContent='🎙 口述'; } toast('启动录音失败：'+(e.message||e)); }
    }).catch(e=>{
      const nm=(e&&e.name)||'';
      toast(nm==='NotAllowedError'?'麦克风权限被拒绝：请在浏览器设置中允许麦克风':'麦克风打开失败'+(nm?'（'+nm+'）':''));
    });
  }
};
let readQueue=null;
function readAll(sentences, onSentence, onDone){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持朗读'); return; }
  speechSynthesis.cancel(); readQueue={list:sentences,i:0};
  const step=()=>{
    if(!readQueue||readQueue.i>=readQueue.list.length){ readQueue=null; document.querySelectorAll('.sent.playing').forEach(x=>x.classList.remove('playing')); if(onDone)onDone(); return; }
    if(onSentence) onSentence(readQueue.i, readQueue.list[readQueue.i]);
    const u=new SpeechSynthesisUtterance(readQueue.list[readQueue.i]); u.lang='zh-CN'; u.rate=0.9;
    const v=pickVoice(); if(v) u.voice=v;
    u.onend=()=>{ if(readQueue){ readQueue.i++; step(); } };
    speechSynthesis.speak(u);
  }; step();
}
function stopRead(){ speechSynthesis.cancel(); readQueue=null; document.querySelectorAll('.sent.playing').forEach(x=>x.classList.remove('playing')); }
// v2.4 范文领读：逐句朗读整篇范文，再点一次停止
let FW_BTN=null;
function fanwenSpeak(btn,f){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持朗读'); return; }
  const playing=speechSynthesis.speaking||speechSynthesis.pending;
  if(FW_BTN===btn&&playing){ stopRead(); btn.textContent='🔊 领读范文'; FW_BTN=null; return; }
  if(FW_BTN&&FW_BTN!==btn) FW_BTN.textContent='🔊 领读范文';
  FW_BTN=btn; btn.textContent='⏹ 停止领读';
  const parts=[];
  (f.text||'').split(/\n+/).forEach(p=>{ (p.match(/[^。！？…]+[。！？…]?/g)||[p]).forEach(sg=>{ if(sg.trim()) parts.push(sg.trim()); }); });
  readAll([f.title+'。'].concat(parts), null, ()=>{ if(FW_BTN===btn){ btn.textContent='🔊 领读范文'; FW_BTN=null; } });
}
function norm(s){ return (s||'').replace(/[\s\p{P}]/gu,'').toLowerCase(); }
function simil(a,b){
  a=norm(a); b=norm(b); if(!a&&!b) return 100; if(!a||!b) return 0;
  const m=a.length,n=b.length; const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i; for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1; dp[i][j]=Math.min(dp[i-1][j]+1,dp[i-1][j-1]+c,dp[i][j-1]+1);}
  return Math.round((1-dp[m][n]/Math.max(m,n))*100);
}

let CUR_SENT='';
const REPLAY_CACHE={};

function closeSheet(){

  const m=$('#sheetMask'), s=$('#sheet');
  if(m) m.classList.remove('show');
  if(s) s.classList.remove('show');
}
function renderSheet(){

  <div class="stip">点句子领读 · 回放始终播放上一次的录音，重新跟读后自动更新</div>`;
  const bRec=$('#shRec'); if(bRec) bRec.onclick=()=>startRecSheet(CUR_SENT);
