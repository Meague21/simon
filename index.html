<meta charset="UTF-8">

<title>小语通 · 语文学习平台</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --sub:#6b7585;
    --line:#e7ebf2; --brand:#e8543f; --brand2:#ffb031; --brand3:#3a8dde;
    --ok:#23a06b; --red:#e23b3b;
    --shadow:0 2px 10px rgba(31,39,51,.06); --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .wrap{max-width:1100px;margin:0 auto;padding:10px 14px 90px}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,#fff6f3,#fffaf2);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .topbar{max-width:1100px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;color:var(--brand);white-space:nowrap}
  .logo svg{width:26px;height:26px}
  .logo .brandname{font-weight:900}
  .logo .subname{font-size:12px;color:var(--sub);font-weight:800;margin-left:1px}
  .ver{font-size:10px;color:var(--sub);background:#eef1f6;border-radius:6px;padding:1px 6px;font-weight:800;white-space:nowrap}
  .selbar{max-width:1100px;margin:0 auto;padding:6px 14px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub)}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:10px;white-space:nowrap}
  .navsel{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:wrap}
  .navsel select.grade-full{flex:1 1 100%;max-width:none;font-size:15px;font-weight:700;padding:9px 10px}
  .navsel::-webkit-scrollbar{display:none}
  .navsel select{font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:130px}
  .topbtns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border-radius:11px;padding:8px 11px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:5px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn svg{width:15px;height:15px}
  nav.tabs{display:flex;gap:5px;padding:7px 2px;border-bottom:1px solid var(--line);overflow-x:auto}
  nav.tabs.top{background:linear-gradient(120deg,#fff6f3,#fffaf2)}
  nav.tabs.sub{background:#fff;padding:6px 2px}
  nav.tabs .tab{flex:0 0 auto;min-width:56px;text-align:center;padding:9px 6px;border-radius:11px;font-weight:700;font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
  nav.tabs.top .tab{flex:1 1 0;min-width:0;font-size:15px;padding:13px 4px;flex-direction:row;gap:6px}
  nav.tabs.top .tab svg{width:20px;height:20px}
  nav.tabs.sub .tab{min-width:54px;padding:11px 8px;font-size:14px;border-radius:12px}
  nav.tabs .tab svg{width:18px;height:18px}
  nav.tabs .tab.active{color:var(--brand);border-color:var(--brand);background:#fff3f0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:11px 0;box-shadow:var(--shadow)}
  .card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:7px}
  .card h3 .tag{font-size:11px;font-weight:700;color:#fff;background:var(--brand);border-radius:7px;padding:2px 7px}
  .card h3.fold{display:flex;align-items:center;cursor:pointer;user-select:none}
  .card h3.fold .foldt{margin-left:auto;color:var(--sub);font-weight:800;font-size:15px}
  .hint{color:var(--sub);font-size:12px}
  .due{background:#fff8f0;border:1px solid #ffe2c2;border-radius:13px;padding:10px 13px;margin:10px 0}
  .due .t{font-weight:800;color:var(--brand);margin-bottom:4px}
  .due ul{margin:0;padding-left:18px}.due li{margin:2px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:6px}
  .lvl{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .lvl:active{transform:scale(.98)}
  .lvl .u{font-size:11px;color:var(--brand);font-weight:700}
  .lvl .n{font-weight:800;font-size:15px;margin:2px 0 5px}
  .lvl .bar{height:6px;border-radius:6px;background:#eef1f6;overflow:hidden}
  .lvl .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
  .lvl .p{font-size:10px;color:var(--sub);margin-top:4px}
  .lvl.done::after{content:"已学";position:absolute;top:7px;right:-24px;transform:rotate(40deg);background:var(--ok);color:#fff;font-size:9px;font-weight:700;padding:2px 22px}
  .para{margin:12px 0}.para .pn{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:3px}
  .sent{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;border-radius:11px;margin:4px 0;border:1px solid transparent;flex-wrap:wrap}
  .sent:hover{background:#fafbff}
  .sent.playing{background:#fff3f0;border-color:#ffd5cc}
  .sent .ic{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:#fff0ec;color:var(--brand);display:flex;align-items:center;justify-content:center;margin-top:1px}
  .sent .ic svg{width:13px;height:13px}
  .sent .tx{flex:1;font-size:17px;min-width:60%;line-height:1.9}
  .sent .do{flex:0 0 auto;display:flex;gap:5px}
  .mini{border-radius:9px;padding:5px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--sub);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .mini.rec{color:var(--brand)}
  .mini.ai{color:var(--brand3);border-color:#cfe3f7}
  .mini:active{transform:scale(.97)}
  .recbox{width:100%;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .recdot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .recbadge{font-size:12px;font-weight:800;color:var(--ok);background:#e9f8f0;border:1px solid #cdeed8;border-radius:8px;padding:3px 8px}
  .aires{font-size:12px;font-weight:700}
  .toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:4px 0}
  .fullread{display:inline-flex;align-items:center;gap:5px;background:var(--brand3);color:#fff;font-weight:700;border-radius:11px;padding:8px 13px;font-size:13px}
  .wtabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
  .wtabs .w{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px;color:var(--sub)}
  .wtabs .w.active{color:var(--brand);border-color:var(--brand);background:#fff3f0}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
  .wcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px 4px;text-align:center;cursor:pointer;transition:.12s}
  .wcard:active{transform:scale(.97);border-color:var(--brand)}
  .wcard .ch{font-size:20px;font-weight:800;line-height:1.15}
  .wcard .py{color:var(--brand);font-size:11px;font-weight:700;margin:1px 0 2px}
  .wcard .zc{font-size:10px;color:var(--sub);line-height:1.35}
  .wcard .zc span{display:inline-block;background:#f3f6fc;border-radius:6px;padding:0 4px;margin:1px}
  .wcard.ciyu .ch{font-size:14px}
  .sec{border-left:4px solid var(--brand);padding:3px 0 3px 12px;margin:12px 0}
  .sec .h{font-weight:800;font-size:16px;margin-bottom:3px}
  .sec .b{color:#37404e;font-size:14px}
  .anno{background:#fffdf7;border:1px solid #f3e6c8;border-radius:11px;padding:9px 11px;margin:7px 0}
  .anno .s{font-weight:700;color:#a9791f}.anno .x{font-size:13px;margin-top:2px;color:#4a4030}
  .hw{background:#f6f9ff;border:1px solid #dde9fb;border-radius:11px;padding:9px 11px;margin:7px 0}
  .hw .q{font-weight:700;font-size:14px}
  .hw .a{font-size:13px;color:#3a516f;margin-top:5px;display:none}
  .hw .a.show{display:block}
  .train-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip:active{transform:scale(.97)}
  .qitem{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}
  .qitem .qt{font-weight:700;font-size:15px;margin-bottom:7px;display:flex;gap:7px;align-items:flex-start}
  .qitem .qt .no{color:var(--brand);font-weight:800}
  .qitem .ty{font-size:10px;background:#eef1f6;color:var(--sub);border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;display:flex;gap:7px;align-items:center;cursor:pointer}
  .opt.sel{border-color:var(--brand);background:#fff3f0}
  .qfill{width:100%;font-size:17px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-top:3px;font-family:inherit}
  .qans{margin-top:7px;font-size:12px;display:none}.qans.show{display:block}
  .qans .ref{color:var(--brand3);font-weight:700}
  .scorebox{background:linear-gradient(120deg,#fff,#f0fbf4);border:1px solid #cdeed8;border-radius:13px;padding:12px;margin:9px 0;text-align:center}
  .scorebox .n{font-size:30px;font-weight:900;color:var(--ok)}
  .material{background:#f7f9fc;border:1px dashed var(--line);border-radius:11px;padding:11px;margin:7px 0;font-size:13px;color:#37404e;white-space:pre-wrap}
  .empty{color:var(--sub);text-align:center;padding:26px 10px}
  .ghead{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px}
  .gstem{font-size:20px;font-weight:800;text-align:center;margin:10px 0;line-height:1.5}
  .gopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .gopt{border:1px solid var(--line);border-radius:11px;padding:14px 10px;font-size:15px;font-weight:700;background:#fff;text-align:center}
  .gopt.ok{background:#e9f8f0;border-color:var(--ok);color:var(--ok)}
  .gopt.no{background:#fdecec;border-color:var(--red);color:var(--red)}
  .gopt.done{cursor:default}
  .gfb{text-align:center;font-weight:800;font-size:13px;min-height:20px;margin:4px 0}
  .ok-t{color:var(--ok)}.no-t{color:var(--red)}
  .grow{display:flex;gap:7px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .cztarget{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
  .cztarget .big{font-size:40px;font-weight:900;color:var(--brand);line-height:1.1;background:#fff3f0;border-radius:14px;padding:2px 16px;border:2px solid var(--brand)}
  .cztarget .tip{font-size:12px;color:var(--sub)}
  .czside{display:flex;flex-direction:column;gap:5px;min-width:64px}
  .czside .czw{font-size:15px;padding:5px 9px;margin:0}
  .czside .ph{color:var(--line);font-size:20px}
  .czprog{text-align:center;font-size:13px;color:var(--sub);margin:3px 0;font-weight:700}
  .czprog b{color:var(--brand)}
  .czgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:300px;margin:8px auto}
  .czcell{border:1px solid var(--line);border-radius:12px;padding:13px 0;font-size:24px;font-weight:800;text-align:center;background:#fff;cursor:pointer;transition:.1s}
  .czcell:active{transform:scale(.94)}
  .czcell.gone{opacity:.22;background:#fafafa;border-style:dashed;cursor:default}
  .czcell.sel{background:#fff3f0;border-color:var(--brand);color:var(--brand)}
  .czfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 2px;flex-wrap:wrap}
  .czwords{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
  .czw{background:#e9f8f0;border:1px solid #cdeed8;border-radius:10px;padding:6px 12px;font-size:17px;font-weight:800;color:var(--ok)}
  .czw .x{color:var(--ok);font-size:13px}
  .poemtitle{text-align:center;font-weight:900;font-size:18px;margin:4px 0}
  .poemtitle .au{font-size:12px;color:var(--sub);font-weight:600}
  .poembank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .pline{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fff;font-size:15px;cursor:pointer}
  .pline.sel{background:#fff3f0;border-color:var(--brand);color:var(--brand)}
  .pline.no{background:#fdecec;border-color:var(--red);color:var(--red)}
  .poemseq{text-align:center;font-size:16px;font-weight:700;min-height:24px;margin:8px 0;line-height:1.8}
  .poemfull{background:#fbfdff;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:15px;line-height:2;text-align:center}
  .poemana{font-size:13px;color:#3a516f;margin-top:8px;line-height:1.8}
  .idiomrow{display:flex;align-items:center;gap:4px;justify-content:center;margin:10px 0;flex-wrap:wrap}
  .ichar{font-size:24px;font-weight:900;color:var(--brand)}
  .iblank{width:36px;height:44px;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:23px;font-weight:800;font-family:inherit;color:var(--ink);padding:0;background:#fff}
  .idiomrow .arrow{color:var(--sub);font-weight:800;margin:0 4px}
  .idiomex{background:#fbfdff;border:1px solid var(--line);border-radius:11px;padding:11px;margin:7px 0;font-size:13px}
  .idiomex b{color:var(--brand)}
  .bnav{display:flex;gap:7px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .bhead{font-weight:800;font-size:16px;margin-bottom:6px}
  .bcontent{background:#fcfdff;border:1px solid var(--line);border-radius:11px;padding:13px;font-size:14px;line-height:1.9;max-height:44vh;overflow:auto;white-space:pre-wrap;color:#2b3340}
  .mask{position:fixed;inset:0;background:rgba(20,25,35,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:16px}
  .modal h3{margin:0 0 8px;font-size:16px}
  .modal textarea{width:100%;height:190px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:11px;padding:9px;resize:vertical}
  .modal input[type=file]{margin:8px 0;font-size:13px}
  .modal .row{display:flex;gap:7px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1f2733;color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  @media(max-width:560px){.logo .subname{display:none}.topbar{gap:5px}.selbar{padding:4px 8px 6px}.navsel select{max-width:72px;font-size:11px;padding:5px 3px}.btn .lbl{display:none}}
  .catbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .czcell.gone{background:#f1f3f7;border-color:var(--line);color:transparent;cursor:default}
  .poemslots{display:flex;flex-direction:column;gap:7px;margin:12px auto;max-width:440px}
  .pslot{border:2px dashed var(--line);border-radius:11px;padding:11px 12px;font-size:15px;font-weight:700;min-height:22px;position:relative;background:#fff;cursor:pointer}
  .pslot.filled{border-style:solid;border-color:var(--brand);background:#fff3f0;color:var(--brand)}
  .pslot .psn{color:var(--sub);font-size:13px;font-weight:800}
  .idprev{font-size:13px;color:var(--brand);margin-left:7px;font-weight:800;letter-spacing:3px;align-self:center}
  /* 课外阅读阅读模式 */
  .readbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:9px 12px;border-radius:12px;margin:-2px 0 10px}
  .readbar .rb{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .readbar .btn{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.5)}
  /* 字词听写 */
  .txbox{text-align:center;padding:6px 2px}
  .txword{font-size:18px;font-weight:800;margin:6px 0;color:var(--ink)}
  .txword b{color:var(--brand)}
  .txhint{font-size:13px;color:var(--sub);margin:10px 0 4px}
  .txinput{width:100%;max-width:280px;font-size:30px;text-align:center;padding:10px;border:2px solid var(--brand);border-radius:14px;margin:8px auto;display:block;font-family:inherit}
  .txinput:focus{outline:none;box-shadow:0 0 0 3px #fff3f0}
  .photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .phitem{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#fff}
  .phitem img{width:100%;height:100%;object-fit:cover}
  .phitem .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1}
  input[type=file]{font-size:13px;margin:8px 0;width:100%}
  /* 消灭错别字 */
  .cbhint{font-size:12.5px;color:var(--sub);background:#fff8f0;border:1px solid #ffe2cf;border-radius:10px;padding:8px 10px;margin:8px 0}
  .cbtext{font-size:19px;line-height:2.1;letter-spacing:1px;padding:8px;border-radius:12px;background:#fff;border:1px solid var(--line)}
  .cbch{display:inline-block;padding:0 1px;cursor:pointer;border-radius:4px}
  .cbch.err{color:inherit;font-weight:inherit;background:transparent}
  .cbch.found{color:var(--ok);font-weight:900;background:#e9f8f0;border-radius:5px;padding:0 3px}
  .cbch.shake{animation:shake .4s}
  .cbreport{background:#fff8f0;border:1px solid #ffe2cf;border-radius:12px;padding:11px;margin:8px 0}
  .cbreport .h{font-weight:800;color:var(--brand);margin-bottom:6px}
  .ritem{font-size:15px;padding:3px 0;border-bottom:1px dashed #ffe2cf}
  .ritem .wrong{color:#e23b2e;font-weight:900}
  .ritem .right{color:var(--ok);font-weight:900}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  /* v2.3 消灭错别字：关卡点/通关横幅/鲜花特效 */
  .cbdot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#fff3ee;color:var(--brand);font-size:12px;font-weight:800;border:1px solid #ffd9c9;margin:0 2px;vertical-align:middle}
  .cbdot.cur{background:var(--brand);color:#fff}
  .cbdot.done{background:var(--ok);color:#fff;border-color:var(--ok)}
  .cbwin{background:#fff7e8;border:2px solid #ffd166;border-radius:14px;padding:12px;margin:10px 0;font-weight:800;color:#b0731b;text-align:center;font-size:16px}
  .cbch.missed{color:#e23b2e;font-weight:700;background:#fff0ee;border-radius:5px;padding:0 3px}

    {p:2, s:["三年前，在南京我住的地方有一道后门，每晚我打开后门，便看见一个静寂的夜。下面是一片菜园，上面是星群密布的蓝天。星光在我们的肉眼里虽然微小，然而它使我们觉得光明无处不在。那时候我正在读一些关于天文学的书，也认得一些星星，好像它们就是我的朋友，它们常常在和我谈话一样。"]},
    {p:3, s:["如今在海上，每晚和繁星相对，我把它们认得很熟了。我躺在舱面上，仰望天空。深蓝色的天空里，悬着无数半明半昧的星。船在动，星也在动，它们是这样低，真是摇摇欲坠呢！渐渐地我的眼睛模糊了，我好像看见无数萤火虫在我的周围飞舞。海上的夜是柔和的，是静寂的，是梦幻的。我望着那许多认识的星，我仿佛看见它们在对我眨眼，我仿佛听见它们在小声说话。这时我忘记了一切。在星的怀抱中我微笑着，我沉睡着。我觉得自己是一个小孩子，现在睡在母亲的怀里了。"]},
    {p:4, s:["有一夜，那个在哥伦波上船的英国人指给我看天上的巨人。他用手指着：那四颗明亮的星是头，下面的几颗是身子，这几颗是手，那几颗是腿和脚，还有三颗星算是腰带。经他这一番指点，我果然看清楚了那个天上的巨人。看，那个巨人还在跑呢！"]}

{id:'doujia5',grade:'四年级',volume:'上册',unit:'第二单元',title:'4 一个豆荚里的五粒豆',author:'安徒生',
  read:[
    {p:1,s:['有一个豆荚，里面有五粒豌豆。豆荚和豌豆都是绿的，豌豆就以为整个世界都是绿的。豆荚在生长，豌豆也在生长。豌豆按照它们在家庭里的地位，坐成一排。太阳在外边照着，把豆荚晒得暖洋洋的。这里既温暖，又舒适；白天明亮，夜间黑暗。豌豆坐在那儿越长越大，它们想，我们得做点儿事情啊。']},
    {p:2,s:['“难道我们永远就在这儿坐下去吗？”它们中的一个问，“老这样坐下去，我恐怕会变得僵硬起来。我似乎觉得外面发生了一些事情——我有这种预感！”']},
    {p:3,s:['许多天过去了。豆荚变黄了，这几粒豌豆也变黄了。“整个世界都变黄啦！”它们说。']},
    {p:4,s:['忽然，它们觉得豆荚震动了一下。豆荚被摘下，跟许多别的丰满的豆荚在一起，溜到一个口袋里去了。“我们不久就要被打开了！”豌豆们说。于是它们就等待这件事情的到来。']},
    {p:5,s:['“我倒想要知道，我们之中谁会走得远！”最小的一粒豆说，“是的，事情马上就要揭晓了。”']},
    {p:6,s:['啪！豆荚裂开来了。那五粒豆子全都躺在一个孩子的手中。这个孩子紧紧地捏着它们，说可以当作玩具枪的子弹用。他马上把第一粒豆子装进去，把它射了出去。']},
    {p:7,s:['“现在我要飞向广大的世界里去了！如果你能捉住我，就请你来吧！”第一粒豌豆说完就飞走了。“我，”第二粒说，“我将直接飞进太阳里去。这才像一粒豌豆呢，而且与我的身份非常相称！”于是，它也飞走了。“我们到了哪儿，就在哪儿住下来，”其余的两粒说，“不过，我们还得向前滚。”在没有被装进玩具枪之前，它们从小孩的手中滑落到地上，打起滚来。但这两粒豆最终还是被装进玩具枪里去了。它们说：“我们才会射得远呢！”']},
    {p:8,s:['“该怎么样就怎么样吧！”最后的那一粒说。它被射到空中，落到顶楼窗子下面的一块旧板子上，正好钻进一个长满了青苔的裂缝里。青苔把它裹起来，它躺在那儿真可以说成了一个囚犯。“该怎么样就怎么样！”这粒豆说。']},
    {p:9,s:['在这个小小的顶楼里住着一个穷苦的女人。她有一个独生女儿，身体非常虚弱，躺在床上一整年了。小女孩安静地、耐心地整天在家里躺着，而她的母亲每天到外面去挣点儿生活费。']},
    {p:10,s:['春天的一个早晨，当母亲准备出去工作的时候，太阳温和地从那个小窗子射进来，一直射到地上。']},
    {p:11,s:['小女孩望着最低的那块窗玻璃说：“有个绿东西从窗玻璃旁边探出头来，它是什么呢？”']},
    {p:12,s:['母亲向窗边走去，把窗户打开一半。“啊！”她说，“我的天，原来是一粒小豌豆在这里生了根，还长出小叶子来了。它怎么钻进这个隙缝里去的？你现在有一个小花园了！”']},
    {p:13,s:['母亲把小女孩的床搬得更靠近窗子，好让她看到这粒正在生长着的豌豆。']},
    {p:14,s:['“妈妈，我觉得我好了一些！”晚上，这个小女孩说，“太阳今天在我身上照得怪暖和的。这粒豆子长得好极了，我也会好起来的；我能爬起来，走到温暖的太阳光中去。”']}
  ],

{id:'bianfu6',grade:'四年级',volume:'上册',unit:'第二单元',title:'5 夜间飞行的秘密',author:'',
  read:[
    {p:1,s:['清朗的夜空出现两个亮点，越来越近，才看清楚是一红一绿的两盏灯。接着传来了隆隆声，是一架飞机在夜航。']},
    {p:2,s:['在漆黑的夜里，飞机是怎么做到安全飞行的呢？要想了解其中的秘密，我们可以从蝙蝠说起。']},
    {p:3,s:['蝙蝠能在夜里飞行，还能捕捉飞蛾和蚊子；而且无论怎么飞，从来没见过它跟什么东西相撞，即使一根极细的电线，它也能灵巧地避开。难道它的眼睛特别敏锐，能在漆黑的夜里看清楚所有的东西吗？']},
    {p:4,s:['为了弄清楚这个问题，两百多年前，科学家做了一次实验。他们在一间屋子里横七竖八地拉了许多绳子，绳子上系了许多铃铛，然后把蝙蝠的眼睛蒙上，让它在屋子里飞。蝙蝠飞了几个钟头，铃铛一个也没响，那么多的绳子，它一根也没碰着。']},
    {p:5,s:['科学家又做了两次实验：一次把蝙蝠的耳朵塞上，一次把蝙蝠的嘴封住，让它在屋子里飞。蝙蝠就像没头苍蝇似的到处乱撞，挂在绳子上的铃铛响个不停。']},
    {p:6,s:['三次实验的结果证明，蝙蝠夜里飞行，靠的不是眼睛，而是用嘴和耳朵配合起来探路的。']},
    {p:7,s:['后来，科学家经过反复研究，终于揭开了蝙蝠能在夜里飞行的秘密。它一边飞，一边从嘴里发出超声波。而这种声音，人的耳朵是听不见的，蝙蝠的耳朵却能听见。超声波向前传播时，遇到障碍物就反射回来，传到蝙蝠的耳朵里，蝙蝠就立刻改变飞行的方向。']},
    {p:8,s:['科学家模仿蝙蝠探路的方法，给飞机装上了雷达。雷达的工作原理与蝙蝠探路类似。雷达通过天线发出无线电波，无线电波遇到障碍物就反射回来，被雷达接收到，显示在荧光屏上。从雷达的荧光屏上，驾驶员能够清楚地看到前方有没有障碍物，所以飞机飞行就更安全了。']}
  ],

{id:'hufeng7',grade:'四年级',volume:'上册',unit:'第二单元',title:'6 呼风唤雨的世纪',author:'路甬祥',
  read:[
    {p:1,s:['20世纪是一个呼风唤雨的世纪。','是谁来呼风唤雨呢？当然是人类。','靠什么呼风唤雨呢？靠的是现代科学技术。']},
    {p:2,s:['在20世纪一百年的时间里，人类利用现代科学技术获得那么多奇迹般的、出乎意料的发现和发明。','正是这些发现和发明，使人类的生活大大改观，其改变的程度超过了人类历史上百万年的总和。']},
    {p:3,s:['人类在上百万年的历史中，一直很依赖自然，生活在一个慢吞吞、静悄悄、一到夜里就黑暗无光的世界。','那时没有电灯，没有电视，没有收音机，也没有汽车。','人们只能在神话中用“千里眼”“顺风耳”和腾云驾雾的神仙，来寄托自己的美好愿望。','我们的祖先大概谁也没有料到，在最近的100年中，他们的那么多幻想纷纷变成了现实。']},
    {p:4,s:['20世纪的成就，真可以用“忽如一夜春风来，千树万树梨花开”来形容。','20世纪，人类登上月球，潜入深海，洞察百亿光年外的天体，探索原子核世界的奥秘；20世纪，电视、程控电话、因特网以及民航飞机、高速火车、远洋船舶等，日益把人类居住的星球变成联系紧密的“地球村”。','人类生活的舒适、方便，是连过去王公贵族也不敢想的。','科学在改变着人类的精神文化生活，也在改变着人类的物质生活。']},
    {p:5,s:['回顾20世纪的百年历程，科学的确创造了一个又一个神话，为人类创造了比以往任何时代都要美好的生活。','在新的世纪里，现代科学技术必将继续创造一个个奇迹，不断改善我们的生活。']}
  ],

  study:{theme:'本文回顾20世纪科学技术的飞速发展，说明现代科技让人类“呼风唤雨”，重点通过对比古今生活，激发我们热爱科学、探索未来的情感。',struct:[{h:'呼风唤雨的世纪',b:'20世纪人类靠现代科技“呼风唤雨”，改变生活。'},{h:'古今对比',b:'过去依赖自然、黑暗无光；如今登上月球、潜入深海、交通便捷。'},{h:'展望未来',b:'科学将继续创造奇迹，改善生活。'}],anno:[{s:'20世纪的成就，真可以用“忽如一夜春风来，千树万树梨花开”来形容。',x:'引用古诗形容20世纪科技成就突如其来、变化巨大，就像春风一夜催开万树梨花。'},{s:'那时没有电灯，没有电视，没有收音机，也没有汽车。',x:'连用四个“没有”，突出过去生活的落后，与今日形成强烈对比。'}],homework:[{q:'为什么说20世纪是一个呼风唤雨的世纪？',a:'因为人类利用现代科学技术获得了许多发现和发明，大大改观了生活，其变化超过了历史上百万年的总和。'},{q:'课文用“忽如一夜春风来，千树万树梨花开”形容什么？',a:'形容20世纪科技成就多、变化快，像春风一夜之间催开无数梨花。'},{q:'你想象未来的科技会怎样改变生活？',a:'示例：未来的交通可能更智能，出行更快更环保；机器人会帮我们做更多事。'}]},
  train:{基础:[{type:'fill',q:'看拼音写词语：hū fēng huàn yǔ',a:['呼风唤雨']},{type:'fill',q:'看拼音写词语：ào mì',a:['奥秘']},{type:'fill',q:'看拼音写词语：gǎi shàn',a:['改善']}],拼音:[{type:'fill',q:'给加点字注音：依赖（赖）',a:['lài']},{type:'fill',q:'给加点字注音：潜入（潜）',a:['qián']},{type:'fill',q:'给加点字注音：哲学（哲）',a:['zhé']}],填空:[{type:'fill',q:'20世纪，人类登上______，潜入______，洞察百亿光年外的天体。',a:['月球','深海']},{type:'fill',q:'那时没有电灯，没有电视，没有收音机，也没有______。',a:['汽车']},{type:'fill',q:'科学的确创造了一个又一个______。',a:['神话']}],判断:[{type:'judge',q:'20世纪人类靠现代科学技术呼风唤雨。',a:true},{type:'judge',q:'过去的人们也有汽车和电视。',a:false},{type:'judge',q:'课文赞美了科学技术的力量。',a:true}],句式:[{type:'sentence',q:'用“没有……没有……也没有……”写一句话。',ref:'示例：山村里没有高楼，没有商场，也没有电影院，却有清新的空气。'}],课内阅读:[{type:'reading',material:'在20世纪一百年的时间里，人类利用现代科学技术获得那么多奇迹般的、出乎意料的发现和发明。正是这些发现和发明，使人类的生活大大改观，其改变的程度超过了人类历史上百万年的总和。',questions:[{type:'fill',q:'人类利用______获得许多发现和发明。',a:['现代科学技术']},{type:'judge',q:'20世纪的发现和发明使人类生活大大改观。',a:true},{type:'fill',q:'其改变的程度超过了人类历史上______年的总和。',a:['百万']}]}],课外阅读:[]}},
{id:'tianjivsai7',grade:'四年级',volume:'上册',unit:'第二单元',title:'7 田忌赛马',author:'据《史记·孙子吴起列传》改写',
 read:[
  {p:1,s:['田忌经常同齐国的贵族们赛马，并下很大的赌注。一天，孙膑看了赛马，发现双方的马的脚力相差不多，都能分成上、中、下三等。']},
  {p:2,s:['于是孙膑对田忌说："你只管下很大的赌注，我能让你取胜。"田忌很信任他，就同齐威王和贵族们下了千金的赌注。']},
  {p:3,s:['到了比赛的时候，孙膑说："现在用你的下等马对付他们的上等马，用你的上等马对付他们的中等马，用你的中等马对付他们的下等马。"']},
  {p:4,s:['三场比赛下来，田忌一负二胜，最后赢了齐威王的千金。']},
  {p:5,s:['齐威王因此知道了孙膑的才智，封他为军师。']}
 ],
 words:{huiRen:[{ch:'忌',py:'jì',zc:['田忌','忌讳']},{ch:'孙',py:'sūn',zc:['孙膑','孙子']},{ch:'膑',py:'bìn',zc:['孙膑']},{ch:'策',py:'cè',zc:['计策','策略']},{ch:'膂',py:'lǚ',zc:['膂力']}],huiXie:[{ch:'赛',py:'sài',zc:['赛马','比赛']},{ch:'赢',py:'yíng',zc:['赢家','输赢']},{ch:'输',py:'shū',zc:['输赢','运输']},{ch:'注',py:'zhù',zc:['赌注','注意']},{ch:'等',py:'děng',zc:['等级','等待']},{ch:'对',py:'duì',zc:['对付','对面']},{ch:'付',py:'fù',zc:['对付','付出']},{ch:'胜',py:'shèng',zc:['取胜','胜利']}],ciyu:['赛马','赌注','脚力','上等马','中等马','下等马','取胜','军师','一负二胜']},
 study:{theme:'本文根据《史记》改写，写田忌赛马常输，孙膑观察后发现双方马的脚力相差不多，便献计调换马的出场顺序：下等马对上等马，上等马对中等马，中等马对下等马，最终一负二胜、转败为胜。故事告诉我们：遇事要善于观察、动脑筋，用智慧取胜。',struct:[{h:'发现问题',b:'孙膑观赛，发现双方马脚力相差不多，可分上中下三等。'},{h:'献计',b:'孙膑让田忌下大赌注，并安排好马的出场顺序。'},{h:'转败为胜',b:'田忌一负二胜，赢了千金；齐威王因此拜孙膑为军师。'}],anno:[{s:'发现双方的马的脚力相差不多，都能分成上、中、下三等。',x:'这是孙膑取胜的关键：先仔细观察，找到可以利用的条件。'},{s:'现在用你的下等马对付他们的上等马，用你的上等马对付他们的中等马，用你的中等马对付他们的下等马。',x:'调换出场顺序，以己之长攻彼之短，一负二胜，体现智慧。'}],homework:[{q:'孙膑的计策妙在哪里？',a:'妙在仔细观察后调换出场顺序：故意输一场，用上等马赢中等马、中等马赢下等马，三局两胜。'},{q:'从这个故事你明白了什么道理？',a:'遇到难题要善于观察、多动脑筋，用智慧和策略取胜，不能只靠硬拼。'}]},

{id:'xiuzuo2',grade:'四年级',volume:'上册',unit:'第二单元',title:'习作·我的家人',author:'',
  read:[
    {p:1,s:['我们一家人，各有各的样子和脾气。','这次习作，写一写你的家人：可以写一位，也可以写几位。']},
    {p:2,s:['写之前先想清楚：他（她）最大的特点是什么？哪件事最能体现这个特点？','用一件真实、具体的事把特点写清楚，比空说形容词更有说服力。']},
    {p:3,s:['写完后读给家人听，请他们评一评：特点写清楚了吗？事例真实吗？']}
  ],
  words:{huiRen:[],huiXie:[],ciyu:['特点','外貌','性格','爱好','习惯','温柔','勤快','幽默','认真','疼爱','敬佩','慈祥']},
  study:{theme:'本次习作是写人作文《我的家人》。要抓住家人最鲜明的一个特点（外貌、性格、爱好或习惯），用一件真实具体的事把特点写清楚，表达出对家人的真情实感。2026版不再限定"比作动物"，给了更自由的发挥空间——关键是"特点＋具体事例"。',struct:[{h:'第一步·审题选材',b:'确定写谁、写他什么特点。选你最熟悉、最有话可说的一位家人，特点要"与众不同"（如：妈妈很会讲故事、爷爷是个倔脾气）。'},{h:'第二步·选事例',b:'用"一件具体的事"证明特点，不要只写"她很温柔"。事例要有动作、语言、神态等细节，让读者仿佛亲眼看见。'},{h:'第三步·列提纲',b:'开头（点明是谁、总体印象）→ 中间（按事情发展写一件体现特点的事）→ 结尾（回扣特点、抒发情感）。'},{h:'第四步·写生动',b:'加上外貌、语言、动作、神态描写；用"有一次……"引出事例；结尾表达爱，做到真情实感。'}],anno:[{s:'写人秘诀：特点 ＋ 一件具体的事。',x:'只写"妈妈很温柔"太空洞；写"妈妈半夜起来给我盖被子、轻声哄我"才真实动人。一个好事例胜过十句形容词。'},{s:'外貌不要从头写到脚。',x:'挑和特点有关的写，比如写"爱运动的爸爸"就写他结实的胳膊，不必写五官长相。'},{s:'用细节代替评判。',x:'不说"奶奶很节俭"，而写"奶奶把我的旧衣服改成抹布，说还能用"。让事例替你说话，读者自己会得出结论。'}],homework:[{q:'列一个习作提纲：写谁？什么特点？用哪件事？',a:'示例：写妈妈；特点是很会讲故事；事例：每晚睡前给我讲一个自编故事，让我安心入睡。'},{q:'用"特点+一件小事"写一段话介绍你的家人。',a:'示例：我的爸爸很幽默。有一次我考试没考好，他模仿监考老师走路的样子，把我逗得破涕为笑。'},{q:'习作结尾可以怎么写？',a:'回扣特点并表达情感，如"这就是我的幽默爸爸，他总能用笑声赶走我的烦恼"。'}]},
  train:{基础:[{type:'fill',q:'写人作文，要先抓住家人的______（特点/名字）。',a:['特点']},{type:'fill',q:'把特点写清楚，最好用一件______的事。',a:['具体']}],拼音:[{type:'fill',q:'给加点字注音：特点（特）',a:['tè']},{type:'fill',q:'给加点字注音：性格（性）',a:['xìng']}],填空:[{type:'fill',q:'本次习作可以写一位家人，也可以写______家人。',a:['几位']},{type:'fill',q:'写完后读给______听，请他们评一评。',a:['家人']},{type:'fill',q:'写人作文的秘诀是：______ ＋ 一件具体的事。',a:['特点']}],判断:[{type:'judge',q:'写家人只要写名字和年龄就够了。',a:false},{type:'judge',q:'用一件具体的事能更好地写出家人的特点。',a:true},{type:'judge',q:'习作结尾可以表达对家人的情感。',a:true}],句式:[{type:'sentence',q:'用“我的____最____，有一次______”写一句话介绍家人。',ref:'示例：我的妹妹最调皮，有一次把我的作业本画满了小星星。'}],课内阅读:[],课外阅读:[]}},
{id:'ywyd2',grade:'四年级',volume:'上册',unit:'第二单元',title:'语文园地二',author:'',
  read:[
    {p:1,s:['【梳理与交流】阅读时，我们要从不同角度去思考，提出自己的问题。可以针对课文的一部分内容提问，也可以针对全文提问；可以针对课文内容提问，也可以针对写法提问，还可以联系生活经验提问。提出问题时，要筛选出对理解课文最有帮助的问题。']},
    {p:2,s:['【词句段运用】读下面的句子，注意问号的用法，再照样子写一写。','例：是谁来呼风唤雨呢？当然是人类。（这种自问自答的句子，叫“设问句”，能引起读者注意、强调答案。）']},
    {p:3,s:['好问则裕，自用则小。——《尚书》']},
    {p:4,s:['博学之，审问之，慎思之，明辨之，笃行之。——《礼记》']},
    {p:5,s:['智能之士，不学不成，不问不知。——王充']},
    {p:6,s:['人非生而知之者，孰能无惑？——韩愈']}
  ],

{id:'pashanhu9',grade:'四年级',volume:'上册',unit:'第三单元',title:'9 爬山虎的脚',author:'叶圣陶',
 read:[
  {p:1,s:['学校操场北边墙上满是爬山虎。我家也有爬山虎，从小院的西墙爬上去，在房顶上占了一大片地方。']},
  {p:2,s:['爬山虎刚长出来的叶子是嫩红的，不几天叶子长大，就变成嫩绿的。爬山虎的嫩叶，不大引人注意，引人注意的是长大了的叶子。那些叶子绿得那么新鲜，看着非常舒服。叶尖一顺儿朝下，在墙上铺得那么均匀，没有重叠起来的，也不留一点儿空隙。']},
  {p:3,s:['以前，我只知道这种植物叫爬山虎，可不知道它怎么能爬。今年，我注意了，原来爬山虎是有脚的。爬山虎的脚长在茎上。茎上长叶柄的地方，反面伸出枝状的六七根细丝，这些细丝很像蜗牛的触角。细丝跟新叶子一样，也是嫩红的。这就是爬山虎的脚。']},
  {p:4,s:['爬山虎的脚触着墙的时候，六七根细丝的头上就变成小圆片，巴住墙。细丝原先是直的，现在弯曲了，把爬山虎的嫩茎拉一把，使它紧贴在墙上。爬山虎就是这样一脚一脚地往上爬。']},
  {p:5,s:['爬山虎的脚要是没触着墙，不几天就萎了，后来连痕迹也没有了。触着墙的，细丝和小圆片逐渐变成灰色。不要瞧不起那些灰色的脚，那些脚巴在墙上相当牢固，要是你的手指不费一点儿劲，休想拉下爬山虎的一根茎。']}
 ],

{id:'xishuai10',grade:'四年级',volume:'上册',unit:'第三单元',title:'10 蟋蟀的住宅',author:'法布尔',
 read:[
  {p:1,s:['居住在草地上的蟋蟀，差不多和蝉一样有名。它的出名不光由于它的唱歌，还由于它的住宅。']},
  {p:2,s:['别的昆虫大多在临时的隐藏所藏身。它们的隐蔽所得来不费工夫，弃去毫不可惜。蟋蟀和它们不同，不肯随遇而安。它常常慎重地选择住址，一定要排水优良，并且有温和的阳光。它不利用现成的洞穴，它的舒服的住宅是自己一点一点挖掘的，从大厅一直到卧室。']},
  {p:3,s:['蟋蟀盖房子大多是在十月，秋天初寒的时候。它用前足扒土，还用钳子搬掉较大的土块。它用强有力的后足踏地。后腿上有两排锯，用它将泥土推到后面，倾斜地铺开。']},
  {p:4,s:['住宅的重要部分快完成了。洞已经挖了有两寸深，够宽敞的了。余下的是长时间的整修，今天做一点儿，明天做一点儿。这个洞可以随天气的变冷和它身体的增长而加深加阔。']},
  {p:5,s:['在朝着阳光的堤岸上，青草丛中隐藏着一条倾斜的隧道，即使有骤雨，这里也立刻就会干的。隧道顺着地势弯弯曲曲，最多九寸深，一指宽，这便是蟋蟀的住宅。出口的地方总有一丛草半掩着，就像一座门。蟋蟀出来吃周围的嫩草，决不去碰这一丛草。那微斜的门口，经过仔细耙扫，收拾得很平坦。这就是蟋蟀的平台。当四周很安静的时候，蟋蟀就在这平台上弹琴。']},
  {p:6,s:['屋子的内部没什么布置，但是墙壁很光滑。主人有的是时间，把粗糙的地方修理平整。大体上讲，住所是很简朴的，清洁、干燥，很卫生。']},
  {p:7,s:['假使我们想到蟋蟀用来挖掘的工具是那样简单，这座住宅真可以算是伟大的工程了。']}
 ],

 study:{theme:'本文写蟋蟀不肯随遇而安，慎重选择排水优良、有温和阳光的地方，用自己的前足、后足一点一点挖掘，建成清洁、干燥、卫生的住宅。作者法布尔长期细致观察，把蟋蟀当作人来写，赞扬它吃苦耐劳、不肯随遇而安的精神。（注：此处原文为节选整理版，完整原文以课本为准。）',struct:[{h:'出名的原因',b:'蟋蟀出名不光因为唱歌，还因为它的住宅。'},{h:'不肯随遇而安',b:'别的昆虫随便藏身，蟋蟀却慎重选择住址，自己挖掘住宅。'},{h:'怎样建造',b:'用前足扒土、钳子搬土块、后足踏地、后腿上的锯推土铺开，长时间整修。'},{h:'住宅的样子',b:'隧道倾斜、弯弯曲曲，出口有草半掩；门口平坦是它的平台；屋内简朴、清洁、干燥。'}],anno:[{s:'蟋蟀和它们不同，不肯随遇而安。',x:'"随遇而安"写出蟋蟀对住宅的讲究，把它当作人来写，生动有趣。'},{s:'当四周很安静的时候，蟋蟀就在这平台上弹琴。',x:'"弹琴"指蟋蟀鸣叫，拟人写法，写出住宅带来的舒适与情趣。'},{s:'假使我们想到蟋蟀用来挖掘的工具是那样简单，这座住宅真可以算是伟大的工程了。',x:'结尾点题：用简单的工具建成这样的住宅，确实是伟大的工程，赞叹之情溢于言表。'}],homework:[{q:'蟋蟀的住宅有什么特点？',a:'排水优良、有温和的阳光；隧道倾斜、弯弯曲曲；出口有草半掩，门口平坦；内部简朴、清洁、干燥、卫生。'},{q:'蟋蟀是怎样挖掘住宅的？',a:'用前足扒土，用钳子搬掉较大的土块，用强有力的后足踏地，用后腿上的两排锯把泥土推到后面倾斜地铺开。'},{q:'作者为什么能把蟋蟀的住宅写得这样清楚？',a:'因为法布尔对蟋蟀进行了长期、细致的观察。'}]},

{id:'pangu', grade:'四年级', volume:'上册', unit:'第四单元', title:'11 盘古开天地', author:'中国神话',
  read:[
    {p:1, s:['很久很久以前，天和地还没有分开，宇宙混沌一片，像个大鸡蛋。','有个叫盘古的巨人，在混沌之中睡了一万八千年。']},
    {p:2, s:['他醒来后，见周围一片漆黑，就抡起大斧头，朝眼前的黑暗猛劈过去。','只听一声巨响，混沌一片的东西渐渐分开了。']},
    {p:3, s:['轻而清的东西，缓缓上升，变成了天；重而浊的东西，慢慢下降，变成了地。','盘古怕它们还会合在一起，就头顶着天，脚踩着地，站在天地当中。']},
    {p:4, s:['天每天升高一丈，地每天加厚一丈，盘古的身体也跟着长高。','这样不知过了多少年，天和地终于成形了，盘古也累得倒了下去。']},
    {p:5, s:['盘古倒下后，他的身体发生了巨大的变化：他呼出的气息，变成了四季的风和飘动的云；他发出的声音，化作了隆隆的雷声……','人类的老祖宗盘古，用他的整个身体创造了美丽的宇宙。']}
  ],
  words:{huiRen:[{ch:'沌',py:'dùn',zc:['混沌','浑沌']},{ch:'斧',py:'fǔ',zc:['斧头','斧子']},{ch:'劈',py:'pī',zc:['劈开','劈柴']},{ch:'浊',py:'zhuó',zc:['浑浊','浊气']},{ch:'丈',py:'zhàng',zc:['一丈','丈量']},{ch:'撑',py:'chēng',zc:['支撑','撑起']}],huiXie:[{ch:'暗',py:'àn',zc:['黑暗','明暗']},{ch:'斧',py:'fǔ',zc:['斧头','板斧']},{ch:'劈',py:'pī',zc:['劈开','劈面']},{ch:'缓',py:'huǎn',zc:['缓缓','缓慢']},{ch:'浊',py:'zhuó',zc:['浑浊','浊气']},{ch:'丈',py:'zhàng',zc:['一丈','丈夫']},{ch:'撑',py:'chēng',zc:['支撑','撑伞']},{ch:'竭',py:'jié',zc:['竭尽','竭力']},{ch:'液',py:'yè',zc:['血液','液体']},{ch:'茂',py:'mào',zc:['茂盛','茂密']}],ciyu:['宇宙','混沌','漆黑','猛劈','缓缓','上升','下降','头顶','脚踩','累倒','气息','创造']},
  study:{theme:'本文讲巨人盘古用神力开辟天地，又用自己的身体化为世间万物，赞美了他开辟天地、无私奉献的精神。',struct:[{h:'混沌初开',b:'盘古醒来，抡斧劈开混沌，轻清上升为天，重浊下降为地。'},{h:'顶天立地',b:'盘古怕天地合拢，头顶天、脚踩地，随天地生长，撑了许多年。'},{h:'化身万物',b:'盘古倒下后，身体各部分化作风云雷电、山川草木，创造宇宙。'}],anno:[{s:'轻而清的东西，缓缓上升，变成了天；重而浊的东西，慢慢下降，变成了地。',x:'对比"轻—重""清—浊""上升—下降"，把天地分开的过程写得清晰生动。'},{s:'人类的老祖宗盘古，用他的整个身体创造了美丽的宇宙。',x:'总结全文，点明盘古牺牲自我、创造万物的奉献精神，是文章主旨。'}],homework:[{q:'讲故事：盘古是怎么创造宇宙的？',a:'盘古劈开混沌分出天地，顶天立地撑开天地，最后身体化作风云、山川、草木等万物。'},{q:'你喜欢盘古吗？为什么？',a:'喜欢，因为他开辟天地、用自己的身体创造万物，有无私奉献的精神。'},{q:'读读"轻而清……重而浊……"这样的句子，体会对比的写法。',a:'用成对的反义词对比，把抽象的开天过程写得具体可感。'}]},
  train:{基础:[{type:'fill',q:'看拼音写词语：hùn dùn',a:['混沌']},{type:'fill',q:'看拼音写词语：chēng zhù',a:['撑住']}],拼音:[{type:'fill',q:'给加点字注音：斧头（斧）',a:['fǔ']},{type:'fill',q:'给加点字注音：浑浊（浊）',a:['zhuó']}],填空:[{type:'fill',q:'轻而______的东西，缓缓上升，变成了天。',a:['清']},{type:'fill',q:'重而浊的东西，慢慢______，变成了地。',a:['下降']},{type:'fill',q:'盘古倒下后，他的身体化作了______。',a:['万物']}],判断:[{type:'judge',q:'盘古用斧头劈开了混沌。',a:true},{type:'judge',q:'盘古的身体化作了世间万物。',a:true},{type:'judge',q:'这是一篇童话故事。',a:false}],句式:[{type:'sentence',q:'用"变成了"写一句话。',ref:'示例：春天来了，山坡变成了绿色的海洋。'}],课内阅读:[],课外阅读:[]}},

  study:{theme:'本文写炎帝之女女娃溺于东海，化为精卫鸟，日复一日衔木石填海，赞美她不畏艰难、永不放弃的精神。',struct:[{h:'女娃化鸟',b:'女娃游东海溺亡，魂化为精卫鸟。'},{h:'衔石填海',b:'精卫常衔西山木石，投入东海，誓要填平大海。'}],anno:[{s:'女娃游于东海，溺而不返，故为精卫',x:'交代精卫的来历，"溺而不返"是悲剧，"故为精卫"引出不屈的填海行动。'},{s:'常衔西山之木石，以堙于东海。',x:'"常"字写出坚持不懈；以小鸟填海，凸显不畏艰难、矢志不渝的精神。'}],homework:[{q:'用自己的话讲《精卫填海》。',a:'炎帝的小女儿女娃去东海游玩，不幸溺水身亡，化为精卫鸟，常常衔西山的树枝石子去填东海。'},{q:'精卫给你留下什么印象？',a:'她虽然弱小，却坚持不懈地填海，让我看到不畏艰难、永不放弃的精神。'},{q:'说说"游于东海"的意思。',a:'"于"是在的意思，"游于东海"就是到东海游玩。'}]},

{id:'puluo13',grade:'四年级',volume:'上册',unit:'第四单元',title:'13 普罗米修斯',author:'古希腊神话',
 read:[
  {p:1,s:['很久很久以前，地面上没有火，人们只好吃生的东西，在无边的黑暗中度过一个又一个长夜。就在这时候，有一位名叫普罗米修斯的天神来到了人间，看到人类没有火的悲惨情景，决心冒着生命危险，到太阳神阿波罗那里去拿取火种。']},
  {p:2,s:['有一天，当阿波罗驾着太阳车从天空中驰过的时候，普罗米修斯跑到太阳车那里，从喷射着火焰的车轮上，拿取了一颗火星，带到人间。自从有了火，人类就开始用它烧熟食物，驱寒取暖，并用火来驱赶危害人类安全的猛兽……']},
  {p:3,s:['得知普罗米修斯从天上取走火种的消息，众神的领袖宙斯气急败坏，决定给普罗米修斯以最严厉的惩罚，吩咐火神立即执行。']},
  {p:4,s:['火神赫淮斯托斯很敬佩普罗米修斯，悄悄对他说："只要你向宙斯承认错误，归还火种，我一定请求他饶恕你。"普罗米修斯摇摇头，坚定地回答："为人类造福，有什么错？我可以忍受各种痛苦，但决不会承认错误，更不会归还火种！"']},
  {p:5,s:['火神不敢违抗宙斯的命令，只好把普罗米修斯押到高加索山上。普罗米修斯的双手和双脚戴着铁环，被死死地锁在高高的悬崖上。他既不能动弹，也不能睡觉，日夜遭受着风吹雨淋的痛苦。尽管如此，普罗米修斯就是不向宙斯屈服。']},
  {p:6,s:['狠心的宙斯又派了一只凶恶的鹫鹰，每天站在普罗米修斯的双膝上，用它尖利的嘴巴，啄食他的肝脏。白天，他的肝脏被吃光了，可是一到晚上，肝脏又重新长了起来。这样，普罗米修斯所承受的痛苦，永远没有了尽头。']},
  {p:7,s:['许多年来，普罗米修斯一直被锁在那个可怕的悬崖上。有一天，著名的大力神赫拉克勒斯经过高加索山。他看到普罗米修斯被锁在悬崖上，心中愤愤不平，便挽弓搭箭，射死了那只鹫鹰，又用石头砸碎了锁链。普罗米修斯——这位敢于从天上拿取火种的英雄，终于获得了自由。']}

 study:{theme:'本文写天神普罗米修斯同情人类，冒险从太阳车那里拿取火种带到人间，因此受到宙斯最严厉的惩罚，被锁在高加索山上，还遭鹫鹰啄食肝脏，却始终不屈服，最后被大力神赫拉克勒斯解救。故事赞颂他为民造福、不畏强暴、甘于牺牲的英雄精神。（注：此处原文为节选整理版，完整原文以课本为准。）',struct:[{h:'拿取火种',b:'人间没有火，普罗米修斯从太阳车上拿取火星，带给人类。'},{h:'受到惩罚',b:'宙斯气急败坏，命火神把他锁在高加索山上，还派鹫鹰啄食他的肝脏。'},{h:'宁死不屈',b:'面对痛苦，普罗米修斯坚定不认错、不归还火种。'},{h:'获得自由',b:'赫拉克勒斯射死鹫鹰、砸碎锁链，救下普罗米修斯。'}],anno:[{s:'为人类造福，有什么错？我可以忍受各种痛苦，但决不会承认错误，更不会归还火种！',x:'反问加坚定的话语，写出普罗米修斯为民造福的决心与无畏。'},{s:'白天，他的肝脏被吃光了，可是一到晚上，肝脏又重新长了起来。这样，普罗米修斯所承受的痛苦，永远没有了尽头。',x:'写出惩罚的残酷，反衬普罗米修斯的坚强不屈。'}],homework:[{q:'普罗米修斯为什么要拿取火种？',a:'他看到人类没有火，只能吃生的东西，在黑暗中生活，十分悲惨，就决心冒险拿取火种帮助人类。'},{q:'普罗米修斯受到了哪些惩罚？他屈服了吗？',a:'被锁在高加索山上，遭受风吹雨淋，还被鹫鹰啄食肝脏。他没有屈服，坚定不认错。'},{q:'说说你心中的普罗米修斯是怎样的英雄。',a:'他为人类造福不惜忍受巨大痛苦，不畏强权、勇于牺牲，是真正的英雄。'}]},

{id:'nuwa14',grade:'四年级',volume:'上册',unit:'第四单元',title:'14 女娲补天',author:'中国神话',
 read:[
  {p:1,s:['自从女娲创造了人类，大地上到处是欢歌笑语，人们一直过着快乐幸福的生活。']},
  {p:2,s:['不知过了多少年，一天夜里，女娲突然被一阵"轰隆隆"的巨大响声震醒了。她急忙起来，跑到外面一看，天哪，太可怕了！远远的天空塌下一大块，露出一个黑黑的大窟窿。地被震裂了，出现了一道道深沟。山冈上燃烧着熊熊大火，田野里到处是洪水。许多人被火围困在山顶上，许多人在水里挣扎。']},
  {p:3,s:['女娲难过极了。她立刻去找雨神，求他下一场雨，把天火熄灭。又造了船，好救出挣扎在洪水中的人们。']},
  {p:4,s:['不久，天火熄灭了，洪水中的人们被救上来了。可是，天上的大窟窿还在喷火。女娲决定冒着生命危险，把天补上。她跑到山上，去寻找补天用的五彩石，她原以为这种石头很多，用不着费多大力气。到山上一看，全是一些零零星星的碎块。她忙了几天几夜，找到了红、黄、蓝、白、青五种颜色的石头，还缺少一种纯青石。于是，她又找啊找啊，终于在一眼清清的泉水中找到了。']},
  {p:5,s:['五彩石找齐了，女娲在地上挖个圆坑，把五彩石放在里面，用神火进行冶炼。炼了五天五夜，五彩石化成了很稠的液体。女娲把它装在一个大盆里，端到天边，对准那个大黑窟窿，往上一泼，只见金光四射，大窟窿立刻被补好了。']},
  {p:6,s:['现在，人们常常看见天边五彩的云霞，传说那就是女娲补天的地方。']}
 ],

 study:{theme:'本文写天塌地裂、人类遭受灾难，女娲求雨灭火、造船救人，又冒着生命危险找齐五彩石，用神火冶炼五天五夜把天补好，歌颂她不怕危险、甘于奉献、造福人类的伟大精神。（注：此处原文为节选整理版，完整原文以课本为准。）',struct:[{h:'灾难降临',b:'天塌下大窟窿，地裂沟深，山冈着火，田野洪水，人们陷入灾难。'},{h:'救灾',b:'女娲求雨神熄灭天火，又造船救出洪水中的人们。'},{h:'补天',b:'女娲找齐五彩石，用神火冶炼成液体，把天上的大窟窿补好。'}],anno:[{s:'她忙了几天几夜，找到了红、黄、蓝、白、青五种颜色的石头，还缺少一种纯青石。于是，她又找啊找啊，终于在一眼清清的泉水中找到了。',x:'"几天几夜""找啊找啊""终于"写出寻找五彩石的艰难和女娲的坚持。'},{s:'炼了五天五夜，五彩石化成了很稠的液体。',x:'"五天五夜"写出补天工程之艰巨，突出女娲不怕辛劳。'}],homework:[{q:'女娲为什么要补天？',a:'天塌下大窟窿，地裂火起、洪水泛滥，人类遭受巨大灾难，女娲为拯救人类决定补天。'},{q:'女娲是怎样补天的？',a:'先找齐红、黄、蓝、白、青五彩石，再用神火冶炼五天五夜化成液体，端到天边往窟窿上一泼，把天补好。'},{q:'说说女娲给你留下的印象。',a:'女娲善良、勇敢、不怕危险和辛劳，一心想着拯救人类，是一位了不起的女神。'}]},

{id:'maque15',grade:'四年级',volume:'上册',unit:'第五单元',title:'15 麻雀',author:'屠格涅夫',
 read:[
  {p:1,s:['我打猎回来，走在林荫路上。猎狗跑在我的前面。']},
  {p:2,s:['突然，我的猎狗放慢脚步，悄悄地向前走，好像嗅到了前面有什么野物。']},
  {p:3,s:['风猛烈地摇撼着路旁的白桦树。我顺着林荫路望去，看见一只小麻雀呆呆地站在地上，无可奈何地拍打着小翅膀。它嘴角嫩黄，头上长着绒毛，分明是刚出生不久，从巢里掉下来的。']},
  {p:4,s:['猎狗慢慢地走近小麻雀，嗅了嗅，张开大嘴，露出锋利的牙齿。突然，一只老麻雀从一棵树上飞下来，像一块石头似的落在猎狗面前。它挓挲起全身的羽毛，绝望地尖叫着。']},
  {p:5,s:['老麻雀用自己的身躯掩护着小麻雀，想拯救自己的幼儿。可是因为紧张，它浑身发抖，发出嘶哑的声音。在它看来，猎狗是个多么庞大的怪物啊！可是它不能安然地站在高高的没有危险的树枝上，一种强大的力量使它飞了下来。']},
  {p:6,s:['猎狗愣住了，它可能没料到老麻雀会有这么大的勇气，慢慢地，慢慢地向后退。']},
  {p:7,s:['我急忙唤回我的猎狗，带着它走开了。']}

{id:'patianf16',grade:'四年级',volume:'上册',unit:'第五单元',title:'16 爬天都峰',author:'黄亦波',
 read:[
  {p:1,s:['暑假里，爸爸带我去黄山，爬天都峰。']},
  {p:2,s:['我站在天都峰脚下抬头望：啊，峰顶这么高，在云彩上面哩！我爬得上去吗？再看看笔陡的石级，石级边上的铁链，似乎是从天上挂下来的，真叫人发颤！']},
  {p:3,s:['忽然听到背后有人叫我："小朋友，你也来爬天都峰？"我回头一看，是一位白发苍苍的老爷爷，年纪比我爷爷还大哩！我点点头，仰起脸，问："老爷爷，您也来爬天都峰？"老爷爷也点点头，说："对，咱们一起爬吧！"']},
  {p:4,s:['我奋力向峰顶爬去，一会儿攀着铁链上，一会儿手脚并用向上爬，像小猴子一样……爬呀爬，我和老爷爷，还有爸爸，终于都爬上了天都峰顶。']},
  {p:5,s:['在鲫鱼背前，爸爸给我和老爷爷照了一张相，留作纪念。老爷爷拉拉我的小辫子，笑呵呵地说："谢谢你啦，小朋友。要不是你的勇气鼓舞我，我还下不了决心哩！现在居然爬上来了！"']},
  {p:6,s:['"不，老爷爷，我是看您也要爬天都峰，才有勇气向上爬的！我应该谢谢您！"']},
  {p:7,s:['爸爸听了，笑着说："你们这一老一小真有意思，都会从别人身上汲取力量！"']}
 ],

 study:{theme:'本文写"我"和一位素不相识的老爷爷互相鼓励、一起奋力爬上又高又陡的天都峰的事，说明面对困难，要有勇气，还要善于从别人身上汲取力量，战胜困难。（注：此处原文为节选整理版，完整原文以课本为准。）',struct:[{h:'望峰生畏',b:'天都峰又高又陡，石级似乎从天上挂下来，"我"心里发颤。'},{h:'相遇鼓励',b:'"我"遇到一位白发苍苍的老爷爷，两人约定一起爬。'},{h:'奋力攀登',b:'"我"攀着铁链、手脚并用，终于和老爷爷一起爬上峰顶。'},{h:'互相感谢',b:'一老一小都说是对方给了自己勇气，爸爸点明：都会从别人身上汲取力量。'}],anno:[{s:'再看看笔陡的石级，石级边上的铁链，似乎是从天上挂下来的，真叫人发颤！',x:'"挂下来"写出石级的陡峭，为后文努力攀登作铺垫。'},{s:'你们这一老一小真有意思，都会从别人身上汲取力量！',x:'爸爸的话点明中心：面对困难，互相鼓励能给人力量。'}],homework:[{q:'"我"为什么一开始不敢爬天都峰？',a:'因为天都峰太高太陡，石级似乎从天上挂下来，"我"怕自己爬不上去。'},{q:'"我"和老爷爷为什么都感谢对方？',a:'"我"看到老爷爷也敢爬，才有了勇气；老爷爷看到小朋友也来爬，才下决心。他们互相鼓励，从对方身上汲取了力量。'},{q:'从这件事你明白了什么？',a:'面对困难要有勇气，还要学会从别人身上汲取力量，互相鼓励，共同战胜困难。'}]},

{id:'changcheng17',grade:'四年级',volume:'上册',unit:'第六单元',title:'17 长城',author:'',
 read:[
  {p:1,s:['远看长城，它像一条长龙，在崇山峻岭之间蜿蜒盘旋。从东头的山海关到西头的嘉峪关，有一万三千多里。']},
  {p:2,s:['从北京出发，不过一百多里就来到长城脚下。这一段长城修筑在八达岭上，高大坚固，是用巨大的条石和城砖筑成的。城墙顶上铺着方砖，十分平整，像很宽的马路，五六匹马可以并行。城墙外沿有两米多高的成排的垛子，垛子上有方形的瞭望口和射口，供瞭望和射击用。城墙顶上，每隔三百多米就有一座方形的城台，是屯兵的堡垒。打仗的时候，城台之间可以互相呼应。']},
  {p:3,s:['站在长城上，踏着脚下的方砖，扶着墙上的条石，很自然地想起古代修筑长城的劳动人民来。单看这数不清的条石，一块有两三千斤重，那时候没有火车、汽车，没有起重机，就靠着无数的肩膀无数的手，一步一步地抬上这陡峭的山岭。多少劳动人民的血汗和智慧，才凝结成这前不见头、后不见尾的万里长城。']},
  {p:4,s:['这样气魄雄伟的工程，在世界历史上是一个伟大的奇迹。']}
 ],

{id:'yiheyuan18',grade:'四年级',volume:'上册',unit:'第六单元',title:'18 颐和园',author:'',
 read:[
  {p:1,s:['北京的颐和园是个美丽的大公园。']},
  {p:2,s:['进了颐和园的大门，绕过大殿，就来到有名的长廊。绿漆的柱子，红漆的栏杆，一眼望不到头。这条长廊有七百多米长，分成二百七十三间。每一间的横槛上都有五彩的画，画着人物、花草、风景，几千幅画没有哪两幅是相同的。长廊两旁栽满了花木，这一种花还没谢，那一种花又开了。']},
  {p:3,s:['走完长廊，就来到了万寿山脚下。抬头一看，一座八角宝塔形的三层建筑耸立在半山腰上，黄色的琉璃瓦闪闪发光。那就是佛香阁。下面的一排排金碧辉煌的宫殿，就是排云殿。']},
  {p:4,s:['登上万寿山，站在佛香阁的前面向下望，颐和园的景色大半收在眼底。葱郁的树丛，掩映着黄的绿的琉璃瓦屋顶和朱红的宫墙。正前面，昆明湖静得像一面镜子，绿得像一块碧玉。游船、画舫在湖面慢慢地滑过，几乎不留一点儿痕迹。向东远眺，隐隐约约可以望见几座古老的城楼和城里的白塔。']},
  {p:5,s:['从万寿山下来，就是昆明湖。昆明湖围着长长的堤岸，堤上有好几座式样不同的石桥，两岸栽着数不清的垂柳。湖中心有个小岛，远远望去，岛上一片葱绿，树丛中露出宫殿的一角。游人走过长长的石桥，就可以去小岛上玩。这座石桥有十七个桥洞，叫十七孔桥；桥栏杆上有上百根石柱，柱子上都雕刻着小狮子。这么多的狮子，姿态不一，也都没有哪两只是相同的。']},
  {p:6,s:['颐和园到处有美丽的景色，说也说不尽，希望你有机会去细细游赏。']}
 ],

{id:'bingmayong19',grade:'四年级',volume:'上册',unit:'第六单元',title:'19* 秦兵马俑',author:'',
 read:[
  {p:1,s:['秦始皇陵兵马俑是我国享誉世界的珍贵历史文物，被誉为"世界第八大奇迹"。']},
  {p:2,s:['兵马俑规模宏大。已发掘的三个俑坑，总面积达两万多平方米，相当于五十多个篮球场那么大，坑内有兵马俑近八千个。站在高处鸟瞰，坑里的兵马俑一行行、一列列，十分整齐，排成了一个巨大的长方形军阵，真像是秦始皇当年统率的一支南征北战、所向披靡的大军。']},
  {p:3,s:['兵马俑不仅规模宏大，而且类型众多，个性鲜明。将军俑身材魁梧，头戴鹖冠，身披铠甲，手握宝剑，昂首挺胸，站在队伍前列，像是在指挥千军万马。武士俑平均身高约一米八，体格健壮，身披铠甲，脚穿战靴，有的握着弓箭，有的拿着戈矛，一个个跃跃欲试。骑兵俑身着短甲，一手执缰绳，一手持弓箭，好像随时准备上马冲杀。']},
  {p:4,s:['每一件兵马俑都是极为精美的艺术珍品。仔细端详，你会发现它们的神态各不相同：有的颔首低眉，若有所思；有的目光炯炯，凝视远方；有的紧握双拳，好像在听候号角……走近它们的身旁，似乎还能听到轻细的呼吸声。']},
  {p:5,s:['秦兵马俑，在古今中外的雕塑史上是绝无仅有的。它惟妙惟肖地模拟军阵的排列，生动地再现了秦军雄兵百万、战车千乘的宏伟气势，形象地展示了中华民族的强大力量和英雄气概。']}

{id:'niue20',grade:'四年级',volume:'上册',unit:'第七单元',title:'20 牛和鹅',author:'任大霖',
 read:[
  {p:1,s:['大家都说：牛的眼睛看人，觉得人比牛大，所以牛是怕人的；鹅的眼睛看人，觉得人比鹅小，所以鹅不怕人。']},
  {p:2,s:['我们都很相信这句话。所以我们看到牛，一点儿不害怕，敢用手拍它的背，摸它的肚子，甚至敢用树枝去触它的屁股呢！可是我们对鹅就不一样了，见到鹅总是远远地躲开。']},
  {p:3,s:['有一次，我们放学回家，走过池塘边，看见有四只大白鹅在靠近岸边的水里游。我们马上都不说话了，贴着墙壁，悄悄地走过去。可不知是哪个坏家伙故意惹怒它们，一只老公鹅张开翅膀，扑扑地跑过来，嘎嘎地叫着，扑向我们。']},
  {p:4,s:['我吓得脚也软了，更跑不快。这时，带头的那只老公鹅就啪嗒啪嗒地跑了过来，咬住了我的衣襟。我吓得腿也软了，坐在地上哭起来。']},
  {p:5,s:['大概是我的哭叫惹恼了它，老公鹅放开我，转过身来。正在这个时候，金奎叔赶了过来。他一把握住了鹅的长脖子。鹅用脚爪划他，用嘴啄他。可是金奎叔的力气是那么大，他轻轻地把鹅提了起来，然后就像摔一个酒瓶似的，呼的一下，把这只老公鹅摔到了池塘里。']},
  {p:6,s:['金奎叔帮我穿上鞋，拾起书包，用大手摸摸我的头，说："鹅有什么可怕的！看把你吓成这样。"我说："因为鹅把我们看得比它小哇！"金奎叔说："让它这样看好了！可是，它要是凭这点来欺负人，那咱们可不答应，就得掐住它的脖子，把它扔到池塘里去。记着，下次可别再怕它们了。"']},
  {p:7,s:['金奎叔的话使我从此不再怕鹅了。直到现在，我还记着金奎叔的话：它虽然把我们看得比它小，可我们实在比它强啊！怕它干吗？']},
  {p:8,s:['看到牛，我也不再无缘无故欺负它了。我觉得它虽然把我们看得比它大，可我们平白地去欺负它干吗？']}
 ],

 study:{theme:'本文写"我"小时候因为"牛眼看人大、鹅眼看人小"的说法而怕鹅，一次被老公鹅追赶、咬住衣襟，金奎叔把鹅摔进池塘，并告诉"我"不要怕它、更不能凭它欺负人。从此"我"不再怕鹅，也不再欺负牛。故事说明：看待事物的角度不同，结果就不同；不要盲目害怕，也不要仗势欺负人。（注：此处原文为节选整理版，完整原文以课本为准。）',struct:[{h:'怕鹅欺牛',b:'因为"鹅眼看人小、牛眼看人大"的说法，"我们"怕鹅而不怕牛。'},{h:'被鹅追赶',b:'一次放学被老公鹅追赶、咬住衣襟，"我"吓得坐在地上哭。'},{h:'金奎叔救我',b:'金奎叔把老公鹅摔进池塘，告诉"我"不要怕鹅。'},{h:'不再怕鹅',b:'"我"明白我们实在比鹅强，不再怕鹅，也不再欺负牛。'}],anno:[{s:'它虽然把我们看得比它小，可我们实在比它强啊！怕它干吗？',x:'点明道理：换一个角度看问题，就不必盲目害怕。'},{s:'我觉得它虽然把我们看得比它大，可我们平白地去欺负它干吗？',x:'由不怕鹅想到不欺牛，写出认识的转变：既不盲目害怕，也不仗势欺人。'}],homework:[{q:'一开始"我"为什么怕鹅？后来为什么不怕了？',a:'一开始相信"鹅把人看得比它小，所以不怕人"；听了金奎叔的话，明白人实在比鹅强，就不怕了。'},{q:'金奎叔的话给了"我"什么启示？',a:'不要盲目害怕，也不要仗着别人怕你就欺负它；要换个角度看问题。'}]},

{id:'wonaolh21',grade:'四年级',volume:'上册',unit:'第七单元',title:'21 一只窝囊的大老虎',author:'叶至善',
 read:[
  {p:1,s:['我念小学的时候，很羡慕别的小朋友在台上演戏。有一回，学校排演一出戏，其中要一只大老虎。老师见我长得高大，就让我扮演这只大老虎。我高兴极了。']},
  {p:2,s:['演老虎要套上一件画着虎皮纹路的布套，头上戴一个糊着纸的虎头罩，只露出两只眼睛。老师教我怎样扑、怎样跳、怎样吼，我练了一遍又一遍，自以为演得很像了。']},
  {p:3,s:['正式演出的那天，台下坐满了人。轮到我出场了。我套上虎皮，戴上虎头罩，只听见台下一阵哄笑。我心里想：笑什么，等一会儿看我的！']},
  {p:4,s:['我按照老师教的，向台前扑过去，又跳又吼。可是虎头罩太大了，我看不清台下的观众，也分不清东南西北，扑了几次，不是撞在桌腿上，就是跌在台边。台下的笑声一阵比一阵响。']},
  {p:5,s:['戏演完了，我垂头丧气地走下台。老师安慰我说："你演得很好，只是虎头罩不太合身。"可我总觉得，自己演的是一只窝囊的大老虎。']},
  {p:6,s:['一直到今天，我还不明白：为什么不会豁虎跳就不能扮老虎呢？为什么没豁虎跳就会引起哄堂大笑呢？']}
 ],

 study:{theme:'本文写"我"小时候渴望上台演戏，被老师选中扮演大老虎，本以为能演得威风，结果因为虎头罩不合身、看不清方向，演得窝窝囊囊，引起哄堂大笑。文章以儿童的视角回忆童年趣事，写出"我"从期待到沮丧的真实心情，充满童真童趣。（注：此处原文为节选整理版，完整原文以课本为准。）',struct:[{h:'得到角色',b:'"我"羡慕别人演戏，被老师选中扮演大老虎，高兴极了。'},{h:'认真排练',b:'"我"学扑、跳、吼，练了一遍又一遍。'},{h:'演出窝囊',b:'虎头罩太大，看不清方向，"我"撞桌腿、跌台边，引起哄堂大笑。'},{h:'留下疑问',b:'"我"一直不明白：为什么演砸了会引起哄堂大笑。'}],anno:[{s:'我心里想：笑什么，等一会儿看我的！',x:'写出"我"当时的自信，与后文演砸形成对比，更显有趣。'},{s:'为什么不会豁虎跳就不能扮老虎呢？为什么没豁虎跳就会引起哄堂大笑呢？',x:'结尾连问两个问题，写出童年的困惑与天真，余味十足。'}],homework:[{q:'"我"为什么觉得自己演的是一只窝囊的大老虎？',a:'因为虎头罩太大，"我"看不清方向，扑跳时撞桌腿、跌台边，引起哄堂大笑，演得很狼狈。'},{q:'你在生活中有过类似"窝囊"的经历吗？说说看。',a:'开放题。如第一次上台表演紧张忘词，第一次做饭把菜烧糊等。'}]},

{id:'wangrong', grade:'四年级', volume:'上册', unit:'第七单元', title:'22 王戎不取道旁李', author:'《世说新语》',

    {p:1, s:['王戎七岁，尝与诸小儿游。']},
    {p:2, s:['看道边李树多子折枝，诸儿竞走取之，唯戎不动。']},
    {p:3, s:['人问之，答曰："树在道边而多子，此必苦李。"','取之，信然。']}
  ],

  study:{theme:'本文写七岁的王戎看到路边李树果实累累却不动，推断"树在道边而多子，此必苦李"，表现他善于观察、冷静思考。',struct:[{h:'故事起因',b:'王戎与小伙伴玩耍，见道边李树果实多到压弯枝条。'},{h:'众人反应',b:'其他孩子争着跑去摘李，只有王戎不动。'},{h:'王戎推断',b:'道边李子多却无人摘，必是苦李；摘来一尝，果然。'}],anno:[{s:'看道边李树多子折枝',x:'"折枝"写果实极多、把枝条压弯，侧面烘托李子的诱人，也为后文铺垫。'},{s:'树在道边而多子，此必苦李。',x:'王戎由"道边"（人来人往）却"多子"（无人摘）推断出李子必苦，逻辑推理严密。'},{s:'取之，信然。',x:'"信然"即果然如此，印证王戎的判断正确。'}],homework:[{q:'用自己的话讲讲这个故事。',a:'王戎七岁和朋友玩，见路边李树果实压弯枝，别人去摘他不去，说"道边多子必是苦李"，摘来一尝果然。'},{q:'王戎为什么不摘李子？',a:'他观察到李树在路边却果实累累、无人采摘，推断一定是苦李，说明他善于观察、爱思考。'},{q:'说说"竞走"古今意思的不同。',a:'古文中"走"是跑，"竞走"是争着跑过去；现在"竞走"是一种体育项目。'}]},

{id:'tuoluo23',grade:'四年级',volume:'上册',unit:'第七单元',title:'23* 陀螺',author:'高洪波',
 read:[
  {p:1,s:['在我的故乡，陀螺不叫陀螺，叫作"冰尜儿"，顾名思义，就是冰上的小家伙。']},
  {p:2,s:['小时候，我们常常在冰上抽冰尜儿。做冰尜儿，用的是木头，削成圆柱形，一头尖尖的，尖上钉一颗滚珠。抽的时候，用一根缠着布条的小鞭子，不停地抽打，冰尜儿就在冰面上飞快地旋转。']},
  {p:3,s:['我从小就不甘人后，更不肯自己的陀螺像个丑八怪。因此，我让木工叔叔给我做了一个漂亮的陀螺。可是我的陀螺个头小，样子也不起眼，同伴们都嘲笑它。']},
  {p:4,s:['可是，出乎所有人意料，这个不起眼的小陀螺，转起来又快又稳，像个不知疲倦的陀螺战士。伙伴们的大陀螺一个个被它撞翻在地，我的"丑小鸭"成了常胜将军。']},
  {p:5,s:['这真是个辉煌的时刻！我尝到了胜利的滋味，品到了幸运的甜头。']},
  {p:6,s:['这使我明白了一个道理：人不可貌相，海水不可斗量。']}
 ],

  study:{theme:'三首都是边塞与爱国主题的古诗。《出塞》借汉代名将抒发巩固边防的愿望；《凉州词》写将士豪饮出征的旷达；《夏日绝句》借项羽赞颂英雄气节，暗讽苟安。',struct:[{h:'《出塞》',b:'以"秦时明月汉时关"起兴，感叹征人未还，期盼良将守边。'},{h:'《凉州词》',b:'写军中宴饮欲战，以"醉卧沙场"的豪情面对生死。'},{h:'《夏日绝句》',b:'借项羽宁死不过江东，推崇英雄气节，讽喻南宋苟安。'}],anno:[{s:'但使龙城飞将在，不教胡马度阴山。',x:'"飞将"指汉代名将李广；表达希望有良将守边、平息战事的愿望。'},{s:'醉卧沙场君莫笑，古来征战几人回？',x:'以反诘写将士视死如归的旷达豪情，悲壮中含洒脱。'},{s:'生当作人杰，死亦为鬼雄。',x:'直抒胸臆，推崇顶天立地的英雄气概，掷地有声。'}],homework:[{q:'背诵三首古诗。',a:'《出塞》盼良将守边；《凉州词》写军中豪情；《夏日绝句》赞英雄气节。'},{q:'《夏日绝句》为什么写项羽？',a:'借项羽宁死不肯过江东，赞颂英雄气节，同时暗讽南宋朝廷苟且偷安、不思恢复。'},{q:'《出塞》表达了诗人怎样的愿望？',a:'希望朝廷起用像李广那样的良将，早日平息边患、让征人回家。'}]},

{id:'jueqi25',grade:'四年级',volume:'上册',unit:'第八单元',title:'25 为中华之崛起而读书',author:'余心言',
 read:[
  {p:1,s:['新学年开始了，修身课上，奉天东关模范学校的魏校长向学生们提出了一个严肃的问题："你们为什么而读书？"']},
  {p:2,s:['"为家父而读书。""为明理而读书。""为光耀门楣而读书。"……同学们踊跃回答。']},
  {p:3,s:['有位同学一直默默地坐在那里，若有所思。魏校长注意到了，他打手势让大家安静下来，点名让那位同学回答。那位同学站了起来，清晰而坚定地回答道："为中华之崛起而读书！"']},
  {p:4,s:['魏校长听了为之一振！他怎么也没想到，一个十二三岁的孩子，竟然有如此的抱负和胸怀！他睁大眼睛又追问了一句："你再说一遍，为什么而读书？"']},
  {p:5,s:['"为中华之崛起而读书！"']},
  {p:6,s:['魏校长听了，高兴地连声赞叹："好哇！为中华之崛起，有志者当效此生！"']},
  {p:7,s:['这位同学是谁呢？他就是周恩来，后来成为了中华人民共和国的第一任总理。']},
  {p:8,s:['周恩来为什么立下这样的志向呢？那是因为他小时候亲眼看到中国人在外国人的地盘上受欺负，却无处说理。他深刻体会到"中华不振"这四个字的沉重含义，从此立下了"为中华之崛起而读书"的远大志向。']}
 ],

{id:'meilanf26',grade:'四年级',volume:'上册',unit:'第八单元',title:'26 梅兰芳蓄须明志',author:'',
 read:[
  {p:1,s:['梅兰芳先生是闻名世界的京剧表演艺术家。他在舞台上唱旦角，为了演出的需要，总是把胡须剃得干干净净。但他的一生，却有一段时间留着胡须，而且是故意的。这到底是怎么回事呢？']},
  {p:2,s:['1937年，日本帝国主义侵占了上海。梅兰芳不堪忍受日本人的骚扰，被迫离开了北京，来到上海。日本人多次要他上台演出，都被他拒绝了。']},
  {p:3,s:['为了不再演戏，梅兰芳蓄起了胡须。熟悉京剧的人都知道，梅兰芳在舞台上扮演的是年轻的女子，一旦留了胡须，就再也演不了旦角了。消息一传开，人们都说："梅兰芳蓄须了，他这是明志啊！"']},
  {p:4,s:['日本人并不甘心。一个日本军医闯进梅兰芳的家，要给他检查身体，实际上是逼迫他登台演出。梅兰芳请医生给自己打了一针伤寒预防针，让自己发起高烧来。日本人只好作罢。']},
  {p:5,s:['拒绝演出，就意味着没有经济来源。梅兰芳卖掉了北京的住宅，卖掉了自己心爱的字画，靠卖画维持生活。生活虽然困苦，但他决不向日本人低头。']},
  {p:6,s:['长期不演戏，没有了收入，梅兰芳的生活越来越艰难，但他始终没有登台。直到抗日战争胜利，他才重新剃掉胡须，回到了阔别多年的舞台。']},
  {p:7,s:['梅兰芳先生用蓄须的方式，表明了不给日本人演戏的决心。他的民族气节，永远为后人所敬仰。']}
 ],

 study:{theme:'本文写京剧大师梅兰芳在日本侵华期间，蓄起胡须，坚决不为侵略者登台演出，宁可卖房卖画度日，也不向日本人低头，表现了他崇高的民族气节和爱国精神。（注：此处原文为节选整理版，完整原文以课本为准。）',struct:[{h:'蓄须原因',b:'日本侵占上海后，梅兰芳拒绝为日本人演出，故意蓄须明志。'},{h:'坚决拒演',b:'面对日本人的逼迫，他打预防针让自己发烧，坚决不上台。'},{h:'宁贫不辱',b:'卖掉住宅和字画，靠卖画为生，决不向侵略者低头。'},{h:'胜利登台',b:'抗战胜利后，他才剃掉胡须，重返舞台。'}],anno:[{s:'梅兰芳蓄须了，他这是明志啊！',x:'"明志"点题：用蓄须表明不给侵略者演戏的坚定决心。'},{s:'生活虽然困苦，但他决不向日本人低头。',x:'"决不"语气坚定，写出梅兰芳宁贫不辱的民族气节。'}],homework:[{q:'梅兰芳为什么要蓄须？',a:'因为他演的是旦角，蓄了须就不能登台，他用这种方式表明不给日本侵略者演戏的决心。'},{q:'梅兰芳拒绝演出后，生活遇到了什么困难？他是怎么做的？',a:'没有了经济来源，他卖掉住宅和字画，靠卖画维持生活，但始终不向日本人低头。'},{q:'说说"民族气节"在梅兰芳身上是怎样体现的。',a:'在国家受侵略时，他宁可忍受困苦也不为侵略者演出，坚守中国人的尊严，这就是民族气节。'}]},

{id:'yanan26',grade:'四年级',volume:'上册',unit:'第八单元',title:'27* 延安，我把你追寻',author:'祁念曾',
 read:[
  {p:1,s:['像翩翩归来的燕子，在追寻昔日的春光；像茁壮成长的小树，在追寻雨露和太阳。追寻你，延安，我把你追寻。']},
  {p:2,s:['追寻延河叮咚的流水，追寻枣园梨花的清香，追寻南泥湾开荒的镢头，追寻杨家岭讲话的会场。']},
  {p:3,s:['一排排高楼大厦像雨后春笋，一件件家用电器满目琳琅；我们永远告别了破旧的茅屋，却忘不了延安窑洞温热的土炕。']},
  {p:4,s:['航天飞机探索宇宙的奥秘，电子计算机奏出美妙的交响；我们毫不犹豫丢掉了老牛破车，却不能丢宝塔山顶天立地的脊梁。']},
  {p:5,s:['延安，你的精神灿烂辉煌！如果一旦失去了你啊，那就仿佛没有了灵魂，怎能向美好的未来展翅飞翔？']},
  {p:6,s:['啊！延安，我把你追寻，追寻信念，追寻金色的理想；追寻温暖，追寻明媚的春光；追寻光明，追寻火红的太阳！']}
 ],

{id:'kedou', grade:'一年级', title:'小蝌蚪找妈妈', author:'人教版·童话', genre:'童话', outputPrompt:'小蝌蚪找到妈妈时心情怎样？你有过"找呀找终于找到"的经历吗？讲一讲。',
    content:'池塘里有一群小蝌蚪，大大的脑袋，黑灰色的身子，甩着长长的尾巴，快活地游来游去。\n\n小蝌蚪游哇游，过了几天，长出了两条后腿。他们看见鲤鱼妈妈在教小鲤鱼捕食，就迎上去问："我们的妈妈在哪里？"鲤鱼妈妈说："你们的妈妈四条腿，宽嘴巴。你们到那边去找吧！"\n\n小蝌蚪游哇游，过了几天，长出了两条前腿。他们看见一只乌龟摆动着四条腿在水里游，连忙追上去："妈妈，妈妈！"乌龟笑着说："我不是你们的妈妈。你们的妈妈头顶上有两只大眼睛，披着绿衣服。你们到那边去找吧！"\n\n小蝌蚪游哇游，过了几天，尾巴变短了。他们游到荷花旁边，看见荷叶上蹲着一只大青蛙，披着绿衣服，露着白肚皮，鼓着一对大眼睛。他们游过去："妈妈，妈妈！"青蛙妈妈低头一看："好孩子，你们已经长成小青蛙了。"\n\n不知什么时候，小青蛙的尾巴已经不见了。他们跟着妈妈，天天去捉害虫。',

{id:'biihu', grade:'一年级', title:'小壁虎借尾巴', author:'人教版·童话', genre:'童话', outputPrompt:'你喜欢小壁虎吗？为什么？说说你的想法或感受。',
    content:'小壁虎在墙角捉蚊子，一条蛇咬住了他的尾巴。小壁虎一挣，挣断尾巴逃走了。\n\n没有尾巴多难看哪！小壁虎想，向谁去借一条尾巴呢？\n\n小壁虎爬呀爬，爬到小河边。他看见小鱼摇着尾巴，在河里游来游去。小壁虎说："小鱼姐姐，您的尾巴借给我行吗？"小鱼说："不行啊，我要用尾巴拨水呢。"\n\n小壁虎爬呀爬，爬到大树上。他看见老牛甩着尾巴，在树下吃草。小壁虎说："牛伯伯，您的尾巴借给我行吗？"老牛说："不行啊，我要用尾巴赶蝇子呢。"\n\n小壁虎爬呀爬，爬到房檐下。他看见燕子摆着尾巴，在空中飞来飞去。小壁虎说："燕子阿姨，您的尾巴借给我行吗？"燕子说："不行啊，我要用尾巴掌握方向呢。"\n\n小壁虎借不到尾巴，心里很难过。他爬呀爬，爬回家里找妈妈。妈妈笑着说："傻孩子，你转过身子看看。"小壁虎转身一看，高兴地叫起来："我长出一条新尾巴啦！"',

{id:'daocaoren', grade:'三年级', title:'稻草人', author:'叶圣陶·童话', genre:'童话', outputPrompt:'稻草人想帮主人却无能为力，你同情它吗？说说你的感受。',
    content:'田野里站着一个稻草人，破竹篮子、残荷叶都可以做他的帽子，他的骨架子是细竹枝，肌肉是黄稻草。\n\n老妇人他的主人，眼睛枯涩，脸色干瘪，因为年年庄稼歉收，眼泪都快流干了。稻草人想到主人今年的稻子长得还好，心里很高兴，盼着主人来收割。\n\n可是夜里来了小蛾，下了卵在稻叶上。稻草人使劲摇扇子想赶走它们，却怎么也赶不走。卵变成了肉虫，把稻叶吃得精光。稻草人心痛极了，可他一步也走不了，只能站在原地着急。\n\n后来又看见一个生病的孩子和一位可怜的渔妇，稻草人很想帮忙，身子却像树木一样定在泥土里，半步也动不得。他终于倒在田野里，哭了。',
    questions:[{q:'稻草人的主人为什么总是流泪？',ref:'因为年年庄稼歉收，生活苦'},{q:'稻草人看到稻子被虫吃，为什么很着急却帮不上忙？',ref:'他固定在田里，一步也走不了'}]},
{id:'chouxiaoya', grade:'二年级', title:'丑小鸭', author:'安徒生·童话', genre:'童话', outputPrompt:'丑小鸭最后变成天鹅，你想对他说什么？',
    content:'一只母鸭孵出了一窝小鸭，其中有一只又大又丑，大家都叫他"丑小鸭"。哥哥姐姐咬他，公鸡啄他，连养鸭的小姑娘也讨厌他。\n\n丑小鸭只好离开了家。他到沼泽地，野雁不理他；到农庄，小猫小狗嫌他丑。冬天来了，天冷极了，丑小鸭冻僵在冰上，幸好被一位农夫救回家。\n\n春天到了，丑小鸭来到湖边，看见几只美丽的白天鹅。他低下头，忽然在水面上看见了自己的倒影——不再是那只灰突突的丑小鸭，而是一只雪白的天鹅！\n\n他张开翅膀，跟着天鹅们飞向蓝天。',

{id:'xiaoma', grade:'二年级', title:'小马过河', author:'彭文席·寓言故事', genre:'故事', outputPrompt:'你遇到拿不准的事时，会像小马一样自己去试一试吗？',
    content:'小马驮着麦子去磨坊，被一条小河挡住了去路。\n\n牛伯伯说："水很浅，刚没小腿，能蹚过去。"松鼠却大叫："不行不行！昨天我的伙伴就是掉进河里淹死的，水可深啦！"\n\n小马不知听谁的好，跑回家问妈妈。妈妈说："孩子，光听别人说，自己不动脑筋，不去试试，是不行的。你去试一试，就知道了。"\n\n小马回到河边，小心地蹚了过去。原来河水既不像老牛说的那样浅，也不像松鼠说的那样深。',

{id:'maliang', grade:'二年级', title:'神笔马良', author:'洪汛涛·童话', genre:'童话', outputPrompt:'如果你有一支神笔，你想画什么？为什么？',

{id:'guiutu', grade:'二年级', title:'龟兔赛跑', author:'伊索·寓言', genre:'故事', outputPrompt:'兔子明明跑得快却输了，你明白了什么道理？',
    content:'兔子嘲笑乌龟爬得慢，乌龟说："咱们比一比，看谁先到山顶。"兔子哈哈大笑，觉得稳赢。\n\n比赛开始，兔子嗖地窜出去，回头一看，乌龟才挪了一点点。兔子想："先睡一觉也不迟。"他靠在树下呼呼大睡。\n\n乌龟一步一步，不停地爬呀爬，超过了熟睡的兔子。等兔子醒来，拼命追，可乌龟已经先一步到了终点。',

{id:'laoshi', grade:'三年级', title:'我的老师', author:'魏巍·写人写事', genre:'写人写事', outputPrompt:'你最喜欢哪位老师？他（她）什么地方让你喜欢？',

{id:'chun', grade:'三年级', title:'春（节选）', author:'朱自清·散文', genre:'写景状物', outputPrompt:'你眼中的春天是什么样子的？用几句话写一写。',

    questions:[{q:'作者写春天用了什么修辞手法说"春天来了"？',ref:'拟人（春天的脚步近了）'},{q:'文中写了春天的哪些景物？',ref:'山、水、太阳、小草、风等'}]},
{id:'qiutian', grade:'三年级', title:'秋天的雨', author:'陶金鸿·写景状物', genre:'写景状物', outputPrompt:'秋天的雨还带来了什么颜色？你也来写一句。',
    content:'秋天的雨，是一把钥匙。它带着清凉和温柔，轻轻地，轻轻地，趁你没留意，把秋天的大门打开了。\n\n秋天的雨，有一盒五彩缤纷的颜料。它把黄色给了银杏树，黄黄的叶子像一把把小扇子；它把红色给了枫树，红红的枫叶像一枚枚邮票。\n\n橙红色是给果树的，橘子、柿子你挤我碰，争着要人们去摘呢！菊花仙子得到的颜色就更多了，紫红的、淡黄的、雪白的……',
    questions:[{q:'作者把秋天的雨比作了什么？',ref:'一把钥匙、一盒五彩缤纷的颜料'},{q:'秋天的雨把红色给了谁？',ref:'枫树'}]},
{id:'huoshaoyun', grade:'三年级', title:'火烧云', author:'萧红·写景状物', genre:'写景状物', outputPrompt:'你见过火烧云吗？它是什么颜色的？说一说。',
    content:'晚饭过后，火烧云上来了。霞光照得小孩子的脸红红的。\n\n天上的云从西边一直烧到东边，红彤彤的，好像是天空着了火。\n\n这地方的火烧云变化极多，一会儿红彤彤的，一会儿金灿灿的，一会儿半紫半黄，一会儿半灰半百合色。葡萄灰、梨黄、茄子紫，这些颜色天空都有。\n\n忽然又来了一条大狗，跑着跑着，小狗不知哪里去了；接着又来了一头大狮子，跟庙门前的石头狮子一模一样，一转眼就变了。',
    questions:[{q:'火烧云为什么叫"火烧云"？',ref:'红彤彤的，像天空着了火'},{q:'火烧云有什么特点？',ref:'颜色多、变化快'}]},
{id:'haidi', grade:'三年级', title:'海底世界', author:'科普·说明', genre:'科普说明', outputPrompt:'你还知道海底有什么有趣的动物？写给同学听。',
    content:'你可知道，大海深处是怎样的吗？\n\n海面上波涛澎湃的时候，海底依然很宁静。最大的风浪，也只能影响到海面以下几十米深。阳光很难射进深海，水越深光线越暗。\n\n海底的动物常常在窃窃私语。有的像蜜蜂一样嗡嗡，有的像小鸟一样啾啾，有的像小狗一样汪汪。它们各有各的活动方法：海参靠肌肉伸缩爬行，乌贼能突然向前方喷水，利用水的反推力迅速后退。\n\n海底有高山、有峡谷，也有森林和草地。那里富含煤、铁、石油和天然气。',
    questions:[{q:'海底是安静还是吵闹？为什么？',ref:'很宁静，因为风浪影响不到深处'},{q:'文中写了哪些海底动物？',ref:'海参、乌贼等（举例说明动物会发声）'}]},
{id:'mifeng', grade:'三年级', title:'蜜蜂', author:'法布尔·科普说明', genre:'科普说明', outputPrompt:'法布尔是怎么做实验的？你做过观察小实验吗？',
    content:'听说蜜蜂有辨认方向的能力，无论飞到哪里，它总是可以回到原处。我想做个试验。\n\n我先在家里捉了一些蜜蜂，放在纸袋里，带着他们走了两里多路，打开纸袋，在它们背上做了白色记号，然后放了出来。\n\n二十只蜜蜂中，至少有十五只没有迷失方向，准确无误地回到了家。尽管它们逆风而飞，沿途都是陌生的景物，但它们确确实实飞回来了。\n\n蜜蜂靠的不是超常的记忆力，而是一种我无法解释的本能。',
    questions:[{q:'作者做实验时给蜜蜂做了什么记号？',ref:'在背上做了白色记号'},{q:'实验说明蜜蜂靠什么回家？',ref:'一种无法解释的本能'}]},
{id:'guanchao2', grade:'四年级', title:'钱塘江大潮', author:'科普·说明', genre:'科普说明', outputPrompt:'你去过海边或江边看潮水吗？描述一下你看到的景象。',
    content:'钱塘江大潮，自古以来被称为"天下奇观"。\n\n农历八月十八前后，太阳、地球、月亮几乎排成一条直线，引潮力最大。钱塘江入海口像一只大喇叭，外宽内窄，潮水涌入时被两岸越挤越窄，便堆起高高的潮头。\n\n潮来时，远处先出现一条白线，转眼变成一堵两丈多高的水墙，伴随着山崩地裂般的轰鸣，浩浩荡荡压过来。潮头过后，江面还要很久才恢复平静。',
    questions:[{q:'为什么钱塘江大潮特别壮观？',ref:'入海口像喇叭，引潮力大'},{q:'描写潮来时声音大的词语是？',ref:'山崩地裂'}]},
{id:'lunyu', grade:'五年级', title:'论语·学而（选读）', author:'孔子及弟子·古文诗歌', genre:'诗歌', outputPrompt:'"学而时习之"是什么意思？你每天复习功课吗？',
    content:'子曰："学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？"\n\n子曰："知之者不如好之者，好之者不如乐之者。"\n\n曾子曰："吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？"',
    questions:[{q:'"学而时习之，不亦说乎"是什么意思？',ref:'学了知识按时温习，不也很愉快吗'},{q:'曾子每天从哪几方面反省自己？',ref:'替人办事是否尽心、与朋友交往是否守信、老师传授是否温习'}]},
{id:'chunxiao', grade:'二年级', title:'春晓', author:'孟浩然·诗歌', genre:'诗歌', outputPrompt:'你早晨醒来听到过鸟叫吗？写一写你的感受。',
    content:'春眠不觉晓，处处闻啼鸟。\n夜来风雨声，花落知多少。',
    questions:[{q:'"春眠不觉晓"是什么意思？',ref:'春天睡觉香甜，不知不觉天就亮了'},{q:'诗人由风雨声想到了什么？',ref:'不知道园里的花被吹落了多少'}]},
{id:'yesushansi', grade:'二年级', title:'夜宿山寺', author:'李白·诗歌', genre:'诗歌', outputPrompt:'你站在高处时有什么感觉？用一句话写写。',
    content:'危楼高百尺，手可摘星辰。\n不敢高声语，恐惊天上人。',
    questions:[{q:'"手可摘星辰"用了什么写法？',ref:'夸张，写楼极高'},{q:'诗人为什么"不敢高声语"？',ref:'怕惊动了天上的仙人'}]},
{id:'yueliang', grade:'四年级', title:'月亮上的学校', author:'科幻·想象', genre:'科幻', outputPrompt:'如果月亮上有学校，你希望它是什么样？发挥想象写一写。',
    content:'小宇乘着光能飞船来到月亮上的学校。这里的教室是半透明的穹顶，能看见地球像一颗蓝宝石挂在天上。\n\n课桌是会说话的平板，你一提笔，它就帮你把字写工整；操场建在环形山里，轻轻一跳就能蹦三米高。\n\n最神奇的是"引力秋千"：荡起来时身体轻飘飘的，像一片云。小宇想：要是地球上的同学也能来体验，该多好啊！',
    questions:[{q:'月亮上的学校有什么神奇之处？',ref:'透明穹顶、会说话的课桌、引力秋千等'},{q:'这篇短文属于什么体裁？',ref:'科幻（科学想象）'}]},
{id:'jiaotong', grade:'四年级', title:'未来的交通工具', author:'科普·想象', genre:'科幻科普', outputPrompt:'你想象中的未来交通工具长什么样？写一写。',
    content:'未来的交通工具，一定又快又干净。\n\n"空陆两用车"遇到堵车就展开机翼飞上天空；"真空管道列车"在几乎没空气的管道里奔跑，速度比飞机还快；"藻类能源船"用海藻制成的燃料发动，一点尾气都不冒。\n\n它们都用太阳能或清洁燃料，既方便，又不污染天空和河流。',
    questions:[{q:'文中写了哪几种未来交通工具？',ref:'空陆两用车、真空管道列车、藻类能源船'},{q:'这些交通工具的共同优点是什么？',ref:'快、清洁、不污染'}]},
{id:'sunwukong', grade:'二年级', title:'孙悟空打妖怪', author:'《西游记》·叙事', genre:'叙事童话', outputPrompt:'你最喜欢孙悟空哪一点？讲给家人听。',
    content:'唐僧师徒去西天取经，路上遇到白骨精。白骨精会变身：先变村姑送饭，再变老婆婆找女儿，又变老公公找老伴，想骗唐僧。\n\n孙悟空火眼金睛，一眼看穿妖怪，举起金箍棒就打。唐僧肉眼凡胎，以为悟空乱打好人，一气之下把他赶回花果山。\n\n后来唐僧被妖怪抓走，猪八戒请回悟空，悟空才把白骨精打死，救出师父。',
    questions:[{q:'白骨精变了几次身？',ref:'三次（村姑、老婆婆、老公公）'},{q:'为什么唐僧会赶走孙悟空？',ref:'他看不出妖怪，以为悟空错打好人'}]},
{id:'pangu', grade:'四年级', title:'盘古开天地', author:'中国神话', genre:'神话', outputPrompt:'盘古用自己的身体创造了世界，你想对他说什么？',
    content:'传说远古时，天和地浑沌一片。巨人盘古醒来，抡起斧头劈开浑沌，轻而清的东西上升成天，重而浊的东西下沉成地。天每日升高一丈，地每日加厚一丈，盘古也越长越高。不知过了多少年，天和地终于成形，盘古却累倒了。他的身体化作山川河流、日月星辰，造福了万物。',
    questions:[{q:'盘古用斧头劈开了什么？',ref:'浑沌（天和地混在一起的状态）'},{q:'盘古倒下后，他的身体变成了什么？',ref:'山川河流、日月星辰等万物'}]},
{id:'jingwei', grade:'四年级', title:'精卫填海', author:'中国神话', genre:'神话', outputPrompt:'你做一件事遇到困难却坚持不放弃过吗？讲一讲。',
    content:'太阳神炎帝的小女儿女娃，去东海游玩时不幸淹死。她化作一只叫"精卫"的小鸟，每天从西山衔来树枝和石子，投进东海，想把大海填平。"哪怕填上一万年，我也要填！"精卫明知大海无边，却永不放弃。',
    questions:[{q:'女娃化作什么鸟？它为什么填海？',ref:'精卫鸟；因为淹死在东海，想填平大海'},{q:'精卫填海表现了什么精神？',ref:'不畏艰难、坚持不懈'}]},
{id:'kuafu', grade:'四年级', title:'夸父追日', author:'中国神话', genre:'神话', outputPrompt:'夸父为了追赶太阳不怕累，你佩服他哪一点？',
    content:'夸父是北方巨人，他追赶太阳，想把它捉住。追到禺谷时，他又渴又累，喝干了黄河、渭水仍不解渴，又向北去找大泽，半路渴死。他丢弃的手杖化作一片桃林，为后来人遮阴解渴。',
    questions:[{q:'夸父追日到哪里渴死？',ref:'去北方大泽的半路上'},{q:'夸父的手杖变成了什么？',ref:'一片桃林'}]},
{id:'nuwa', grade:'四年级', title:'女娲补天', author:'中国神话', genre:'神话', outputPrompt:'女娲为了大家不怕辛苦，你从她身上学到什么？',
    content:'天破了一个大窟窿，洪水喷涌、猛兽横行。女娲熔炼五色石补天，砍断巨龟的四脚撑起四方的天，又杀黑龙、烧芦苇堵住洪水。天地终于恢复了平静，人们得以安居。',
    questions:[{q:'女娲用什么补天？',ref:'熔炼五色石'},{q:'女娲还做了哪些事拯救众生？',ref:'斩龟足撑天、杀黑龙、积芦灰止洪水'}]},
{id:'houyi', grade:'四年级', title:'后羿射日', author:'中国神话', genre:'神话', outputPrompt:'后羿为大家除害，你想对这位英雄说什么？',
    content:'天上同时出现十个太阳，烤焦了庄稼，晒死了草木，百姓苦不堪言。神射手后羿拉开神弓，一连射下九个太阳，留下一个为人们照明。他又除掉毒蛇猛兽，成了救民于水火的英雄。',
    questions:[{q:'后羿射下了几个太阳？',ref:'九个，留下一个'},{q:'后羿为什么射日？',ref:'十个太阳让百姓活不下去'}]},
{id:'change', grade:'四年级', title:'嫦娥奔月', author:'中国神话', genre:'神话', outputPrompt:'中秋赏月时，你会想起嫦娥的故事吗？说说看。',
    content:'后羿娶了嫦娥，向西王母求来不死药。逢蒙趁后羿外出，逼迫嫦娥交药。嫦娥无奈，吞下药飞向月亮，住进清冷的广寒宫。从此，人们总在月圆时想念她。',
    questions:[{q:'嫦娥为什么飞到了月亮上？',ref:'逢蒙逼药，她吞下不死药'},{q:'嫦娥住进了月亮上的哪里？',ref:'广寒宫'}]},
{id:'dayu', grade:'四年级', title:'大禹治水', author:'中国神话', genre:'神话', outputPrompt:'大禹"三过家门而不入"，你怎样看他的选择？',
    content:'洪水泛滥，大禹接过父亲未完的事业治理水患。他改用"疏导"之法，开渠引水入海，一去十三年，三次路过家门都顾不上进去。洪水终于被治服，百姓称赞他公而忘私。',
    questions:[{q:'大禹治水用了什么方法？',ref:'疏导（开渠引水入海）'},{q:'"三过家门而不入"表现了大禹什么品质？',ref:'公而忘私、一心治水'}]},
{id:'nezha', grade:'四年级', title:'哪吒闹海', author:'中国神话', genre:'神话', outputPrompt:'哪吒小小年纪敢保护百姓，你从他身上学到什么？',
    content:'小英雄哪吒在海边玩耍，用混天绫搅得龙宫不得安宁，又打死欺压百姓的夜叉和龙王三太子。龙王兴风作浪报复，哪吒挺身而出，剔骨还父、削肉还母，舍身救了百姓。后来师傅用莲花让他重生，他更加英勇。',
    questions:[{q:'哪吒用什么搅动了龙宫？',ref:'混天绫'},{q:'哪吒为什么敢与龙王对抗？',ref:'因为龙王欺压百姓，他要保护百姓'}]},
{id:'baohulu', grade:'四年级', title:'宝葫芦的秘密', author:'张天翼·童话', genre:'童话', outputPrompt:'如果你也有一个宝葫芦，你希望它帮你实现什么愿望？为什么？',
    content:'小学生王葆总想不费力气就得到一切。一天，他钓鱼时钓上一个神奇的宝葫芦，只要心里想要什么，葫芦就立刻变出来。可渐渐地，葫芦变出的东西惹出一堆麻烦，还让王葆被同学误会、失去朋友。最后王葆明白：世上没有不劳而获的好事，自己的事情要自己做。',
    questions:[{q:'王葆一开始为什么想要宝葫芦？',ref:'他想不费力气就得到一切'},{q:'这个故事告诉我们什么道理？',ref:'世上没有不劳而获，自己的事要自己做'}]},
{id:'yuailai', grade:'四年级', title:'小英雄雨来', author:'管桦·故事', genre:'故事', outputPrompt:'雨来年纪小小却很勇敢，你从他身上学到了什么？讲给家人听。',
    content:'晋察冀边区的少年雨来，上夜校念书，牢记"我们是中国人，我们爱自己的祖国"。有一天，鬼子来扫荡，雨来掩护交通员李大叔，被鬼子抓住。面对刺刀和诱惑，他宁死不说，机智地跳河逃脱。雨来用勇敢和智慧保护了同志，成了村里的"小英雄"。',
    questions:[{q:'雨来在夜校记住了哪句话？',ref:'我们是中国人，我们爱自己的祖国'},{q:'雨来被鬼子抓住后是怎么做的？',ref:'宁死不说，机智跳河逃脱'}]},
{id:'haiyangrichu', grade:'四年级', title:'海上日出', author:'巴金·写景状物', genre:'写景状物', outputPrompt:'你看过日出吗？太阳升起时天空和云彩是什么颜色的？写一写。',
    content:'巴金在海上乘船时，仔细观察日出：天边出现红霞，太阳像负着什么重担似的，慢慢儿，一纵一纵地使劲向上升。到了最后，终于冲破了云霞，完全跳出了海面，颜色红得非常可爱。一刹那间，那深红的圆东西发出夺目的亮光。',
    questions:[{q:'太阳升起时是怎样往上升的？',ref:'一纵一纵地、使劲向上升'},{q:'海上日出给你什么感受？',ref:'壮观、充满力量，让人心情振奋'}]},
{id:'hupo', grade:'四年级', title:'琥珀', author:'柏吉尔·科普说明', genre:'科普说明', outputPrompt:'你能用自己的话讲讲琥珀是怎么形成的吗？',
    content:'几千万年前，一只苍蝇和一只蜘蛛在松树上，忽然一大滴松脂滴下来，把它们一齐包在里头。松脂继续滴，积成一个松脂球。后来陆地沉下去、海水漫上来，松脂球淹没在泥沙下面，经过几千万年，变成了化石——这就是透明的琥珀，里面还清楚楚地留着两个小东西。',
    questions:[{q:'琥珀里通常包裹着什么？',ref:'远古的小昆虫，如苍蝇、蜘蛛'},{q:'松脂球要经过多久才变成琥珀？',ref:'几千万年'}]},
{id:'konglong', grade:'四年级', title:'飞向蓝天的恐龙', author:'徐星·科普说明', genre:'科普说明', outputPrompt:'科学家说鸟类可能由恐龙演化而来，你觉得神奇吗？说说你的想法。',
    content:'恐龙的一支——猎食性恐龙，在漫长演化中身体变小、长出羽毛、学会飞翔，最终变成了鸟类。课文向我们介绍了这一假说：亿万年前，一种带羽毛的恐龙脱离同类，飞向蓝天，演化出今天的鸟儿。这正是"恐龙飞向蓝天"的奇妙旅程。',
    questions:[{q:'课文认为鸟类可能由哪类恐龙演化而来？',ref:'猎食性恐龙（带羽毛的一支）'},{q:'"飞向蓝天的恐龙"指的是什么？',ref:'恐龙的一支演化成了鸟类'}]},
{id:'yaner', grade:'四年级', title:'掩耳盗铃', author:'寓言故事', genre:'寓言故事', outputPrompt:'这个人捂住自己的耳朵去偷铃，可笑在哪里？你明白了什么？',
    content:'有个人想偷别人家门上的铃铛，又怕铃铛一碰就响被人发现。他想：铃响是因为耳朵听见，只要捂住自己的耳朵，不就听不见了吗？于是他捂住耳朵去偷，结果当场被主人抓住。捂住自己的耳朵，骗得了自己，却骗不了别人。',
    questions:[{q:'偷铃的人为什么捂住自己的耳朵？',ref:'他以为自己听不见，别人也听不见'},{q:'这个故事说明什么？',ref:'自欺欺人终究会被发现'}]},
{id:'maihuochai', grade:'三年级', title:'卖火柴的小女孩', author:'安徒生·童话', genre:'童话', outputPrompt:'小女孩的命运让你难过吗？你想对她说句什么话？',
    content:'大年夜里，一个卖火柴的小女孩赤着脚在街上走，又冷又饿。她擦亮一根根火柴，眼前浮现出温暖的火炉、喷香的烤鹅、美丽的圣诞树，还有疼爱她的奶奶。火柴熄灭，美景消失。第二天清晨，人们在墙角发现了冻僵的、带着微笑的小女孩。',
    questions:[{q:'小女孩擦火柴时看到了哪些美好的东西？',ref:'火炉、烤鹅、圣诞树、奶奶'},{q:'这个故事表达了作者怎样的情感？',ref:'对穷苦孩子的同情'}]},
{id:'laowu', grade:'三年级', title:'总也倒不了的老屋', author:'慈琪·童话', genre:'童话', outputPrompt:'老屋为什么总也倒不了？你愿意像它一样帮助别人吗？',
    content:'老屋已经活了一百多岁，准备倒下。可小猫来躲雨、老母鸡来孵蛋、小蜘蛛来织网讲故事，每一次它都答应再站一会儿。因为总有小动物需要帮助，老屋就一直站着，再也没倒下。',
    questions:[{q:'哪些小动物请求老屋帮忙？',ref:'小猫、老母鸡、小蜘蛛'},{q:'老屋给你留下什么印象？',ref:'善良、乐于助人'}]},
{id:'niuduizi', grade:'三年级', title:'在牛肚子里旅行', author:'张之路·科普童话', genre:'科普说明', outputPrompt:'红头在牛肚子里经历了一场惊险旅行，你知道牛有几个胃吗？',
    content:'蟋蟀红头和青头是好朋友。红头不小心被牛卷进嘴里，又吞进了肚子。青头镇定地告诉红头：牛有四个胃，会反刍，吞下去的草还会送回嘴里。红头随着草在牛肚子里"旅行"一圈，终于被喷出来，脱险了。故事里有惊险，也藏着反刍的小知识。',
    questions:[{q:'牛有几个胃？会反刍吗？',ref:'牛有四个胃，会反刍'},{q:'红头是怎么脱险的？',ref:'跟着草在牛肚子里转一圈，被反刍喷出来'}]},
{id:'caochong', grade:'二年级', title:'曹冲称象', author:'历史故事', genre:'故事', outputPrompt:'曹冲的办法聪明在哪？你遇到难题时会动脑筋吗？',
    content:'曹操得到一头大象，官员们想不出怎么称它的重量。小儿子曹冲说：把象赶到船上，在船舷齐水处画线；再换成石头装船，到画线处为止；最后称石头，石头多重大象就多重。利用水的浮力，难题轻松解决。',
    questions:[{q:'曹冲用什么办法称象？',ref:'借船画线、装石头等量代换'},{q:'这个故事说明什么？',ref:'遇事要动脑筋、巧用方法'}]},
{id:'hujia', grade:'二年级', title:'狐假虎威', author:'寓言故事', genre:'寓言故事', outputPrompt:'狐狸借老虎的威风吓跑百兽，你想对狐狸和老虎各说一句什么？',
    content:'老虎抓住狐狸，狐狸说："天帝派我做百兽之王，你敢吃我？"它让老虎跟在身后走走。森林里的野兽见了老虎，吓得纷纷逃命。老虎以为百兽怕的是狐狸，其实它们怕的是老虎。狐狸借着别人的势力吓唬人，就是"狐假虎威"。',
    questions:[{q:'百兽逃命，到底怕的是谁？',ref:'怕的是老虎，不是狐狸'},{q:'"狐假虎威"现在比喻什么？',ref:'借别人的势力欺压人'}]},
{id:'xuehaizi', grade:'一年级', title:'雪孩子', author:'童话', genre:'童话', outputPrompt:'雪孩子为了救小白兔融化了，你心疼它吗？说说你的感受。',
    content:'兔妈妈堆了一个雪孩子陪小兔子玩。小兔子睡觉时，小屋起火了。雪孩子冲进火里救出小兔子，自己却慢慢融化，变成了天上的一朵白云。雪孩子用生命救了朋友，温柔又勇敢。',
    questions:[{q:'雪孩子最后变成了什么？',ref:'天上的一朵白云'},{q:'雪孩子为什么融化了？',ref:'它冲进火里救小兔子'}]},
{id:'sima', grade:'一年级', title:'司马光', author:'历史故事', genre:'故事', outputPrompt:'别的小朋友都慌了，司马光却砸缸救人，你佩服他哪一点？',
    content:'一群孩子在庭院里玩，一个小孩爬上水缸，失足掉进装满水的缸里，眼看要淹死。别的孩子吓得哭喊着跑去找大人，只有司马光搬起石头砸破水缸，水流出来，小孩得救了。遇事冷静、肯想办法，才能化险为夷。',
    questions:[{q:'司马光是怎么救出小孩的？',ref:'搬石头砸破水缸，放出水'},{q:'司马光和别的孩子有什么不同？',ref:'别的孩子慌乱逃跑，他冷静想办法'}]},
{id:'hailibu', grade:'五年级', title:'猎人海力布', author:'民间故事', genre:'民间故事', outputPrompt:'海力布为了救乡亲说出了秘密变成石头，你怎样看他的选择？',
    content:'猎人海力布救下小白蛇，得到能听懂动物话的宝石，但说出秘密就会变成石头。一天，他听到鸟说大山要崩塌、洪水要淹没村庄，便急忙劝乡亲搬家。乡亲不信，海力布为救大家，说出真相，自己化作一块石头。乡亲们得救了，永远纪念他。',
    questions:[{q:'海力布得到宝石要遵守什么约定？',ref:'不能把动物的话告诉别人，否则变石头'},{q:'海力布为什么变成了石头？',ref:'为救乡亲说出秘密'}]},
{id:'shaonian', grade:'五年级', title:'少年中国说（节选）', author:'梁启超·古文诗歌', genre:'古文诗歌', outputPrompt:'"少年强则国强"，作为少年，你觉得自己该怎样努力？',
    content:'梁启超写道："少年智则国智，少年富则国富，少年强则国强……"他把少年比作初升的太阳、奔腾的河流、啸谷的乳虎，充满希望与力量。文章热情呼唤中国少年奋发向上，肩负起振兴国家的重任。',
    questions:[{q:'文中把少年比作哪些事物？',ref:'初升的太阳、河流、乳虎等'},{q:'"少年强则国强"是什么意思？',ref:'少年强大了，国家就会强大'}]},
{id:'lubinxun', grade:'六年级', title:'鲁滨逊漂流记', author:'笛福·历险故事', genre:'故事', outputPrompt:'鲁滨逊独自在荒岛生活了二十八年，你最佩服他哪一点？',
    content:'鲁滨逊在一次航海中遇险，独自流落荒岛。他搭帐篷、种粮食、养山羊、做陶器，靠智慧和勤劳在岛上生活了二十八年，后来还救下"星期五"作伴，最终重返文明世界。故事告诉我们：面对困境，勇敢和乐观能创造奇迹。',
    questions:[{q:'鲁滨逊在荒岛靠什么活了下来？',ref:'智慧、勤劳，自己动手搭房种粮'},{q:'这个故事给你什么启发？',ref:'面对困难要勇敢、乐观、动手解决'}]},
{id:'caoyuan', grade:'六年级', title:'草原', author:'老舍·写景状物', genre:'写景状物', outputPrompt:'老舍笔下的草原给你印象最深的是什么？写一写你见过的美景。',
    content:'老舍第一次来到内蒙古草原：天比别处更可爱，空气清鲜，天空明朗，一碧千里而并不茫茫。羊群像给无边的绿毯绣上白色大花。主人们骑马来迎，敬酒、联欢，蒙汉情深何忍别，天涯碧草话斜阳。',
    questions:[{q:'草原给你印象最深的是什么？',ref:'一碧千里的绿、羊群如白花、蒙汉情深'},{q:'"蒙汉情深何忍别"表达了什么？',ref:'蒙古族和汉族人民依依不舍的情谊'}]},
{id:"bk-zouyueliang",grade:"四年级",title:"走月亮（拓展阅读）",author:"吴然·散文",genre:"写景状物",outputPrompt:"你和家人一起散过步吗？月光下的景色是什么样的？说一说。",
 content:"秋天的夜晚，月亮升起来了，从洱海那边升起来了。\n\n月盘是那样明亮，月光是那样柔和，是在洱海里淘洗过吗？月亮照亮了高高的点苍山，照亮了村头的大青树，也照亮了，照亮了村间的大道和小路……\n\n这时候，阿妈喜欢牵着我，在洒满月光的小路上走着，走着……啊，我和阿妈走月亮！\n\n细细的溪水，流着山草和野花的香味，流着月光。灰白色的鹅卵石，布满河床。哟，卵石间有多少可爱的小水塘啊，每个小水塘，都抱着一个月亮！哦，阿妈，白天你在溪里洗衣裳，而我，用树叶做小船，运载许多新鲜的花瓣……哦，阿妈，我们到溪边去吧，去看看小水塘，看看水塘里的月亮，看看我采过鲜花的地方。\n\n啊，我和阿妈走月亮……\n\n村道已经修补过，坑坑洼洼的地方，已经填上碎石和新土。就要收庄稼了，收庄稼前，要把道路修一修，补一补，这是村里的风俗。秋虫唱着，夜鸟拍打着翅膀，鱼儿跃出水面，泼剌声里银光一闪……从果园那边，飘来果子的甜香。是雪梨，还是火把梨？还是紫葡萄？都有，在坡头上那片月光下的果园里，这些好吃的果子挂满枝头。沟水汩汩，很满意地响着。是啊，它旁边，是它浇灌过的稻田。哦，阿妈，这不就是我们家的地吗？春天，我们种油菜，种蚕豆。我在豆田里找兔草，我把蒲公英吹得飞啊，飞……收了豆，栽上水稻。看，稻谷就要成熟了，稻穗低垂着头，稻田像一块月光镀亮的银毯。哦，阿妈，我们到田埂上去吧，你不是说学校放假了，阿爸就要回来了吗？我们采哪一塘新谷招待阿爸呢？\n\n啊，我和阿妈走月亮……\n\n有时，阿妈给我讲月亮的故事，一个古老的传说；有时，却什么也不讲，只是静静地走着，走着。走过月光闪闪的溪岸，走过石拱桥；走过月影团团的果园，走过庄稼地和菜地……啊，在我仰起脸看阿妈的时候，我突然看见，美丽的月亮牵着那些闪闪烁烁的小星星，好像也在天上走着，走着……\n\n多么奇妙的夜晚啊，我和阿妈走月亮！",
 questions:[{q:"“啊，我和阿妈走月亮”在文中反复出现，有什么作用？",ref:"是全文的情感线索，一次次抒发我和阿妈在一起的幸福"},{q:"文中把小水塘和月亮写成什么样子？",ref:"每个小水塘都抱着一个月亮"}]},
{id:"bk-hufengh20",grade:"四年级",title:"呼风唤雨的世纪（拓展阅读）",author:"路甬祥·科普",genre:"科普说明",outputPrompt:"现代科技还带来了哪些“呼风唤雨”的变化？举两个例子。",
 content:"20世纪是一个呼风唤雨的世纪。是谁来呼风唤雨呢？当然是人类。靠什么呼风唤雨呢？靠的是现代科学技术。\n\n在20世纪一百年的时间里，人类利用现代科学技术获得那么多奇迹般的、出乎意料的发现和发明。正是这些发现和发明，使人类的生活大大改观，其改变的程度超过了人类历史上百万年的总和。\n\n人类在上百万年的历史中，一直很依赖自然，生活在一个慢吞吞、静悄悄、一到夜里就黑暗无光的世界。那时没有电灯，没有电视，没有收音机，也没有汽车。人们只能在神话中用“千里眼”“顺风耳”和腾云驾雾的神仙，来寄托自己的美好愿望。我们的祖先大概谁也没有料到，在最近的100年中，他们的那么多幻想纷纷变成了现实。\n\n20世纪的成就，真可以用“忽如一夜春风来，千树万树梨花开”来形容。20世纪，人类登上月球，潜入深海，洞察百亿光年外的天体，探索原子核世界的奥秘；20世纪，电视、程控电话、因特网以及民航飞机、高速火车、远洋船舶等，日益把人类居住的星球变成联系紧密的“地球村”。人类生活的舒适、方便，是连过去王公贵族也不敢想的。科学在改变着人类的精神文化生活，也在改变着人类的物质生活。\n\n回顾20世纪的百年历程，科学的确创造了一个又一个神话，为人类创造了比以往任何时代都要美好的生活。在新的世纪里，现代科学技术必将继续创造一个个奇迹，不断改善我们的生活。",
 questions:[{q:"为什么说20世纪是一个呼风唤雨的世纪？",ref:"因为人类利用现代科学技术获得了许多发现和发明，大大改变了生活"},{q:"课文用哪句诗来形容20世纪的成就？",ref:"忽如一夜春风来，千树万树梨花开"}]},
{id:'kongrong',grade:'一年级',title:'孔融让梨',author:'历史故事',genre:'故事',outputPrompt:'孔融把大梨让给哥哥，你愿意把好东西分享给家人吗？讲一讲。',
 content:'孔融四岁的时候，有一天，爸爸买来一些梨，让孩子们挑。哥哥们挑了大的，孔融却挑了一个最小的。\n\n爸爸问："你为什么不拿大的呢？"孔融说："我年纪小，应该吃小的，大的留给哥哥。"\n\n爸爸听了很高兴，夸孔融是个懂礼貌、会谦让的好孩子。',
 questions:[{q:'孔融挑了什么样的梨？',ref:'最小的梨'},{q:'孔融为什么拿小的梨？',ref:'他觉得自己年纪小，大的应该留给哥哥'}]},
{id:'chanhe',grade:'一年级',title:'蚂蚁和蝈蝈',author:'伊索·寓言',genre:'故事',outputPrompt:'夏天你看到过蚂蚁搬食物吗？它们为什么那么忙？',
 content:'夏天到了，蚂蚁们顶着烈日，把一粒粒粮食搬回家，累得满头大汗。蝈蝈却躲在树荫下唱歌，笑蚂蚁："这么热的天，歇一会儿吧！"\n\n蚂蚁说："我们要准备过冬的粮食呢。"\n\n冬天来了，北风呼呼地刮。蝈蝈又冷又饿，再也唱不出歌了；蚂蚁呢，正躲在暖和的洞里，吃着香喷喷的粮食。',
 questions:[{q:'夏天蚂蚁在做什么？',ref:'搬粮食，准备过冬'},{q:'这个故事告诉我们什么？',ref:'要提前做好准备，不能只顾眼前玩乐'}]},
{id:'tiechu',grade:'二年级',title:'铁杵成针',author:'历史故事',genre:'故事',outputPrompt:'你做事有半途而废过吗？读完这个故事你想说什么？',
 content:'大诗人李白小时候很贪玩，读书不用功，常常逃学出去玩。\n\n一天，他在小溪边看见一位老奶奶拿着一根铁棒在石头上磨。李白好奇地问："奶奶，您磨它做什么？"\n\n老奶奶说："我要把它磨成一根绣花针。"\n\n李白笑了："铁棒怎么能磨成针呢？"老奶奶说："只要天天磨，铁棒就会越磨越细，怎么会磨不成针呢？"\n\n李白听了很惭愧，从此发奋读书，终于成了伟大的诗人。',
 questions:[{q:'老奶奶要把铁棒磨成什么？',ref:'绣花针'},{q:'李白听了老奶奶的话后有了什么变化？',ref:'不再逃学，发奋读书'}]},
{id:'beifeng',grade:'二年级',title:'北风和太阳',author:'伊索·寓言',genre:'故事',outputPrompt:'北风和太阳谁的本领大？你想对北风说什么？',
 content:'北风和太阳争论谁的本领大。他们看见路上走来一个行人，就约定：谁能让他脱下外衣，谁的本领就大。\n\n北风先来。他使劲地吹，可是风越大，行人把衣服裹得越紧。北风吹得筋疲力尽，行人还是没有脱衣。\n\n轮到太阳了。他把温暖的阳光洒向大地。行人越走越热，不一会儿就脱下了外衣。\n\n北风只好认输：温和的力量，比猛烈更强大。',
 questions:[{q:'北风和太阳打的赌是什么？',ref:'谁能让行人脱下外衣'},{q:'为什么太阳赢了？',ref:'温暖的阳光让人主动脱衣，比强迫更有效'}]},
{id:'yugong',grade:'三年级',title:'愚公移山',author:'《列子》·历史故事',genre:'故事',outputPrompt:'愚公这么大年纪还要移山，你觉得他傻吗？说说理由。',
 content:'古时候，有一位快九十岁的老人叫愚公。他家门前有两座大山，出门办事都要绕很远的路。\n\n愚公召集全家人说："我们一起动手，把这两座山搬走，开出一条大路！"全家人同意了，每天挖土搬石，干得热火朝天。\n\n有人笑话他："你这么老了，哪搬得动大山？"愚公说："我死了有儿子，儿子死了还有孙子，子子孙孙没有穷尽，山却不会再长高，怎么会搬不平呢？"\n\n愚公的恒心感动了上天，两座大山终于被搬走了。',
 questions:[{q:'愚公为什么要移山？',ref:'大山挡路，出门不方便'},{q:'愚公移山靠的是什么精神？',ref:'坚持不懈、不怕困难的恒心'}]},
{id:'shangyang',grade:'三年级',title:'立木为信',author:'《史记》·历史故事',genre:'故事',outputPrompt:'商鞅为什么要立一根木头？诚信重要吗？讲一件你守信的事。',
 content:'战国时，商鞅在秦国推行新法。为了让百姓相信官府说到做到，他在城南门立了一根三丈高的木头，下令说："谁能把这根木头搬到北门，就赏十两金子。"\n\n人们都觉得奇怪，没人敢动。商鞅把赏金加到五十两。终于有个人壮着胆子把木头搬到了北门，商鞅当场赏了他五十两金子。\n\n这件事传开了，百姓都知道商鞅言而有信，新法很快推行开来，秦国一天天强大起来。',
 questions:[{q:'商鞅让人把木头搬到北门，赏了多少金子？',ref:'五十两金子'},{q:'"立木为信"说明了什么道理？',ref:'做人做事要讲诚信，说到才能做到'}]},
{id:'saiweng',grade:'四年级',title:'塞翁失马',author:'《淮南子》·寓言',genre:'故事',outputPrompt:'坏事有可能变成好事吗？举个例子说说。',
 content:'边塞有位老人，人们叫他塞翁。一天，他家的马跑丢了。邻居来安慰，塞翁却说："丢了马，说不定是好事呢。"\n\n过了几个月，那匹马竟带着一群骏马回来了。邻居来祝贺，塞翁又说："多了马，说不定是祸事呢。"\n\n后来，塞翁的儿子骑骏马摔断了腿。塞翁说："摔断腿，说不定是好事呢。"一年后，边塞打仗，青壮年大多战死，塞翁的儿子却因为腿瘸保全了性命。\n\n这就是"塞翁失马，焉知非福"的故事。',
 questions:[{q:'塞翁丢了马，为什么说不一定是坏事？',ref:'后来马带回一群骏马，坏事变成了好事'},{q:'"塞翁失马，焉知非福"是什么意思？',ref:'坏事在一定条件下可能变成好事，要用长远的眼光看问题'}]},
{id:'huashe',grade:'四年级',title:'画蛇添足',author:'《战国策》·寓言',genre:'故事',outputPrompt:'那个人为什么输了比赛？你犯过"画蛇添足"的错误吗？',
 content:'楚国有个人祭祀完祖先，把一壶酒赏给门客。门客们商量："这壶酒几个人喝不够，一个人喝正好。我们比赛画蛇，谁先画完谁喝。"\n\n有个人最先画好了。他端起酒壶，见别人还没画完，就得意地说："我还能给蛇添上脚呢！"于是左手拿壶，右手画脚。\n\n脚还没画完，另一个人画好了，夺过酒壶说："蛇本来没有脚，你添了脚就不是蛇了。"说完把酒喝了。\n\n画蛇添足的人，反而没喝到酒。',
 questions:[{q:'最先画好蛇的人为什么没喝到酒？',ref:'他给蛇添脚，蛇本来没有脚，添了就不是蛇了'},{q:'"画蛇添足"比喻什么？',ref:'做了多余的事，反而把事情弄糟'}]},
{id:'sangu',grade:'五年级',title:'三顾茅庐',author:'《三国演义》·历史故事',genre:'故事',outputPrompt:'刘备三次去请诸葛亮，说明他是个怎样的人？',
 content:'东汉末年，刘备为了请诸葛亮出山相助，带着关羽、张飞到隆中拜访。第一次，诸葛亮出门了；第二次，只见到他的弟弟。\n\n张飞不耐烦地说："一个村夫，何必哥哥亲自去！"刘备说："诸葛亮是大贤，我一定要亲自去请。"\n\n冬去春来，刘备第三次来到茅庐。诸葛亮正在午睡，刘备就静静地站在台阶下等。诸葛亮醒来，被刘备的诚心打动，为他分析天下大势，提出了"三分天下"的计策，从此出山辅佐刘备。',
 questions:[{q:'刘备一共去了几次隆中？',ref:'三次'},{q:'诸葛亮为什么答应出山？',ref:'被刘备求贤若渴的诚心打动'}]},
{id:'wukong',grade:'五年级',title:'大闹天宫（西游记故事）',author:'吴承恩·经典名著',genre:'故事',outputPrompt:'孙悟空最吸引你的是什么？你佩服他哪一点？',
 content:'孙悟空学得一身本领，从东海龙宫得了如意金箍棒，能大能小，重一万三千五百斤。\n\n玉帝请他上天庭做官，他嫌官小，回到花果山自称"齐天大圣"。玉帝派天兵天将捉拿，都被他打得落花流水。后来太上老君把他放进炼丹炉，炼了七七四十九天，他不但没死，反而炼成了火眼金睛，蹬倒丹炉，打上灵霄宝殿。\n\n最后，如来佛祖赶来，把孙悟空压在五行山下。五百年后，他保护唐僧西天取经，一路上降妖除魔，立下大功。',
 questions:[{q:'孙悟空的兵器叫什么？有什么特点？',ref:'如意金箍棒，能大能小'},{q:'炼丹炉里，孙悟空炼成了什么本领？',ref:'火眼金睛'}]},
{id:'wusong',grade:'六年级',title:'武松打虎（水浒传故事）',author:'施耐庵·经典名著',genre:'故事',outputPrompt:'武松明知山有虎偏向虎山行，这是勇敢还是鲁莽？说说你的看法。',
 content:'武松回家探望哥哥，路过景阳冈。他在酒店里一连喝了十八碗酒，店家劝他："冈上有老虎，别一个人走。"武松不信，提着哨棒上了冈。\n\n走到半山，果然跳出一只吊睛白额大虫。那老虎一扑、一掀、一剪，武松三闪躲过，抡起哨棒就打，棒子却打在枯树上折了。武松赤手空拳，按住虎头，铁拳雨点般落下，直打得老虎七窍流血，动弹不得。\n\n武松为民除了害，景阳冈打虎的美名从此传遍天下。',
 questions:[{q:'武松一共喝了多少碗酒？',ref:'十八碗'},{q:'哨棒折断后，武松是怎样打死老虎的？',ref:'赤手空拳按住虎头，用拳头打死'}]},
{id:'changzheng',grade:'六年级',title:'金色的鱼钩（长征故事）',author:'革命故事',genre:'故事',outputPrompt:'老班长为什么自己不吃鱼？你想对他说什么？',
 content:'红军长征过草地时，一位炊事班长照顾三个生病的小战士。粮食吃完了，老班长把缝衣针烧弯做成鱼钩，在水塘里钓鱼，煮鱼汤给小战士们喝。\n\n可是小战士们发现，老班长从来不喝一口鱼汤。一天夜里，他们悄悄跟着老班长，只见他嚼着他们吃剩的鱼骨头和草根，艰难地咽下去。\n\n"班长，你骗我们！"小战士们哭了。老班长慈祥地说："你们还小，一定要走出草地。"后来，老班长倒在了草地上。那个长满红锈的鱼钩，闪着金色的光芒。',
 questions:[{q:'老班长用什么做鱼钩？',ref:'烧弯的缝衣针'},{q:'老班长为什么不吃鱼？',ref:'他把食物省给小战士，自己吃鱼骨头和草根'}]}
];;

{id:'b-xuanliang',grade:'三年级',title:'悬梁刺股',author:'历史故事',genre:'故事',outputPrompt:'孙敬和苏秦为什么要这样刻苦读书？你觉得值得吗？',

{id:'b-huanwei',grade:'五年级',title:'凌晨四点的环卫工',author:'原创·写人写事',genre:'写人写事',outputPrompt:'你身边有哪些默默奉献的劳动者？写一两句话致敬他们。',

{id:'b-zhuozi',grade:'三年级',title:'我的同桌',author:'原创·写人写事',genre:'写人写事',outputPrompt:'你的同桌有什么特点？用一件事写一写。',
